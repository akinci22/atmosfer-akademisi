kam olarak yaz\u0131lan her de\u011Fi\u015Fken puan a\xE7\u0131s\u0131ndan olumsuz de\u011Ferlendirilir.","Hesap g\xFCnlerine en yak\u0131n saatteki radyosonde \xF6l\xE7\xFCm\xFCne dayal\u0131 Skew-T diyagramlar\u0131 da rapora eklenir.","Hesaplanan ve \xF6l\xE7\xFCme dayal\u0131 diyagramlar\u0131n k\u0131yaslanmas\u0131 ve yorumu puantaj a\xE7\u0131s\u0131ndan kritiktir.","Her g\xFCn\xFCn foto\u011Fraf\u0131 ile Skew-T profilinin birlikte de\u011Ferlendirilmesi de ayn\u0131 derecede \xF6nemlidir.","Hesap, veri ve kod dosyalar\u0131 ile rapor Ninova\u2019ya y\xFCklenir.","Ayn\u0131 duyuruda tak\u0131ld\u0131\u011F\u0131n yerleri sormak i\xE7in ofis saatleri de verilmi\u015Fti; Skew-T i\xE7in iki kaynak ba\u011Flant\u0131s\u0131 da payla\u015F\u0131lm\u0131\u015Ft\u0131: NOAA JetStream \xABSkew-T plots\xBB sayfas\u0131 ve Wyoming \xDCniversitesi Avrupa \xFCst hava sayfas\u0131."],basit:["K\u0131saca hoca \xFC\xE7 \u015Feyi ar\u0131yor: hesab\u0131 kendin yap, ger\xE7ekle k\u0131yasla, foto\u011Frafla profili ba\u011Fla.","En kritik k\u0131s\u0131m k\u0131yas ve foto\u011Fraf\u2013profil yorumu; hesap tablosu bunlar\u0131n kan\u0131t\u0131.","Haz\u0131r paket ya da denklemsiz rakam puan kaybettirdi\u011Fi i\xE7in her say\u0131n\u0131n arkas\u0131nda bir form\xFCl ve bir hesap olmal\u0131."],tablo:{baslik:["Duyuruda vurgulanan","Benim kar\u015F\u0131l\u0131\u011F\u0131m","Rehberde"],satirlar:[["Hesap g\xFCnleri Part I foto\u011Fraf g\xFCnlerinden; farkl\u0131 bulut katlar\u0131 ve varsa \u015Fiddetli hava","20, 21, 27, 28, 30 Nisan: d\xF6rt bulut t\xFCr\xFC ve bir a\xE7\u0131k g\xFCn (ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli g\xFCn yoktu, bu eksikti)","Part II \xB7 2"],["Skew-T verilen ve derste g\xF6sterilen denklemlerle","Projedeki \u0394T/\u0394P, Clausius\u2013Clapeyron ve Bolton; haz\u0131r paket yok","Part II \xB7 4, 11"],["Do\u011Frudan veri: yaln\u0131z 100 kPa s\u0131cakl\u0131\u011F\u0131 ve her seviyede nem","Radyosondeden yaln\u0131z bu ikisi girdi oldu","Part II \xB7 3"],["Haz\u0131r de\u011Fi\u015Fken ve denklemsiz rakam olumsuz","21 kalemin hepsi kendi fonksiyonumla; tek sat\u0131r elle s\u0131nand\u0131","Part II \xB7 6, 6a"],["Radyosonde Skew-T\u2019leri rapora eklenecek","5 g\xFCn \xD7 g\xF6zlem Skew-T\u2019si","Part II \xB7 12"],["Hesap ve \xF6l\xE7\xFCm diyagramlar\u0131n\u0131n k\u0131yas\u0131 ve yorumu kritik","K\u0131yas diyagram\u0131, indeks tablosu, hata analizi","Part II \xB7 12, 14"],["Foto\u011Fraf ile profilin birlikte de\u011Ferlendirilmesi ayn\u0131 derecede \xF6nemli","G\xFCn g\xFCn bulut ve profil yorumu","Part II \xB7 13"],["Hesap, veri, kod ve rapor Ninova\u2019ya","Rapor, Excel tablolar\u0131, kod: tek zip","Part II \xB7 15"]],not:"Bu tablo bir yaz\u0131l\u0131 duyurunun \xF6zetidir; \xF6l\xE7ek ya da puan a\u011F\u0131rl\u0131\u011F\u0131 verilmemi\u015Fti, vurgular \xABkritik\xBB ve \xABayn\u0131 derecede \xF6nemli\xBB gibi ifadelerle yap\u0131lm\u0131\u015Ft\u0131."}},{id:"m1",no:"M.2",baslik:{tr:"Mant\u0131k zinciri: her a\u015Faman\u0131n as\u0131l sorusu",en:"The logic chain: the real question behind each stage"},neden:"Her a\u015Faman\u0131n arkas\u0131ndaki as\u0131l soruyu bilirsen, proje metni de\u011Fi\u015Fse bile ayakta kal\u0131rs\u0131n.",teknik:["Proje, ham g\xF6zlemden yoruma uzanan yedi halkal\u0131 bir zincir.","Her halkan\u0131n sorusu bir \xF6ncekinin cevab\u0131na dayan\u0131r; zincirin en zay\u0131f halkas\u0131 sonucu belirler.","Haz\u0131r paket kullanmadan hesaplamak, zincirin ortas\u0131ndaki halkay\u0131 (hesap) sana ait k\u0131lmak i\xE7in isteniyor olabilir.","Yaz\u0131l\u0131m dili \xF6nemli g\xF6r\xFCnm\xFCyor; \xF6nemli olan hesab\u0131n sana ait olmas\u0131 ve g\xF6zlemle do\u011Frulanm\u0131\u015F olmas\u0131."],basit:["Hoca bir say\u0131 sormuyor, bir ak\u0131l y\xFCr\xFCtme zincirini yokluyor: g\xF6rd\xFCn, \xF6l\xE7t\xFCn, hesaplad\u0131n, \xE7izdin, k\u0131yaslad\u0131n, a\xE7\u0131klad\u0131n.","Bu y\xFCzden hangi ad\u0131mda olursan ol \xABbunu neden yap\u0131yorum, bir sonrakini nas\u0131l besliyor\xBB diye sorabilmelisin."],tablo:{baslik:["A\u015Fama","As\u0131l soru","Aranan \u015Fey (\xF6ng\xF6r\xFC)"],satirlar:[["1 \xB7 G\xF6zlem","G\xF6rd\xFC\u011F\xFCn\xFC sistemli ve tekrarlanabilir bi\xE7imde ortaya koyabiliyor musun?","Sabit saat ve yer, net foto\u011Fraf, bulut cinsi \xF6l\xE7\xFCtleri"],["2 \xB7 Veri","Hangi veri neyi temsil ediyor, s\u0131n\u0131r\u0131 ne?","Kaynaklar\u0131n fark\u0131 (nokta \xF6l\xE7\xFCm ve \u0131zgara model), zaman e\u015Flemesi"],["3 \xB7 Hesap","Form\xFCl\xFCn fizi\u011Fini ve birimini biliyor musun?","Haz\u0131r paket yok; her b\xFCy\xFCkl\xFC\u011F\xFCn anlam\u0131; birim tutarl\u0131l\u0131\u011F\u0131"],["4 \xB7 Diyagram","Sonucu g\xF6rsel olarak okuyabiliyor musun?","Skew-T \xFCzerinde LCL, LFC, EL ve kararl\u0131l\u0131k okuma"],["5 \xB7 K\u0131yas","Hesab\u0131n ger\xE7ekle uyu\u015Fuyor mu, uyu\u015Fmuyorsa neden?","Do\u011Frulama al\u0131\u015Fkanl\u0131\u011F\u0131 ve hata analizi"],["6 \xB7 Yorum","G\xF6rd\xFC\u011F\xFCn bulut atmosferin profiliyle a\xE7\u0131klan\u0131yor mu?","Bulut t\xFCr\xFC ile LCL, nem katman\u0131 ve kararl\u0131l\u0131k aras\u0131ndaki ba\u011F"],["7 \xB7 Rapor","Bunu ba\u015Fkas\u0131na anlatabiliyor musun?","Yap\u0131, kaynak\xE7a, \u015Fekil ve tablo d\xFCzeni, kendi yorumun"]]}},{id:"m2",no:"M.3",baslik:{tr:"Soru kartlar\u0131 1: g\xF6zlem ve veri",en:"Question cards 1: observation and data"},neden:"G\xF6zlem ve veri sorular\u0131nda en s\u0131k d\xFC\u015F\xFClen hata, y\xF6ntemin s\u0131n\u0131r\u0131n\u0131 s\xF6ylememek.",teknik:["Her kartta \xFC\xE7 par\xE7a var: soru kal\u0131b\u0131, cevap iskeleti, ba\u011Fl\u0131 ad\u0131m.","Cevap iskeletini ezberlemeyin; kendi verinle doldurun (kendi g\xFCnlerin, kendi say\u0131lar\u0131n)."],basit:["Cevab\u0131n \u015Fablonu hep ayn\u0131: ne yapt\u0131m, neden \xF6yle yapt\u0131m, s\u0131n\u0131r\u0131 ne."],sorular:[{s:"Neden her g\xFCn ayn\u0131 saatte ve ayn\u0131 yerden g\xF6zlem isteniyor?",c:["G\xFCnler aras\u0131 fark\u0131n hava m\u0131 yoksa saat ve yer mi oldu\u011Funu ay\u0131rmak i\xE7in: sabit ko\u015Ful, kontroll\xFC deney gibidir.","G\xFCn i\xE7i \u0131s\u0131nma ve \u0131\u015F\u0131k bulutun g\xF6r\xFCn\xFCm\xFCn\xFC de\u011Fi\u015Ftirir; saat sabitse bu etki sabitlenir.","Kendi uygulamam: saat tam sabit kalmad\u0131; bunu foto\u011Fraf\u0131n EXIF saatiyle belgeledim ve s\u0131n\u0131r\u0131n\u0131 yazd\u0131m."],adim:"p1-1"},{s:"Bulut cinsini foto\u011Fraftan nas\u0131l ay\u0131rd\u0131n? Foto\u011Fraf yetmedi\u011Finde ne yapt\u0131n?",c:["\xD6nce kat (y\xFCksek, orta, al\xE7ak), sonra doku, sonra \xF6rt\xFC miktar\u0131 ve g\xFCne\u015Fin se\xE7ilip se\xE7ilmedi\u011Fi.","Stratus ile Nimbostratus gibi benzer cinslerde ya\u011F\u0131\u015F ve nem ek bilgi verir.","Tan\u0131y\u0131 tek kayna\u011Fa b\u0131rakmad\u0131m: foto\u011Fraf, nem ve ya\u011F\u0131\u015Fla \xE7ifte kontrol."],adim:"p1-5"},{s:"ERA5 nedir ve istasyon \xF6l\xE7\xFCm\xFCnden fark\u0131 nedir?",c:["Ge\xE7mi\u015F g\xF6zlemleri bir tahmin modeliyle birle\u015Ftiren, saatlik ve \u0131zgaral\u0131 yeniden analiz verisi.","\u0130stasyon tek bir noktad\u0131r; ERA5 bir \u0131zgara h\xFCcresinin (yakla\u015F\u0131k 25\u201330 km) ortalamas\u0131d\u0131r.","\u0130stasyon yoksa ya da g\xFCn eksikse tutarl\u0131 de\u011Fer verir; ama yerel olay\u0131 yumu\u015Fatabilir."],adim:"p1-6"},{s:"Veri saati ile foto\u011Fraf saati tutmuyorsa ne yapars\u0131n?",c:["UTC\u2019yi yerel saate \xE7evirir (UTC+3), foto\u011Fraf\u0131n iki yan\u0131ndaki veri saatleri aras\u0131nda do\u011Frusal enterpolasyon yapar\u0131m.","Do\u011Frusal enterpolasyon iki \xF6l\xE7\xFCm aras\u0131ndaki de\u011Fi\u015Fimi d\xFCz kabul eder; h\u0131zl\u0131 de\u011Fi\u015Fen havada hata verir.","En iyisi g\xF6zlemi veri saatine denk getirmektir."],adim:"p1-6"},{s:"Nem hangi de\u011Ferin \xFCst\xFCnde g\xF6ky\xFCz\xFC kapal\u0131 oluyor? Bunu nereden \xE7\u0131kard\u0131n?",c:["G\xFCnl\xFCk tabloyu nem ve bulutlulu\u011Fa g\xF6re s\u0131ralad\u0131m: yakla\u015F\u0131k %50 alt\u0131nda a\xE7\u0131k, %75 \xFCst\xFCnde kapal\u0131 ve ya\u011F\u0131\u015Fl\u0131.","Bu e\u015Fikler ilkbahar \xF6rneklemimden \xE7\u0131kt\u0131; yasa de\u011Fil, mevsime g\xF6re de\u011Fi\u015Febilir.","Fizi\u011Fi: nem y\xFCkseldik\xE7e hava doyuma yakla\u015F\u0131r, LCL al\xE7al\u0131r, bulut taban\u0131 yere iner."],adim:"p1-8"}]},{id:"m3",no:"M.4",baslik:{tr:"Soru kartlar\u0131 2: hesap ve fizik",en:"Question cards 2: calculation and physics"},neden:"Hesap sorular\u0131nda puan, say\u0131dan \xE7ok form\xFCl\xFCn fizi\u011Fini s\xF6yleyebilmekte.",teknik:["Her kartta cevap, k\u0131sa bir fizik c\xFCmlesi ve bir say\u0131 \xF6rne\u011Fiyle g\xFC\xE7lenir.","Say\u0131 \xF6rnekleri i\xE7in \xABTek sat\u0131rl\u0131k elle hesap\xBB ad\u0131m\u0131ndaki 27 Nisan de\u011Ferlerini kullanabilirsin."],basit:["Bir form\xFCl\xFC anlat\u0131rken \xF6nce ne anlatt\u0131\u011F\u0131n\u0131 s\xF6yle, sonra form\xFCl\xFC yaz, sonra birimine bak."],sorular:[{s:"Neden haz\u0131r bir meteoroloji paketi yerine kendi kodunla hesaplad\u0131n?",c:["Ama\xE7 say\u0131y\u0131 almak de\u011Fil; her b\xFCy\xFCkl\xFC\u011F\xFCn form\xFCl\xFCnden nas\u0131l \xE7\u0131kt\u0131\u011F\u0131n\u0131 g\xF6stermek.","Her fonksiyonu bilinen de\u011Ferlerle ve geri hesapla s\u0131nad\u0131m (\xF6rne\u011Fin 0 \xB0C\u2019de es \u2248 0,6112 kPa; RH \u2192 e \u2192 RH).","Haz\u0131r paketle kar\u015F\u0131la\u015Ft\u0131rmak ek bir do\u011Frulama olabilir ama hesab\u0131n yerini tutmaz."],adim:"p2-6"},{s:"Doyma buhar bas\u0131nc\u0131 s\u0131cakl\u0131kla neden bu kadar h\u0131zl\u0131 art\u0131yor?",c:["Clausius\u2013Clapeyron: es s\u0131cakl\u0131kla \xFCstel artar; 10 \xB0C art\u0131\u015Fta yakla\u015F\u0131k iki kat\u0131na \xE7\u0131kar (1,23 kPa \u2192 2,36 kPa, 10 \u2192 20 \xB0C).","Fizi\u011Fi: s\u0131cak havada daha \xE7ok molek\xFCl s\u0131v\u0131dan kurtulacak enerjiye sahip; denge daha y\xFCksek buhar bas\u0131nc\u0131nda kurulur.","Sonu\xE7: so\u011Fuk hava az nem ta\u015F\u0131r, bu y\xFCzden so\u011Fuyan bir parsel kolay doyar."],adim:"p2-6"},{s:"Kar\u0131\u015Fma oran\u0131 ile \xF6zg\xFCl nem aras\u0131ndaki fark ne zaman \xF6nemli?",c:["r = su buhar\u0131 / kuru hava; q = su buhar\u0131 / nemli hava. q = r/(1 + r).","r birka\xE7 g/kg iken ikisi neredeyse ayn\u0131d\u0131r (4,20 ve 4,18 g/kg).","Nem \xE7ok y\xFCkselince (r yakla\u015F\u0131k 20 g/kg ve \xFCst\xFC) fark y\xFCzde ikiyi bulur ve ihmal edilemez."],adim:"p2-6"},{s:"\xC7iy noktas\u0131 nedir ve LCL ile nas\u0131l ili\u015Fkilidir?",c:["Td: havan\u0131n sabit bas\u0131n\xE7ta so\u011Futuldu\u011Funda doydu\u011Fu s\u0131cakl\u0131k; nemin s\u0131cakl\u0131k cinsinden ifadesi.","T \u2212 Td ne kadar k\xFC\xE7\xFCkse hava doymaya o kadar yak\u0131nd\u0131r.","Kabaca LCL \u2248 125 m \xD7 (T \u2212 Td): fark 10 \xB0C ise bulut taban\u0131 yakla\u015F\u0131k 1,25 km. Benim 27 Nisan de\u011Ferimde 11,9 \xB0C fark, yakla\u015F\u0131k 1,5 km."],adim:"p2-6a"},{s:"\u03B8 ile \u03B8e nedir; hangisi hangi s\xFCre\xE7te korunur?",c:["\u03B8: parseli 100 kPa\u2019ya kuru adyabatik olarak indirsek s\u0131cakl\u0131\u011F\u0131 olurdu; kuru adyabatik hareketlerde korunur.","\u03B8e: b\xFCt\xFCn su buhar\u0131n\u0131 yo\u011Fu\u015Fturup gizli \u0131s\u0131y\u0131 geri ald\u0131\u011F\u0131m\u0131zda \u03B8; nemli adyabatik hareketlerde de korunur.","\u03B8 y\xFCkseklikle art\u0131yorsa kolon kararl\u0131d\u0131r. \u03B8e y\xFCkseklikle azal\u0131yorsa potansiyel (konvektif) karars\u0131zl\u0131k i\u015Faretidir."],adim:"p2-6"},{s:"\u0394T/\u0394P denklemi ne yap\u0131yor? Her yeri doygun kabul etmeseydin ne de\u011Fi\u015Firdi?",c:["Parsel bas\u0131n\xE7 de\u011Fi\u015Ftirince s\u0131cakl\u0131\u011F\u0131n nas\u0131l de\u011Fi\u015Fti\u011Fini veren e\u011Fim; rs \u2192 0 iken kuru adyabata iner.","rs (doyma) kullan\u0131nca profil nemli adyabat olur: so\u011Fuma yava\u015Flar, profil daha s\u0131cak ve daha kararl\u0131 \xE7\u0131kar.","Doymam\u0131\u015F katmanda kuru, doymu\u015F katmanda nemli e\u011Fimi kullansayd\u0131m ger\xE7e\u011Fe daha yak\u0131n olurdu."],adim:"p2-4"},{s:"Parsel neden LCL\u2019ye kadar kuru, sonra nemli so\u011Fuyor?",c:["Doymam\u0131\u015F parsel \xE7evreyle \u0131s\u0131 al\u0131\u015Fveri\u015Fi yapmadan genle\u015Fip so\u011Fur: kuru adyabatik e\u011Fim, yakla\u015F\u0131k 9,8 \xB0C/km.","LCL\u2019de doyar; sonra so\u011Fuduk\xE7a su buhar\u0131 yo\u011Fu\u015Fur, gizli \u0131s\u0131 a\xE7\u0131\u011Fa \xE7\u0131kar ve so\u011Fuma yava\u015Flar (genelde 4\u20137 \xB0C/km).","Bu y\xFCzden nemli adyabat kuru adyabattan daha az diktir; Skew-T\u2019de e\u011Fri LCL\u2019de k\u0131r\u0131l\u0131r."],adim:"p2-8"},{s:"CAPE ve CIN ne anlat\u0131yor? Senin g\xFCnlerinde CAPE neden s\u0131f\u0131ra yak\u0131n \xE7\u0131kt\u0131?",c:["CAPE: parselin \xE7evreden s\u0131cak oldu\u011Fu alan (LFC ile EL aras\u0131), f\u0131rt\u0131na yak\u0131t\u0131. CIN: y\xFCzeyden LFC\u2019ye kadar a\u015F\u0131lmas\u0131 gereken engel.","Be\u015F g\xFCn\xFCmde parsel \xE7evreden so\u011Fuk ya da e\u015Fit kald\u0131; LFC olu\u015Fmad\u0131, CAPE \u2248 0.","Bu, ilkbahar \u0130stanbul\u2019unda derin konveksiyon yerine tabakal\u0131 ve s\u0131\u011F bulutlar\u0131n g\xF6r\xFClmesiyle uyumlu."],adim:"p2-9"},{s:"Skew-T \xFCzerinde LCL, LFC ve EL nas\u0131l bulunur?",c:["LCL: y\xFCzey s\u0131cakl\u0131\u011F\u0131ndan \xE7\u0131kan kuru adyabat ile y\xFCzey \xE7iy noktas\u0131ndan \xE7\u0131kan kar\u0131\u015Fma oran\u0131 \xE7izgisinin kesi\u015Fti\u011Fi nokta.","LFC: LCL\u2019den sonra nemli adyabat\u0131n \xE7evre s\u0131cakl\u0131k e\u011Frisini ilk kez soldan sa\u011Fa (s\u0131cak tarafa) ge\xE7ti\u011Fi nokta.","EL: parsel e\u011Frisinin \xE7evre e\u011Frisini tekrar kesti\u011Fi, \xFCstte so\u011Fuk tarafa ge\xE7ti\u011Fi nokta; LFC ile EL aras\u0131 CAPE alan\u0131."],adim:"p2-11"},{s:"Hangi veriyi do\u011Frudan ald\u0131n, hangilerini hesaplad\u0131n?",c:["Do\u011Frudan ald\u0131\u011F\u0131m yaln\u0131z iki \u015Fey: 100 kPa\u2019daki ger\xE7ek s\u0131cakl\u0131k ve her seviyedeki ba\u011F\u0131l nem (\xF6l\xE7\xFCm ve model verisi).","Geri kalan her \u015Fey form\xFClle hesapland\u0131: es, rs, Td, q, \u03B8, \u03B8e, LCL, CAPE, indeksler.","Haz\u0131r de\u011Fi\u015Fken ya da denklemsiz rakam puan kaybettirir; her sat\u0131r\u0131n form\xFCl\xFC kodda ve raporda var."],adim:"p2-3",dayanak:"duyuru"},{s:"Skew-T diyagram\u0131n\u0131 hangi denklemlerle \xFCrettin?",c:["Projede verilen \u0394T/\u0394P e\u011Fimini RK4 ile entegre ederek \xE7evre s\u0131cakl\u0131k profilini \xFCrettim.","\xC7iy noktas\u0131n\u0131 Clausius\u2013Clapeyron\u2019un tersinden, parselin LCL\u2019sini Bolton form\xFCl\xFCyle buldum; LCL\u2019den sonras\u0131 yine ayn\u0131 e\u011Fimle (nemli).","Diyagram\u0131n \xE7izgi aileleri (izoterm, izobar, kuru ve nemli adyabat, kar\u0131\u015Fma oran\u0131) de elle \xE7izildi."],adim:"p2-11",dayanak:"duyuru"}]},{id:"m4",no:"M.5",baslik:{tr:"Soru kartlar\u0131 3: k\u0131yas, hata ve yorum",en:"Question cards 3: comparison, error and interpretation"},neden:"K\u0131yas ve yorum sorular\u0131, projenin en \xE7ok de\u011Fer verilen k\u0131sm\u0131 olabilir; cevab\u0131n iskeleti hep \xABkabul \u2192 sonu\xE7 \u2192 s\u0131n\u0131r\xBB.",teknik:["Bu kartlarda say\u0131lar\u0131 kendi tablonla doldur: LCL, K, CAPE de\u011Ferlerin cevab\u0131n kan\u0131t\u0131."],basit:["Hatay\u0131 saklamak yerine nedenini g\xF6stermek hem d\xFCr\xFCst hem daha \xE7ok puan getirir."],sorular:[{s:"Hesaplad\u0131\u011F\u0131n profil g\xF6zlem profilinden neden ayr\u0131\u015F\u0131yor?",c:["D\xF6rt neden: y\xF6ntem kabul\xFC (her yer doygun), zaman uyu\u015Fmazl\u0131\u011F\u0131 (3\u20136 saat), temsil fark\u0131 (tek y\xF6r\xFCnge ve \u0131zgara ortalamas\u0131), say\u0131sal hata.","En b\xFCy\xFC\u011F\xFC y\xF6ntem kabul\xFC: hesaplanan profil nemli adyabata yak\u0131n oldu\u011Fu i\xE7in g\xF6zlemden biraz daha kararl\u0131.","\xC7\xF6z\xFCm \xF6nerileri: doymam\u0131\u015Fta kuru e\u011Fim, \xE7ekim saatine denk veri, daha k\xFC\xE7\xFCk \u0394P."],adim:"p2-14"},{s:"Bu k\u0131yasta hangi sonu\xE7 sana g\xFCven verdi?",c:["K indeksi hesap ve g\xF6zlemde birbirine yak\u0131n \xE7\u0131kt\u0131 (21 Nisan\u2019da 25 ve 25; 20 Nisan\u2019da 8 ve 9).","K yaln\u0131zca nem ve 85/70/50 kPa s\u0131cakl\u0131klar\u0131na ba\u011Fl\u0131; yani veri giri\u015Fi ve indeks form\xFCl\xFC do\u011Fru \xE7al\u0131\u015F\u0131yor.","CAPE profilin tamam\u0131na ba\u011Fl\u0131 oldu\u011Fundan, fark\u0131 y\xF6ntem kabul\xFCyle a\xE7\u0131klad\u0131m."],adim:"p2-12"},{s:"Neden bu be\u015F g\xFCn\xFC se\xE7tin, hangi \xF6l\xE7\xFCtle?",c:["\xC7e\u015Fitlilik: y\xFCksek bulut, tabakal\u0131 al\xE7ak bulut, a\xE7\u0131k g\xF6ky\xFCz\xFC, bodur k\xFCm\xFCl\xFCs, kapal\u0131 stratus.","Foto\u011Fraf\u0131 net ve saati belli g\xFCn, ayr\u0131ca yak\u0131n bir radyosonde saati olmas\u0131.","Be\u015F farkl\u0131 hik\xE2ye ayn\u0131 y\xF6ntemle ayr\u0131\u015F\u0131yorsa y\xF6ntem \xE7al\u0131\u015F\u0131yor demektir."],adim:"p2-2"},{s:"Bulutsuz bir g\xFCn neden en kolay a\xE7\u0131klanan g\xFCn? Profil orada neyi g\xF6steriyor?",c:["\xC7iy noktas\u0131 e\u011Frisi s\u0131cakl\u0131ktan belirgin uzak: t\xFCm kolon kuru, doymaktan uzak.","LCL y\xFCksek ve kolon \xE7ok kararl\u0131: parsel y\xFCkselse bile doymadan \xF6nce enerjisi biter.","Bulut yok demek, doyma ve kald\u0131rma ko\u015Fullar\u0131ndan en az birinin sa\u011Flanmamas\u0131 demektir."],adim:"p2-13"},{s:"Al\xE7ak bir stratus g\xFCn\xFC ile bodur bir k\xFCm\xFCl\xFCs g\xFCn\xFC profilde nas\u0131l ayr\u0131\u015F\u0131r?",c:["Stratus g\xFCn\xFC: alt katmanda y\xFCksek nem, \xE7ok d\xFC\u015F\xFCk LCL (benim verimde yakla\u015F\u0131k 600 m), kararl\u0131 kolon: bulut yatay yay\u0131l\u0131r.","K\xFCm\xFCl\xFCs g\xFCn\xFC: y\xFCzey \u0131s\u0131nmas\u0131yla s\u0131\u011F konveksiyon, LCL d\xFC\u015F\xFCk (yakla\u015F\u0131k 750 m) ama \xFCst kolon kuru: dikey b\xFCy\xFCme s\u0131n\u0131rl\u0131, humilis.","Ortak nokta d\xFC\u015F\xFCk LCL; fark, \xFCst kolonun nemi ve g\xFCnd\xFCz \u0131s\u0131nmas\u0131."],adim:"p2-13"},{s:"Modelinin g\xF6zlemden daha kararl\u0131 \xE7\u0131kmas\u0131 neyi g\xF6steriyor, nas\u0131l d\xFCzeltirdin?",c:["Kabul\xFCn s\u0131n\u0131r\u0131n\u0131 g\xF6steriyor: her seviyeyi doygun varsaymak nemli adyabat verir; ger\xE7ek kolon doymam\u0131\u015F katmanlarda daha h\u0131zl\u0131 so\u011Fur.","D\xFCzeltme: doymam\u0131\u015Fta kuru, doymu\u015Fta nemli e\u011Fim; \u0394P\u2019yi k\xFC\xE7\xFCltmek; \xE7ekim saatine denk veri.","\xD6nemli olan hatay\u0131 saklamak yerine nedenini g\xF6stermek: bir model kabulleri kadar do\u011Frudur."],adim:"p2-14"},{s:"Part I\u2019deki g\xF6zlemin Part II\u2019deki hesaba ba\u011F\u0131 neydi?",c:["Part I\u2019de se\xE7ti\u011Fim g\xFCnlerin saatleri ve bulut cinsleri Part II\u2019nin girdisi ve do\u011Frulama \xF6l\xE7\xFCt\xFC oldu.","Part I \xABne g\xF6rd\xFCm\xBB, Part II \xABneden g\xF6rd\xFCm\xBB sorusunu cevapl\u0131yor.","Part I\u2019i d\xFCzenli tutmak (EXIF saat, g\xFCn klas\xF6r\xFC, tek veri s\xF6zl\xFC\u011F\xFC) Part II\u2019yi kolayla\u015Ft\u0131rd\u0131."],adim:"g1"},{s:"Hesaplanan ve radyosonde Skew-T\u2019lerini nas\u0131l k\u0131yaslad\u0131n, neye bakt\u0131n?",c:["Ayn\u0131 eksende \xFCst \xFCste koydum; \xF6nce y\xFCzeye yak\u0131n katmanlarda, sonra yukar\u0131da ayr\u0131\u015Fma var m\u0131 bakt\u0131m.","Say\u0131sal k\u0131yas i\xE7in ayn\u0131 indeks kodunu iki profile de uygulad\u0131m (LCL, CAPE, LI, K).","Fark\u0131 d\xF6rt nedenle a\xE7\u0131klad\u0131m ve her biri i\xE7in \xE7\xF6z\xFCm \xF6nerdim; en b\xFCy\xFCk neden y\xF6ntem kabul\xFCyd\xFC."],adim:"p2-12",dayanak:"duyuru"},{s:"Foto\u011Fraftaki bulut ile Skew-T profili aras\u0131nda nas\u0131l bir ba\u011F kurdun?",c:["Her g\xFCn i\xE7in \xFC\xE7 soru: LCL nerede (bulut taban\u0131), kolon kararl\u0131 m\u0131, nem hangi katmanda?","Bulutsuz g\xFCnde kolon kuru ve LCL y\xFCksek; al\xE7ak tabakal\u0131 g\xFCnde alt katmanda nem ve d\xFC\u015F\xFCk LCL; k\xFCm\xFCl\xFCs g\xFCn\xFCnde d\xFC\u015F\xFCk LCL ama kuru \xFCst kolon.","Foto\u011Fraf ile hesap ayn\u0131 hik\xE2yeyi anlat\u0131yorsa y\xF6ntem \xE7al\u0131\u015F\u0131yor; anlatm\u0131yorsa nedenini arad\u0131m."],adim:"p2-13",dayanak:"duyuru"},{s:"Be\u015F g\xFCn\xFC hangi \xF6l\xE7\xFCtle se\xE7tin; ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli bir g\xFCn se\xE7medin mi?",c:["\xD6l\xE7\xFCt: Part I\u2019de foto\u011Fraflad\u0131\u011F\u0131m g\xFCnler, farkl\u0131 bulut katlar\u0131, temiz foto\u011Fraf ve yak\u0131n bir radyosonde saati.","Benim be\u015F g\xFCn\xFCmde ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli hava yoktu; bu bir eksikti.","Bir daha olsa bir Nimbostratus g\xFCn\xFCn\xFC eklerdim: nemin kal\u0131n bir katmanda topland\u0131\u011F\u0131n\u0131 ve LCL\u2019nin \xE7ok al\xE7ak oldu\u011Funu g\xF6rmek e\u015Fle\u015Fmeyi zenginle\u015Ftirirdi."],adim:"p2-2",dayanak:"duyuru"}]},{id:"m5",no:"M.6",baslik:{tr:"Puan getirenler ve kaybettirenler",en:"What earns and what loses marks"},neden:"B\xFCt\xFCn zaman\u0131 do\u011Fru yere harcamak i\xE7in, de\u011Ferlendirmede hangi noktalar\u0131n \xF6ne \xE7\u0131kt\u0131\u011F\u0131n\u0131 bil.",teknik:["\xABTeyitli\xBB sat\u0131rlar proje duyurusundan ve proje belgesinden; \xAB\xE7\u0131kar\u0131m\xBB sat\u0131rlar\u0131 benim \xF6ng\xF6r\xFCm.","Resm\xEE bir puan \xF6l\xE7e\u011Fi yok; vurgular \xABkritik\xBB ve \xABayn\u0131 derecede \xF6nemli\xBB gibi ifadelerle yap\u0131lm\u0131\u015Ft\u0131."],basit:["K\u0131saca: hesab\u0131 kendin yap, ger\xE7ekle kar\u015F\u0131la\u015Ft\u0131r, fark\u0131 a\xE7\u0131kla, foto\u011Frafla profili ba\u011Fla, d\xFCzg\xFCn yaz."],tablo:{baslik:["Konu","Puan getirir","Puan kaybettirir","Durum"],rozetSutun:3,satirlar:[["Girdi verisi","Do\u011Frudan veriden yaln\u0131z 100 kPa s\u0131cakl\u0131\u011F\u0131 ve her seviyede nem","Ba\u015Fka b\xFCy\xFCkl\xFCkleri haz\u0131r almak","teyitli"],["Hesap","Her b\xFCy\xFCkl\xFC\u011F\xFCn form\xFCl\xFC ve hesab\u0131 g\xF6r\xFCn\xFCr","Denklemsiz, do\u011Frudan rakam; haz\u0131r paket \xE7\u0131kt\u0131s\u0131","teyitli"],["Skew-T","Verilen ve derste g\xF6sterilen denklemlerle kendi \xE7izimin","Haz\u0131r \xE7izim paketi","teyitli"],["G\xFCn se\xE7imi","Part I g\xFCnleri; farkl\u0131 bulut katlar\u0131, varsa \u015Fiddetli hava","Tek tip bulut g\xFCnleri","teyitli"],["K\u0131yas","Hesaplanan ve radyosonde Skew-T\u2019yi yan yana yorumlamak (kritik)","K\u0131yas\u0131 g\xF6stermemek ya da yorumsuz b\u0131rakmak","teyitli"],["Foto\u011Fraf ve profil","Her g\xFCn\xFCn foto\u011Fraf\u0131n\u0131 profille birlikte de\u011Ferlendirmek (ayn\u0131 derecede \xF6nemli)","Foto\u011Fraf\u0131 ve hesab\u0131 ayr\u0131 ayr\u0131 anlatmak","teyitli"],["Rapor","Giri\u015F-geli\u015Fme-sonu\xE7 yap\u0131s\u0131, numaral\u0131 ba\u015Fl\u0131klar, APA 6, en az \xFC\xE7 sayfa","Kaynaks\u0131z iddia, d\xFCzensiz tablo","teyitli"],["Birim ve do\u011Fruluk","Tutarl\u0131 birimler, s\u0131nanm\u0131\u015F form\xFCller","hPa/kPa ve \xB0C/K kar\u0131\u015F\u0131kl\u0131\u011F\u0131","cikarim"],["Part I","Sabit saat ve yer, g\xFCn kapsamas\u0131, bulut cinsinin gerek\xE7esi","Bo\u015F g\xFCnler, saat tutars\u0131zl\u0131\u011F\u0131n\u0131 s\xF6ylememek","cikarim"]]}}]},rc=[{after:"g1",step:{id:"g1a",no:"0.2",baslik:{tr:"Ninova\u2019da proje nerede? (eski s\u0131n\u0131fa bak)",en:"Where is the project on Ninova? (look at the old class)"},neden:"Proje metnini, teslim penceresini ve duyurular\u0131 bilmeden do\u011Fru yere haz\u0131rlanamazs\u0131n; hepsi Ninova\u2019da duruyor.",teknik:["Yol: Ninova \u2192 Kamp\xFCs \u2192 ders s\u0131n\u0131f\u0131 (MTO 342E) \u2192 sol men\xFCde \xABS\u0131n\u0131f \xD6devleri\xBB.","Eski d\xF6nemin s\u0131n\u0131f\u0131 da listende kal\u0131r: oradan ge\xE7en d\xF6nemin proje metnini, teslim pencerelerini ve duyurular\u0131n\u0131 okuyabilirsin.","\xDC\xE7 ba\u015Fl\u0131k g\xF6receksin: Part I, Part II ve G\xFCncellenmi\u015F Part II.","Her ba\u015Fl\u0131\u011F\u0131n sayfas\u0131nda d\xF6rt alan var: teslim ba\u015Flang\u0131c\u0131 ve biti\u015Fi, a\xE7\u0131klama alan\u0131, kaynak dosyalar (hocan\u0131n PDF\u2019i), istenen dosyalar (zip ya da rar).","Part I\u2019in kaynak dosyas\u0131 k\u0131sa bir \xF6zet belgesi; Part II\u2019ninki \xABhesaplama ad\u0131mlar\u0131\xBB belgesi.","G\xFCncellenmi\u015F Part II\u2019de kaynak dosya yok; a\xE7\u0131klama alan\u0131 rapor, hesaplamalar, sunum gibi her \u015Feyin tek zip\u2019te y\xFCklenmesini istiyor.","S\u0131n\u0131f Duyurular\u0131: Part I tan\u0131t\u0131m\u0131, Skew-T i\xE7in iki kaynak ba\u011Flant\u0131s\u0131 ve Part II i\xE7in puanlamada vurgulananlar\u0131n \xF6zeti burada.","S\u0131n\u0131f Dosyalar\u0131 ve Ders Dosyalar\u0131 ders slaytlar\u0131n\u0131 ta\u015F\u0131yor; projeye \xF6zel bir klas\xF6r yok."],basit:["\u0130lk i\u015F S\u0131n\u0131f Duyurular\u0131\u2019n\u0131 oku. Neyin puan getirece\u011Fini en a\xE7\u0131k orada yaz\u0131yor.","Sonra proje sayfas\u0131ndaki PDF\u2019i indir ve \xABistenenler\xBB listesini \xE7\u0131kar (bu rehberde Part I ve Part II\u2019nin ba\u015F\u0131ndaki liste gibi).","Teslim pencerelerine bak: Part II\u2019nin ard\u0131ndan ikinci bir pencere (g\xFCncellenmi\u015F teslim) a\xE7\u0131ld\u0131; ilk teslimi yap\u0131p b\u0131rakma, ikinci \u015Fans\u0131 de\u011Ferlendir."],gorsel:[{diag:"ninova",altAdim:"0.2a",alt:"Ninova s\u0131n\u0131f sayfas\u0131ndaki \xFC\xE7 proje teslim ba\u015Fl\u0131\u011F\u0131n\u0131n sadele\u015Ftirilmi\u015F \xE7izimi",cap:"Alt ad\u0131m 0.2a. Eski s\u0131n\u0131fta S\u0131n\u0131f \xD6devleri sayfas\u0131n\u0131n sadele\u015Ftirilmi\u015F \xE7izimi: \xFC\xE7 ba\u015Fl\u0131k, teslim pencereleri, kaynak ve istenen dosyalar. (Ger\xE7ek sayfada kurum g\xF6rselleri var; burada yaln\u0131z bilgi korunmu\u015Ftur.)"}]}},{after:"p1-6",step:{id:"p1-6a",no:"6a",baslik:{tr:"ERA5 hesab\u0131 ve ilk istek: kurulum ad\u0131mlar\u0131",en:"ERA5 account and first request: setup steps"},neden:"ERA5\u2019i ilk kez kullanacak biri i\xE7in en uzun s\xFCren \u015Fey kod de\u011Fil, hesab\u0131 ve anahtar\u0131 do\u011Fru kurmak.",teknik:["A\u015Fa\u011F\u0131daki dokuz ad\u0131m, s\u0131f\u0131rdan ilk \xE7al\u0131\u015Fan iste\u011Fe g\xF6t\xFCr\xFCr.","Ad\u0131m 4\u2019teki anahtar sana \xF6zeldir; kimseyle payla\u015Fma ve bir depoya y\xFCkleme.","\u0130stekler kuyru\u011Fa girer; birka\xE7 dakika bekleyebilirsin."],basit:["\u0130lk g\xFCn sadece bir g\xFCnl\xFCk, k\xFC\xE7\xFCk bir istekle dene. \xC7al\u0131\u015Ft\u0131\u011F\u0131n\u0131 g\xF6r\xFCnce d\xF6nemin tamam\u0131n\u0131 tek seferde iste."],tablo:{baslik:["#","Yap\u0131lacak","Not"],satirlar:[["1","Copernicus \u0130klim Veri Deposu\u2019nda \xFCcretsiz hesap a\xE7","e-posta ile; onay mailini bekle"],["2","\xABERA5 hourly data on pressure levels\xBB veri seti sayfas\u0131n\u0131 a\xE7; \u0130ndirme sekmesinde lisans\u0131 kabul et","Kabul etmezsen istek reddedilir"],["3","Profil sayfandaki API anahtar\u0131n\u0131 (ki\u015Fisel eri\u015Fim anahtar\u0131) bul","Gizli tut"],["4","Kullan\u0131c\u0131 klas\xF6r\xFCnde .cdsapirc dosyas\u0131 olu\u015Ftur: iki sat\u0131r, url ve key","url: https://cds.climate.copernicus.eu/api"],["5","pip install cdsapi netCDF4 numpy","Python 3.9 ve \xFCst\xFC"],["6","6. ad\u0131mdaki iste\u011Fi \xE7al\u0131\u015Ft\u0131r; \xF6nce tek g\xFCn, alan kutusu geni\u015F","2\xB0 \xD7 2\xB0 gibi"],["7","Gelen .nc dosyas\u0131n\u0131 netCDF4.Dataset ile a\xE7, de\u011Fi\u015Fken adlar\u0131n\u0131 yazd\u0131r","zaman, bas\u0131n\xE7 seviyesi, enlem, boylam, t, r"],["8","Enlem/boylamda g\xF6zlem noktana en yak\u0131n \u0131zgara h\xFCcresini se\xE7; saatleri UTC+3\u2019e \xE7evir; foto\u011Fraf an\u0131na enterpole et","numpy.interp"],["9","\u0130lk kontrol: s\u0131cakl\u0131k Kelvin (\u2212273,15), nem y\xFCzde mi?","Birim hatas\u0131 burada yakalan\u0131r"]]}}},{after:"p2-6",step:{id:"p2-6a",no:"6a",baslik:{tr:"Tek sat\u0131rl\u0131k elle hesap: 27 Nisan, 100 kPa",en:"One row by hand: 27 April, 100 kPa"},neden:"Form\xFCller bir tabloda uzak g\xF6r\xFCn\xFCr; tek sat\u0131r\u0131 elle yap\u0131nca hepsinin nas\u0131l birbirine ba\u011Fland\u0131\u011F\u0131 g\xF6r\xFCn\xFCr.",teknik:["Girdiler (radyosonde, 12 UTC): y\xFCzey s\u0131cakl\u0131\u011F\u0131 13,2 \xB0C ve 100 kPa\u2019daki ba\u011F\u0131l nem %44.","A\u015Fa\u011F\u0131daki on bir ad\u0131m, tablodaki 100 ve 95 kPa sat\u0131rlar\u0131n\u0131 elle \xFCretir ve kodun sonucuyla birebir uyu\u015Fur.","Say\u0131lar\u0131 bir hesap makinesiyle ya da Python\u2019da kendin tekrarla; ayn\u0131 \xE7\u0131kmal\u0131."],basit:["Bu tek sat\u0131r\u0131 yapabiliyorsan, tablonun geri kalan\u0131 ayn\u0131 i\u015Fin 17 tekrar\u0131.","Her ad\u0131mda sonu\xE7 bir sonraki ad\u0131m\u0131n girdisi; bir ad\u0131mda hata yaparsan sonrakilerin hepsi kayar."],tablo:{baslik:["#","\u0130\u015Flem","Form\xFCl","Say\u0131"],satirlar:[["1","Kelvin\u2019e \xE7evir","T = 13,2 + 273,15","T = 286,35 K"],["2","Doyma buhar bas\u0131nc\u0131","es = 0,6112\xB7exp[(Lv/Rv)(1/273,15 \u2212 1/T)]","\xFCs \u2248 0,914  \u2192  es \u2248 1,525 kPa"],["3","Ger\xE7ek buhar bas\u0131nc\u0131","e = (RH/100)\xB7es","e = 0,44 \xD7 1,525 \u2248 0,671 kPa"],["4","Kar\u0131\u015Fma oranlar\u0131","r = \u03B5\xB7e/(P \u2212 e);  rs = \u03B5\xB7es/(P \u2212 es)","r \u2248 4,20 g/kg;  rs \u2248 9,63 g/kg"],["5","\xD6zg\xFCl nem","q = r/(1 + r)","q \u2248 4,18 g/kg"],["6","\xC7iy noktas\u0131","Td = 1/[1/273,15 \u2212 (Rv/Lv)\xB7ln(e/0,6112)]","Td \u2248 274,44 K = 1,29 \xB0C"],["7","Kaba LCL (125 m/\xB0C)","z \u2248 125\xB7(T \u2212 Td)","125 \xD7 11,91 \u2248 1489 m (Bolton ile 1503 m)"],["8","\u0394T/\u0394P: pay ve payda","pay = a\xB7T + c\xB7rs;  payda = P\xB7(1 + b\xB7rs/T\xB2)","pay = 81,81 + 23,96 = 105,77;  payda = 100\xB7(1 + 1,585) = 258,54"],["9","E\u011Fim","\u0394T/\u0394P = pay / payda","0,409 K/kPa"],["10","5 kPa yukar\u0131 (Euler tahmini)","T\u2082 \u2248 T\u2081 + (\u0394T/\u0394P)\xB7(P\u2082 \u2212 P\u2081)","286,35 \u2212 0,409 \xD7 5 = 284,30 K = 11,15 \xB0C  (RK4: 11,08 \xB0C)"],["11","Potansiyel s\u0131cakl\u0131k, kontrol","\u03B8 = T\u2082\xB7(100/95)^0,2857","284,23 \xD7 1,0148 \u2248 288,42 K = tablodaki de\u011Fer"]],not:"Ad\u0131m 10\u2019da Euler ile RK4 aras\u0131nda 0,07 K fark var: basamak ba\u015F\u0131ndaki e\u011Fimle yetinmeyip basamak ortas\u0131ndaki e\u011Fimlere de bakman\u0131n k\xFC\xE7\xFCk ama ger\xE7ek kazanc\u0131."}}}],ac={g2:{no:"0.3"},g4:{no:"0.5"},g3:{no:"0.4",teknik:["G\xF6zlem d\xF6nemi: Nisan ortas\u0131 \u2013 May\u0131s ba\u015F\u0131 (10 Nisan \u2013 5 May\u0131s aral\u0131\u011F\u0131nda 22 g\xFCn).","Part I: Nisan ba\u015F\u0131nda a\xE7\u0131ld\u0131; k\u0131sa bir tan\u0131t\u0131m ofiste yap\u0131ld\u0131; ayr\u0131nt\u0131l\u0131 \xF6zet belgesi May\u0131s ba\u015F\u0131nda s\u0131n\u0131fa kondu; teslim May\u0131s ba\u015F\u0131.","Part II: \xABhesaplama ad\u0131mlar\u0131\xBB belgesi May\u0131s ortas\u0131nda yay\u0131mland\u0131; teslim May\u0131s ortas\u0131. Tak\u0131ld\u0131\u011F\u0131n yerler i\xE7in ofis saatleri duyuruldu.","\u0130lk s\xFCr\xFCm\xFCm\xFC (Excel, CSV ve k\u0131sa betikler) bu s\xFCre i\xE7inde teslim ettim.","Sonra \xABg\xFCncellenmi\u015F Part II\xBB teslimi May\u0131s sonuna kadar a\xE7\u0131ld\u0131: rapor, hesaplamalar, sunum gibi her \u015Fey tek zip.","Bu ikinci pencerede Part II\u2019yi s\u0131f\u0131rdan, mod\xFCllere b\xF6l\xFCnm\xFC\u015F ve birim testli bir proje olarak yazd\u0131m (sabitler, termo, profil, indeksler, veri, tablo, skewt, main, rapor \xFCretici). Part I raporu ve sunumu da ayn\u0131 g\xFCn verisinden betikle \xFCretildi."]},"p2-2":{tuzak:"Benim be\u015F g\xFCn\xFCmde ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli bir g\xFCn yoktu; oysa duyuru farkl\u0131 bulut katlar\u0131n\u0131 ve varsa \u015Fiddetli hava g\xFCnlerini \xF6ne \xE7\u0131kar\u0131yordu. Bir daha olsa kapal\u0131 ve ya\u011F\u0131\u0 31yor; ilk turun hatalar\u0131n\u0131 ilgili ad\u0131mlarda \xABtuzak\xBB kutusunda yazd\u0131m."]},{id:"g4",no:"0.4",baslik:{tr:"Kulland\u0131\u011F\u0131m ara\xE7lar",en:"Tools I used"},neden:"Hepsi \xFCcretsiz; nereden ne alaca\u011F\u0131n\u0131 bilmek zaman kazand\u0131r\u0131r.",teknik:["Dil ve k\xFCt\xFCphaneler: Python 3.9; numpy, pandas, matplotlib, openpyxl, requests, pillow, pillow-heif, netCDF4, python-docx, python-pptx.","Veri: Copernicus \u0130klim Veri Deposu (ERA5 yeniden analizi, NetCDF) ve Wyoming \xDCniversitesi radyosonde ar\u015Fivi (\u0130stanbul/Kartal, istasyon 17064, metin \xE7\u0131kt\u0131s\u0131).","Foto\u011Fraf: Fujifilm foto\u011Fraf makinesi (RAW .RAF) ve cep telefonu (.HEIC / .JPG)."],basit:["Yaz\u0131l\u0131m taraf\u0131nda tek \u015Fart Python. Veri taraf\u0131nda iki \xFCcretsiz kaynak yetiyor: ERA5 i\xE7in \xFCcretsiz bir hesap a\xE7man gerekiyor, radyosonde i\xE7in hi\xE7bir \u015Fey gerekmiyor."]}]},{id:"p1",baslik:{tr:"Part I: g\xF6ky\xFCz\xFC g\xF6zlemi",en:"Part I: sky observation"},ozet:"Foto\u011Fraftan bulut cinsine, bulut cinsinden g\xFCnl\xFCk tabloya, tablodan \xF6zet yaz\u0131ya giden yol.",istenen:["Ard\u0131\u015F\u0131k 25 g\xFCn, sabit saat ve sabit yerde g\xF6ky\xFCz\xFCn\xFC g\xF6zle.","Her g\xFCn net g\xF6ky\xFCz\xFC foto\u011Fraf\u0131 \xE7ek, temel meteorolojik de\u011Fi\u015Fkenleri not al, g\xF6zlem defteri tut.","Bir ya da bir bu\xE7uk sayfal\u0131k Word \xF6zeti yaz: (a) genel hava paterni, (b) bulut olu\u015Fumu ve ana bulut tipleri, (c) ya\u011F\u0131\u015F ve ya\u011F\u0131\u015Fl\u0131 g\xFCn say\u0131s\u0131, (d) s\u0131cakl\u0131k, nem ve r\xFCzg\xE2r\u0131n rol\xFC, (e) foto\u011Fraflar\u0131n kullan\u0131m\u0131.","G\xF6zlem, veri, foto\u011Fraf ve \xF6zeti tek zip olarak Ninova\u2019ya y\xFCkle."],adimlar:[{id:"p1-1",no:"1",baslik:{tr:"G\xF6zlem d\xFCzenini kur",en:"Set up the observation routine"},neden:"Sabit saat ve sabit yer \u015Fart\u0131, g\xFCnler aras\u0131ndaki fark\u0131n hava m\u0131 yoksa senin yerin mi oldu\u011Funu ay\u0131rt etmeni sa\u011Flar.",teknik:["Ana nokta: Ayaza\u011Fa kamp\xFCs\xFC (yakla\u015F\u0131k 41,10\xB0K, 29,02\xB0D). 24\u201326 Nisan \u0130zmir\u2019de, 22 Nisan yolculukta (\u0130stanbul \u2192 Ege) g\xF6zlem yapt\u0131m.","Her g\xFCn ayn\u0131 kadraj\u0131 korumaya \xE7al\u0131\u015Ft\u0131m: g\xF6ky\xFCz\xFC + ufuk \xE7izgisi + tan\u0131d\u0131k bir yer i\u015Fareti. Bir g\xFCnde 3\u201310 kare.","Sabit saati tutamad\u0131m: \xE7ekimler sabah 07:00 ile ak\u015Fam 19:50 aras\u0131na da\u011F\u0131ld\u0131. Bu y\xFCzden her karenin saatini elle yazmak yerine foto\u011Fraf\u0131n EXIF \xAB\xE7ekim zaman\u0131\xBB alan\u0131ndan okudum (3. ad\u0131m).","Kapsam: 10 Nisan \u2013 5 May\u0131s aral\u0131\u011F\u0131nda 22 g\xFCn. 11, 12, 19 ve 23 Nisan bo\u015F kald\u0131; yani 25 ard\u0131\u015F\u0131k g\xFCn \u015Fart\u0131n\u0131 tam kar\u015F\u0131lamad\u0131m."],basit:["En kolay ka\xE7an \u015Fart \xABher g\xFCn ayn\u0131 saat\xBB. Ben ka\xE7\u0131rd\u0131m. Kurtaran \u015Fey foto\u011Fraf\u0131n i\xE7inde zaten saat damgas\u0131 olmas\u0131.","Tavsiyem: telefona g\xFCnl\xFCk alarm kur, ayn\u0131 yere d\xF6n, ufuk \xE7izgisini kadraja al. Be\u015F dakikal\u0131k i\u015F ama puan\u0131n\u0131 korur."],tuzak:"D\xF6rt g\xFCn bo\u015F b\u0131rakt\u0131m ve \xABard\u0131\u015F\u0131k\xBB \u015Fart\u0131 zay\u0131flad\u0131. Bir g\xFCn ka\xE7\u0131r\u0131rsan ertesi g\xFCn telafi edemezsin; alarm kurmak en ucuz \xE7\xF6z\xFCm.",gorsel:[{src:J+"gozlem_20nis.jpg",altAdim:"1a",alt:"Ayaza\u011Fa\u2019dan bat\u0131ya, g\xFCn bat\u0131m\u0131na do\u011Fru \xE7ekilmi\u015F g\xF6ky\xFCz\xFC; ince lifli bulutlar",cap:"Alt ad\u0131m 1a. Tipik g\xF6zlem karesi: kamera yukar\u0131 e\u011Fik, solda bina kenar\u0131 (yer i\u015Fareti), altta ufuk. Lifli, k\u0131vr\u0131k ince bulutlar bu karede g\xF6r\xFCn\xFCyor."}]},{id:"p1-2",no:"2",baslik:{tr:"Foto\u011Fraflar\u0131 g\xFCnlere ay\u0131r",en:"Sort photos into day folders"},neden:"Part II\u2019de ayn\u0131 g\xFCnlerin saatine ve karesine geri d\xF6neceksin; ba\u015Ftan d\xFCzenli tutmak ikinci par\xE7ay\u0131 kolayla\u015Ft\u0131r\u0131r.",teknik:["Her g\xFCn i\xE7in bir klas\xF6r (g\xFCn + ay ad\u0131yla). O g\xFCn\xFCn t\xFCm kareleri, ERA5 .nc dosyalar\u0131 ve veriyi \xE7eken komut metni ayn\u0131 klas\xF6rde.","Kameradan gelen dosya adlar\u0131na dokunmad\u0131m; g\xFCn klas\xF6r\xFC ana anahtar oldu.","G\xFCnl\xFCk de\u011Ferleri (saat, s\u0131cakl\u0131k, nem, bulut cinsi, yorum) Excel yerine tek bir Python s\xF6zl\xFC\u011F\xFCnde toplad\u0131m. Rapor, sunum ve \xF6zet tablo ayn\u0131 s\xF6zl\xFCkten \xFCretildi: bir de\u011Feri d\xFCzeltince hepsi d\xFCzeliyor."],basit:["Her g\xFCn\xFCn klas\xF6r\xFCne o g\xFCn\xFCn her \u015Feyini att\u0131m: foto\u011Fraf, veri dosyas\u0131, komut. \xABO g\xFCn neydi?\xBB diye sorunca tek yere bak\u0131yorum.","Veriyi tek yerde tutman\u0131n faydas\u0131: raporda 14,7 yaz\u0131p slaytta 14,6 yazma ihtimali yok."],gorsel:[{diag:"agac",altAdim:"2a",alt:"G\xFCn klas\xF6rlerinin a\u011Fa\xE7 g\xF6r\xFCn\xFCm\xFC",cap:"Alt ad\u0131m 2a. Klas\xF6r d\xFCzeni: bir ana klas\xF6r, alt\u0131nda g\xFCn klas\xF6rleri; her g\xFCn klas\xF6r\xFCnde kareler, ERA5 dosyalar\u0131 ve veri \xE7ekme notu."}]},{id:"p1-3",no:"3",baslik:{tr:"T\xFCm formatlar\u0131 JPG yap, saat damgas\u0131n\u0131 oku",en:"Convert everything to JPG, read the time stamp"},neden:"Telefon HEIC, kamera RAF verir; Word ve sunuma girmeleri i\xE7in ortak bir formata inmeleri gerekir.",teknik:[".HEIC \u2192 JPG: pillow-heif k\xFCt\xFCphanesini register_heif_opener() ile Pillow\u2019a tan\u0131tt\u0131m; ondan sonra Image.open() HEIC\u2019i do\u011Frudan a\xE7\u0131yor.",".RAF (Fujifilm ham): dosya \xABFUJIFILM\xBB ile ba\u015Fl\u0131yor. 84. bayttan itibaren 4 baytl\u0131k (big-endian) JPEG ofseti, 88. bayttan itibaren uzunlu\u011Fu var. O aral\u0131\u011F\u0131 okuyunca RAW\u2019\u0131n i\xE7ine g\xF6m\xFCl\xFC tam boyutlu JPEG \xF6nizleme \xE7\u0131k\u0131yor; RAW a\xE7mak i\xE7in ayr\u0131 program gerekmiyor.","Saat: EXIF\u2019te DateTimeOriginal (36867), yoksa DateTime (306), yoksa DateTimeDigitized (36868) alan\u0131. ImageOps.exif_transpose ile dik \xE7ekilen kareler d\xFCzeltildi, en uzun kenar 1280 px\u2019e k\xFC\xE7\xFClt\xFCld\xFC."],kod:{ad:"isleme.py (\xF6zet): RAF i\xE7inden g\xF6m\xFCl\xFC JPEG \xE7\u0131karma",metin:`def raf_embedded_jpeg(path):
    # Fuji RAF ba\u015Fl\u0131\u011F\u0131: JPEG ofseti 0x54'te, uzunluk 0x58'de (4 bayt, big-endian)
    with open(path, "rb") as f:
        head = f.read(96)
        if head[:8] != b"FUJIFILM":
            return None
        jpg_off = struct.unpack(">I", head[84:88])[0]
        jpg_len = struct.unpack(">I", head[88:92])[0]
        f.seek(jpg_off)
        data = f.read(jpg_len)
    return data if data[:2] == b"\\xff\\xd8" else None`},basit:["Telefon HEIC, makine RAF veriyor. Word ikisini de sevmiyor. HEIC\u2019i bir k\xFCt\xFCphane a\xE7\u0131yor; RAF\u2019\u0131n i\xE7inde zaten k\xFC\xE7\xFCk bir JPG sakl\u0131, onu kesip ald\u0131m.","Saati foto\u011Fraf\u0131n i\xE7inden okudu\u011Fum i\xE7in tek tek yazmak zorunda kalmad\u0131m ve yanl\u0131\u015F yazma ihtimalim s\u0131f\u0131rland\u0131."],gorsel:[{src:J+"raf_15nis.jpg",altAdim:"3a",alt:"Mavi g\xF6ky\xFCz\xFCnde k\xFC\xE7\xFCk dalga dalga bulut elemanlar\u0131",cap:"Alt ad\u0131m 3a. Bu kare .RAF dosyas\u0131yd\u0131; g\xF6m\xFCl\xFC JPEG \xE7\u0131kar\u0131ld\u0131ktan sonraki h\xE2li (yaln\u0131z g\xF6ky\xFCz\xFC k\u0131sm\u0131 k\u0131rp\u0131ld\u0131). K\xFC\xE7\xFCk, d\xFCzenli bulut elemanlar\u0131: uskumru g\xF6\u011F\xFC."},{src:J+"gok_28.jpg",altAdim:"3b",alt:"Mavi g\xF6ky\xFCz\xFCnde da\u011F\u0131n\u0131k k\xFC\xE7\xFCk k\xFCm\xFCl\xFCs bulutlar\u0131",cap:"Alt ad\u0131m 3b. Bu kare telefon .HEIC dosyas\u0131yd\u0131; JPG\u2019ye \xE7evrilmi\u015F h\xE2li. Bi\xE7im de\u011Fi\u015Fti, g\xF6r\xFCnt\xFC ayn\u0131."}]},{id:"p1-4",no:"4",baslik:{tr:"G\xFCn\xFC tek bak\u0131\u015Fta incele: montaj",en:"Review the day at a glance: contact sheet"},neden:"Bir g\xFCnde 10 kareyi tek tek a\xE7mak yerine hepsini bir sayfada g\xF6rmek, temsili kareyi se\xE7meyi h\u0131zland\u0131r\u0131r.",teknik:["Her g\xFCn i\xE7in t\xFCm kareler 3 s\xFCtunlu tek bir sayfaya dizildi; her karenin \xFCst\xFCne EXIF saati yaz\u0131ld\u0131 (Pillow ImageDraw).","Bu sayfa hem g\xFCn i\xE7inde bulutun nas\u0131l de\u011Fi\u015Fti\u011Fini (sabah\u2013ak\u015Fam) hem de rapora girecek kareyi se\xE7meyi sa\u011Flad\u0131. Se\xE7im \xF6l\xE7\xFCt\xFCm: en net, bulutu en iyi g\xF6steren, kadraj\u0131 bozuk olmayan kare."],basit:["20\u201330 foto\u011Fraf\u0131 tek tek a\xE7mak yerine hepsini bir sayfaya dizdim, g\xF6z\xFCmle en iyisini se\xE7tim. \xDCstteki saat damgas\u0131 sayesinde \xABbu sabahki mi ak\u015Famki mi\xBB kar\u0131\u015Fm\u0131yor."],gorsel:[{src:J+"montaj_20nis.jpg",altAdim:"4a",alt:"\xDC\xE7 karelik montaj: \xFCstlerinde saat damgas\u0131 olan g\xFCn bat\u0131m\u0131 g\xF6ky\xFCz\xFC foto\u011Fraflar\u0131",cap:"Alt ad\u0131m 4a. Montaj\u0131n ilk sat\u0131r\u0131: her karenin \xFCst\xFCnde \xE7ekim saati. Ayn\u0131 ak\u015Fam i\xE7inde bulutlar\u0131n g\xFCne\u015Fe g\xF6re nas\u0131l dizildi\u011Fini bir bak\u0131\u015Fta g\xF6r\xFCyorsun."},{src:J+"montaj_16nis.jpg",altAdim:"4b",alt:"Koyu gri, al\xE7ak, kapal\u0131 g\xF6ky\xFCz\xFCn\xFCn \xFC\xE7 karesi",cap:"Alt ad\u0131m 4b. Ba\u015Fka bir g\xFCn: ba\u015Ftan sona gri \xF6rt\xFC. Karelerin neredeyse ayn\u0131 g\xF6r\xFCnmesi bile tan\u0131 i\xE7in bilgi: yap\u0131s\u0131z, kal\u0131n bir tabaka."}]},{id:"p1-5",no:"5",baslik:{tr:"Bulut cinsini belirle",en:"Identify the cloud genus"},neden:"Bulut cinsi, projenin Part II ucuyla birle\u015Fecek ana g\xF6zlem \xE7\u0131kt\u0131s\u0131.",teknik:["S\u0131n\u0131flama d\xFCnya standard\u0131 (WMO) cinslerine g\xF6re: y\xFCksek (Cirrus, Cirrostratus), orta (Altocumulus, Altostratus), al\xE7ak (Stratus, Stratocumulus, Cumulus) ve d\xFC\u015Fey geli\u015Fimli ya da ya\u011F\u0131\u015F \xFCreten (Nimbostratus, Cumulonimbus). Il\u0131man ku\u015Fakta yakla\u015F\u0131k katlar: al\xE7ak 0\u20132 km, orta 2\u20137 km, y\xFCksek 5\u201313 km.","Karar \xF6l\xE7\xFCtlerim: (1) doku: lifli mi, dalgal\u0131-yumrulu mu, p\xFCr\xFCzs\xFCz tabaka m\u0131, kabar\u0131k m\u0131; (2) \xF6rt\xFC miktar\u0131; (3) g\xFCne\u015F se\xE7iliyor mu; (4) o g\xFCn\xFCn s\u0131cakl\u0131k, nem ve ya\u011F\u0131\u015F bilgisi.","Foto\u011Fraf tek ba\u015F\u0131na yetmedi: kapal\u0131 gri bir tabaka Stratus mu Nimbostratus mu? Ya\u011F\u0131\u015Fa ve neme bakarak karar verdim (ba\u011F\u0131l nem %85\u2019e yak\u0131n ve ya\u011F\u0131\u015F varsa Nimbostratus)."],basit:["Bulut ismi iki soruyla bulunuyor: ka\xE7\u0131nc\u0131 katta (y\xFCksek, orta, al\xE7ak) ve nas\u0131l g\xF6r\xFCn\xFCyor (lif, dalga, d\xFCz tabaka, kabar\u0131k).","G\xFCne\u015Fin i\xE7inden ge\xE7iyorsa ince bir bulut, g\xFCne\u015F tamamen kay\u0131psa kal\u0131n bir bulut. Karars\u0131z kald\u0131\u011F\u0131mda neme ve ya\u011F\u0131\u015Fa bak\u0131p ikinci bir kontrol yapt\u0131m."],gorsel:[{diag:"bulutkat",altAdim:"5a",alt:"Bulut katlar\u0131 ve cinsleri \u015Femas\u0131",cap:"Alt ad\u0131m 5a. \xD6nce hangi katta oldu\u011Funa karar ver. \u015Eemadaki cinsler bu projede g\xF6rd\xFCklerim."},{src:J+"gok_20.jpg",altAdim:"5b",alt:"\u0130nce, k\u0131vr\u0131k, lifli y\xFCksek bulutlar",cap:"Alt ad\u0131m 5b. Cirrus (kancal\u0131, lifli): y\xFCksek kat, buz kristali, ince ve k\u0131vr\u0131k yap\u0131."},{src:J+"raf_15nis.jpg",altAdim:"5c",alt:"K\xFC\xE7\xFCk dalgal\u0131 bulut elemanlar\u0131",cap:"Alt ad\u0131m 5c. Altocumulus: orta kat, k\xFC\xE7\xFCk d\xFCzenli yumrular; mavi g\xF6ky\xFCz\xFC aralardan g\xF6r\xFCn\xFCr."},{src:J+"gok_28.jpg",altAdim:"5d",alt:"Da\u011F\u0131n\u0131k bodur k\xFCm\xFCl\xFCsler",cap:"Alt ad\u0131m 5d. Cumulus humilis: al\xE7ak kat, taban\u0131 d\xFCz, yatay geni\u015Fli\u011Fi boyundan fazla; g\xFCn i\xE7i \u0131s\u0131nman\u0131n bulutu."},{src:J+"gok_21.jpg",altAdim:"5e",alt:"G\xF6ky\xFCz\xFCn\xFC kaplayan dokulu gri-beyaz \xF6rt\xFC",cap:"Alt ad\u0131m 5e. Stratocumulus: al\xE7ak kat, geni\u015F ve dokulu \xF6rt\xFC; mavi a\xE7\u0131kl\u0131klar k\xFC\xE7\xFCk."},{src:J+"montaj_3may.jpg",altAdim:"5f",alt:"Koyu gri, kal\u0131n ve kapal\u0131 g\xF6ky\xFCz\xFC, ya\u011F\u0131\u015Fl\u0131 g\xFCn",cap:"Alt ad\u0131m 5f. Nimbostratus: kal\u0131n, koyu, yap\u0131s\u0131z ve \u0131\u015F\u0131k ge\xE7irmeyen \xF6rt\xFC; ya\u011F\u0131\u015Fl\u0131 g\xFCn\xFCn bulutu."},{src:J+"gok_27.jpg",altAdim:"5g",alt:"Bulutsuz, derin mavi g\xF6ky\xFCz\xFC",cap:"Alt ad\u0131m 5g. Bulutsuz g\xF6ky\xFCz\xFC de bir g\xF6zlemdir; \xAByok\xBB sonucu Part II\u2019de en kolay a\xE7\u0131klanan sonu\xE7lardan biri \xE7\u0131kt\u0131."}]},{id:"p1-6",no:"6",baslik:{tr:"S\u0131cakl\u0131k ve nemi topla: ERA5",en:"Collect temperature and humidity: ERA5"},neden:"G\xF6rd\xFC\u011F\xFCn bulutu nem ve s\u0131cakl\u0131kla birlikte okumak tan\u0131y\u0131 do\u011Frulat\u0131r.",teknik:["Kaynak: Copernicus \u0130klim Veri Deposu \u2192 \xABERA5 hourly data on pressure levels\xBB ve tek seviye s\u0131cakl\u0131\u011F\u0131 (2 m). \xC7\u0131kt\u0131 bi\xE7imi NetCDF (.nc), nokta yakla\u015F\u0131k 41,10\xB0K 29,02\xB0D.","De\u011Fi\u015Fkenler: 2 m s\u0131cakl\u0131k (t2m, Kelvin) ve bas\u0131n\xE7 seviyelerinde ba\u011F\u0131l nem (r, %). Seviyeler: 1000, 950, 900, 850, 800, 750, 650, 550, 450, 350, 250, 200 hPa.","Zaman: ERA5 UTC\u2019dir; yerel saat UTC+3. Foto\u011Fraf saatinin iki yan\u0131ndaki ERA5 saatleri aras\u0131nda do\u011Frusal zaman enterpolasyonu yapt\u0131m (numpy.interp) ve foto\u011Fraf an\u0131ndaki de\u011Feri buldum.","Y\xFCzeye en yak\u0131n nem = 1000 hPa seviyesindeki r. R\xFCzg\xE2r ve ya\u011F\u0131\u015F ERA5 y\xFCzey dosyamda yoktu; onlar\u0131 ayr\u0131 bir resm\xEE hava uygulamas\u0131ndan g\xF6zlem olarak okudum ve yaln\u0131zca kendi notum olarak kulland\u0131m (bu rehbere say\u0131 yazm\u0131yorum)."],kod:{ad:"ERA5 iste\u011Fi (\xF6zet; alan kutusunu geni\u015F vermek \xF6nemli)",metin:`import cdsapi

,baslik:{tr:"a\u2013e \xF6zetini yaz",en:"Write the a\u2013e summary"},neden:"Not bu bir bu\xE7uk sayfada verilir; tablo ve foto\u011Fraflar kan\u0131t, \xF6zet ise yorum.",teknik:["(a) Genel patern: d\xF6nem ilkbahar\u0131n de\u011Fi\u015Fken do\u011Fas\u0131n\u0131 yans\u0131tt\u0131. Kapal\u0131 ve ya\u011F\u0131\u015Fl\u0131 bir ba\u015Flang\u0131\xE7, ard\u0131ndan y\xFCksek bas\u0131n\xE7l\u0131 a\xE7\u0131k bir evre, May\u0131s ba\u015F\u0131nda so\u011Fuk ve karars\u0131z ya\u011F\u0131\u015Fl\u0131 bir evre.","(b) Bulut: d\xF6rt kat\u0131n hepsinden \xF6rnek var: y\xFCksek (Cirrus, Cirrostratus), orta (Altocumulus), al\xE7ak (Cumulus humilis, Stratocumulus), ya\u011F\u0131\u015Fl\u0131 (Nimbostratus, Stratus).","(c) Ya\u011F\u0131\u015F: belirgin ya\u011F\u0131\u015F \xFC\xE7 g\xFCnde, eser ve aral\u0131kl\u0131 ya\u011F\u0131\u015F \xFC\xE7 g\xFCnde; ya\u011F\u0131\u015Fl\u0131 g\xFCnlerin tamam\u0131 so\u011Fuk ve nemliydi.","(d) Rolleri: ba\u011F\u0131l nem tan\u0131n\u0131n en g\xFC\xE7l\xFC g\xF6stergesiydi: yakla\u015F\u0131k %50 alt\u0131nda g\xF6ky\xFCz\xFC a\xE7\u0131k, yakla\u015F\u0131k %75 \xFCst\xFCnde kapal\u0131 ve ya\u011F\u0131\u015Fl\u0131. S\u0131cak g\xFCnler a\xE7\u0131k ve kuru, so\u011Fuk g\xFCnler kapal\u0131. Kuzeyli, g\xFC\xE7lenen r\xFCzg\xE2rlar so\u011Fuk ve nemli havan\u0131n ta\u015F\u0131nd\u0131\u011F\u0131na i\u015Faret etti.","(e) Foto\u011Fraflar: her tan\u0131 bir foto\u011Frafa ba\u011Fland\u0131; bulut cinsleri bu foto\u011Fraflardan okundu, de\u011Fi\u015Fkenlerle do\u011Fruland\u0131."],basit:["\xD6zeti yazarken her ba\u015Fl\u0131\u011Fa en az bir somut g\xFCn \xF6rne\u011Fi koydum (\xAB20 Nisan\u2019da kancal\u0131 Cirrus\u2026\xBB). Genel c\xFCmle de\u011Fil, g\xFCn g\xF6stererek yazmak hem daha k\u0131sa hem daha ikna edici oluyor.","Buldu\u011Fum en net sonu\xE7 tek c\xFCmleydi: nem y\xFCksekse kapal\u0131, d\xFC\u015F\xFCkse a\xE7\u0131k. Part II bu c\xFCmlenin neden do\u011Fru oldu\u011Funu hesapla g\xF6steriyor."],tablo:{baslik:["Ba\u015Fl\u0131k","Ne yazd\u0131m","Dayanak"],satirlar:[["a) Genel patern","Kapal\u0131-ya\u011F\u0131\u015Fl\u0131 ba\u015Flang\u0131\xE7, y\xFCksek bas\u0131n\xE7l\u0131 a\xE7\u0131k evre, May\u0131s ba\u015F\u0131nda so\u011Fuk ve karars\u0131z evre","G\xFCnl\xFCk tablodaki bulut ve nem s\u0131ras\u0131"],["b) Bulut olu\u015Fumu","D\xF6rt kat\u0131n hepsinden \xF6rnek; hangi g\xFCn hangi cins","Foto\u011Fraflar ve montajlar"],["c) Ya\u011F\u0131\u015F","Belirgin ya\u011F\u0131\u015Fl\u0131 g\xFCn say\u0131s\u0131, eser ya\u011F\u0131\u015Fl\u0131 g\xFCn say\u0131s\u0131, ortak \xF6zellikleri","G\xFCn kartlar\u0131"],["d) T, nem, r\xFCzg\xE2r","Nem e\u015Fikleri (yakla\u015F\u0131k %50 alt\u0131 a\xE7\u0131k, %75 \xFCst\xFC kapal\u0131), s\u0131cak-kuru ve so\u011Fuk-nemli e\u015Fle\u015Fmesi","ERA5 s\u0131cakl\u0131k ve nem s\xFCtunlar\u0131"],["e) Foto\u011Fraflar\u0131n kullan\u0131m\u0131","Her tan\u0131y\u0131 bir foto\u011Frafa ba\u011Flayan \xF6rnekler","Se\xE7ilmi\u015F kareler"]],not:"Her ba\u015Fl\u0131kta en az bir somut g\xFCn \xF6rne\u011Fi kullan\u0131ld\u0131."}},{id:"p1-9",no:"9",baslik:{tr:"Rapor ve sunumu \xFCret, paketle",en:"Generate the report and slides, package"},neden:"Kodla \xFCretilen rapor, veri de\u011Fi\u015Fince bir komutla yenilenir; elle Word d\xFCzeltmesi hata \xFCretir.",teknik:["Rapor: python-docx ile. Her g\xFCn bir kart: ba\u015Fl\u0131k \xE7ubu\u011Fu (tarih, konum, saat) \u2192 de\u011Ferler tablosu \u2192 bulut cinsi \u2192 yorum \u2192 foto\u011Fraf ve altyaz\u0131. Sonda \xF6zet (a\u2013e) ve t\xFCm g\xFCnlerin tablosu.","Sunum: python-pptx ile k\u0131sa bir deste; g\xFCn ba\u015F\u0131na bir slayt: foto\u011Fraf + bulut cinsi + tek c\xFCmle.","Teslim: Word \xF6zeti, i\u015Flenmi\u015F foto\u011Fraflar, ham veri dosyalar\u0131 ve kodlar tek zip; Ninova\u2019ya y\xFCkleme."],basit:["Raporu elle Word\u2019de yazmad\u0131m; betik yazd\u0131. Bir de\u011Fer yanl\u0131\u015Fsa veri dosyas\u0131nda d\xFCzeltiyorum, rapor ve sunum yeniden \xFCretiliyor.","Zip\u2019e hi\xE7bir \u015Feyi atlamadan koy: istenen \xABhepsi\xBB demekti."],tablo:{baslik:["G\xFCn kart\u0131 b\xF6l\xFCm\xFC","\u0130\xE7erik","Kaynak"],satirlar:[["Ba\u015Fl\u0131k \xE7ubu\u011Fu","Tarih, g\xFCn ad\u0131, konum, \xE7ekim saat aral\u0131\u011F\u0131","EXIF ve g\xFCnl\xFCk veri s\xF6zl\xFC\u011F\xFC"],["De\u011Ferler tablosu","ERA5 s\u0131cakl\u0131\u011F\u0131 ve nemi (varsa)","ERA5 .nc dosyas\u0131"],["Bulut tipi","Cins ve k\u0131sa nitelik (kapal\u0131, par\xE7al\u0131, a\xE7\u0131k)","Benim s\u0131n\u0131flamam"],["Yorum","2\u20133 c\xFCmle: g\xF6rd\xFCm \u2192 bulut \u2192 de\u011Ferler destekliyor mu","G\xFCnl\xFCk veri s\xF6zl\xFC\u011F\xFC"],["Foto\u011Fraf ve altyaz\u0131","Se\xE7ilen temsil\xEE kare, alt\u0131nda tarih ve cins","Montajdan se\xE7ilen kare"]],not:"Ayn\u0131 s\xF6zl\xFCkten hem rapor kartlar\u0131 hem sunum slaytlar\u0131 hem de sonraki par\xE7adaki \xF6zet tablosu \xFCretildi."}}],dersler:["Alarm kur, ayn\u0131 saatte ayn\u0131 yere git. Bo\u015F kalan d\xF6rt g\xFCn en ucuz hatayd\u0131.","Her g\xFCn\xFCn her \u015Feyini (kare, veri, komut) tek klas\xF6rde tut; sonradan arama zaman\u0131 yok.","Saati elle yazma, EXIF\u2019ten oku.","Veriyi tek yerde tut, rapor ve sunumu koddan \xFCret.","Bulut ismini foto\u011Fraftan de\u011Fil, foto\u011Fraf + nem + ya\u011F\u0131\u015Ftan koy."]},{id:"p2",baslik:{tr:"Part II: dikey profil hesab\u0131 ve Skew-T",en:"Part II: vertical profile calculation and Skew-T"},ozet:"Projenin kalbi: ham veriden form\xFCle, form\xFClden profile, profilden diyagrama ve yoruma. Her ad\u0131m \xF6nce teknik, sonra sade.",istenen:["101 kPa\u2019dan 20 kPa\u2019ya, \u0394P = 5 kPa ad\u0131mlarla, projede verilen denklemle yeni s\u0131cakl\u0131\u011F\u0131 (T\u2082) bul.","Part I\u2019de foto\u011Fraf \xE7ekti\u011Fin g\xFCnlerden 5\u2019ini se\xE7: ya\u011F\u0131\u015Fl\u0131, a\xE7\u0131k, bulutlu, f\u0131rt\u0131nal\u0131 gibi \xE7e\u015Fitlilik; al\xE7ak, orta ve y\xFCksek bulut, Cumulus, Stratus, Cirrus gibi \xE7e\u015Fitlilik.","\xD6nerilen kaynaklardan (radyosonde ar\u015Fivi, ERA5 bas\u0131n\xE7 seviyeleri, kapsaml\u0131 y\xFCksek hava g\xF6zlem a\u011F\u0131) veri al.","\xC7iy noktas\u0131, kar\u0131\u015Fma oran\u0131, \xF6zg\xFCl nem, ba\u011F\u0131l nem (do\u011Frulama), doyma buhar bas\u0131nc\u0131, \u03B8, \u03B8e, \u03B8l, \u03B8w, LCL, bulut taban\u0131 ve tepesi, CAPE, CIN, dikey nem profili, s\u0131cakl\u0131k, LI, EL, LFC, K, SI ve \u0394T/\u0394P hesapla.","5 sounding tablosu haz\u0131rla; her g\xFCne en yak\u0131n g\xF6zlem sounding\u2019ini de al. \u0130kisi i\xE7in de Skew-T log-P diyagram\u0131 \xE7iz, durumlar\u0131 k\u0131yasla ve bulut olu\u015Fumu ile t\xFCr\xFC a\xE7\u0131s\u0131ndan yorumla.","Giri\u015F, geli\u015Fme, sonu\xE7 yap\u0131l\u0131, ba\u015Fl\u0131k numaralar\u0131 d\xFCzg\xFCn, APA 6 kaynak\xE7al\u0131, en az 3 sayfal\u0131k rapor yaz.","Hesap raporunu ve kodu tek zip olarak Ninova\u2019ya y\xFCkle."],adimlar:[{id:"p2-1",no:"1",baslik:{tr:"Projeyi par\xE7ala: 21 kalem, 5 grup",en:"Break it down: 21 quantities, 5 groups"},neden:"\u0130ki sat\u0131rl\u0131k hesap listesi gibi g\xF6r\xFCnen \u015Fey asl\u0131nda 21 kalem. Gruplay\u0131nca hangisinin hangisine ba\u011Fl\u0131 oldu\u011Fu belli oluyor.",teknik:["Nem grubu (6): \xE7iy noktas\u0131, kar\u0131\u015Fma oran\u0131, \xF6zg\xFCl nem, ba\u011F\u0131l nem (do\u011Frulama), doyma buhar bas\u0131nc\u0131, dikey nem profili.","S\u0131cakl\u0131k grubu (6): s\u0131cakl\u0131k profili, \u0394T/\u0394P, potansiyel s\u0131cakl\u0131k \u03B8, e\u015Fde\u011Fer potansiyel s\u0131cakl\u0131k \u03B8e, s\u0131v\u0131 su potansiyel s\u0131cakl\u0131\u011F\u0131 \u03B8l, \u0131slak termometre potansiyel s\u0131cakl\u0131\u011F\u0131 \u03B8w.","Bulut seviyeleri (2): kald\u0131rma yo\u011Fu\u015Fma seviyesi LCL, bulut taban\u0131 ve tepesi.","Kald\u0131rma enerjisi (4): LFC, EL, CAPE, CIN.","Kararl\u0131l\u0131k indeksleri (3): LI, SI, K.","Ba\u011F\u0131ml\u0131l\u0131k s\u0131ras\u0131: s\u0131cakl\u0131k profili \u2192 doyma buhar bas\u0131nc\u0131 \u2192 kar\u0131\u015Fma oranlar\u0131 \u2192 \xF6teki nem b\xFCy\xFCkl\xFCkleri \u2192 \u03B8\u2019lar \u2192 LCL \u2192 parsel \u2192 CAPE/CIN \u2192 indeksler."],basit:["Listeye bak\u0131nca korkutucu geliyor. Ama hepsi ayn\u0131 iki girdiden t\xFCr\xFCyor: s\u0131cakl\u0131k ve nem. \xD6nce bu ikisini sa\u011Flam kurunca geri kalan zincirleme \xE7\u0131k\u0131yor.","Bu y\xFCzden rehberin bundan sonraki ad\u0131mlar\u0131 bu ba\u011F\u0131ml\u0131l\u0131k s\u0131ras\u0131n\u0131 izliyor."],gorsel:[{diag:"gruplar",altAdim:"1a",alt:"Hesaplanacak 21 b\xFCy\xFCkl\xFC\u011F\xFCn be\u015F gruba ayr\u0131lm\u0131\u015F h\xE2li",cap:"Alt ad\u0131m 1a. Be\u015F grup ve i\xE7indeki b\xFCy\xFCkl\xFCkler. Sa\u011Fdaki gruplar soldakilere dayan\u0131yor."}]},{id:"p2-2",no:"2",baslik:{tr:"5 g\xFCn\xFC se\xE7",en:"Pick the 5 days"},neden:"Be\u015F g\xFCn, farkl\u0131 bulut t\xFCrlerini kapsamal\u0131 ki hesap \xABbulut t\xFCr\xFC ile profil ili\u015Fkilidir\xBB iddias\u0131n\u0131 s\u0131nas\u0131n.",teknik:["\xD6l\xE7\xFCtler: (1) foto\u011Fraf\u0131 net ve \xE7ekim saati belli, (2) \xE7e\u015Fitlilik: y\xFCksek bulut, tabakal\u0131 al\xE7ak bulut, a\xE7\u0131k g\xF6ky\xFCz\xFC, g\xFCzel hava k\xFCm\xFCl\xFCs\xFC, kapal\u0131 stratus, (3) o saate yak\u0131n bir radyosonde (00 ya da 12 UTC) var.","Se\xE7ilenler: 20 Nisan (Cirrus/Cirrostratus), 21 Nisan (Stratocumulus), 27 Nisan (a\xE7\u0131k), 28 Nisan (Cumulus humilis), 30 Nisan (al\xE7ak Stratus/Stratocumulus).","Saat e\u015Flemesi: ak\u015Fam \xE7ekimleri (19:05\u201319:08 yerel = yakla\u015F\u0131k 16 UTC) i\xE7in ayn\u0131 g\xFCn\xFCn 12 UTC sounding\u2019i; sabah \xE7ekimleri (07:00\u201308:54 yerel = 04\u201306 UTC) i\xE7in ayn\u0131 g\xFCn\xFCn 00 UTC sounding\u2019i. Fark yakla\u015F\u0131k 3\u20136 saat."],basit:["Be\u015F g\xFCn, be\u015F farkl\u0131 hik\xE2ye: y\xFCksek ince bulut, d\xFCz al\xE7ak \xF6rt\xFC, bulutsuz, bodur k\xFCm\xFCl\xFCs, kal\u0131n al\xE7ak \xF6rt\xFC. Hesap bunlar\u0131 ay\u0131rabiliyorsa y\xF6ntem \xE7al\u0131\u015F\u0131yor demektir.","Sounding g\xFCnde iki kez at\u0131l\u0131yor (00 ve 12 UTC), bu y\xFCzden foto\u011Fraf saatiyle sounding saati birebir tutmayacak. Bunu raporda hata kayna\u011F\u0131 olarak yazd\u0131m (14. ad\u0131m)."],tablo:{baslik:["G\xFCn","\xC7ekim (yerel)","Sounding","G\xF6zlenen bulut"],satirlar:[["20 Nisan","ak\u015Fam","12 UTC","Cirrus / Cirrostratus (y\xFCksek)"],["21 Nisan","sabah","00 UTC","Stratocumulus (tabakal\u0131, al\xE7ak\u2013orta)"],["27 Nisan","ak\u015Fam","12 UTC","A\xE7\u0131k, bulutsuz"],["28 Nisan","sabah","00 UTC","Cumulus humilis"],["30 Nisan","sabah","00 UTC","Stratus / Stratocumulus (kapal\u0131, al\xE7ak)"]]},gorsel:[{src:J+"kolaj_5gun.jpg",altAdim:"2a",alt:"Be\u015F g\xFCn\xFCn g\xF6ky\xFCz\xFC foto\u011Fraflar\u0131 yan yana; altlar\u0131nda tarih, s\u0131cakl\u0131k ve nem",cap:"Alt ad\u0131m 2a. Se\xE7ilen be\u015F g\xFCn yan yana: 20, 21, 27, 28 ve 30 Nisan (altta tarih, y\xFCzey s\u0131cakl\u0131\u011F\u0131, nem). Soldan sa\u011Fa: lifli y\xFCksek bulut, dokulu \xF6rt\xFC, bulutsuz, k\xFCm\xFCl\xFCsler, kapal\u0131 \xF6rt\xFC."}]},{id:"p2-3",no:"3",baslik:{tr:"Veriyi \xE7ek: radyosonde (ve ERA5 ile \xE7apraz kontrol)",en:"Get the data: radiosonde (cross-check with ERA5)"},neden:"Hesab\u0131n t\xFCm girdileri bu ad\u0131mda belirlenir. Yanl\u0131\u015F girdi, do\u011Fru form\xFCl\xFC bo\u015Fa \xE7\u0131kar\u0131r.",teknik:["Birincil kaynak: Wyoming \xDCniversitesi radyosonde ar\u015Fivi, \u0130stanbul/Kartal istasyonu (17064), metin \xE7\u0131kt\u0131s\u0131. \u0130kincil kaynak (\xE7apraz kontrol): ERA5 bas\u0131n\xE7 seviyeleri.","URL kal\u0131b\u0131: \u2026/cgi-bin/sounding?region=europe&TYPE=TEXT:LIST&YEAR=\u2026&MONTH=\u2026&FROM=GGSS&TO=GGSS&STNM=17064 (GG = g\xFCn, SS = saat UTC).","Sayfadaki ilk <PRE> blo\u011Fu sounding tablosu: her sat\u0131r sabit geni\u015Flikli 7 karakterlik s\xFCtunlar. Bas\u0131n\xE7 ilk s\xFCtun (0:7), s\u0131cakl\u0131k 14:21, \xE7iy noktas\u0131 21:28, ba\u011F\u0131l nem 28:35. Bas\u0131n\xE7 hPa \u2192 kPa i\xE7in 10\u2019a b\xF6l\xFCnd\xFC.","\u0130kinci <PRE> blo\u011Fu istasyonun kendi indekslerini veriyor (CAPE, LI, K\u2026); do\u011Frulama i\xE7in sakland\u0131.","Girdi olarak yaln\u0131z iki \u015Fey al\u0131nd\u0131: y\xFCzey (100 kPa) s\u0131cakl\u0131\u011F\u0131 ve t\xFCm seviyelerdeki ba\u011F\u0131l nem. Geri kalan her \u015Fey hesaplan\u0131r; g\xF6zlem profili yaln\u0131zca k\u0131yas i\xE7indir."],kod:{ad:"veri.py (\xF6zet): sounding\u2019i \xE7ekip ayr\u0131\u015Ft\u0131rma",metin:`WYO_URL = ("http://weather.uwyo.edu/cgi-bin/sounding?"
           "region=europe&TYPE=TEXT%3ALIST&YEAR={yil}&MONTH={ay:02d}"
           "&FROM={gun:02d}{saat:02d}&TO={gun:02d}{saat:02d}&STNM={stn}")

html = http_get(WYO_URL.format(yil=2026, ay=4, gun=27, saat=12, stn=17064))
blok = re.search(r"<PRE>(.*?)</PRE>", html, re.S).group(1)
for satir in blok.splitlines():
    if len(satir) < 35:
        continue
    p  = float(satir[0:7])                 # hPa
    t  = float(satir[14:21])               # s\u0131cakl\u0131k \xB0C
    td = float(satir[21:28])               # \xE7iy noktas\u0131 \xB0C
    rh = float(satir[28:35])               # ba\u011F\u0131l nem %
    P.append(p / 10.0)                     # kPa`},tuzak:"\u0130lk turda ERA5\u2019ten yaln\u0131z 2 m s\u0131cakl\u0131\u011F\u0131 alm\u0131\u015Ft\u0131m ve Skew-T\u2019de t\xFCm seviyelere ayn\u0131 s\u0131cakl\u0131\u011F\u0131 koydum: \xE7izgi d\xFCz \xE7\u0131kt\u0131. Sorun, y\xFCzey s\u0131cakl\u0131\u011F\u0131 bilgisinin b\xFCt\xFCn s\xFCtunu temsil etmedi\u011Fiydi. Profili ger\xE7ek radyosondeden al\u0131nca (ya da denklemle \xFCretince) bu hata kapand\u0131.",basit:["Radyosonde, balonla havaya \xE7\u0131kar\u0131lan bir \xF6l\xE7\xFCm aleti: y\xFCkseldik\xE7e bas\u0131nc\u0131, s\u0131cakl\u0131\u011F\u0131, \xE7iy noktas\u0131n\u0131 ve nemi okuyup g\xF6nderiyor. Wyoming bu verileri herkese a\xE7\u0131k metin olarak veriyor.","\u0130nternet sayfas\u0131n\u0131 Python ile indirip metni s\xFCtun s\xFCtun kesiyorum. Kopyala-yap\u0131\u015Ft\u0131r yerine kod yazmam\u0131n sebebi 5 g\xFCn \xD7 18 seviye = binlerce say\u0131 olmas\u0131 ve elle yazarsam bir say\u0131y\u0131 yanl\u0131\u015F yazma ihtimalim olmas\u0131."]},{id:"p2-4",no:"4",baslik:{tr:"Projede verilen \u0394T/\u0394P denklemini anla",en:"Understand the given \u0394T/\u0394P equation"},neden:"Bu denklem t\xFCm s\u0131cakl\u0131k profilini \xFCretiyor. Ne yapt\u0131\u011F\u0131n\u0131 bilmeden kodlarsan \xE7\u0131kan sonucu yorumlayamazs\u0131n.",teknik:["a = Rd/Cp = 287/1005 \u2248 0,2857: pay\u2019\u0131n ilk terimi kuru adyabatik e\u011Fimdir. rs \u2192 0 iken e\u015Fitlik \u0394T/\u0394P = a\xB7T/P\u2019ye iner.","c = Lv/Cp \u2248 2,5\xD710\u2076/1005 \u2248 2488 K: yo\u011Fu\u015Fma \u0131s\u0131s\u0131 terimi. Doymu\u015F havada y\xFCkselen parsel yo\u011Fu\u015Furken \u0131s\u0131 verir ve daha yava\u015F so\u011Fur.","b = Lv\xB2\xB7\u03B5/(Cp\xB7Rd) \u2248 1,35\xD710\u2077 K\xB2: paydadaki d\xFCzeltme; nemli adyabat\u0131n tam bi\xE7imini verir.","rs doyma kar\u0131\u015Fma oran\u0131 oldu\u011Fu i\xE7in denklem doymu\u015F (nemli) adyabatt\u0131r; denklemin tek form\xFClle iki rejimi (kuru ve nemli) kapsamas\u0131 rs\u2019nin b\xFCy\xFCkl\xFC\u011F\xFCne ba\u011Fl\u0131.","Birim kontrol\xFC: pay K, payda kPa, e\u011Fim K/kPa. P azald\u0131k\xE7a (y\xFCkseldik\xE7e) T d\xFC\u015Fer, e\u011Fim pozitiftir."],denklem:{satirlar:["\u0394T/\u0394P = ( a\xB7T + c\xB7rs ) / ( P \xB7 ( 1 + b\xB7rs / T\xB2 ) )"],terimler:[["\u0394T/\u0394P","s\u0131cakl\u0131\u011F\u0131n bas\u0131nca g\xF6re de\u011Fi\u015Fimi (e\u011Fim)","K/kPa"],["T","o seviyedeki s\u0131cakl\u0131k","K"],["P","o seviyedeki bas\u0131n\xE7","kPa"],["rs","doyma kar\u0131\u015Fma oran\u0131 (ayn\u0131 T ve P\u2019de)","g/g"],["a","Rd/Cp, kuru adyabatik katsay\u0131","0,28571"],["b","Lv\xB2\xB7\u03B5/(Cp\xB7Rd), payda d\xFCzeltmesi","1,35\xD710\u2077 K\xB2"],["c","Lv/Cp, yo\u011Fu\u015Fma \u0131s\u0131s\u0131 katsay\u0131s\u0131","2488,4 K"]]},basit:["Bu denklem \xABy\xFCkselen hava paketi 5 kPa yukar\u0131 \xE7\u0131k\u0131nca ka\xE7 derece so\u011Fur?\xBB sorusunun cevab\u0131. Hava kuruysa h\u0131zl\u0131 so\u011Fur. Nemliyse bulut olu\u015Ftururken \u0131s\u0131 verdi\u011Fi i\xE7in yava\u015F so\u011Fur.","Bir form\xFCl her ikisini birden yap\u0131yor: rs s\u0131f\u0131ra yak\u0131nsa kuru davran\u0131yor, b\xFCy\xFCkse nemli davran\u0131yor. Terimleri ezberleme; birimleri tutuyor mu ve i\u015Fareti do\u011Fru mu diye bak."]},{id:"p2-5",no:"5",baslik:{tr:"Sabitleri ve birimleri tek yere koy",en:"Put all constants and units in one place"},neden:"Meteoroloji hesaplar\u0131nda en s\u0131k hata birimden gelir; tek bir birim s\xF6zle\u015Fmesi bu hatay\u0131 kapat\u0131r.",teknik:["Tek dosya (sabitler.py): Rd = 287, Rv = 461,5, Cp = 1005 J/(kg\xB7K); g = 9,81 m/s\xB2; Lv = 2,5\xD710\u2076 J/kg; \u03B5 = Rd/Rv \u2248 0,622; e\u2080 = 0,6112 kPa (T\u2080 = 273,15 K\u2019de); P\u2080 = 100 kPa.","Dahili birim s\xF6zle\u015Fmesi: s\u0131cakl\u0131k K, bas\u0131n\xE7 kPa, kar\u0131\u015Fma oran\u0131 g/g (g/kg\u2019a yaln\u0131z tabloya yazarken \xE7evrilir). Giri\u015Fte \xB0C\u2019yi K\u2019ye, hPa\u2019y\u0131 kPa\u2019ya bir kere \xE7eviriyorum.","Bas\u0131n\xE7 \u0131zgaras\u0131: 101, 100, 95, 90, \u2026 20 kPa (18 seviye). \u0130lk ad\u0131m 101\u2192100 (1 kPa), sonras\u0131 5 kPa.","T\xFCm form\xFCller saf fonksiyon (girdi say\u0131 ya da dizi, \xE7\u0131kt\u0131 say\u0131 ya da dizi) ve numpy ile skaler/vekt\xF6rel \xE7al\u0131\u015F\u0131yor; 18 birim testi yazd\u0131m ve hepsi ge\xE7iyor (\xF6rn. 273,15 K\u2019de es \u2248 0,6112 kPa; RH\u2019nin form\xFClden geri \xFCretilebilmesi)."],tuzak:"\u0130lk turda hPa ile kPa\u2019y\u0131 kar\u0131\u015Ft\u0131rd\u0131m: \u0131zgara 1000, 950, \u2026 750 (50\u2019\u015Fer), sonra 650, 550, \u2026 200 (100\u2019er) idi ama s\u0131cakl\u0131k d\xFC\u015F\xFC\u015F\xFCn\xFC her ad\u0131mda 50 hPa varsay\u0131m\u0131yla hesapl\u0131yordum. \xDCst katmanlarda s\u0131cakl\u0131k yanl\u0131\u015F \xE7\u0131kt\u0131. Tek sabit \u0131zgara ve tek birim s\xF6zle\u015Fmesi bu hatay\u0131 k\xF6kten bitirdi.",basit:["Hesapta en \xE7ok \xABhPa m\u0131 kPa m\u0131, \xB0C mi K mi\xBB diye hata yap\u0131l\u0131yor. B\xFCt\xFCn sabitleri ve birimleri tek dosyada sabitledim: Kelvin, kPa, g/g. Geri kalan her \u015Fey buradan okudu.","Test yazmak ilk bak\u0131\u015Fta zaman kayb\u0131 gibi geliyor. Ama form\xFCl\xFCn do\u011Fru \xE7al\u0131\u015Ft\u0131\u011F\u0131n\u0131 bildi\u011Fin i\xE7in sonu\xE7 yanl\u0131\u015F \xE7\u0131karsa su\xE7u veride ar\u0131yorsun, form\xFClde de\u011Fil."],tablo:{baslik:["Sabit","De\u011Fer","Birim","Nerede kullan\u0131ld\u0131"],satirlar:[["Rd (kuru hava gaz sabiti)","287","J/(kg\xB7K)","\u03B8, hipsometrik denklem, parsel"],["Rv (su buhar\u0131 gaz sabiti)","461,5","J/(kg\xB7K)","es ve Td"],["Cp (sabit bas\u0131n\xE7ta \xF6zg\xFCl \u0131s\u0131)","1005","J/(kg\xB7K)","\u03B8, nemli adyabat"],["g (yer\xE7ekimi)","9,81","m/s\xB2","y\xFCkseklik, CAPE"],["Lv (buharla\u015Fma gizli \u0131s\u0131s\u0131)","2,5\xD710\u2076","J/kg","es, Td, \u03B8l"],["\u03B5 = Rd/Rv","\u2248 0,622","\u2013","kar\u0131\u015Fma oran\u0131"],["e\u2080 (T\u2080\u2019da doyma buhar bas\u0131nc\u0131)","0,6112","kPa","es, Td"],["T\u2080","273,15","K","es, Td"],["P\u2080","100","kPa","\u03B8"],["a, b, c","0,28571 \xB7 1,35\xD710\u2077 \xB7 2488,4","\u2013 \xB7 K\xB2 \xB7 K","\u0394T/\u0394P denklemi"]],not:"Birim s\xF6zle\u015Fmesi: s\u0131cakl\u0131k K, bas\u0131n\xE7 kPa, kar\u0131\u015Fma oran\u0131 g/g."}},{id:"p2-6",no:"6",baslik:{tr:"Form\xFClleri tek tek kodla (haz\u0131r paket yok)",en:"Code each formula (no ready-made package)"},neden:"Projede kendi hesab\u0131n isteniyordu; haz\u0131r bir paketin sonucunu okumak, her b\xFCy\xFCkl\xFC\u011F\xFCn form\xFClden nas\u0131l \xE7\u0131kt\u0131\u011F\u0131n\u0131 g\xF6stermez.",teknik:["Her form\xFCl tek fonksiyon: termo.py. Hi\xE7bir meteoroloji paketi kullan\u0131lmad\u0131; tek ba\u011F\u0131ml\u0131l\u0131k numpy.","Doyma buhar bas\u0131nc\u0131 i\xE7in projede istenen form\xFCl Clausius\u2013Clapeyron\u2019dur; Tetens yakla\u015F\u0131m\u0131 yaln\u0131z sa\u011Flama i\xE7in yaz\u0131ld\u0131.","\u03B8e i\xE7in Bolton (1980) form\xFCl\xFC, LCL i\xE7in Bolton\u2019un LCL s\u0131cakl\u0131\u011F\u0131 form\xFCl\xFC kullan\u0131ld\u0131; ayr\u0131ca projedeki kaba yakla\u015F\u0131m z \u2248 125\xB7(T \u2212 Td) metre ile kar\u015F\u0131la\u015Ft\u0131r\u0131ld\u0131."],tablo:{baslik:["B\xFCy\xFCkl\xFCk","Form\xFCl","Basit\xE7e"],satirlar:[["Doyma buhar bas\u0131nc\u0131 es","es = e\u2080\xB7exp[(Lv/Rv)(1/T\u2080 \u2212 1/T)]","Bu s\u0131cakl\u0131kta havan\u0131n ta\u015F\u0131yabilece\u011Fi en fazla su buhar\u0131 bas\u0131nc\u0131"],["Kar\u0131\u015Fma oran\u0131 r","r = \u03B5\xB7e/(P \u2212 e)   (doymada e = es \u2192 rs)","1 kg kuru havadaki su buhar\u0131 miktar\u0131"],["Ger\xE7ek buhar bas\u0131nc\u0131 e","e = (RH/100)\xB7es","Nemden ger\xE7ek buhar bas\u0131nc\u0131na ge\xE7i\u015F"],["\xD6zg\xFCl nem q","q = r/(1 + r)","1 kg nemli havadaki su buhar\u0131; r\u2019ye \xE7ok yak\u0131n"],["Ba\u011F\u0131l nem (do\u011Frulama) RH","RH = 100\xB7e/es","Form\xFCllerin tutarl\u0131 oldu\u011Funu g\xF6rmek i\xE7in geri hesap"],["\xC7iy noktas\u0131 Td","Td = 1 / [1/T\u2080 \u2212 (Rv/Lv)\xB7ln(e/e\u2080)]","Hava bu s\u0131cakl\u0131\u011Fa so\u011Fursa buhar doyar"],["Sanal s\u0131cakl\u0131k Tv","Tv = T\xB7(1 + 0,61\xB7r)","Nemli havan\u0131n kuru hava gibi davransa sahip olaca\u011F\u0131 s\u0131cakl\u0131k"],["Potansiyel s\u0131cakl\u0131k \u03B8","\u03B8 = T\xB7(P\u2080/P)^(Rd/Cp)","Parseli 100 kPa\u2019ya indirsek s\u0131cakl\u0131\u011F\u0131 ne olurdu"],["E\u015Fde\u011Fer pot. s\u0131cakl\u0131k \u03B8e","Bolton (1980), denk. 21, 24, 38","Parselin t\xFCm nemini yo\u011Fu\u015Fturup \u0131s\u0131s\u0131n\u0131 geri ald\u0131\u011F\u0131m\u0131zdaki \u03B8"],["S\u0131v\u0131 su pot. s\u0131cakl\u0131\u011F\u0131 \u03B8l","\u03B8l \u2248 \u03B8\xB7exp(\u2212Lv\xB7rl/(Cp\xB7T))","S\u0131v\u0131 su yoksa (rl = 0) \u03B8\u2019ya e\u015Fit"],["Islak termometre pot. s\u0131cakl\u0131\u011F\u0131 \u03B8w","LCL\u2019den 100 kPa\u2019ya nemli adyabat boyunca ini\u015F","Nemli adyabat\u0131 100 kPa\u2019ya kadar takip edince okunan T"],["LCL","T_LCL = 1/[1/(Td \u2212 56) + ln(T/Td)/800] + 56;  P_LCL = P\xB7(T_LCL/T)^(Cp/Rd)","Yer seviyesinden zorlanan havan\u0131n doydu\u011Fu ve bulut taban\u0131n\u0131n olu\u015Ftu\u011Fu seviye"]]},basit:["Her sat\u0131r, bir fikrin bir c\xFCmlesi: \xABhavan\u0131n tutabilece\u011Fi nem\xBB, \xABger\xE7ekte tuttu\u011Fu nem\xBB, \xABbu ikisinin oran\u0131\xBB. Bu \xFC\xE7\xFC oturunca geri kalan\u0131 onlardan t\xFCr\xFCyor.","Form\xFClleri koda \xE7evirmek ezberden \xE7ok kolaym\u0131\u015F: bir sat\u0131r form\xFCl, bir sat\u0131r kod. Zor olan k\u0131s\u0131m birimleri tutturmak; onu da 5. ad\u0131mda \xE7\xF6zd\xFCm."]},{id:"p2-7",no:"7",baslik:{tr:"S\u0131cakl\u0131k profilini entegre et (RK4)",en:"Integrate the temperature profile (RK4)"},neden:"Verilen denklem bir e\u011Fim; s\u0131cakl\u0131\u011F\u0131 bulmak i\xE7in bu e\u011Fimi seviye seviye yukar\u0131 do\u011Fru toplamak gerek.",teknik:["Tohum: 100 kPa\u2019daki y\xFCzey s\u0131cakl\u0131\u011F\u0131 (radyosondeden). Yukar\u0131 do\u011Fru: her ad\u0131mda rs = \u03B5\xB7es(T)/(P \u2212 es(T)) hesaplan\u0131r, e\u011Fim bulunur, s\u0131cakl\u0131k bir \xFCst seviyeye ta\u015F\u0131n\u0131r.","Euler yerine 4. derece Runge\u2013Kutta (RK4) kulland\u0131m: k1, k2, k3, k4 e\u011Fimlerinin a\u011F\u0131rl\u0131kl\u0131 ortalamas\u0131. Ayn\u0131 ad\u0131m geni\u015Fli\u011Finde Euler\u2019e g\xF6re \xE7ok daha az say\u0131sal hata yapar.","A\u015Fa\u011F\u0131 y\xF6nde 101 kPa (STP) sat\u0131r\u0131 da ayn\u0131 yolla \xFCretildi. Toplam 18 seviye.","Nem profili (RH) radyosondeden al\u0131n\u0131p numpy.interp ile 18 seviyeli \u0131zgaraya ta\u015F\u0131nd\u0131; b\xF6ylece her seviyede hem hesaplanm\u0131\u015F s\u0131cakl\u0131k hem ger\xE7ek nem var."],kod:{ad:"profil.py (\xF6zet): RK4 ile bir bas\u0131n\xE7 ad\u0131m\u0131",metin:`def _rk4(T1, P1, P2):
    h  = P2 - P1                                   # negatif: yukar\u0131 \xE7\u0131karken P azal\u0131r
    k1 = _egim(T1,              P1)
    k2 = _egim(T1 + 0.5*h*k1,   P1 + 0.5*h)
    k3 = _egim(T1 + 0.5*h*k2,   P1 + 0.5*h)
    k4 = _egim(T1 + h*k3,       P2)
    return T1 + (h/6.0) * (k1 + 2*k2 + 2*k3 + k4)

def _egim(T_K, P):
    rs = mixing_ratio(es(T_K), P)                  # her seviyede doyma kar\u0131\u015Fma oran\u0131
    return dTdP(T_K, P, rs)                        # projede verilen denklem`},basit:["Merdiven gibi d\xFC\u015F\xFCn: 100 kPa basama\u011F\u0131ndan ba\u015Fl\u0131yorsun, form\xFCl \xABbir \xFCst basamakta \u015Fu kadar so\u011Fur\xBB diyor, \xE7\u0131k\u0131yorsun, tekrar soruyorsun. Toplam 18 basamak.","RK4 sadece daha ak\u0131ll\u0131 basamak atma y\xF6ntemi: basama\u011F\u0131n ba\u015F\u0131ndaki e\u011Fime de\u011Fil, ortas\u0131ndaki e\u011Fime de bak\u0131yor, yani basamak boyunca e\u011Fim de\u011Fi\u015Fiyorsa hatal\u0131 olmuyor."],gorsel:[{diag:"pgrid",altAdim:"7a",alt:"Bas\u0131n\xE7 basamaklar\u0131 \u015Femas\u0131: 101 kPa\u2019dan 20 kPa\u2019ya 18 seviye",cap:"Alt ad\u0131m 7a. Entegrasyonun basamaklar\u0131: 100 kPa tohum, yukar\u0131 do\u011Fru 5 kPa\u2019l\u0131k ad\u0131mlar, a\u015Fa\u011F\u0131 do\u011Fru bir ad\u0131m 101 kPa (STP) sat\u0131r\u0131."}]},{id:"p2-8",no:"8",baslik:{tr:"Parseli y\xFCkselt: \xF6nce kuru, doyunca nemli",en:"Lift the parcel: dry first, moist after saturation"},neden:"Bulutun taban\u0131 ve karars\u0131zl\u0131k enerjisi, y\xFCzeyden y\xFCkselen bir parselin yolculu\u011Fundan \xE7\u0131kar.",teknik:["Parsel y\xFCzeyden (100 kPa) ba\u015Flar. P \u2265 P_LCL oldu\u011Fu s\xFCrece kuru adyabat: \u03B8 sabit, T = T_y\xFCzey\xB7(P/P_y\xFCzey)^(Rd/Cp); kar\u0131\u015Fma oran\u0131 r sabit.","P < P_LCL olunca nemli adyabat: LCL\u2019den ba\u015Flay\u0131p ayn\u0131 \u0394T/\u0394P denklemi, 1 kPa\u2019l\u0131k k\xFC\xE7\xFCk RK4 ad\u0131mlar\u0131yla. Bu ad\u0131mlar \u0131zgaradan ba\u011F\u0131ms\u0131z tutuldu.","LCL, Bolton form\xFCl\xFCyle bulundu ve hipsometrik y\xFCkseklikle metreye \xE7evrildi. Bulut taban\u0131 = LCL y\xFCksekli\u011Fi.","Bulut tepesi: CAPE belirgin (50 J/kg \xFCst\xFC) ise denge seviyesi (EL) y\xFCksekli\u011Fi; de\u011Filse ba\u011F\u0131l nemin %95\u2019i ge\xE7ti\u011Fi en \xFCst katman."],basit:["Yerden bir hava paketi al\u0131p yukar\u0131 itiyorum. \xC7evreyle \u0131s\u0131 al\u0131\u015Fveri\u015Fi yapm\u0131yor, y\xFCkseldik\xE7e so\u011Fuyor. Doyana kadar kuru so\u011Fuyor (bulut yok); doyunca yo\u011Fu\u015Fup bulut oluyor ve so\u011Fuma yava\u015Fl\u0131yor.","Doydu\u011Fu seviye, bulutun taban\u0131: LCL. 28 Nisan\u2019da bu 746 m \xE7\u0131kt\u0131, 21 Nisan\u2019da 2029 m. Foto\u011Fraflardaki bulut taban\u0131 fark\u0131n\u0131 bu say\u0131 a\xE7\u0131kl\u0131yor."],gorsel:[{src:J+"skewt_hesap_28.webp",altAdim:"8a",alt:"28 Nisan i\xE7in hesaplanan Skew-T: \xE7evre s\u0131cakl\u0131\u011F\u0131, \xE7iy noktas\u0131 ve parsel e\u011Frisi",cap:"Alt ad\u0131m 8a. 28 Nisan Skew-T\u2019si: k\u0131rm\u0131z\u0131 \xE7evre s\u0131cakl\u0131\u011F\u0131, ye\u015Fil \xE7iy noktas\u0131, kesikli \xE7izgi parsel. Mor nokta LCL (746 m). Parsel, \xE7evreden so\u011Fuk kald\u0131\u011F\u0131 i\xE7in y\xFCkselmeye devam etmiyor: CAPE \u2248 0."}]},{id:"p2-9",no:"9",baslik:{tr:"Enerji ve indeksler: CAPE, CIN, LFC, EL, LI, SI, K",en:"Energy and indices: CAPE, CIN, LFC, EL, LI, SI, K"},neden:"Bu say\u0131lar \xABbu atmosfer bulutu dikey b\xFCy\xFCt\xFCr m\xFC?\xBB sorusuna tek say\u0131l\u0131k cevaplar.",teknik:["Y\xFCkseklik: hipsometrik denklemle seviye seviye z hesapland\u0131: z(i+1) = z(i) + (Rd\xB7Tv_ort/g)\xB7ln(P(i)/P(i+1)); y\xFCzey z = 0.","Kald\u0131rma kuvveti: buoy = g\xB7(Tv,parsel \u2212 Tv,\xE7evre)/Tv,\xE7evre. Hesaplar 25 m\u2019lik ince y\xFCkseklik \u0131zgaras\u0131na enterpole edilerek yap\u0131ld\u0131 (kararl\u0131 integral i\xE7in).","LFC: y\xFCzeyden yukar\u0131, kald\u0131rma kuvvetinin ilk kez (\u2212)\u2019den (+)\u2019ya ge\xE7ti\u011Fi nokta. CIN: y\xFCzey ile LFC aras\u0131ndaki negatif alan. CAPE: LFC ile EL aras\u0131ndaki pozitif alan. EL: LFC\u2019nin \xFCst\xFCnde kald\u0131rman\u0131n (+)\u2019dan (\u2212)\u2019ye ge\xE7ti\u011Fi nokta.","LI = T_\xE7evre(50 kPa) \u2212 T_parsel(50 kPa), y\xFCzey parseliyle. SI ayn\u0131d\u0131r ama parsel 85 kPa\u2019dan y\xFCkseltilir. K = (T85 \u2212 T50) + Td85 \u2212 (T70 \u2212 Td70) (\xB0C).","Okuma: LI ve SI pozitifse kararl\u0131, negatifse karars\u0131z; CAPE b\xFCy\xFCkse (y\xFCzlerce J/kg ve \xFCst\xFC) f\u0131rt\u0131na yak\u0131t\u0131 bol; K yakla\u015F\u0131k 15\u2019in alt\u0131nda g\xF6k g\xFCr\xFClt\xFCl\xFC f\u0131rt\u0131na beklenmez. E\u015Fikler kayna\u011Fa g\xF6re biraz de\u011Fi\u015Fir."],denklem:{satirlar:["CAPE = \u222B g \xB7 ( Tv,parsel \u2212 Tv,\xE7evre ) / Tv,\xE7evre  dz     (LFC\u2019den EL\u2019ye)"],terimler:[["CAPE","konvektif kullan\u0131labilir potansiyel enerji","J/kg"],["g","yer\xE7ekimi ivmesi","9,81 m/s\xB2"],["Tv,parsel","parselin sanal s\u0131cakl\u0131\u011F\u0131","K"],["Tv,\xE7evre","\xE7evre havan\u0131n sanal s\u0131cakl\u0131\u011F\u0131","K"],["dz","y\xFCkseklik ad\u0131m\u0131 (25 m)","m"]]},basit:["CAPE, parselin \xE7evreden ne kadar s\u0131cak kald\u0131\u011F\u0131n\u0131n alan\u0131. Parsel \xE7evreden s\u0131caksa y\xFCkselmeye devam eder; alan b\xFCy\xFCkse f\u0131rt\u0131na yak\u0131t\u0131 \xE7ok. Benim be\u015F g\xFCn\xFCmde hepsi s\u0131f\u0131ra yak\u0131nd\u0131: bunlar f\u0131rt\u0131nal\u0131 g\xFCnler de\u011Fildi.","CIN, parselin \xF6nce a\u015Fmas\u0131 gereken engel. LI, SI ve K ise 85, 70 ve 50 kPa\u2019daki s\u0131cakl\u0131k ve nem say\u0131lar\u0131n\u0131 tek say\u0131ya s\u0131k\u0131\u015Ft\u0131ran k\u0131sa yollar."]},{id:"p2-10",no:"10",baslik:{tr:"Sounding tablosunu \xFCret (CSV ve Excel)",en:"Produce the sounding table (CSV and Excel)"},neden:"Projenin istedi\u011Fi \xE7\u0131kt\u0131 tabloydu; elle doldurmak yerine kodun yazmas\u0131 hatay\u0131 ortadan kald\u0131r\u0131yor.",teknik:["pandas DataFrame: 18 sat\u0131r (101 \u2192 20 kPa), s\xFCtunlar: P, T, es, rs, \u0394T/\u0394P, Td, RH, q, \u03B8, \u03B8e, \u03B8l, Tv ve g\xFCn i\xE7in \xF6zet indeksler.","Her g\xFCn i\xE7in hem .csv hem .xlsx (openpyxl) yaz\u0131ld\u0131; ayr\u0131ca be\u015F g\xFCn\xFCn \xF6zetini tek tabloda toplayan bir \xF6zet dosyas\u0131 \xFCretildi. Rapordaki tablolar bu dosyalardan okuna
