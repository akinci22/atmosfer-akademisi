ew-T bir hava durumu \xE7izelgesi gibi: a\u015Fa\u011F\u0131dan yukar\u0131 bas\u0131n\xE7, sa\u011Fa sola s\u0131cakl\u0131k. \xABE\u011Fik\xBB demesinin sebebi s\u0131cakl\u0131k \xE7izgilerinin yana yatmas\u0131; b\xF6ylece s\u0131cakl\u0131k ve \xE7iy noktas\u0131 e\u011Frilerini ayn\u0131 k\xE2\u011F\u0131tta okuyabiliyorsun.","Okuma kural\u0131 basit: k\u0131rm\u0131z\u0131 (s\u0131cakl\u0131k) ile ye\u015Fil (\xE7iy noktas\u0131) birbirine yak\u0131nsa o seviye neredeyse doymu\u015F, bulut olabilir. Birbirinden uzaksa kuru."],gorsel:[{src:J+"skewt_hesap_20.webp",altAdim:"11a",alt:"20 Nisan hesaplanan Skew-T",cap:"Alt ad\u0131m 11a. 20 Nisan (Cirrus/Cirrostratus): orta kolon kuru; y\xFCksek seviyedeki ince nem band\u0131 lifli buz bulutunu a\xE7\u0131kl\u0131yor."},{src:J+"skewt_hesap_21.webp",altAdim:"11b",alt:"21 Nisan hesaplanan Skew-T",cap:"Alt ad\u0131m 11b. 21 Nisan (Stratocumulus): y\xFCzeye yak\u0131n nemli tabaka, \xFCstte daha kuru hava; y\xFCksek LCL (2029 m)."},{src:J+"skewt_hesap_27.webp",altAdim:"11c",alt:"27 Nisan hesaplanan Skew-T",cap:"Alt ad\u0131m 11c. 27 Nisan (a\xE7\u0131k): \xE7iy noktas\u0131 e\u011Frisi s\u0131cakl\u0131ktan belirgin uzak; t\xFCm kolon kuru ve \xE7ok kararl\u0131."},{src:J+"skewt_hesap_30.webp",altAdim:"11d",alt:"30 Nisan hesaplanan Skew-T",cap:"Alt ad\u0131m 11d. 30 Nisan (al\xE7ak Stratus/Stratocumulus): d\xFC\u015F\xFCk LCL (627 m), alt katmanda y\xFCksek nem."}]},{id:"p2-12",no:"12",baslik:{tr:"G\xF6zlem sounding\u2019iyle \xFCst \xFCste koy",en:"Overlay on the observed sounding"},neden:"Hesab\u0131n ger\xE7e\u011Fe ne kadar yak\u0131n oldu\u011Funu bu k\u0131yas g\xF6sterir; k\u0131yas yoksa hesap sadece bir iddiad\u0131r.",teknik:["Ayn\u0131 eksende: d\xFCz \xE7izgi = Wyoming g\xF6zlemi (T ve Td), kesikli \xE7izgi = hesaplanan profil.","Say\u0131sal k\u0131yas i\xE7in ayn\u0131 indeks kodunu g\xF6zlem profiline de uygulad\u0131m; b\xF6ylece \xABg\xF6zlem\xBB s\xFCtunu kod hatas\u0131ndan ba\u011F\u0131ms\u0131z bir \xE7apraz do\u011Frulama oldu.","Bulgu 1: K indeksi (yaln\u0131z nem ve 85/70/50 kPa s\u0131cakl\u0131klar\u0131na dayan\u0131yor) hesap ve g\xF6zlemde birbirine yak\u0131n (21 Nisan: 25 ve 25; 20 Nisan: 8 ve 9). Yani veri giri\u015Fi ve indeks form\xFClleri do\u011Fru kodlanm\u0131\u015F.","Bulgu 2: hesaplanan atmosfer g\xF6zlenenden biraz daha kararl\u0131 \xE7\u0131kt\u0131: nedeni 14. ad\u0131mda."],basit:["Hesapla ger\xE7e\u011Fi ayn\u0131 k\xE2\u011F\u0131da koyunca iki \xE7izgi alt katmanlarda \xFCst \xFCste biniyor, yukar\u0131da ayr\u0131l\u0131yor. Neden ayr\u0131ld\u0131\u011F\u0131n\u0131 anlamak raporun en de\u011Ferli b\xF6l\xFCm\xFC oldu."],tablo:{baslik:["G\xFCn","LCL (m)","CAPE hesap / g\xF6zlem (J/kg)","LI hesap / g\xF6zlem (\xB0C)","K hesap / g\xF6zlem"],satirlar:[["20 Nis","1524","1 / 0","10,6 / 7,5","8 / 9"],["21 Nis","2029","0 / 5","13,0 / 9,3","25 / 25"],["27 Nis","1503","1 / 14","9,8 / 12,3","\u22120 / \u22128"],["28 Nis","746","0 / 0","4,4 / 14,1","\u22129 / \u221213"],["30 Nis","627","0 / 2","4,1 / 12,2","15 / 18"]],not:"G\xF6zlem s\xFCtunu: ayn\u0131 indeks kodunun Wyoming radyosonde profiline uygulanmas\u0131yla bulundu."},gorsel:[{src:J+"skewt_kiyas_27.webp",altAdim:"12a",alt:"27 Nisan hesap ve g\xF6zlem Skew-T kar\u015F\u0131la\u015Ft\u0131rmas\u0131",cap:"Alt ad\u0131m 12a. 27 Nisan: d\xFCz \xE7izgiler g\xF6zlem, kesikli \xE7izgiler hesap. \u0130kisi de y\xFCzeyde bulu\u015Fuyor, yukar\u0131da g\xF6zlem biraz daha serin."},{src:J+"skewt_kiyas_21.webp",altAdim:"12b",alt:"21 Nisan hesap ve g\xF6zlem Skew-T kar\u015F\u0131la\u015Ft\u0131rmas\u0131",cap:"Alt ad\u0131m 12b. 21 Nisan: nemli alt tabaka ve kuru \xFCst kolon iki profilde de g\xF6r\xFCl\xFCyor; K indeksi iki profilde de 25."},{src:J+"skewt_kiyas_30.webp",altAdim:"12c",alt:"30 Nisan hesap ve g\xF6zlem Skew-T kar\u015F\u0131la\u015Ft\u0131rmas\u0131",cap:"Alt ad\u0131m 12c. 30 Nisan: y\xFCzeye yak\u0131n y\xFCksek nem iki profilde de al\xE7ak bulut taban\u0131na i\u015Faret ediyor."}]},{id:"p2-13",no:"13",baslik:{tr:"Yorumla: g\xF6ky\xFCz\xFC ile profil ayn\u0131 hik\xE2yeyi anlat\u0131yor mu?",en:"Interpret: do the sky and the profile tell the same story?"},neden:"Projenin as\u0131l sorusu bu: bulut t\xFCr\xFC atmosferin dikey yap\u0131s\u0131yla a\xE7\u0131klanabiliyor mu?",teknik:["Her g\xFCn i\xE7in \xFC\xE7 soru: (1) LCL ka\xE7 metre, yani bulut taban\u0131 nerede olmal\u0131? (2) kolon kararl\u0131 m\u0131 (CAPE, LI, K)? (3) nem hangi katmanda toplanm\u0131\u015F?","E\u015Fle\u015Fme: LCL y\xFCksekse (1500\u20132000 m) ve kolon kuruysa bulutsuz ya da yaln\u0131z ince y\xFCksek bulut; LCL d\xFC\u015F\xFCk ve nem alt katmandaysa al\xE7ak tabakal\u0131 \xF6rt\xFC; k\xFC\xE7\xFCk LCL + kuru \xFCst kolon = bodur k\xFCm\xFCl\xFCs.","D\xF6nemin tamam\u0131nda CAPE \xE7ok k\xFC\xE7\xFCkt\xFC: ilkbahar \u0130stanbul\u2019u derin konveksiyona elveri\u015Fsizdi; bulut t\xFCr\xFCn\xFC belirleyen \u015Fey nemin hangi seviyede bulundu\u011Fuydu."],basit:["Be\u015F g\xFCn\xFCn hik\xE2yesi tek c\xFCmlelik: 27 Nisan \xE7ok kuru ve kararl\u0131, g\xF6ky\xFCz\xFC bulutsuz. 21 ve 30 Nisan alt katman nemli ve \xFCst\xFC kuru, al\xE7ak \xF6rt\xFC. 28 Nisan serin ama g\xFCnd\xFCz \u0131s\u0131nan s\u0131\u011F konveksiyon, bodur k\xFCm\xFCl\xFCs. 20 Nisan yukar\u0131da ince nem, lifli cirrus.","Yani foto\u011Fraftaki g\xF6ky\xFCz\xFC ile hesab\u0131mdaki LCL ve kararl\u0131l\u0131k say\u0131lar\u0131 ayn\u0131 \u015Feyi s\xF6yl\xFCyordu. Projenin istedi\u011Fi buydu."],gorsel:[{diag:"lclbar",altAdim:"13a",alt:"Be\u015F g\xFCn\xFCn LCL y\xFCksekliklerini g\xF6steren \xE7ubuk grafik",cap:"Alt ad\u0131m 13a. Be\u015F g\xFCn\xFCn LCL (bulut taban\u0131) y\xFCksekli\u011Fi. Kuru g\xFCnlerde taban y\xFCksek (1500 m \xFCst\xFC), nemli sabahlarda al\xE7ak (600\u2013750 m)."}]},{id:"p2-14",no:"14",baslik:{tr:"Hata analizi: model neden g\xF6zlemden daha kararl\u0131 \xE7\u0131kt\u0131?",en:"Error analysis: why was the model more stable than the observation?"},neden:"Projede \xABk\u0131yasla ve yorumla\xBB denildi\u011Fi i\xE7in sonucu savunmak kadar s\u0131n\u0131rlar\u0131n\u0131 g\xF6stermek de puan.",teknik:["Y\xF6ntemsel k\u0131s\u0131t: verilen denklem her seviyede doyma kar\u0131\u015Fma oran\u0131 rs kullan\u0131yor, yani hesaplad\u0131\u011F\u0131m s\u0131cakl\u0131k profili doymu\u015F (nemli) adyabata yak\u0131n. Ger\xE7ek atmosferin doymam\u0131\u015F katmanlar\u0131 kuru adyabat gibi daha h\u0131zl\u0131 so\u011Fur; bu y\xFCzden hesap profili ger\xE7ekten daha kararl\u0131 ve CAPE sistematik olarak k\xFC\xE7\xFCk.","Zaman uyu\u015Fmazl\u0131\u011F\u0131: foto\u011Fraf \xE7ekim saatinde, radyosonde 00 ya da 12 UTC\u2019de; 3\u20136 saatlik fark g\xFCn i\xE7i \u0131s\u0131nma ve nemlenmeyi yakalayamaz.","Temsil fark\u0131: radyosonde tek bir dikey y\xF6r\xFCnge, ERA5 ise yakla\u015F\u0131k 25\u201330 km\u2019lik \u0131zgara ortalamas\u0131; ikisi de g\xF6zlem noktas\u0131n\u0131 tam temsil etmez.","Say\u0131sal hata: sonlu \u0394P ad\u0131m\u0131 ve enterpolasyonlar k\xFC\xE7\xFCk yuvarlama hatalar\u0131 ekler; RK4 bunu en aza indirir.","Alternatifler: (a) s\u0131cakl\u0131k profilini de do\u011Frudan radyosondeden al\u0131p yaln\u0131z t\xFCrev b\xFCy\xFCkl\xFCkleri hesaplamak; (b) \xE7ekim saatine tam denk ERA5 saatlik verisini birincil yapmak; (c) \u0394P ad\u0131m\u0131n\u0131 1 kPa\u2019ya indirip kar\u0131\u015Fma oran\u0131n\u0131 doyma yerine ger\xE7ek neme ba\u011Flamak; (d) birden \xE7ok yak\u0131n istasyonu ortalamak."],basit:["Bu b\xF6l\xFCm\xFC rapora ayr\u0131 ba\u015Fl\u0131kla koydum: k\u0131yas yapt\u0131m, fark \xE7\u0131kt\u0131, fark\u0131n d\xF6rt nedenini yazd\u0131m, her birine bir \xE7\xF6z\xFCm \xF6nerdim.","En \xF6\u011Fretici c\xFCmle \u015Fuydu: bir model yanl\u0131\u015F de\u011Fildir, kabulleri kadar do\u011Frudur. Benim modelimde kabul \xABher yer doymu\u015F\xBB idi ve fark tam o kabulden geldi."],tablo:{baslik:["Hata kayna\u011F\u0131","Neden","Etkisi","\xC7\xF6z\xFCm \xF6nerisi"],satirlar:[["Y\xF6ntemsel k\u0131s\u0131t","Her seviyede doyma kar\u0131\u015Fma oran\u0131 kullan\u0131l\u0131yor","Profil fazla kararl\u0131, CAPE k\xFC\xE7\xFCk \xE7\u0131k\u0131yor","Kar\u0131\u015Fma oran\u0131n\u0131 ger\xE7ek neme ba\u011Fla"],["Zaman uyu\u015Fmazl\u0131\u011F\u0131","Foto\u011Fraf an\u0131 ile 00/12 UTC aras\u0131 3\u20136 saat","G\xFCn i\xE7i \u0131s\u0131nma ve nemlenme yakalanm\u0131yor","\xC7ekim saatine denk ERA5 saatlik veri"],["Temsil fark\u0131","Radyosonde tek y\xF6r\xFCnge, ERA5 \u0131zgara ortalamas\u0131","G\xF6zlem noktas\u0131 tam temsil edilmiyor","Birden \xE7ok istasyon ya da \u0131zgara noktas\u0131 ortala"],["Say\u0131sal hata","Sonlu \u0394P ad\u0131m\u0131 ve enterpolasyon","K\xFC\xE7\xFCk yuvarlama hatalar\u0131","\u0394P = 1 kPa, RK4"]]}},{id:"p2-15",no:"15",baslik:{tr:"Raporu yaz, paketle, y\xFCkle",en:"Write, package and upload the report"},neden:"Hesap ne kadar iyi olursa olsun, rapor onu okunur ve savunulur h\xE2le getirir.",teknik:["Yap\u0131: \xD6zet \u2192 1. Giri\u015F \u2192 2. Part I \xF6zeti \u2192 3. Veri ve y\xF6ntem (kaynaklar, form\xFCller, Python par\xE7alar\u0131) \u2192 4. Bulgular (5 g\xFCn \xD7 [foto\u011Fraf + istasyon verisi + tablo + indeks tablosu + iki Skew-T + yorum]) \u2192 5. Kar\u015F\u0131la\u015Ft\u0131rma, hata analizi, alternatifler \u2192 6. Genel de\u011Ferlendirme (benim sesimle) \u2192 Kaynaklar.","Bi\xE7im: ba\u015Fl\u0131k numaralar\u0131 d\xFCzg\xFCn, \u015Fekil ve \xE7izelge altyaz\u0131l\u0131, APA 6 kaynak\xE7a (Wallace & Hobbs, Rogers & Yau, Bolton 1980, Hersbach ve ark. 2020 gibi).","Rapor python-docx ile bir betikten \xFCretildi; tablolar CSV\u2019den okundu\u011Fu i\xE7in say\u0131lar kaynakla birebir tutuyor.","Teslim: rapor, Excel tablolar\u0131, t\xFCm kod; tek zip; Ninova."],basit:["\xABEn az 3 sayfa\xBB minimumdur, hedef de\u011Fil. Be\u015F g\xFCn i\xE7in bolca \u015Fekil ve tablo olunca sayfa kendili\u011Finden doluyor; as\u0131l i\u015F her b\xF6l\xFCmde \xABg\xF6rd\xFCm \u2192 hesaplad\u0131m \u2192 uyu\u015Ftu mu\xBB s\u0131ras\u0131n\u0131 korumak.","Genel de\u011Ferlendirmeyi kendi sesimle yazd\u0131m: ne yapt\u0131m, neyi sevdim, nerede y\xF6ntemimin s\u0131n\u0131r\u0131n\u0131 g\xF6rd\xFCm. \u015Eablon metin gibi g\xF6r\xFCnmesin diye bu b\xF6l\xFCm tamamen bana ait."],tablo:{baslik:["Rapor b\xF6l\xFCm\xFC","\u0130\xE7erik","Yakla\u015F\u0131k yer"],satirlar:[["\xD6zet","Ama\xE7, veri, y\xF6ntem, ana sonu\xE7","Yar\u0131m sayfa"],["1. Giri\u015F","Bulut olu\u015Fumunun termodinamik temeli; projenin amac\u0131","Yar\u0131m sayfa"],["2. Part I \xF6zeti","G\xF6zlem d\xF6nemi, 5 g\xFCn\xFCn bulut s\u0131n\u0131flamas\u0131, kolaj","Bir sayfa"],["3. Veri ve y\xF6ntem","Kaynaklar, form\xFCller, Python par\xE7alar\u0131","Bir bu\xE7uk sayfa"],["4. Bulgular","5 g\xFCn \xD7 (foto\u011Fraf, tablo, indeks tablosu, 2 Skew-T, yorum)","G\xFCn ba\u015F\u0131na bir sayfa"],["5. K\u0131yas ve hata analizi","Toplu tablo, hata nedenleri, alternatifler","Bir sayfa"],["6. Genel de\u011Ferlendirme","Ki\u015Fisel \xE7\u0131kar\u0131m, ben dili","Yar\u0131m sayfa"],["Kaynaklar","APA 6","Yar\u0131m sayfa"]],not:"Toplam asgari s\u0131n\u0131r\u0131n \xE7ok \xFCst\xFCnde \xE7\u0131kt\u0131; as\u0131l \xF6l\xE7\xFCt sayfa de\u011Fil, her b\xF6l\xFCmde g\xF6rd\xFCm \u2192 hesaplad\u0131m \u2192 uyu\u015Ftu mu s\u0131ras\u0131."}}],dersler:["\xD6nce tek birim s\xF6zle\u015Fmesi ve tek \u0131zgara; sonra form\xFCller; sonra test; en sonda diyagram.","Kendi \xE7izimin bir \u015Feyi do\u011Frulamadan \xF6nce ikinci bir kaynakla (g\xF6zlem sounding\u2019i) yan yana koy.","Veri giri\u015Fine g\xFCven i\xE7in ikinci bir \xF6l\xE7\xFCt bul (benim i\xE7in K indeksi hesap-g\xF6zlem uyumuydu).","Fark\u0131 gizleme: hata analizi hocan\u0131n en \xE7ok de\u011Fer verece\u011Fi b\xF6l\xFCm olabilir.","Ben dili hem raporu hem \xF6\u011Frenmeyi sa\u011Flamla\u015Ft\u0131r\u0131yor."]},{id:"fark",baslik:{tr:"Bu d\xF6nem proje ne istiyor, fark ne?",en:"What does this term\u2019s project ask, and what is different?"},ozet:"Bu d\xF6nemin Part I metni elimde ve b\xFCy\xFCk haber \u015Fu: neredeyse ayn\u0131 proje. En \xF6nemli fark g\xF6zlem s\xFCresinin 25 g\xFCnden 30 g\xFCne \xE7\u0131kmas\u0131; bunun takvime etkisi b\xFCy\xFCk. Part II metni hen\xFCz yok.",adimlar:[{id:"f1",no:"F.1",baslik:{tr:"Ayn\u0131 m\u0131, farkl\u0131 m\u0131: sat\u0131r sat\u0131r",en:"Same or different: line by line"},neden:"Neyin de\u011Fi\u015Fti\u011Fini ve neyin kesin olmad\u0131\u011F\u0131n\u0131 ay\u0131rmak, yanl\u0131\u015F yere emek harcaman\u0131 engeller.",teknik:["Bu d\xF6nemin Part I proje metni ge\xE7en d\xF6nemkiyle neredeyse kelimesi kelimesine ayn\u0131: ayn\u0131 ba\u015Fl\u0131k (bulut ve ya\u011F\u0131\u015F i\xE7in g\xF6ky\xFCz\xFC g\xF6zlemi), ayn\u0131 d\xF6rt g\xFCnl\xFCk i\u015F (g\xF6zle, temel de\u011Fi\u015Fkenleri not al, net foto\u011Fraf \xE7ek, g\xF6zlem defteri tut), ayn\u0131 a\u2013e \xF6zeti, ayn\u0131 zip teslimi.","Metindeki tek say\u0131sal de\u011Fi\u015Fiklik: \xAB25 ard\u0131\u015F\u0131k g\xFCn\xBB yerine \xAB30 ard\u0131\u015F\u0131k g\xFCn\xBB (\xF6zette de \xAB25 g\xFCn\xBB yerine \xAB30 g\xFCn\xBB).","Sa\u011Fdaki etiket g\xFCven d\xFCzeyidir: teyitli = proje metninden ya da resm\xEE katalogdan do\u011Fruland\u0131; \xE7\u0131kar\u0131m = i\u015Faretlerden \xE7\u0131kard\u0131m, kesin de\u011Fil; bilinmiyor = belge hen\xFCz yok."],basit:["Yani ge\xE7en d\xF6nem Part I\u2019i yapan biri bu d\xF6nemin Part I\u2019inde neredeyse hi\xE7bir \u015Feyi yeniden \xF6\u011Frenmek zorunda de\u011Fil. Fark g\xFCn say\u0131s\u0131 ve takvim.","Part II konusunda h\xE2l\xE2 bilmedi\u011Fim \u015Fey var; onu F.4\u2019te ayr\u0131 yazd\u0131m."],tablo:{baslik:["Konu","Ge\xE7en d\xF6nem (Bahar 2026)","Bu d\xF6nem (G\xFCz 2026)","Durum"],satirlar:[["Ders kodu","MTO 229E (proje metninde)","MTO 342E (Ninova s\u0131n\u0131f\u0131); katalogda MTO 229E ile denk; proje metninin ba\u015Fl\u0131\u011F\u0131 h\xE2l\xE2 MTO229E","teyitli"],["Part I konusu","Bulut ve ya\u011F\u0131\u015F i\xE7in g\xF6ky\xFCz\xFC g\xF6zlemi","Ayn\u0131 ba\u015Fl\u0131k","teyitli"],["G\xF6zlem s\xFCresi","25 ard\u0131\u015F\u0131k g\xFCn","30 ard\u0131\u015F\u0131k g\xFCn","teyitli"],["Sabit saat ve yer","Her g\xFCn ayn\u0131 saat, ayn\u0131 yer (metinde \xF6rnek: sabah dokuz)","Ayn\u0131 \u015Fart, ayn\u0131 \xF6rnek","teyitli"],["Her g\xFCn yap\u0131lacak","G\xF6zle, temel de\u011Fi\u015Fkenleri not al, net foto\u011Fraf \xE7ek, g\xF6zlem defteri tut","Ayn\u0131 d\xF6rt madde","teyitli"],["\xD6zet","Bir \u2013 bir bu\xE7uk sayfa Word, ba\u015Fl\u0131klar a\u2013e","Ayn\u0131 be\u015F ba\u015Fl\u0131k; s\xFCre 30 g\xFCn olarak ge\xE7iyor","teyitli"],["Teslim","Her \u015Fey tek zip, Ninova","Ayn\u0131; Ninova\u2019da Part I teslimi Aral\u0131k ba\u015F\u0131nda","teyitli"],["Sayfa ba\u015Fl\u0131\u011F\u0131ndaki tarihler","Part I May\u0131s ba\u015F\u0131, Part II May\u0131s ortas\u0131","Ba\u015Fl\u0131ktaki Part I ve Part II tarihleri metin g\xF6vdesiyle \xE7eli\u015Fiyor; Ninova\u2019daki teslim tarihi esas al\u0131nmal\u0131","cikarim"],["Hocan\u0131n de\u011Fi\u015Fiklik yapt\u0131\u011F\u0131 yer","\u2014","Part I\u2019de g\xF6r\xFCnen tek de\u011Fi\u015Fiklik 25 \u2192 30 g\xFCn; ba\u015Fka de\u011Fi\u015Fiklik var m\u0131 Part II ile netle\u015Fir","cikarim"],["Part II","Part I\u2019den sonra ayr\u0131 bir \xABhesaplama ad\u0131mlar\u0131\xBB belgesiyle geldi","Belge hen\xFCz yok","bilinmiyor"]],rozetSutun:3}},{id:"f2",no:"F.2",baslik:{tr:"En b\xFCy\xFCk fark: 30 ard\u0131\u015F\u0131k g\xFCn ve takvim",en:"The big difference: 30 consecutive days and the calendar"},neden:"Ard\u0131\u015F\u0131k g\xFCn \u015Fart\u0131, b\xFCt\xFCn projenin en pahal\u0131 k\u0131sm\u0131; bir g\xFCn bo\u015Fluk bile bunu bozar.",teknik:["S\xFCre 25\u2019ten 30 g\xFCne \xE7\u0131kt\u0131. \xABArd\u0131\u015F\u0131k\xBB oldu\u011Fu i\xE7in g\xF6zlem penceresi kesintisiz olmal\u0131.","Ninova\u2019da Part I teslimi Aral\u0131k ba\u015F\u0131nda. 30 g\xFCn\xFC Aral\u0131k ba\u015F\u0131nda bitirmek i\xE7in g\xF6zlemin Kas\u0131m ba\u015F\u0131nda ba\u015Flamas\u0131 gerekiyor; Kas\u0131m ba\u015F\u0131nda ba\u015Flayan pencere Aral\u0131k ba\u015F\u0131nda biter ve g\xF6zlemin son g\xFCn\xFC teslim g\xFCn\xFCyle \xE7ak\u0131\u015F\u0131r.","Ge\xE7en d\xF6nem 26 g\xFCnl\xFCk aral\u0131kta 22 g\xFCn g\xF6zlem yapabildim, 4 g\xFCn bo\u015F kald\u0131. Ayn\u0131 oran bu d\xF6nem 30 g\xFCnde yakla\u015F\u0131k 5 bo\u015F g\xFCn demek; yani ge\xE7en d\xF6nemin temposu bu d\xF6nemin \u015Fart\u0131n\u0131 kar\u015F\u0131lamaz.","\xD6nerilen takvim (g\xFCn say\u0131s\u0131 g\xF6zlemin kendi g\xFCnleridir): ilk 3 g\xFCn rutin kurulumu; 4\u201325. g\xFCnler g\xFCnl\xFCk g\xF6zlem + haftal\u0131k veri g\xFCncellemesi; 26\u201329. g\xFCnler \xF6zetin ve tablolar\u0131n son h\xE2li; 30. g\xFCn son g\xF6zlem, zip ve Ninova\u2019ya y\xFCkleme."],tuzak:"Raporu son g\xFCne b\u0131rak\u0131rsan 30. g\xFCnde hem g\xF6zlem yap\u0131p hem rapor yazamazs\u0131n. \u0130lk \xFC\xE7 haftan\u0131n verisiyle \xF6zet tasla\u011F\u0131n\u0131 \xF6nceden yaz; son g\xFCnlerde yaln\u0131z say\u0131lar\u0131 g\xFCncelle.",basit:["K\u0131saca: bu d\xF6nem 30 g\xFCn, bo\u015Fluk yok ve teslim son g\xFCnle ayn\u0131 hafta. O y\xFCzden i\u015F, ba\u015Flad\u0131\u011F\u0131n g\xFCnden itibaren her g\xFCn be\u015F dakikal\u0131k k\xFC\xE7\xFCk bir rutin olmal\u0131: foto\u011Fraf, saat, not.","Ge\xE7en d\xF6nem en \xE7ok bo\u015F b\u0131rakt\u0131\u011F\u0131m \u015Fey buydu. Bu d\xF6nem alarm kurmak sadece \xF6neri de\u011Fil, \u015Fart gibi."],tablo:{baslik:["G\xFCn aral\u0131\u011F\u0131","Ne yap\u0131l\u0131r"],satirlar:[["1\u20133","Sabit saat ve yer se\xE7imi, alarm, kadraj, klas\xF6r d\xFCzeni, g\xFCnl\xFCk veri s\xF6zl\xFC\u011F\xFCn\xFCn iskeleti, i\u015Fleme beti\u011Finin denenmesi"],["4\u201325","Her g\xFCn: foto\u011Fraf + saat + not. Haftada bir: montaj \xFCret, ERA5 / radyosonde verisini \xE7ek, tabloyu g\xFCncelle"],["26\u201329","a\u2013e \xF6zetinin son h\xE2li, tablolar\u0131n tamamlanmas\u0131, rapor ve sunum \xFCretimi, zip i\xE7eri\u011Finin kontrol\xFC"],["30","Son g\xF6zlem, say\u0131lar\u0131n g\xFCncellenmesi, raporun yeniden \xFCretilmesi, zip ve Ninova\u2019ya y\xFCkleme (g\xFCn bitmeden)"]]}},{id:"f3",no:"F.3",baslik:{tr:"Kas\u0131m\u2013Aral\u0131k g\xF6ky\xFCz\xFC ve veri: neye dikkat?",en:"November\u2013December sky and data: what to watch"},neden:"Ge\xE7en d\xF6nem ilkbahar verisiyle \xE7al\u0131\u015Ft\u0131m; sonbahar sonu ve k\u0131\u015F ba\u015F\u0131 farkl\u0131 bulut ve farkl\u0131 veri sorunlar\u0131 getirir.",teknik:["Bulut \xE7e\u015Fitlili\u011Fi: sonbahar sonu ve k\u0131\u015F ba\u015F\u0131nda cephe ge\xE7i\u015Fleri ve tabakal\u0131 bulutlar s\u0131kla\u015F\u0131r, g\xFCzel hava k\xFCm\xFCl\xFCs\xFC azalabilir. Tan\u0131 \xF6l\xE7\xFCtleri (5. ad\u0131m) ayn\u0131 kal\u0131r; Altostratus, Nimbostratus ve Stratus ayr\u0131m\u0131 daha \xE7ok i\u015F g\xF6r\xFCr.","G\xFCn \u0131\u015F\u0131\u011F\u0131: g\xFCn k\u0131sa; \u0130stanbul\u2019da yakla\u015F\u0131k 08:00 ile 17:30 aras\u0131. Sabit saati bu aral\u0131\u011Fa koy; ak\u015Fam ge\xE7 saatlerde foto\u011Fraf bulutu g\xF6stermez.","Saat \xF6nerisi (benim \xF6nerim, metinde zorunluluk yok): 15:00 yerel saat = 12 UTC, yani radyosonde saati. Part II\u2019de sounding ile g\xF6zlem aras\u0131ndaki 3\u20136 saatlik uyu\u015Fmazl\u0131k, ge\xE7en d\xF6nemin ana hata kayna\u011F\u0131yd\u0131; g\xF6zlemi 12 UTC\u2019ye denk getirirsen bu hata kaybolur. Metindeki \xAB\xF6rne\u011Fin 09:00\xBB yaln\u0131zca \xF6rnek g\xF6r\xFCn\xFCyor.","ERA5 gecikmesi: ERA5 verisi yakla\u015F\u0131k be\u015F g\xFCn gecikmeyle (\xF6n s\xFCr\xFCm) gelir; son g\xFCnlerin ERA5 de\u011Feri teslim g\xFCn\xFCne yeti\u015Fmeyebilir. Radyosonde ise ayn\u0131 g\xFCn al\u0131nabilir; son g\xFCnler i\xE7in yedek plan: radyosonde ve resm\xEE hava uygulamas\u0131ndan okuma.","E\u015Fikler: ge\xE7en d\xF6nemin \xAByakla\u015F\u0131k %50 alt\u0131 a\xE7\u0131k, %75 \xFCst\xFC kapal\u0131\xBB sonucu ilkbahar verisinden \xE7\u0131kt\u0131; k\u0131\u015F i\xE7in kendi verinle yeniden do\u011Frula, haz\u0131r kabul etme."],basit:["K\u0131\u015Fa yakla\u015F\u0131rken g\xF6ky\xFCz\xFC daha s\u0131k\u0131c\u0131 ve daha gri olacak. Bu k\xF6t\xFC de\u011Fil: tabakal\u0131 bulutlar\u0131n ayr\u0131m\u0131n\u0131 yapmak en \xE7ok puan\u0131 getiren becerilerden biri.","Saat konusunda k\xFC\xE7\xFCk bir hile: radyosonde balonu 00 ve 12 UTC\u2019de at\u0131l\u0131yor. 15:00 yerel saat tam 12 UTC. O saatte foto\u011Fraf \xE7ekersen ileride sounding ile ayn\u0131 an\u0131 k\u0131yasl\u0131yorsun, uyu\u015Fmazl\u0131k sorunu hi\xE7 \xE7\u0131km\u0131yor."]},{id:"f4",no:"F.4",baslik:{tr:"Part II ne olabilir? (\xE7\u0131kar\u0131m)",en:"What could Part II be? (inference)"},neden:"Part I metni ge\xE7en d\xF6nemle ayn\u0131 oldu\u011Funa g\xF6re Part II\u2019nin de benzer gelme ihtimali y\xFCksek; haz\u0131rl\u0131\u011F\u0131 ona g\xF6re yap.",teknik:["Ge\xE7en d\xF6nem Part II, Part I\u2019den sonra ayr\u0131 bir \xABhesaplama ad\u0131mlar\u0131\xBB belgesiyle geldi: g\xF6zlem g\xFCnlerinden 5\u2019ini se\xE7, 101 kPa\u2019dan 20 kPa\u2019ya 5 kPa ad\u0131mlarla profil \xFCret, 21 kalem b\xFCy\xFCkl\xFCk hesapla, Skew-T \xE7iz, radyosondeyle k\u0131yasla, \u22653 sayfa rapor.","Bu d\xF6nem proje metninin ba\u015Fl\u0131\u011F\u0131nda yine Part I ve Part II adlar\u0131 var; Part II metni yok. Ge\xE7en d\xF6nemkine benzemesi b\xFCy\xFCk olas\u0131l\u0131k ama kesin de\u011Fil.","Benziyorsa bu rehberin Part II b\xF6l\xFCm\xFC do\u011Frudan ge\xE7erli. Haz\u0131rl\u0131k: Part I\u2019in foto\u011Fraf saatlerini ve g\xFCnl\xFCk verisini Part II\u2019ye haz\u0131r tut (EXIF saat, g\xFCn klas\xF6r\xFC, tek veri s\xF6zl\xFC\u011F\xFC); hesap zincirinin sabitlerini ve birim s\xF6zle\u015Fmesini \xF6nceden kur."],basit:["Part II gelince ilk i\u015F \xABistenen\xBB listesini \xE7\u0131karmak olacak (bu rehberde Part II\u2019nin ilk b\xF6l\xFCm\xFCndeki gibi). Farkl\u0131 bir \u015Fey isterse yaln\u0131z o sat\u0131rlar de\u011Fi\u015Fir."]},{id:"f5",no:"F.5",baslik:{tr:"Ge\xE7en d\xF6nemden bu d\xF6neme ta\u015F\u0131nabilecek par\xE7alar",en:"What carries over from last term"},neden:"Ayn\u0131 i\u015Fi ba\u015Ftan yazmamak, zaman\u0131 yorumlamaya ay\u0131r\u0131r.",teknik:["A\u015Fa\u011F\u0131daki tablo, ge\xE7en d\xF6nem yazd\u0131\u011F\u0131m mod\xFCllerin bu d\xF6nemde ne i\u015Fe yarayaca\u011F\u0131n\u0131 g\xF6sterir. \u0130lk \xFC\xE7 sat\u0131r Part I i\xE7in hemen ge\xE7erli."],basit:["Hepsini kopyala-yap\u0131\u015Ft\u0131r de\u011Fil, anlayarak yeniden kullan: Part II farkl\u0131 bir \u015Fey isterse bile iskelet ayn\u0131 kal\u0131r."],tablo:{baslik:["Par\xE7a","Ne yap\u0131yor","Bu d\xF6nem ne olur"],satirlar:[["isleme (Part I)","HEIC ve RAF\u2019\u0131 JPG\u2019ye \xE7evirme, EXIF saat okuma, montaj","Aynen kullan\u0131l\u0131r; yaln\u0131z klas\xF6r yolu de\u011Fi\u015Fir"],["era5 (Part I)","ERA5 .nc\u2019den g\xFCnl\xFCk s\u0131cakl\u0131k ve nem, foto\u011Fraf an\u0131na enterpolasyon","Aynen; tarih aral\u0131\u011F\u0131 ve alan kutusu de\u011Fi\u015Fir"],["gunluk_veri + rapor/sunum \xFCretici","G\xFCnl\xFCk s\xF6zl\xFCkten Word raporu ve sunum","\u015Eablon korunur, metinler 30 g\xFCne g\xF6re yeniden yaz\u0131l\u0131r"],["sabitler","Sabitler ve birim s\xF6zle\u015Fmesi","Part II geldi\u011Finde yeni metindeki sabitler farkl\u0131ysa yaln\u0131z buras\u0131 de\u011Fi\u015Fir"],["termo","es, rs, Td, q, \u03B8, \u03B8e, LCL \u2026 form\xFClleri","B\xFCy\xFCk olas\u0131l\u0131kla aynen kal\u0131r; yeni b\xFCy\xFCkl\xFCk istenirse eklenir"],["profil","RK4 ile s\u0131cakl\u0131k profili, parsel y\xFCkseltme","Denklem ayn\u0131ysa aynen; farkl\u0131ysa tek fonksiyon"],["indeksler","CAPE, CIN, LFC, EL, LI, SI, K","\u0130stenen indeks listesine g\xF6re"],["veri","Radyosonde \xE7ekme ve ayr\u0131\u015Ft\u0131rma","Tarih, saat ve istasyon de\u011Fi\u015Fir"],[
