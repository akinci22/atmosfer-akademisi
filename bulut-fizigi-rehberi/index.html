eklik demek.","Saati UTC verirsin; T\xFCrkiye saatine \xE7evirmek i\xE7in 3 saat ekle: 12 UTC, \xF6\u011Fleden sonra 3 eder."],akademi:[A.seviyeLab,A.h700]},"p1-4":{konu:["Foto\u011Fraf, saat, bulut ad\u0131, s\u0131cakl\u0131k ve nemi tek kartta yan yana g\xF6r\xFCnce g\xFCnler aras\u0131 de\u011Fi\u015Fimi tek bak\u0131\u015Fta yakalars\u0131n.","De\u011Fi\u015Fkenlerin birbirine ba\u011Fl\u0131 oldu\u011Funu kartlarda fark edersin: nem artt\u0131k\xE7a bulut taban\u0131 genelde al\xE7al\u0131r."],akademi:[A.meteogram]},"p1-5":{konu:["\xD6nce ne g\xF6rd\xFC\u011F\xFCn\xFC, sonra neden \xF6yle oldu\u011Funu yaz: foto\u011Fraf kan\u0131t, s\u0131cakl\u0131k ve nem a\xE7\u0131klama.","Bir g\xFCn\xFC \xF6rnek se\xE7; bulutun ad\u0131n\u0131, taban\u0131n\u0131 ve nemi tek bir zincirde anlat."]},"p2-1":{konu:["Be\u015F g\xFCn birbirinden farkl\u0131 olsun: a\xE7\u0131k, par\xE7al\u0131 bulutlu, kapal\u0131, ya\u011F\u0131\u015Fl\u0131. Farkl\u0131 hava, hesab\u0131n\u0131 s\u0131namak i\xE7in en iyi f\u0131rsat.","Radyosonde yaln\u0131z 00 ve 12 UTC\u2019de var; g\xFCn\xFC se\xE7erken foto\u011Fraf\u0131n saatine yak\u0131n \xF6l\xE7\xFCm\xFC olan g\xFCnlere bak."],akademi:[A.radar,A.yagis]},"p2-2":{konu:["Radyosonde balonla y\xFCkselirken her seviyede bas\u0131n\xE7, s\u0131cakl\u0131k, \xE7iy noktas\u0131 ve r\xFCzg\xE2r\u0131 \xF6l\xE7er; ortaya dikey profil \xE7\u0131kar.","Wyoming ar\u015Fivinde istasyonu ve saati se\xE7ip metin tablosunu indirirsin; hesab\u0131nda ger\xE7ek \xF6l\xE7\xFCm olarak kullan\u0131rs\u0131n.","Balon bulutun i\xE7inden de ge\xE7er: nemin %100\u2019e yakla\u015Ft\u0131\u011F\u0131 katmanlar bulut katman\u0131n\u0131n izidir."],akademi:[A.skewt,A.seviyeLab]},"p2-3":{konu:["Denklem, doymu\u015F havada s\u0131cakl\u0131\u011F\u0131n bas\u0131n\xE7la nas\u0131l de\u011Fi\u015Fti\u011Fini s\xF6yler: y\xFCkselirken so\u011Fuma, yo\u011Fu\u015Fman\u0131n verdi\u011Fi \u0131s\u0131yla yava\u015Flar.","Kodlarken her terimi ve birimini yaz. \xC7o\u011Fu hata birim kar\u0131\u015Fmas\u0131ndan \xE7\u0131kar: kPa m\u0131 hPa m\u0131, \xB0C mi K mi.","Bilinen bir \xF6rnekle dene; sonucu bir sonraki ad\u0131mdaki hesaplay\u0131c\u0131yla kar\u015F\u0131la\u015Ft\u0131r."],akademi:[A.kararlilik]},"p2-4":{konu:["Doymu\u015F parselin so\u011Fuma h\u0131z\u0131 s\u0131cakl\u0131\u011Fa ve bas\u0131nca ba\u011Fl\u0131; bu y\xFCzden tek hamlede de\u011Fil, 5 kPa\u2019l\u0131k k\xFC\xE7\xFCk basamaklarla \xE7\u0131k\u0131yorsun.","Her basamakta e\u011Fimi yeniden hesaplars\u0131n: s\u0131cak havada parsel yava\u015F, so\u011Fuk havada h\u0131zl\u0131 so\u011Fur.","Euler tek bir e\u011Fime bakar; RK4 basama\u011F\u0131n i\xE7inde d\xF6rt e\u011Fime bakar, bu y\xFCzden ayn\u0131 basamakta daha do\u011Fru \xE7\u0131kar."],akademi:[A.kararlilik,A.skewt]},"p2-5":{konu:["21 de\u011Ferin hepsi iki girdiden (s\u0131cakl\u0131k ve nem) t\xFCr\xFCyor: \xF6nce doyma, buhar ve nem de\u011Ferleri, sonra s\u0131cakl\u0131k \xE7e\u015Fitleri.","Sonra parseli kald\u0131r\u0131rs\u0131n: LCL\u2019ye kadar kuru adyabat, LCL\u2019den sonra nemli adyabat.","LFC ile EL aras\u0131nda parsel \xE7evreden s\u0131caksa CAPE birikir; parsel LFC\u2019ye \xE7\u0131kam\u0131yorsa CIN engeldir.","A\u015Fa\u011F\u0131daki oyuncakla dene: \xE7evre e\u011Fimini de\u011Fi\u015Ftir, bulutun dikey b\xFCy\xFCy\xFCp b\xFCy\xFCmedi\u011Fine bak."],widget:_f,akademi:[A.kararlilik,A.indeks]},"p2-6":{konu:["Skew-T\u2019de bas\u0131n\xE7 dikey ve logaritmik, s\u0131cakl\u0131k \xE7izgileri e\u011Fik; kuru adyabatlar hafif e\u011Fridir.","S\u0131cakl\u0131k ve \xE7iy noktas\u0131 \xE7izgilerinin birbirine yakla\u015Ft\u0131\u011F\u0131 seviyeler nemli, birle\u015Ftikleri seviyeler doymu\u015F katmand\u0131r.","Parsel \xE7izgisi s\u0131cakl\u0131k \xE7izgisinin sa\u011F\u0131nda kal\u0131yorsa o aral\u0131kta parsel \xE7evreden s\u0131cakt\u0131r; o alan CAPE\u2019tir."],akademi:[A.skewt,A.kararlilik]},"p2-7":{konu:["\xD6l\xE7\xFCmle ERA5 profilini \xFCst \xFCste koyunca nerede ayr\u0131ld\u0131klar\u0131n\u0131 g\xF6r\xFCrs\xFCn; fark \xE7o\u011Fu zaman nemli katmanlarda \xE7\u0131kar.","K\xFC\xE7\xFCk farklar normal: ERA5 bir \u0131zgara h\xFCcresinin ortalamas\u0131, radyosonde ise balonun ge\xE7ti\u011Fi tek bir yol."],akademi:[A.skewt,A.meteogram]},"p2-8":{konu:["Profil bulutun nerede olabilece\u011Fini s\xF6yler: nemli katman bulut katman\u0131, doymu\u015F katman\u0131n taban\u0131 bulut taban\u0131d\u0131r.","Foto\u011Fraftaki bulutu profile ba\u011Fla: karars\u0131z nemli profil Cumulus ya da Cumulonimbus, kararl\u0131 nemli profil Stratus gibi katmanl\u0131 bulut verir.","CIN b\xFCy\xFCkse parsel y\xFCkselemez; f\u0131rt\u0131na i\xE7in bir tetikleyiciye ihtiya\xE7 var. CAPE b\xFCy\xFCkse tetiklenince g\xFC\xE7l\xFC geli\u015Fir."],akademi:[A.skewt,A.uydu,A.radar,A.indeks]}};var F="rehber/pcp/",Rg="https://cds.climate.copernicus.eu/datasets/reanalysis-era5-pressure-levels?tab=download",If="https://weather.uwyo.edu/upperair/sounding.shtml",lo={id:"bulut-yagis-proje-bahar-2026",ders:"mto-229",dersKod:"MTO 229E",dersAd:"Bulut ve Ya\u011F\u0131\u015F Fizi\u011Fi",donem:"Bahar 2026",baslik:"G\xF6ky\xFCz\xFC foto\u011Fraf\u0131ndan Skew-T\u2019ye",ozet:"Bir ay g\xF6ky\xFCz\xFCn\xFC \xE7ektim; be\u015F g\xFCn\xFCn atmosferini kendi kodumla hesaplay\u0131p balon \xF6l\xE7\xFCm\xFCyle (radyosonde) k\u0131yaslad\u0131m.",nasilEtiket:"Nas\u0131l yapt\u0131m?",istenenEtiket:"Hoca senden ne istiyor?",bilgi:[{k:"D\xF6nem",v:"Bahar 2026"},{k:"Part I",v:"25 g\xFCn g\xF6ky\xFCz\xFC g\xF6zlemi"},{k:"Part II",v:"5 g\xFCn\xFCn atmosfer hesab\u0131"},{k:"Gerekenler",v:"Telefon ve biraz Python"},{k:"Teslim",v:"Ninova\u2019ya iki zip"}],sonuc:{gorsel:[{src:F+"gok_27.jpg",alt:"27 Nisan ak\u015Fam\u0131 bulutsuz, derin mavi g\xF6ky\xFCz\xFC",cap:"27 Nisan ak\u015Fam\u0131 g\xF6ky\xFCz\xFCn\xFC \xE7ektim: bulutsuzdu."},{src:F+"skewt_kiyas_27.webp",alt:"27 Nisan i\xE7in hesaplanan ve \xF6l\xE7\xFClen Skew-T diyagramlar\u0131 \xFCst \xFCste",c a bak, sonra \u015Fekline. Emin olamazsan o g\xFCn\xFCn nemine ve ya\u011F\u0131\u015F\u0131na bak; ben de karars\u0131z kald\u0131\u011F\u0131mda \xF6yle yapt\u0131m.",adim:"p1-2"},{s:"Foto\u011Fraf\u0131n \xE7ekim saatini nereden bilece\u011Fim?",c:"Telefon saati foto\u011Fraf\u0131n i\xE7ine zaten yaz\u0131yor; sen de saati bir yere not edersen yeter. Kodla okumak (EXIF) istersen Ad\u0131m 1\u2019in Ek detay b\xF6l\xFCm\xFCnde var.",adim:"p1-1"},{s:"ERA5 hesab\u0131 a\xE7mak zor mu?",c:"De\u011Fil, \xFCcretsiz. Copernicus sitesinde sa\u011F \xFCstteki \xABLogin \u2013 Register\xBB\u2019dan hesap a\xE7\u0131yorsun. G\xFCn\xFC ve saati se\xE7ip Submit\u2019e bas\u0131nca dosya \xABYour requests\xBB sayfanda haz\u0131r oluyor; benimki birka\xE7 dakika s\xFCrd\xFC.",adim:"p1-3"},{s:"UTC nedir, neden \xE7eviriyoruz?",c:"UTC meteorolojinin ortak saati; T\xFCrkiye saati = UTC + 3 (15:00 TS\u0130 = 12 UTC). Radyosonde balonlar\u0131 g\xFCnde iki kez, 00 ve 12 UTC\u2019de y\xFCkseliyor; foto\u011Fraf\u0131n\u0131 bunlardan en yak\u0131n\u0131na ba\u011Fl\u0131yorsun.",adim:"p1-3"},{s:"Teslim nas\u0131l oluyor?",c:"Her par\xE7ay\u0131 Ninova\u2019da kendi alan\u0131na tek zip olarak y\xFCkl\xFCyorsun: Part I i\xE7in \xABPROJECT PART # I #\xBB, Part II i\xE7in \xABUPDATED PROJECT PART II\xBB. Alan yaln\u0131z zip ya da rar kabul ediyor; y\xFCkleyince zipi indirip a\xE7\u0131l\u0131yor mu diye bak.",adim:"p1-6"},{s:"Hangi 5 g\xFCn\xFC se\xE7meliyim?",c:"Bulutlar\u0131 birbirinden farkl\u0131, foto\u011Fraf\u0131 net ve saati belli g\xFCnleri se\xE7; ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli bir g\xFCn\xFCn varsa onu da kat. Ben cirrus, stratocumulus, bulutsuz, k\xFCm\xFCl\xFCs ve stratus g\xFCnlerini ald\u0131m.",adim:"p2-1"},{s:"Wyoming sayfas\u0131ndan veri gelmiyor, ne yapay\u0131m?",c:"Tarihi, saati (00 ya da 12 Z) ve istasyon numaras\u0131n\u0131 (\u0130stanbul/Kartal i\xE7in 17064) kontrol et. Sayfa bazen yo\u011Fun oluyor; birka\xE7 dakika sonra yeniden dene.",a
