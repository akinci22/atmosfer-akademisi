tinde \xE7ekmeliyim?",c:"Sana uyan saati se\xE7. 15:00 civar\u0131 \xE7ekersen o g\xFCn\xFCn 12 UTC balon \xF6l\xE7\xFCm\xFCyle birebir e\u015Fle\u015Fir. Ben hem sabah hem ak\u015Fam \xE7ektim; sabahkileri 00 UTC, ak\u015Famkileri 12 UTC \xF6l\xE7\xFCm\xFCne ba\u011Flad\u0131m.",adim:"p1-1"},{s:"Hava hep bulutsuzsa ya da hep kapal\u0131ysa ne yapaca\u011F\u0131m?",c:"Onu da yaz. Bulutsuz bir g\xFCn de ger\xE7ek bir g\xF6zlem: ben 27 Nisan\u2019\u0131 bulutsuz olarak tabloya yazd\u0131m. Hep kapal\u0131ysa kal\u0131nl\u0131\u011Fa ve ya\u011F\u0131\u015Fa bak: gri d\xFCz tabaka Stratus, ya\u011F\u0131\u015F varsa Nimbostratus.",adim:"p1-2"},{s:"Bulutu tan\u0131yamazsam ne olur?",c:"\xD6nce bulutun ka\xE7 katta oldu\u011Funa bak, sonra \u015Fekline. Emin olamazsan o g\xFCn\xFCn nemine ve ya\u011F\u0131\u015F\u0131na bak; ben de karars\u0131z kald\u0131\u011F\u0131mda \xF6yle yapt\u0131m.",adim:"p1-2"},{s:"Foto\u011Fraf\u0131n \xE7ekim saatini nereden bilece\u011Fim?",c:"Telefon saati foto\u011Fraf\u0131n i\xE7ine zaten yaz\u0131yor; sen de saati bir yere not edersen yeter. Kodla okumak (EXIF) istersen Ad\u0131m 1\u2019in Ek detay b\xF6l\xFCm\xFCnde var.",adim:"p1-1"},{s:"ERA5 hesab\u0131 a\xE7mak zor mu?",c:"De\u011Fil, \xFCcretsiz. Copernicus sitesinde sa\u011F \xFCstteki \xABLogin \u2013 Register\xBB\u2019dan hesap a\xE7\u0131yorsun. G\xFCn\xFC ve saati se\xE7ip Submit\u2019e bas\u0131nca dosya \xABYour requests\xBB sayfanda haz\u0131r oluyor; benimki birka\xE7 dakika s\xFCrd\xFC.",adim:"p1-3"},{s:"UTC nedir, neden \xE7eviriyoruz?",c:"UTC meteorolojinin ortak saati; T\xFCrkiye saati = UTC + 3 (15:00 TS\u0130 = 12 UTC). Radyosonde balonlar\u0131 g\xFCnde iki kez, 00 ve 12 UTC\u2019de y\xFCkseliyor; foto\u011Fraf\u0131n\u0131 bunlardan en yak\u0131n\u0131na ba\u011Fl\u0131yorsun.",adim:"p1-3"},{s:"Teslim nas\u0131l oluyor?",c:"Her par\xE7ay\u0131 Ninova\u2019da kendi alan\u0131na tek zip olarak y\xFCkl\xFCyorsun: Part I i\xE7in \xABPROJECT PART # I #\xBB, Part II i\xE7in \xABUPDATED PROJECT PART II\xBB. Alan yaln\u0131z zip ya da rar kabul ediyor; y\xFCkleyince zipi indirip a\xE7\u0131l\u0131yor mu diye bak.",adim:"p1-6"},{s:"Hangi 5 g\xFCn\xFC se\xE7meliyim?",c:"Bulutlar\u0131 birbirinden farkl\u0131, foto\u011Fraf\u0131 net ve saati belli g\xFCnleri se\xE7; ya\u011F\u0131\u015Fl\u0131 ya da \u015Fiddetli bir g\xFCn\xFCn varsa onu da kat. Ben cirrus, stratocumulus, bulutsuz, k\xFCm\xFCl\xFCs ve stratus g\xFCnlerini ald\u0131m.",adim:"p2-1"},{s:"Wyoming sayfas\u0131ndan veri gelmiyor, ne yapay\u0131m?",c:"Tarihi, saati (00 ya da 12 Z) ve istasyon numaras\u0131n\u0131 (\u0130stanbul/Kartal i\xE7in 17064) kontrol et. Sayfa bazen yo\u011Fun oluyor; birka\xE7 dakika sonra yeniden dene.",adim:"p2-2"},{s:"Part II\u2019de kod yazmak \u015Fart m\u0131?",c:"Evet. Hoca hesaplar\u0131 kendi kodundan istiyor; haz\u0131r paketten okudu\u011Fun say\u0131 puan getirmez. Python\u2019da temel bilgi \u015Fart: ben tek fonksiyon yaz\u0131p her basamakta tekrar \xE7a\u011F\u0131rd\u0131m. \xC7ekirdek kod Ek detay\u2019da; tak\u0131l\u0131rsan \xABSoru sor\xBB.",adim:"p2-3"},{s:"Skew-T neye yar\u0131yor?",c:"Havan\u0131n yukar\u0131 do\u011Fru s\u0131cakl\u0131\u011F\u0131n\u0131 ve nemini tek grafikte g\xF6steriyor. K\u0131rm\u0131z\u0131 s\u0131cakl\u0131k ile ye\u015Fil \xE7iy noktas\u0131 birbirine yak\u0131nsa o seviye nemli, bulut olabilir. Parselin yolundan da bulut taban\u0131n\u0131 okuyorsun.",adim:"p2-6"},{s:"Skew-T\u2019yi haz\u0131r paketle \xE7izebilir miyim?",c:"Ben matplotlib ile kendim \xE7izdim; eksen d\xF6n\xFC\u015F\xFCm\xFCn\xFC de kendim yazd\u0131m. Haz\u0131r paket kullan\u0131rsan eksenleri ve ne yapt\u0131\u011F\u0131n\u0131 raporunda a\xE7\u0131klamal\u0131s\u0131n.",adim:"p2-6"},{s:"Hesab\u0131m radyosonde \xF6l\xE7\xFCm\xFCyle tutmad\u0131; yanl\u0131\u015F m\u0131 yapt\u0131m?",c:"Fark \xE7\u0131kmas\u0131 normal. \xD6nemli olan nedenini yazman: saat fark\u0131, ad\u0131m geni\u015Fli\u011Fi ya da girdi fark\u0131. Ben
