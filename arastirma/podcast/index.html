<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Podcastler · Araştırma</title><link rel="icon" href="data:,">
<style>
:root{--m:#1d4ed8;--g:#64748b;--c:#e2e8f0}
body{margin:0;background:#fff;color:#0f172a;font:18px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
a{color:var(--m)} .geri{font-size:16px;text-decoration:none}
h1{font-size:30px;line-height:1.25;margin:16px 0 4px} .alt{color:var(--g);margin:0 0 28px}
h2{font-size:22px;line-height:1.3;margin:36px 0 8px}
ol{list-style:none;padding:0;margin:0} li{border-top:1px solid var(--c);padding:16px 0}
li:target{background:#eff6ff;margin:0 -16px;padding:16px} .ad{font-weight:600} .pdf{color:var(--g);font-size:16px}
.dg{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:10px;background:var(--m);color:#fff;text-decoration:none;font-size:16px}
.hz{display:inline-block;margin-top:8px;color:var(--g);font-size:16px}
.w8{display:block;margin-top:6px;font-size:16px}
#yon{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--c);padding:12px 0;font-size:16px}
#yon[hidden]{display:none} button{font:inherit;font-size:15px;border:1px solid var(--c);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
</style></head><body><main>
<a class="geri" href="../">← Araştırma</a>
<div id="yon" hidden></div>
<h1>Podcastler</h1>
<p class="alt">Defterlerdeki QR'lar buraya gelir. Adresi hazır olan podcast doğrudan açılır.</p>
<p><a href="../w8/">PDF ile eş zamanlı anlatım: W8, sayfa sayfa →</a></p>
<div id="liste"></div>
</main>
<script src="hedef.js"></script>
<script>
(function(){
  var L=window.PODCAST||[], kap=document.getElementById('liste'), ol=null, grup='';
  var GRUP={w8:'ING 201A · W8 defteri', prj:'TÜBİTAK 2209-A · proje'};
  L.forEach(function(p){
    var g=p.id.split('-')[0];
    if(g!==grup){grup=g; var h=document.createElement('h2'); h.textContent=GRUP[g]||g; kap.appendChild(h); ol=document.createElement('ol'); kap.appendChild(ol);}
    var li=document.createElement('li'); li.id=p.id;
    li.innerHTML='<div class="ad"></div><div class="pdf"></div>'+(p.url?'<a class="dg" rel="noopener">Podcast\u2019i aç ↗</a>':'<span class="hz">Hazırlanıyor: hazır olunca bu bağlantı doğrudan açılacak.</span>');
    li.querySelector('.ad').textContent=p.ad; li.querySelector('.pdf').textContent=p.pdf;
    if(p.url) li.querySelector('a').href=p.url;
    var m=(p.pdf||'').match(/s\. (\d+)/);
    if(m){var w=document.createElement('a'); w.className='w8'; w.href='../w8/#s'+m[1]; w.textContent='PDF ile eş zamanlı anlatım →'; li.appendChild(w);}
    if(p.site){var a=document.createElement('a'); a.className='w8'; a.href=p.site; a.textContent='Sitede ilgili bölüm →'; li.appendChild(a);}
    ol.appendChild(li);
  });
  var id=location.hash.slice(1), p=L.filter(function(x){return x.id===id})[0], yon=document.getElementById('yon');
  if(p&&p.url){
    yon.hidden=false; yon.textContent='Açılıyor: '+p.ad+' ';
    var b=document.createElement('button'); b.textContent='Burada kal'; yon.appendChild(b);
    var t=setTimeout(function(){location.replace(p.url)},1500);
    b.onclick=function(){clearTimeout(t); yon.hidden=true};
  }
})();
</script></body></html>
