<style>
.es{max-width:1440px;margin:0 auto;padding:18px clamp(16px,3vw,40px) calc(96px + env(safe-area-inset-bottom,0px))}
.es-bas h1{font-size:clamp(22px,2.3vw,30px);line-height:1.25;margin:0 0 4px}
.es-bas h1{margin-bottom:12px}
.h1-alt{font-weight:500;color:var(--soluk);font-size:.6em;margin-left:10px}
.bolumler{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.bol{font:inherit;font-size:15.5px;line-height:1.3;border:1px solid var(--cizgi);background:#fff;color:var(--yazi);border-radius:999px;padding:7px 14px;cursor:pointer}
.bol b{color:var(--vurgu)}
.bol span{color:var(--soluk);font-size:14px}
.bol[aria-current="true"]{background:var(--vurgu-zemin);border-color:var(--vurgu)}
.serit{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.serit .c{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--cizgi);background:#fff;font:inherit;font-size:15px;color:var(--yazi);cursor:pointer;position:relative}
.serit .c.ok{border-color:var(--vurgu);color:var(--vurgu)}
.serit .c.ok::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--vurgu)}
.serit .c.su{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.serit .c.su::after{background:#fff}
.sahne{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(18px,2.4vw,34px);align-items:start;margin-top:10px}
.gorsel{position:sticky;top:72px;margin:0}
.gorsel img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 322px);max-height:calc(100dvh - 322px);margin:0 auto;background:#fff;border:1px solid var(--cizgi);border-radius:12px;box-shadow:0 1px 3px rgba(20,24,31,.06)}
.gorsel figcaption{margin-top:6px;font-size:14.5px;color:var(--soluk);text-align:center}
.anlat{background:var(--yuzey);border-radius:var(--r);padding:clamp(16px,2vw,26px) clamp(18px,2.2vw,30px)}
.rozet{margin:0 0 4px;font-size:14.5px;color:var(--vurgu);font-weight:600;letter-spacing:.01em}
.anlat h2{font-size:clamp(21px,2vw,26px);line-height:1.3;margin:0 0 12px}
.anlat ul{margin:0;padding-left:1.15em}
.anlat li{margin:0 0 10px}
.anlat li::marker{color:var(--vurgu)}
.yap{margin-top:14px;border-left:4px solid var(--vurgu);background:var(--vurgu-zemin);border-radius:10px;padding:10px 16px}
.yap b,.kal b{display:block;font-size:15px;color:var(--vurgu);margin-bottom:4px}
.yap ul{padding-left:1.1em}
.yap li{margin:0}
.kal{margin-top:14px;background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:10px 16px}
.kal p{margin:6px 0 8px}
.kal .en{display:block;font-weight:600}
.kal .tr{display:block;color:var(--soluk);font-style:italic;font-size:16px}
.baglar{display:flex;flex-wrap:wrap;gap:10px 18px;margin:16px 0 6px;font-size:16px}
.baglar a{color:var(--vurgu);text-decoration:none;border-bottom:1px solid currentColor}
.okudum{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--soluk);cursor:pointer;margin-top:4px}
.okudum input{width:20px;height:20px;accent-color:var(--vurgu)}
.gezgin{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--cizgi);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:14px}
.gezgin button{font:inherit;font-size:17px;min-width:128px;padding:10px 18px;border-radius:12px;border:1px solid var(--vurgu);background:var(--vurgu);color:#fff;cursor:pointer}
.gezgin button#onc{background:#fff;color:var(--vurgu)}
.gezgin button:disabled{opacity:.35;cursor:default}
.gezgin #sayac{min-width:70px;text-align:center;color:var(--soluk);font-size:16px}
@media (max-width:900px){
  .sahne{grid-template-columns:1fr;gap:12px}
  .gorsel{top:58px;z-index:5;background:var(--zemin);padding:4px 0 6px}
  .gorsel img{max-height:34vh;width:auto;max-width:100%;margin:0 auto}
  .bolumler{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .bol{flex:none}
  .h1-alt{display:block;margin:4px 0 0;font-size:.62em}
  .gorsel figcaption{margin-top:2px}
  .gezgin button{min-width:0;flex:1;max-width:180px}
}
</style>

<main class="es" id="ana">
<div class="es-bas">
<h1>ING201A · W8 · Paragraph A <span class="h1-alt">PDF ile eş zamanlı anlatım · defterde hangi sayfadaysan burada da o sayfa</span></h1>
<nav class="bolumler" id="bolumler" aria-label="Bölümler"></nav>
<nav class="serit" id="serit" aria-label="PDF sayfaları"></nav>
</div>

<script src="anlati.js"></script>
<script>
(function () {
  var A = window.ANLATI, B = window.BOLUMLER, N = A.length;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>'); }
  function iki(n) { return (n < 10 ? '0' : '') + n; }
  var ok = {};
  try { ok = JSON.parse(localStorage.getItem('w8-okudum') || '{}') || {}; } catch (e) { ok = {}; }
  var serit = $('serit'), bol = $('bolumler'), cur = 1;
  A.forEach(function (x) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'c'; b.textContent = x.s; b.dataset.s = x.s;
    b.setAttribute('aria-label', 'PDF sayfa ' + x.s + ': ' + x.t);
    b.addEventListener('click', function () { git(x.s); });
    serit.appendChild(b);
  });
  B.forEach(function (x) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'bol'; b.dataset.b = x.b;
    b.innerHTML = '<b>' + x.b + '</b> ' + esc(x.ad) + ' <span>s.' + x.s + '</span>';
    b.addEventListener('click', function () { git(x.s); });
    bol.appendChild(b);
  });
  function hashNo() { var m = location.hash.match(/(\d+)/); var n = m ? +m[1] : 1; return Math.min(N, Math.max(1, n)); }
  function goster(n) {
    cur = n; var x = A[n - 1];
    var img = $('img'); img.src = 's/' + iki(n) + '.webp'; img.alt = 'PDF sayfa ' + n + ': ' + x.t;
    $('no').textContent = n; $('sayac').textContent = n + ' / ' + N;
    var bo = null; B.forEach(function (y) { if (y.b === x.b) bo = y; });
    $('rozet').textContent = (bo ? 'Bölüm ' + bo.b + ' · ' + bo.ad + ' · ' : '') + 'PDF s.' + n;
    $('baslik').textContent = x.t;
    $('maddeler').innerHTML = x.an.map(function (s) { return '<li>' + md(s) + '</li>'; }).join('');
    var yap = $('yap'); yap.hidden = !x.yap;
    if (x.yap) yap.innerHTML = '<b>Şimdi yap</b><ul>' + x.yap.map(function (s) { return '<li>' + md(s) + '</li>'; }).join('') + '</ul>';
    var kal = $('kal'); kal.hidden = !x.kal;
    if (x.kal) kal.innerHTML = '<b>Kalıplar</b>' + x.kal.map(function (k) { return '<p><span class="en">' + esc(k[0]) + '</span><span class="tr">' + esc(k[1]) + '</span></p>'; }).join('');
    var pod = $('pod');
    if (bo) { pod.hidden = false; pod.href = '../podcast/#' + bo.pod; pod.textContent = '🎧 Bölüm ' + bo.b + ' podcasti'; } else { pod.hidden = true; }
    $('pdfs').href = '../defter/ING201A_W8_PARAGRAF-A_v4.pdf#page=' + n;
    $('ok').checked = !!ok[n];
    $('onc').disabled = n === 1; $('snr').disabled = n === N;
    Array.prototype.forEach.call(serit.children, function (c) {
      var s = +c.dataset.s; c.classList.toggle('su', s === n); c.classList.toggle('ok', !!ok[s]);
      if (s === n) c.setAttribute('aria-current', 'page'); else c.removeAttribute('aria-current');
    });
    Array.prototype.forEach.call(bol.children, function (c) { c.setAttribute('aria-current', +c.dataset.b === x.b ? 'true' : 'false'); });
    var su = serit.querySelector('.su');
    if (su) serit.scrollLeft = su.offsetLeft - serit.clientWidth / 2 + su.clientWidth / 2;
    [n + 1, n - 1].forEach(function (k) { if (k >= 1 && k <= N) { var i = new Image(); i.src = 's/' + iki(k) + '.webp'; } });
    document.title = 'PDF s.' + n + ' · ' + x.t + ' · ING201A W8';
  }
  function git(n) {
    n = Math.min(N, Math.max(1, n));
    if (location.hash !== '#s' + n) history.replaceState(null, '', '#s' + n);
    goster(n);
    window.scrollTo(0, 0);
  }
  $('onc').addEventListener('click', function () { git(cur - 1); });
  $('snr').addEventListener('click', function () { git(cur + 1); });
  $('ok').addEventListener('change', function (e) {
    if (e.target.checked) ok[cur] = 1; else delete ok[cur];
    try { localStorage.setItem('w8-okudum', JSON.stringify(ok)); } catch (er) {}
    goster(cur);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { git(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { git(cur - 1); e.preventDefault(); }
  });
  var x0 = null, y0 = 0, sahne = $('sahne');
  sahne.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  sahne.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) git(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });
  window.addEventListener('hashchange', function () { goster(hashNo()); });
  goster(hashNo());
})();
</script>
