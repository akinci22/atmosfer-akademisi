  <script type="module" crossorigin>(function(a,tr){"use strict";const na="Ders dosyası: TROUGHS AND RIDGES",he="Ders dosyası: Isobar",ze="Ders dosyası: brifing örneği (Met Office istasyon modeli)",kr=[{id:"buyuk-resim",no:"1",baslik:"Büyük resim: gözlemden öngörüye",ozet:"Hava analizi bir zincirdir: gözlem → kod → çizim → analiz → teşhis → öngörü → doğrulama. Her halka bir öncekine dayanır.",neden:"Sınavdaki her soru bu zincirin bir halkasını yoklar; hangi halkada olduğunu bilmek, elindeki bilgiden nereye gideceğini gösterir.",widget:"zincir",oz:"Harita bir fotoğraf değil, bir zincirin ortasıdır: önce tarih-saat, sonra çizgiler, en son öngörü.",kavramlar:[{id:"analiz-zinciri",baslik:"Analiz → öngörü zinciri",ozet:"Yedi halka: gözlem, kod, çizim, analiz, teşhis, öngörü, doğrulama.",ses:{teknik:["Gözlemler SYNOP olarak kodlanır, istasyon modeliyle haritaya işlenir (plotting), sonra eğriler çizilir (analysis).","Teşhis (diagnosis): izobar/kontur desenlerinden siklon, antisiklon, trof, sırt ve cepheyi tanımak.","Öngörü (forecast) sistemlerin hareketinden çıkar; doğrulama (verification) tahmini gözlemle karşılaştırmaktır."],basit:["Önce herkes aynı anda gökyüzüne bakar, bunu kısa bir şifreyle yazar; şifre haritada küçük işaretlere döner.","İşaretleri birleştirip şekilleri görürsün; şekiller hareket eder, sen de nereye gideceklerini kestirirsin."],ben:["Ben bir soruya takılınca önce şunu sorarım: zincirin hangi halkasındayım, elimde ne var?","Kod verildiyse çözüp modele koyarım, model verildiyse eğri çizerim; adım atlamam."]},tablo:{baslik:["Halka","Ne yapılır","Ürün"],satirlar:[["1 Gözlem","istasyonlar aynı anda ölçer","ham veri"],["2 Kod","SYNOP gruplarına yazılır","AAXX mesajı"],["3 Çizim","değerler istasyon modeline işlenir","plotlu harita"],["4 Analiz","izobar, kontur, izoterm çizilir","analiz kartı"],["5 Teşhis","A/Y, trof, sırt, cephe bulunur","sistem haritası"],["6 Öngörü","hareket ve gelişme kestirilir","tahmin"],["7 Doğrulama","tahmin gözlemle kıyaslanır","isabet / hata"]]},sorular:[{s:"Elinde yalnızca istasyon modelleri işlenmiş bir harita var. Zincirin hangi halkasındasın, sıradaki adım ne?",c:["3. halka: çizim (plotting) yapılmış.","Sıradaki adım analiz: değerlere göre izobar ve izoterm çizmek."]}],kaynak:"sinoptik kod kağıdı final; factsheet_11-interpreting-weather-charts; Isobar"},{id:"sinoptik-olcek",baslik:"Sinoptik ölçek ve orta enlemler",ozet:"Bu ders binlerce km'lik, günlerce yaşayan orta enlem sistemlerini inceler.",ses:{teknik:["Sinoptik ölçek: yatayda ~1000 km ve üstü, ömrü günler mertebesinde sistemler (siklon, antisiklon, trof, sırt).","Kapsam orta enlemler; tropikal siklonlar cephesizdir ve bu dersin dışında kalır.","Hava kütleleri de büyük ölçeklidir: ders dosyasında ömürleri 3 günden 1–2 haftaya kadar verilir."],basit:["Bir siklon kabaca bir ülke büyüklüğündedir; tek bir sağanak bulutu onun içinde bir nokta gibi kalır.","Bu ders büyük resmi okur: tek bir sağanağı değil, onu getiren dev hava çarkını."],ben:["Ben haritada önce birkaç bin km'lik şekillere bakarım, tek istasyona sonra inerim.","Kendime hatırlatırım: tropik fırtınalar kapsam dışı, odakta orta enlem siklonu var."]},kaynak:"Air Masses and Fronts_2025_Spring; Isobar; derste geçenler"},{id:"utc",baslik:"UTC ve sinoptik saatler",ozet:"Ana sinoptik 00-06-12-18, ara sinoptik 03-09-15-21 UTC; Türkiye = UTC+3.",anlam:"kimlik",ses:{teknik:["Tüm istasyonlar aynı anda gözlem yapar: ana sinoptik 00, 06, 12, 18 UTC; ara sinoptik 03, 09, 15, 21 UTC.","Harita saati her zaman UTC'dir; GMT değil, çünkü UTC atom saatine dayanır ve yaz saatiyle kaymaz.","SYNOP'taki YYGG: ayın günü + gözlem saati (UTC)."],basit:["Dünyadaki bütün gözlemciler aynı anda saatine bakıyor gibi düşün; ortak saat UTC.","İstanbul'da akşam 18:00 ise harita saati 15 UTC'dir; üç saat geri al."],ben:["Ben haritanın köşesindeki saati görünce önce +3 ekleyip yerel saate çeviririm.","12 UTC görürsem ana sinoptik, 15 UTC görürsem ara sinoptik derim."]},tuzak:"Harita saatini yerel saat sanma: «12 UTC» İstanbul'da 15:00 demektir.",sorular:[{s:"21 UTC'de çizilen bir yer haritası ana mı ara mı sinoptik? Türkiye saatiyle kaç?",c:["Ara sinoptik (ana olanlar 00-06-12-18).","Türkiye UTC+3 → yerel 24:00 (gece yarısı)."]}],kaynak:"sinoptik kod kağıdı final; derste geçenler"},{id:"ilk-bakis",baslik:"Haritaya ilk bakış: künye",ozet:"Önce tarih-saat, seviye, analiz mi tahmin mi; çizgilere ancak sonra bakılır.",anlam:"kimlik",ses:{teknik:["İlk kontrol: tarih, saat (UTC), seviye (yer / 850 / 500…) ve ürün tipi: analiz (analysis) mi, tahmin (forecast) mi.","Tarihsiz ya da geçerlilik zamanı belirsiz harita analiz edilmez; brifingin ilk cümlesi de künyedir."],basit:["Bir fotoğrafa bakmadan önce ne zaman çekildiğini sorarsın; harita da öyle.","Dünün haritasıyla bugünü anlatırsan, doğru okusan bile yanlış öngörü yaparsın."],ben:["Ben her haritada önce köşedeki başlığı okurum: hangi gün, hangi saat, hangi seviye.","Brifingde ilk cümlem hep şudur: «Bu, X tarihli 12 UTC yer analizi.»"]},tuzak:"«Valid» tahminin geçerli olduğu zamandır, haritanın üretildiği zaman değil.",sorular:[{s:"Bir haritada tarih yok ama izobarlar çok net. Kullanır mısın?",c:["Hayır.","Hangi ana ait olduğunu bilmeden ne gözlemle kıyaslarsın ne öngörü yaparsın; tarihli sürümünü bul."]}],kaynak:"brifing örneği; derste geçenler"}]},{id:"gozlem-kod",no:"2",baslik:"Gözlem ve kod: SYNOP",ozet:"SYNOP, bir istasyonun gözlemini 5 haneli gruplara sıkıştırır. Çözmenin anahtarı grubun ilk rakamıdır.",neden:"Kod çözme sınavın en garanti sorularındandır; kod tablosu genelde verilir, ama hangi grubun nerede olduğunu ve tuzakları bilmek sana kalır.",widget:"kodcoz",oz:"Önce bölümü bul, sonra grubun ilk rakamını oku: 1 sıcaklık, 2 çiy, 3 aktüel, 4 deniz seviyesi, 5 eğilim.",kavramlar:[{id:"synop-nedir",baslik:"SYNOP nedir?",ozet:"Kara istasyonu AAXX, gemi BBXX; tüm gözlem 5 karakterlik gruplar hâlinde.",anlam:"kimlik",ses:{teknik:["SYNOP: yüzey sinoptik gözlem mesajı. Kara istasyonu AAXX, gemi ve deniz istasyonu BBXX başlığıyla başlar.","Her grup 5 karakterdir; ölçülemeyen hane «/» ile yazılır. Gruplar sabit sırayla dizilir.","İstasyon kimliği IIiii: II ülke blok numarası (Türkiye 17), iii istasyon numarası."],basit:["SYNOP, hava gözleminin kısa mesajı gibidir: az yer kaplar, dünyadaki her merkez aynı şekilde okur.","Beşli rakam paketleri var; her paketin içinde bir iki ölçüm saklı."],ben:["Ben kodu görünce önce AAXX mi BBXX mi diye bakar, sonra 17 ile başlayan istasyonu ararım.","Eğik çizgi (/) görürsem «ölçülmemiş» derim, sıfır sanmam."]},kaynak:"sinoptik kod kağıdı final; 2015 Nisan Sinoptik Rasat Ders Notları"},{id:"bolumler",baslik:"Bölümler: 0, 1, 3 (ve 5)",ozet:"Bölüm 0 kimlik, Bölüm 1 temel ölçümler; 333 ile Bölüm 3, 555 ile ulusal bölüm başlar.",anlam:"kimlik",ses:{teknik:["Bölüm 0: MiMiMjMj (AAXX), YYGGiw (gün, saat, rüzgar birimi), IIiii (istasyon).","Bölüm 1: iRixhVV ve Nddff, ardından 1–8 göstergeli gruplar. Bölüm 3 «333» ile başlar: max/min sıcaklık, bulut katmanları.","Bölüm 5 «555» ile başlar ve ulusal amaçlıdır; haritaya temelde Bölüm 1 değerleri işlenir."],basit:["Mektup gibi düşün: zarfın üstü (Bölüm 0), asıl mektup (Bölüm 1), dipnotlar (333 ve 555).","333 ve 555 birer ayraçtır; görünce yeni bölüme geçtiğini anla."],ben:["Ben kodu bölümlere ayırırken 333 ve 555'in önüne dikey bir çizgi çekerim.","Bölüm 3'teki 1 ve 2 gruplarını Bölüm 1'dekilerle karıştırmam: orada max ve min sıcaklık var."]},tablo:{baslik:["Bölüm","Başlangıç","İçerik"],satirlar:[["0","AAXX / BBXX","tip · YYGGiw · IIiii"],["1","iRixhVV Nddff","bulut, görüş, rüzgar, T, Td, basınç, eğilim, yağış, hava"],["3","333","1 max T · 2 min T · 8NsChshs bulut katmanı · 9.. grupları (ör. hamle)"],["5","555","ulusal gruplar"]]},tuzak:"Bölüm 3'te 1snTxTxTx max, 2snTnTnTn min sıcaklıktır; Bölüm 1'deki T ve Td ile karıştırma.",kaynak:"sinoptik kod kağıdı final; brifing örneği"},{id:"gosterge",baslik:"Grup göstergesi: ilk rakam = anlam",ozet:"Bölüm 1'de ilk iki gruptan sonra her grubun ilk rakamı, grubun ne olduğunu söyler.",ses:{teknik:["iRixhVV ve Nddff sabit yerdedir; ardından gelen grupların ilk hanesi göstergedir (group indicator): 1…8.","Bir grup eksikse atlanır ama diğerlerinin anlamı değişmez; bu yüzden konuma değil göstergeye bakılır."],basit:["Her paketin önünde bir etiket rakamı var; etiketi okuyunca içinde ne olduğunu bilirsin.","Sırada bir paket yoksa telaş yok: bir sonraki etikete geçersin."],ben:["Ben her grubun ilk rakamını yuvarlak içine alırım: 1 sıcaklık, 2 çiy, 3 aktüel, 4 deniz seviyesi, 5 eğilim…","Sonra kalan dört haneyi gerekiyorsa tabloya bakarak çözerim."]},tablo:{baslik:["Gösterge","Grup","Ne söyler"],satirlar:[["—","iRixhVV","yağış bölümü, istasyon tipi, en alçak bulut (h), görüş (VV)"],["—","Nddff","toplam bulut, rüzgar yönü ve hızı"],["1","1snTTT","sıcaklık"],["2","2snTdTdTd","çiy noktası sıcaklığı"],["3","3P0P0P0P0","istasyon (aktüel) basıncı"],["4","4PPPP","deniz seviyesine indirgenmiş basınç"],["5","5appp","3 saatlik basınç eğilimi"],["6","6RRRtR","yağış miktarı ve süresi"],["7","7wwW1W2","şimdiki ve geçmiş hava"],["8","8NhCLCMCH","alçak bulut miktarı, bulut cinsleri"]]},sorular:[{s:"Bölüm 1'de «10192 20130» var. Sıcaklık ve çiy noktası kaç?",c:["10192: 1 = sıcaklık, sn = 0 (pozitif), 192 → +19,2 °C.","20130: 2 = çiy noktası, sn = 0, 130 → +13,0 °C."]}],kaynak:"sinoptik kod kağıdı final; brifing örneği; derste geçenler"},{id:"strateji",baslik:"Kodu çözme stratejisi",ozet:"Böl, etiketle, tabloya bak, modele yerleştir: kod dört adımda biter.",ses:{teknik:["1) 333/555 ile bölümlere ayır. 2) YYGGiw'den gün, saat ve iw'yi al. 3) Göstergeye göre grupları etiketle.","4) Tablo isteyen haneleri (h, VV, ww, a, C) tablodan oku. 5) Değeri istasyon modelinde doğru konuma koy.","Derste, kod tablolarının sınavda verildiği ve ezberden çok kullanımın ölçüldüğü vurgulanıyor."],basit:["Şifreyi çözmek bir bulmaca: önce parçaları ayır, sonra her parçayı sözlüğe bakarak çevir.","Sözlük (tablo) elinde; asıl beceri hangi kelimeye bakacağını bilmek."],ben:["Ben önce iw'ye bakarım, çünkü rüzgarın knot mu m/s mi olduğunu o söyler.","Sonra her grubun yanına kısa not düşerim: T 19,2 · Td 13,0 · P 1018,4."]},sorular:[{s:"«AAXX 14124 17022 12670 73603» parçasında gün, saat, rüzgar ve rüzgar birimi ne?",c:["14124: ayın 14'ü, 12 UTC, iw = 4 → anemometre, knot.","12670: h = 6 (1000–1500 m), VV = 70 → 20 km.","73603: N = 7/8; dd = 36 → kuzey (355–004°); ff = 03 → 3 kt."],ipucu:"Bölüm 0'ın ikinci grubu YYGGiw'dir."}],kaynak:"brifing örneği; sinoptik kod kağıdı final; derste geçenler"},{id:"tuzaklar",baslik:"Sık tuzaklar",ozet:"3 mü 4 mü, işaret hanesi, VV aralıkları, iw birimi, dd onluk derece.",ses:{teknik:["En sık beş hata: 3 ile 4 basıncını karıştırmak, sn'yi atlamak, VV'yi düz okumak, iw'yi unutmak, dd'yi onla çarpmamak.","Her biri bir alt kartta; tıkla, örnekle gör."],basit:["Kodda hata genelde hesapta değil, okumada olur: bir haneyi yanlış yere koymak.","Beş tuzağı bilen, kod sorusunu güvenle bitirir."],ben:["Ben kod sorusunu bitirince bu beş maddeyi tek tek kontrol ederim.","3 ile 4'ü karıştırmamak için 4'ün yanına «deniz seviyesi» yazarım."]},alt:[{id:"tuzak-3-4",baslik:"3P0P0P0P0 mı, 4PPPP mi?",ozet:"3 = istasyon (aktüel) basıncı, 4 = deniz seviyesine indirgenmiş basınç. Haritaya 4 girer.",anlam:"basinc",ses:{teknik:["3 grubu istasyon seviyesinde ölçülen basınçtır; 4 grubu deniz seviyesine indirgenmiş basınçtır (MSLP).","İkisinde de binler hanesi atılır: 30022 → 1002,2 hPa; 40184 → 1018,4 hPa; 49987 → 998,7 hPa."],basit:["3, istasyonun bulunduğu yükseklikteki basınç; 4, herkes deniz kıyısındaymış gibi hesaplanan basınç.","İzobar çizeceksen 4'ü kullanırsın; yoksa dağlar alçak basınç gibi görünür."],ben:["Ben 4 grubunu görünce hemen yanına «harita» yazarım.","İstasyon yüksekse 3 ile 4 arasındaki fark büyür; yüksek istasyonda 3 belirgin küçüktür."]},tuzak:"PPPP'nin başı 0 ise 1000'li (0184 → 1018,4), 9 ise 900'lü (9987 → 998,7) okunur.",kaynak:"sinoptik kod kağıdı final; 2015 Nisan Sinoptik Rasat Ders Notları; brifing örneği"},{id:"tuzak-isaret",baslik:"İşaret hanesi sn",ozet:"1snTTT ve 2snTdTdTd'de sn = 0 ise sıfır/pozitif, 1 ise negatif.",anlam:"sicaklik",ses:{teknik:["sn = 0: sıcaklık ≥ 0 °C; sn = 1: sıcaklık < 0 °C. TTT onda bir derece cinsindendir.","11025 → −2,5 °C; 10137 → +13,7 °C; 21043 → çiy noktası −4,3 °C."],basit:["İkinci rakam bir artı-eksi düğmesidir: 0 artı, 1 eksi.","Kışın bu düğmeyi kaçırırsan donlu sabahı bahar sabahı sanırsın."],ben:["Ben önce ikinci haneye bakıp sayının önüne + ya da − yazarım, sonra virgülü koyarım.","Çiy noktası sıcaklıktan büyük çıkarsa bir şeyi yanlış okumuşumdur."]},tuzak:"TTT'nin son hanesi ondalıktır: 192 → 19,2 °C.",kaynak:"sinoptik kod kağıdı final; 2015 Nisan Sinoptik Rasat Ders Notları"},{id:"tuzak-vv",baslik:"VV görüş aralıkları",ozet:"00–50 yüz metre adımlı, 51–55 kullanılmaz, 56–80 eksi 50 km, 81–88 beşer km.",anlam:"gorus",ses:{teknik:["VV 00–50: kod/10 km (25 → 2,5 km). 51–55 kullanılmaz. 56–80: kod − 50 km (70 → 20 km).","81–88: 30 + 5 × (kod − 80) km → 81 = 35 km, 88 = 70 km; 89 = 70 km'den fazla. 90–99 denizde kullanılır."],basit:["VV tek bir cetvel değil, üç cetvelin birleşimi: yakında ince, uzakta kaba ölçek.","56'yı 5,6 km sanmak en tipik hata; 56 aslında 6 km."],ben:["Ben VV'yi okurken önce 50'den küçük mü büyük mü diye bakarım.","50'den büyükse 50 çıkarırım; 80'i geçtiyse beşer km saymaya başlarım."]},formul:[{satir:"VV ≤ 50 → VV/10 km · 56–80 → VV − 50 km · 81–88 → 30 + 5·(VV − 80) km",terimler:[["VV","yatay görüş kodu (kod tablosu 4377)","—"]],not:"Görüş yönlere göre farklıysa en küçük değer kodlanır."}],kaynak:"2015 Nisan Sinoptik Rasat Ders Notları; sinoptik kod kağıdı final"},{id:"tuzak-iw",baslik:"ff birimi: iw",ozet:"iw 0–1 ise m/s, 3–4 ise knot; ff 99'u aşarsa 00fff grubu eklenir.",anlam:"ruzgar",ses:{teknik:["YYGGiw'deki iw: 0 tahmini m/s, 1 anemometre m/s, 3 tahmini knot, 4 anemometre knot.","Hız 99 birimi aşarsa Nddff'de ff = 99 yazılır, hemen ardından gelen 00fff grubu gerçek hızı verir."],basit:["Rüzgar hızının birimi kodun içinde değil, en baştaki küçük bir hanede saklı.","10 m/s yaklaşık 19 knot'tır; birimi kaçırmak hızı yarı yarıya yanlış okutur."],ben:["Ben Nddff'yi çözmeden önce Bölüm 0'a dönüp iw'yi kontrol ederim.","Derste çözülen Türkiye örneğinde iw = 4'tü: anemometre ve knot."]},kaynak:"sinoptik kod kağıdı final; brifing örneği"},{id:"tuzak-dd",baslik:"dd onluk derece",ozet:"dd iki hanedir, onlar cinsinden derece: 36 = kuzey, 09 = doğu, 00 sakin, 99 değişken.",anlam:"ruzgar",ses:{teknik:["dd, rüzgarın geldiği yönü 10° adımla verir: 27 → 265–274° (batı), 36 → 355–004° (kuzey).","00 sakin (calm), 99 değişken yön demektir; ff ile birlikte okunur."],basit:["dd'nin sonuna bir sıfır eklersen pusula derecesini bulursun: 24 → 240°, güneybatı.","Rüzgar yönü her zaman nereden geldiğidir, nereye gittiği değil."],ben:["Ben dd'yi okuyunca sonuna 0 koyup oku pusulaya çizerim.","«36» görünce 360° yani kuzey derim; 36° kuzeydoğu demem."]},kaynak:"sinoptik kod kağıdı final"}],kaynak:"sinoptik kod kağıdı final; 2015 Nisan Sinoptik Rasat Ders Notları"}]},{id:"istasyon-modeli",no:"3",baslik:"İstasyon modeli (station plot)",ozet:"İstasyon modeli kodun haritadaki resmidir: her değerin dairenin çevresinde sabit bir yeri vardır.",neden:"Sınavda bir istasyon modeli verilip değerler sorulabilir ya da koddan model çizdirilebilir; konum bilgisi ve 3 hane kuralı doğrudan puan getirir.",widget:"kurucu",oz:"Sol sütun sıcaklık-görüş-çiy, sağ sütun basınç-eğilim, merkez bulut, çubuk rüzgar; 042 = 1004,2 hPa.",kavramlar:[{id:"yerlesim",baslik:"Konumlar (Met Office düzeni)",ozet:"Her öğenin dairenin çevresinde sabit bir yeri var; yalnız rüzgar çubuğu yön değiştirir.",ses:{teknik:["Merkez daire N (toplam bulut). Sol üst TT, sol orta ww, en sol VV, sol alt TdTd. Sağ üst PPP, sağ orta ppp a, sağ alt W1W2.","Üst ortada CH ve altında CM (bulut cinsi); dairenin altında CL ile N/h (alçak bulut). En sağ üstte G (hamle).","Rüzgar çubuğu (dd ff) daireden rüzgarın geldiği yöne uzanır; Met Office'te eğilim düşüyorsa kırmızı, yükseliyorsa siyah."],basit:["Daireyi bir saat kadranı gibi düşün: solda sıcaklık ailesi, sağda basınç ailesi, tepede bulutlar.","Böylece haritada yüzlerce istasyon olsa bile her sayının ne olduğunu yerinden anlarsın."],ben:["Ben «sol = sıcaklık, sağ = basınç» diye aklımda tutarım; solda üstte T, altta Td.","Ortadaki daire bana bulutu, ondan çıkan çubuk rüzgarı söyler."]},tablo:{baslik:["Konum","Öğe","Kod"],satirlar:[["merkez","toplam bulut (okta)","N"],["sol üst","sıcaklık (°C)","TT"],["en sol","görüş","VV"],["sol orta","şimdiki hava","ww"],["sol alt","çiy noktası (°C)","TdTd"],["üst orta","yüksek / orta bulut cinsi","CH / CM"],["alt orta","alçak bulut cinsi, miktar/yükseklik","CL · N/h"],["sağ üst","basınç (3 hane)","PPP"],["en sağ üst","maksimum hamle (kt)","G ff"],["sağ orta","3 saatlik eğilim + şekil","ppp a"],["sağ alt","geçmiş hava","W1W2"],["çubuk","rüzgar yönü ve hızı","dd ff"]]},sekil:[{src:"img/ders1/istasyon-modeli-konumlar.png",alt:"İstasyon dairesi çevresinde öğelerin sabit konumları",cap:"Sabit yerler: solda sıcaklık-görüş-çiy, sağda basınç-eğilim, üstte bulut cinsleri, çubuk rüzgar.",kaynak:ze}],kaynak:"factsheet_11-interpreting-weather-charts; brifing örneği"},{id:"ruzgar-oku",baslik:"Rüzgar oku ve bayraklar",ozet:"Çubuk rüzgarın geldiği yönü gösterir; kısa tüy 5, uzun tüy 10, bayrak 50 kt.",anlam:"ruzgar",ses:{teknik:["Çubuk istasyondan rüzgarın geldiği yöne uzanır (dd); tüyler uçta toplanır: kısa 5 kt, uzun 10 kt, üçgen bayrak 50 kt.","Sakin rüzgar (calm) istasyon çevresine çizilen ikinci daireyle gösterilir; kısa tüy pratikte 3–7 kt aralığıdır.","Bileşenler: u = −ff·sin(dd), v = −ff·cos(dd); güneybatılı rüzgarda u ve v ikisi de pozitiftir."],basit:["Çubuk bir rüzgar gülü değil, bir işaret direği: rüzgarın estiği yöne değil, geldiği yöne bakar.","Tüyleri para gibi say: bayrak 50, uzun tüy 10, kısa tüy 5."],ben:["Ben önce çubuğun uzandığı yöne bakıp «buradan geliyor» derim, sonra tüyleri toplarım.","1 bayrak + 2 uzun + 1 kısa = 75 kt; parmakla sayarak yaparım."]},formul:[{satir:"ff = 50·B + 10·U + 5·K",terimler:[["ff","rüzgar hızı","kt"],["B","üçgen bayrak sayısı","adet"],["U","uzun tüy sayısı","adet"],["K","kısa tüy sayısı","adet"]]},{satir:"u = −ff · sin(dd) · v = −ff · cos(dd)",terimler:[["u","doğuya doğru bileşen","kt"],["v","kuzeye doğru bileşen","kt"],["dd","rüzgarın geldiği yön","°"],["ff","rüzgar hızı","kt"]],not:"Eksi işareti dd'nin «geldiği yön» olmasından gelir: 240° rüzgar kuzeydoğuya doğru eser."}],tuzak:"Çubuğu gittiği yön sanma: kuzeye uzanan çubuk kuzeyli (kuzeyden esen) rüzgardır.",sorular:[{s:"Çubuk güneybatıya uzanıyor, üzerinde 3 uzun tüy var. Rüzgar?",c:["Yön: güneybatıdan.","Hız: 3 × 10 = 30 kt.","Ders dosyasındaki örnek model bu şekilde 250°, 30 kt olarak çözülür."]}],kaynak:"factsheet_11-interpreting-weather-charts; brifing örneği; derste geçenler"},{id:"bulut-dairesi",baslik:"Bulut dairesi (N, okta)",ozet:"Gökyüzü 8'e bölünür, daire o oranda doldurulur. 8 = kapalı, ⊗ = gökyüzü görülemiyor.",anlam:"bulut",ses:{teknik:["N okta (1/8) cinsinden: 0 boş daire, 8 tam dolu. 9 = gökyüzü sis vb. nedeniyle görülemiyor (⊗), «/» = gözlenmedi.","METAR karşılığı: FEW 1–2, SCT 3–4, BKN 5–7, OVC 8 okta.","Dairenin altındaki N/h, alçak bulutun miktarını ve yükseklik kodunu verir (ör. 6/4)."],basit:["Gökyüzünü sekiz dilimli bir pasta gibi düşün: kaç dilimi bulut kaplıyorsa daireden o kadarı boyanır.","Tam dolu daire «gök kapalı», içi çarpılı daire «göğü göremiyorum» demektir."],ben:["Ben daireye bakıp dolu kısmı sekizde bir olarak sayarım; yarısı doluysa 4 okta derim.","İçi çarpılı daireyi görünce aklıma önce sis gelir."]},tablo:{baslik:["Okta","Daire","METAR"],satirlar:[["0","boş","SKC / CLR"],["1–2","çeyreğe kadar dolu","FEW"],["3–4","yarıya kadar dolu","SCT"],["5–7","çoğu dolu","BKN"],["8","tam dolu","OVC"],["9","içi çarpılı (⊗)","gökyüzü görülemiyor"]]},kaynak:"factsheet_11-interpreting-weather-charts; sinoptik kod kağıdı final; brifing örneği"},{id:"basinc-3-hane",baslik:"Basınç: 3 hane kuralı",ozet:"PPP'nin başı ≥5 ise 9, <5 ise 10 eklenir; son hane ondalık: 042 → 1004,2 hPa.",anlam:"basinc",ses:{teknik:["Haritaya deniz seviyesine indirgenmiş basıncın son üç hanesi yazılır (onlar, birler, ondalık); baştaki 9 ya da 10 atılır.","Deniz seviyesi basıncı pratikte 950–1050 hPa arasında olduğu için ilk hane belirsizlik yaratmaz.","042 → 1004,2 · 189 → 1018,9 · 987 → 998,7 · 504 → 950,4 hPa."],basit:["Baştaki «10» ya da «9» yer kaplamasın diye kesilmiş; sen geri yapıştırırsın.","0–4 ile başlayan sayı 1000'in üstü, 5–9 ile başlayan sayı 1000'in altı demek."],ben:["Ben ilk haneye bakarım: 0–4 ise başına 10, 5–9 ise başına 9 koyar, son haneden önce virgül atarım.","Sonuç 950–1050 arasında mı diye kontrol ederim; değilse yanlış yapmışımdır."]},formul:[{satir:"P = 1000 + PPP/10 (PPP < 500) · P = 900 + PPP/10 (PPP ≥ 500)",terimler:[["PPP","istasyon modelindeki üç hane","—"],["P","deniz seviyesine indirgenmiş basınç","hPa"]]}],tuzak:"042'yi 1042 ya da 942 okuma; son hane ondalıktır: 1004,2 hPa.",sorular:[{s:"Modelde basınç «976» yazıyor. Kaç hPa?",c:["İlk hane 9 ≥ 5 → başına 9.","9976 → son hane ondalık → 997,6 hPa."]}],kaynak:"factsheet_11-interpreting-weather-charts; sinoptik kod kağıdı final; brifing örneği"},{id:"egilim",baslik:"Basınç eğilimi (ppp a)",ozet:"Son 3 saatteki değişim (onda bir hPa) + değişimin şekli; düşüş çoğu zaman bir sistem yaklaşıyor demek.",anlam:"basinc",ses:{teknik:["ppp: son 3 saatteki basınç değişimi, onda bir hPa (05 → 0,5 hPa). a: eğilim karakteri, kod 0–8.","a = 0–3: 3 saat öncesinden yüksek (yükselen); 4: aynı; 5–8: düşük (düşen). Sembol, eğrinin şeklini çizer.","SYNOP'ta 5appp grubu: 58003 → a = 8 (düşüş), 0,3 hPa."],basit:["Barometrenin son üç saatlik hikâyesi: yükseldi mi, düştü mü, ne kadar?","Sürekli düşen basınç, kapıya bir alçak ya da trof dayanıyor olabilir demektir."],ben:["Ben sağ ortadaki sayıyı görünce önce rengine ya da sembolüne bakarım: düşüyor mu, yükseliyor mu?","05 gördüğümde 5 hPa değil, 0,5 hPa derim."]},tuzak:"ppp ondalıklıdır: «05» 0,5 hPa, «15» 1,5 hPa'dır.",kaynak:"sinoptik kod kağıdı final; factsheet_11-interpreting-weather-charts; brifing örneği"},{id:"ornek-okuma",baslik:"Örnek model okuma",ozet:"Ders dosyasındaki örnek: 23/18 °C, 6 km görüş, sürekli orta yağmur, 1004,2 hPa, 0,5 hPa düşüş.",ses:{teknik:["TT 23, TdTd 18 °C; VV 56 → 6 km; ww üç nokta → sürekli orta yağmur; W1W2 iki nokta → geçmiş hava yağmur.","PPP 042 → 1004,2 hPa; 05 ve düşen sembol → 3 saatte 0,5 hPa düşüş; G45 → 45 kt hamle; tam dolu daire → 8 okta.","Çubuk güneybatıya, 3 uzun tüy → ~250°'den 30 kt; altta 6/4 → 6 okta alçak bulut, yükseklik kodu 4 (1000–1999 ft)."],basit:["Bu istasyonda nemli, ılık bir hava ve kesintisiz yağmur var; basınç yavaşça düşüyor.","Yani bir sistemin içindeyiz ve hava hemen düzelecek gibi görünmüyor."],ben:["Ben modeli soldan sağa okurum: önce sıcaklıklar, sonra hava olayı, sonra basınç ve eğilim, en son rüzgar.","T ile Td'nin yakınlığı (5 °C) bana havanın nemli olduğunu söyler."]},tablo:{baslik:["Görünen","Öğe","Anlamı"],satirlar:[["23","TT","23 °C"],["18","TdTd","18 °C"],["56","VV","6 km"],["∴ (üç nokta)","ww","sürekli orta yağmur"],["•• (iki nokta)","W1W2","geçmiş hava: yağmur"],["042","PPP","1004,2 hPa"],["05 + düşen sembol","ppp a","3 saatte 0,5 hPa düşüş"],["G45","hamle","45 kt"],["3 uzun tüy","dd ff","güneybatıdan 30 kt"],["— ve 6/4","CL · N/h","stratus, 6 okta, kod 4 (1000–1999 ft)"],["üstteki iki sembol","CM / CH","altostratus / cirrus"]]},sekil:[{src:"img/ders1/istasyon-modeli-ornek.png",alt:"Örnek istasyon modeli: 23, 18, 56, 042, 05, G45, 6/4 ve güneybatıdan 30 kt rüzgar",cap:"Sıcak-nemli, yağmurlu bir istasyon: basınç 1004,2 hPa ve düşüyor, güneybatıdan 30 kt, hamle 45 kt.",kaynak:ze}],sorular:[{s:"Bu örnekte T − Td farkı kaç ve ne anlatır?",c:["23 − 18 = 5 °C.","Fark küçük → hava nemli; yağmurla uyumlu."]}],kaynak:"brifing örneği; factsheet_11-interpreting-weather-charts"}]},{id:"yuzey-haritasi",no:"4",baslik:"Yüzey haritası: izobar, merkez, rüzgar",ozet:"Yer kartında deniz seviyesine indirgenmiş basınç 4 hPa aralıkla çizilir; desen rüzgarı ve sistemleri ele verir.",neden:"Harita yorumu sorularının çoğu buradan çıkabilir: merkezleri bul, rüzgarı yön-hızıyla oku, izobar sıklığını yorumla.",widget:"harita",oz:"Sık izobar = kuvvetli rüzgar; KYK'de alçak çevresinde saat tersine dönüş; yerde rüzgar alçağa doğru içe keser.",kavramlar:[{id:"izobar",baslik:"İzobar (isobar)",ozet:"Eş basınç eğrisi; 1000 hPa referanslı 4'er hPa: 996, 1000, 1004…",anlam:"basinc",ses:{teknik:["İzobar: deniz seviyesine indirgenmiş eş basınç noktalarını birleştiren eğri; 1000 hPa referansla 4 hPa aralık.","İzobarlar kesişmez, çatallanmaz; ya kapanır ya harita kenarında biter. 1008 ile 1016 arasında mutlaka 1012 vardır.","Yüksek basınç izobarları sırtlarla, alçak basınç izobarları troflarla ilişkilidir."],basit:["İzobar, eş yükselti eğrisine benzer; ama yükseklik yerine hava basıncını birleştirir.","Dağların etkisini silmek için her istasyon deniz kıyısındaymış gibi hesaplanır."],ben:["Ben izobar çizerken önce en yüksek ve en alçak değerleri bulur, sonra 4'er 4'er doldururum.","Çizdiğim eğri rüzgar oklarıyla çelişiyorsa eğrimi düzeltirim."]},tuzak:"Ham istasyon basıncını çizersen harita hava sistemlerini değil dağları gösterir; hep indirgenmiş basınç (4PPPP) kullanılır.",kaynak:"Isobar; factsheet_11-interpreting-weather-charts; derste geçenler"},{id:"merkezler",baslik:"Alçak ve yüksek: A / Y",ozet:"A = alçak (L), Y = yüksek (H); kapalı izobarla çevrili merkez. Alman kartlarında T = alçak!",anlam:"basinc",ses:{teknik:["Türk kartlarında alçak A, yüksek Y; İngilizce L (low), H (high). Kapalı izobarla çevrili en uç değer merkezdir.","Yer kartında «alçak/yüksek basınç merkezi», üst seviye kartında «alçak/yüksek merkez» denir.","Met Office kartları merkez değerini yanına yazar; derinleşme 961 → 957 gibi değer farkıyla izlenir."],basit:["Alçak, hava sütununun hafif olduğu çukur; yüksek, ağır sütunun bastırdığı tepe.","Merkez değeri düşüyorsa sistem güçleniyor (derinleşiyor), yükseliyorsa zayıflıyor (doluyor)."],ben:["Ben haritada önce harfleri ararım: A gördüğüm yerde kötü hava, Y'de sakinlik beklerim.","wetter3 kartında T görünce «Tief» der, alçak olduğunu hatırlarım."]},tuzak:"Alman kartlarında (wetter3.de) T = Tief = alçak, H = Hoch = yüksek. T'yi «tepe» sanma.",sorular:[{s:"Bir alçağın merkezi 6 saatte 961'den 957 hPa'ya iniyor. Ne dersin?",c:["Merkez basıncı düşüyor → alçak derinleşiyor.","İzobarlar da sıklaşıyorsa rüzgar sertleşiyor; brifing dili: «derinleşen alçak»."]}],kaynak:"Isobar; factsheet_11-interpreting-weather-charts; derste geçenler"},{id:"gradyan",baslik:"Basınç gradyanı ↔ rüzgar hızı",ozet:"İzobarlar sıklaştıkça basınç gradyanı, dolayısıyla rüzgar büyür.",anlam:"ruzgar",ses:{teknik:["Basınç gradyan kuvveti izobarlara dik, yüksekten alçağa yönelir; sürtünmesiz seviyede Coriolis ile dengelenir.","Bu dengedeki geostrofik rüzgar izobarlara paraleldir; hızı izobar aralığıyla ters orantılıdır.","Kart köşesindeki geostrofik rüzgar skalası, 4 hPa'lık izobar aralığını knot'a çevirir."],basit:["Sık izobar dik bir yokuş gibidir: hava hızla akar. Seyrek izobar düz bir ova: rüzgar zayıf.","Brifingde «izobarlar sık» demek «rüzgar kuvvetli» demektir."],ben:["Ben iki izobar arasını parmakla ölçerim: dar ise kuvvetli, geniş ise hafif rüzgar derim.","Fırtına aradığımda izobarların üst üste bindiği yeri ararım."]},formul:[{satir:"Vg = (1 / ρf) · Δp / Δn",terimler:[["Vg","geostrofik rüzgar hızı","m/s"],["ρ","hava yoğunluğu","kg/m³"],["f","Coriolis parametresi = 2Ω·sinφ","1/s"],["Δp","komşu iki izobar arasındaki fark (4 hPa = 400 Pa)","Pa"],["Δn","izobarlar arasındaki dik uzaklık","m"]],not:"Δn küçüldükçe (sık izobar) Vg büyür. Aynı aralıkta enlem azaldıkça f küçülür, rüzgar daha güçlü çıkar."}],kaynak:"factsheet_11-interpreting-weather-charts; Isobar; derste geçenler"},{id:"buys-ballot",baslik:"Buys-Ballot kuralı ve dönüş yönü",ozet:"KYK'de sırtını rüzgara ver: alçak solunda, yüksek sağında.",anlam:"ruzgar",ses:{teknik:["Buys-Ballot: kuzey yarımkürede rüzgarı arkana alırsan alçak basınç solunda, yüksek basınç sağında kalır.","Sonuç: KYK'de alçak çevresinde saat yönünün tersine (siklonik), yüksek çevresinde saat yönünde (antisiklonik) dolaşım.","Güney yarımkürede ikisi de terstir."],basit:["Rüzgar sırtından iterken sol kolunu aç: alçak o tarafta.","Alçağın çevresinde rüzgar saat ibresinin tersine bir halka çizer, yüksekte saat yönünde."],ben:["Ben bir istasyonun rüzgarına bakıp alçağı soluna yerleştiririm; merkezi böyle kestiririm.","Alçağın kuzeyinde doğulu, güneyinde batılı rüzgar beklerim."]},sorular:[{s:"İstanbul'da rüzgar kuzeydoğudan esiyor. Alçak basınç nerede olabilir?",c:["Rüzgarı arkana al: yüzün güneybatıya döner.","Alçak solunda → güneydoğu tarafında (yerde sürtünme nedeniyle biraz daha güneye kayık)."]}],kaynak:"factsheet_11-interpreting-weather-charts; Isobar; derste geçenler"},{id:"surtunme",baslik:"Sürtünme: rüzgar izobarı keser",ozet:"Yerde rüzgar izobarlara paralel değildir: alçakta içe, yüksekte dışa doğru keser.",anlam:"dinamik",ses:{teknik:["Sürtünme rüzgarı yavaşlatır, Coriolis zayıflar, gradyan kuvveti baskın çıkar: rüzgar izobarları alçağa doğru keser.","Alçakta içe kesme → konverjans → yükselme → bulut-yağış; yüksekte dışa kesme → diverjans → çökme → açık hava.","Sürtünme tabakasının üstünde (yaklaşık 1,5–2 km) rüzgar izobara/kontura paralel kabul edilir."],basit:["Yere yakın hava pürüzlü zeminde sürtünüp yavaşlar ve alçağın içine doğru kıvrılır.","Alçağın içine dolan hava gidecek yer bulamaz, yukarı tırmanır ve bulut olur."],ben:["Ben yer kartında rüzgar oklarının izobarı hafifçe alçağa doğru kestiğini görmeyi beklerim.","Üst seviye kartında ise okların konturlara paralel akmasını beklerim."]},tuzak:"«Yerde rüzgar izobara paraleldir» yanlıştır; paralellik ancak sürtünmesiz üst seviyelerde geçerlidir.",kaynak:"derste geçenler; factsheet_11-interpreting-weather-charts; Isobar"},{id:"yuzey-trof-sirt",baslik:"Yüzey trofu ve sırtı",ozet:"Trof: izobarların alçağa doğru içbükey olduğu oluk; sırt: yüksekten uzanan dil.",anlam:"dinamik",ses:{teknik:["Trof: alçağa doğru içbükey, ekseni boyunca eğriliği en büyük izobarlar (trough line). Sırt (wedge): yüksekten uzanan çıkıntı.","Her cephe bir trofta yer alır ama her trof cephe değildir; cephesiz troflar da genelde bulutlu ve sağanaklıdır.","Türk analizlerinde trof ekseni kesikli çizgiyle; Met Office kartlarında trof düz kalın çizgiyle gösterilir."],basit:["Trof alçağın uzattığı bir parmak, sırt yüksekten uzanan bir dil.","Trof geldiğinde bulut ve sağanak, sırt geldiğinde düzelme beklenir."],ben:["Ben izobarların V gibi kıvrıldığı yeri bulur, kıvrımların en keskin noktalarından kesikli bir çizgi geçiririm.","İngiliz kartında düz kalın bir çizgi görürsem üstünde sembol var mı bakarım; yoksa trof derim."]},tuzak:"Met Office trofu düz çizgiyle çizer; üstünde üçgen ya da yarım daire yoksa o çizgi cephe değil, trof.",kaynak:"factsheet_11-interpreting-weather-charts; TROUGHS AND RIDGES; derste geçenler"}]},{id:"seviyeler",no:"5",baslik:"Seviyeler: yüzeyden jete",ozet:"Yer kartı yüksekliği sabit tutup basıncı çizer; üst seviye kartları basıncı sabit tutup yüksekliği (kontur) çizer.",neden:"«500 hPa'da referans kontur ve aralık kaç?» ya da «hangi seviyede neye bakılır?» tipi kısa sorular sık gelebilir.",widget:"seviyeler",oz:"Yer 4 hPa · 850 → 150/3 dam · 700 → 300/6 · 500 → 552/6 · 300 → 900/6; yüksek kontur = sıcak, kalın sütun.",kavramlar:[{id:"iki-aile",baslik:"Yer kartı ↔ sabit basınç kartı",ozet:"Yerde yükseklik sabit → izobar; üstte basınç sabit → kontur (izohips, gpdam).",anlam:"basinc",ses:{teknik:["850 hPa kartında her noktanın basıncı 850 hPa'dır; çizilen, o basıncın bulunduğu yüksekliktir: kontur (izohips).","Birim jeopotansiyel dekametre (gpdam): 552 dam ≈ 5520 m. Yüksek kontur yüksek merkeze, alçak kontur alçak merkeze yakındır.","Üst seviye kartında «yüksek basınç merkezi» denmez; «yüksek merkez» ya da «yüksek jeopotansiyel» denir."],basit:["Yer kartı «deniz seviyesinde basınç kaç?», üst kart «850 hPa ne kadar yukarıda?» sorusunu cevaplar.","Aynı dağın iki fotoğrafı gibi: biri yüksekliği sabit tutar, diğeri basıncı."],ben:["Ben üst seviye kartındaki sayıları metre gibi okurum: 552 → 5520 m.","850'yi İstanbul'da 1500 m'de, Madrid'de 1800 m'de yakaladıysam İstanbul tarafı alçak derim."]},tablo:{baslik:["","Yer kartı","Üst seviye kartı"],satirlar:[["Sabit olan","yükseklik (deniz seviyesi)","basınç (850, 500…)"],["Çizilen","izobar (hPa)","kontur / izohips (gpdam)"],["Merkez adı","alçak/yüksek basınç merkezi","alçak/yüksek merkez"]]},tuzak:"Üst seviye kartındaki konturlara «izobar» deme; o kartta basınç her yerde aynıdır.",kaynak:"Isobar; derste geçenler"},{id:"standartlar",baslik:"Referans ve aralık tablosu",ozet:"Her seviyenin bir çıpa değeri ve sabit aralığı var; haritalar bu sayede karşılaştırılabilir.",anlam:"basinc",ses:{teknik:["Yer: izobar, 1000 hPa referans, 4 hPa. 850: 150 gpdam referans, 3 dam. 700: 300 gpdam, 6 dam.","500: 552 gpdam referans, 6 dam (552, 558, 564…). 300: 900 gpdam, 6 dam. İzotak (200/300): 60 kt referans, 20 kt.","İzotermler derste 2,5 °C aralıkla çiziliyor; birçok hazır kartta 5'in katları daha koyu çizilir."],basit:["Her katın bir sıfır noktası var; ondan yukarı ya da aşağı hep aynı adımla sayılır.","Adım sabit olduğu için «çizgiler sıklaştı» demek gerçekten «rüzgar arttı» demektir."],ben:["Ben 150 · 300 · 552 · 900 dizisini bir telefon numarası gibi ezberledim.","Aralıkları da ekledim: yer 4 hPa, 850'de 3 dam, diğerleri 6 dam."]},tablo:{baslik:["Seviye","~Yükseklik","Çizilen","Referans","Aralık"],satirlar:[["Yer","0 m (MSL)","izobar","1000 hPa","4 hPa"],["850 hPa","~1,5 km","kontur + izoterm","150 gpdam","3 dam"],["700 hPa","~3 km","kontur + nem","300 gpdam","6 dam"],["500 hPa","~5,5 km","kontur + izoterm","552 gpdam","6 dam"],["300 hPa","~9 km","kontur + izotak","900 gpdam","6 dam · izotak 20 kt"]],not:"Değerler ders dosyasından (Isobar). Başka notlarda farklı aralıklar görülebilir; ders dosyasındakiler esas."},formul:[{satir:"ΔZ = (Rd · T̄ / g0) · ln(p1 / p2)",terimler:[["ΔZ","iki basınç yüzeyi arasındaki kalınlık","m"],["Rd","kuru hava gaz sabiti ≈ 287","J/(kg·K)"],["T̄","tabakanın ortalama sıcaklığı","K"],["g0","yerçekimi ivmesi ≈ 9,81","m/s²"],["p1, p2","alt ve üst basınç seviyesi","hPa"]],not:"Sıcak sütun kalın → 500 hPa yüzeyi yukarıda → yüksek kontur (sırt). Soğuk sütun ince → alçak kontur (trof)."}],sorular:[{s:"500 hPa'da 552'nin iki yanındaki konturlar hangileri? 534 kaç adım aşağıda?",c:["6 dam aralık → yukarı 558, 564; aşağı 546, 540.","534 = 552 − 3 × 6 → üç kontur aşağıda: soğuk, derin bir trof ya da alçak merkez."]}],kaynak:"Isobar; Thermal Wind; derste geçenler"},{id:"alt-seviyeler",baslik:"850 ve 700 hPa: sıcaklık ve nem",ozet:"850'de adveksiyon ve cepheler, 700'de nem; yağışın hammaddesi bu katlardan okunur.",anlam:"sicaklik",ses:{teknik:["850 hPa (~1,5 km): kontur + izoterm. Kontur izotermleri kesiyorsa adveksiyon var; soğuk cephe soğuk adveksiyonun başında.","Oklüzyon 850'de sıcak izoterm dilinin ortasından geçer; izoterm sıklığı cephe bölgesini gösterir.","700 hPa (~3 km): nem (bağıl nem) ve trof yerleri; etkili yağış için 700'de yeterli nem aranır."],basit:["850 «hangi hava geliyor, sıcak mı soğuk mu?», 700 «yağmur yapacak su var mı?» sorusunu cevaplar.","Trof gelse bile 700'de hava kuruysa bulut cılız kalabilir."],ben:["Ben 850'de rüzgarın soğuk izotermden sıcağa doğru estiği yere «soğuk adveksiyon» notu düşerim.","Yağış öngörüsünden önce mutlaka 700'ün nemine bakarım."]},kaynak:"ADVECTION; FRONTS_2; Isobar; derste geçenler"},{id:"bes-yuz",baslik:"500 hPa: dalganın katı",ozet:"Ana akım, trof ve sırt, kesik alçak ve omega burada; çıpa değer 552 dam.",anlam:"dinamik",ses:{teknik:["500 hPa (~5,5 km): ana akımın izlendiği seviye; trof/sırt, kesik alçak ve omega blokajı burada belirgin.","552 dam altı soğuk/trof, üstü sıcak/sırt eğilimi. Ders dosyası şekillerinde 534 (kesik alçak merkezi) ile 570 arası var.","Trofun önünde pozitif vortisite ve yükselme; 500 izotermleri (−20…−40 °C) soğuk hava çöküşünü gösterir."],basit:["500 hPa, atmosferin orta katındaki büyük nehir; aşağıdaki sistemleri bu nehir taşır.","Nehrin güneye sarkan kıvrımı trof, kuzeye kabaran kıvrımı sırttır."],ben:["Ben öngörüye 500'den başlarım: dalga nerede, bize doğru mu geliyor?","Sonra yer kartına inip bu dalganın altındaki alçağı ararım."]},kaynak:"Isobar; TROUGHS AND RIDGES; derste geçenler"},{id:"jet",baslik:"300 / 250 / 200 hPa: jet katı",ozet:"İzotaklarla jet çekirdeği bulunur; jet, sistemleri yönlendirir.",anlam:"ruzgar",ses:{teknik:["İzotak: eş rüzgar hızı eğrisi; 200/300 hPa ve maksimum rüzgar kartlarında 60 kt referansla 20 kt aralık.","İzotaklar jetin kuzey (soğuk) kenarında sık, güney kenarında seyrek çizilir: yaklaşık 1:3.","Genç (oklüzyona uğramamış) cephelerde jet ekseni cephelere paraleldir; oklüzyonda oklüzyon noktasından geçer."],basit:["Jet, gökyüzünün otobanıdır; alttaki sistemler bu otobanın yönünde taşınır.","Jeti bulmak için en hızlı rüzgarın toplandığı dar şeridi ararsın."],ben:["Ben 300 hPa'da kapalı, yüksek değerli izotakları görünce «jet çekirdeği burada» derim.","Jet bir sistemi sürüklemiyorsa o sistemin yerinde kalabileceğini düşünürüm."]},kaynak:"Isobar; FRONTS_2; derste geçenler"},{id:"izoterm",baslik:"İzoterm: sıcak dil, soğuk oluk",ozet:"Eş sıcaklık eğrileri; aşağı sarkan izoterm trofu soğuk havanın, kuzeye uzanan dil sıcak havanın yolu.",anlam:"sicaklik",ses:{teknik:["İzoterm: eş sıcaklık eğrisi; yüksek değer sıcak, düşük değer soğuk hava kütlesi. Derste 2,5 °C aralıkla çiziliyor.","İzoterm trofu soğuk havanın güneye sokulduğunu, sıcak dil sıcak havanın kuzeye taşındığını gösterir.","İzotermlerin sıklaştığı yer cephe bölgesine ya da kuvvetli rüzgara işaret eder."],basit:["İzotermleri haritaya dökülmüş sıcak ve soğuk su gibi düşün: soğuk su güneye, sıcak su kuzeye akar.","İki rengin keskin buluştuğu yer bir cephe olabilir."],ben:["Ben kırmızı izotermlerde aşağı sarkan bir oluk görünce «soğuk hava geliyor» derim.","Trof çizdiğimde hemen yakınında bir izoterm trofu ararım; yoksa trof dolup sönebilir."]},kaynak:"Isobar; TROUGHS AND RIDGES; derste geçenler"}]},{id:"trof-sirt",no:"6",baslik:"Trof ve sırt",ozet:"Trof üst seviye akışının güneye sarkan oluğu, sırt kuzeye kabaran dilidir. Hava çoğunlukla trofun önünde bozulur.",neden:"Derste en çok vurgulanan konulardan: trof/sırt eksenini çizdirme, rüzgar dönmesinden trof bulma ve «yağış hangi tarafta?» soruları beklenebilir.",widget:"trof",oz:"Trof kesikli, sırt dalgalı çizilir; trofun önü yükselme-yağış, arkası çökme-açılma, üstü yarı yarıya.",kavramlar:[{id:"trof-tanim",baslik:"Trof (oluk, trough)",ozet:"Alçak merkezden dışa uzanan oluk; değerler merkezden dışa artar. Kesikli çizgiyle çizilir.",anlam:"dinamik",ses:{teknik:["Trof: alçak merkez çevresinde, merkezden dışa doğru değerlerin arttığı oluk biçimli desen; kesikli çizgiyle (- - -) çizilir.","İki koşul: 1) trof üzerinde rüzgar dönmesi (wind shift) olmalı; 2) hemen önünde ya da arkasında izoterm trofu olmalı.","Soğuk hava ile beslenmeyen trof dolar ve kaybolur; cephesiz yağışta da bir trof ya da alçak aranır."],basit:["Trof, hava nehrinde güneye sarkan bir dirsek; dirseğin içinde soğuk hava birikir.","Soğuk hava beslemesi kesilirse dirsek düzleşir, trof söner."],ben:["Ben haritaya bakınca önce konturların V ya da U gibi güneye sarktığı yeri ararım, sonra kesikli çizgimi atarım.","Çizgimi doğrulamak için rüzgarın gerçekten döndüğüne ve yakında soğuk izoterm olduğuna bakarım."]},sekil:[{src:"img/ders1/trof-ana-trof.png",alt:"500 hPa ana trof şeması: 552–570 konturları, A merkezi ve kesikli trof ekseni",cap:"Konturlar güneye sarkar; kesikli eksen kıvrımların en keskin noktalarından geçer.",kaynak:na}],kaynak:"TROUGHS AND RIDGES; derste geçenler"},{id:"sirt-tanim",baslik:"Sırt (ridge)",ozet:"Yüksek değerli dil; arkasında SW, önünde NW rüzgar. Dalgalı (kırık) çizgiyle çizilir.",anlam:"dinamik",ses:{teknik:["Sırt: yüksek basınç/kontur değerli, dil biçimli desen; arkasında güneybatılı, önünde kuzeybatılı akış; dönüş antisiklonik.","Her sırtı besleyen bir sıcak hava dili vardır (üstünde, önünde ya da arkasında). Ekseni dalgalı/kırık çizgiyle (~) çizilir.","Sivri sırtta konturlar daralır; basık (yayvan) sırt geniş aralıklıdır ve soğuk adveksiyondan kolay etkilenmez."],basit:["Sırt, hava nehrinde kuzeye kabaran bir tümsek; altında ılık hava birikir.","Sırt üzerimizdeyse günlerce ılık ve sakin, bahar gibi bir hava yaşanabilir."],ben:["Ben sırt eksenini kesikli değil dalgalı çizerim; kesikliyi troflara saklarım.","Sırtın önünü iyi hava, arkasını «sıradaki trofun kapısı» diye düşünürüm."]},tuzak:"Sırt ve sırt önü genelde iyi havadır ama sis istisnadır; sırt arkası SW akış ve sıcak cepheyle yağış alabilir.",sekil:[{src:"img/ders1/sirt-sivri-basik.png",alt:"Sivri sırt ve basık sırt şemaları, dalgalı mavi sırt ekseniyle",cap:"Üstte sivri sırt (konturlar daralır), altta basık sırt (geniş aralık). Eksen dalgalı çizgi.",kaynak:na}],kaynak:"TROUGHS AND RIDGES; derste geçenler"},{id:"ruzgarla-trof",baslik:"Rüzgar dönmesiyle trof bulma",ozet:"Önündeki ve arkasındaki rüzgarlara paralel çizgiler çiz; eksen kesişimdeki açının açıortayından geçer.",anlam:"ruzgar",ses:{teknik:["Trofun önündeki ve arkasındaki rüzgarlara paralel iki çizgi çizilir; trof ekseni kesişimdeki açının açıortayından geçer.","Ana trofta arkada ~310–320° (NW), üstünde 270° (W), önde ~240° (SW): a-b-c istasyonları bu sırayla dizilir.","Backing (saat tersine dönme) trof/alçak yaklaşımını ve soğumayı; veering (saat yönü) sırt/sıcak hava yaklaşımını gösterir."],basit:["Rüzgar bir istasyonda kuzeybatıdan batıya, sonra güneybatıya dönüyorsa sıradaki trof kapıda demektir.","Tersine güneybatıdan kuzeybatıya dönüyorsa trof geçmiş, sırt geliyordur."],ben:["Ben üç istasyonun oklarını sıralarım: 320, 270, 240 görürsem trofu 270'in üstüne koyarım.","Okların döndüğü yer, kesikli çizgimin geçeceği yerdir."]},tuzak:"Backing/veering'i dönüş yönüyle oku: 310 → 240 sayılar küçülüyor = saat tersine = backing.",sekil:[{src:"img/ders1/trof-istasyonlar-abc.png",alt:"Trofun arkası, üstü ve önündeki a, b, c istasyonlarında 320°, 270° ve 240° rüzgarlar; kesikli trof ekseni",cap:"a (arka) 320° · b (üstü) 270° · c (ön) 240°: kesikli eksen b'den geçer.",kaynak:na},{src:"img/ders1/trof-ruzgar-donmesi.png",alt:"Aynı istasyonda rüzgarın zamanla 310°, 270° ve 240° olarak saat tersine dönmesi",cap:"Zamanla 310° → 270° → 240°: backing; trof ya da alçak yaklaşıyor.",kaynak:na},{src:"img/ders1/sirt-ruzgar-donmesi.png",alt:"Aynı istasyonda rüzgarın zamanla 240°, 270° ve 310° olarak saat yönünde dönmesi",cap:"Zamanla 240° → 270° → 310°: veering; sırt ya da sıcak hava yaklaşıyor.",kaynak:na}],sorular:[{s:"Bir istasyonda rüzgar art arda 310°, 270°, 240° ölçülüyor. Ne yaklaşıyor, sıcaklık ne olur?",c:["Saat yönünün tersine dönüş: backing.","Ders dosyasına göre trof ya da alçak merkez yaklaşıyor; sıcaklık düşüşü beklenir."]}],kaynak:"TROUGHS AND RIDGES"},{id:"trof-turleri",baslik:"Trof türleri: yapı ve şekil",ozet:"Yapıya göre ana/tali, şekle göre V (sivri) ve U (geniş). Öngörüde asıl oyuncu ana trof.",anlam:"dinamik",ses:{teknik:["Yapıya göre: ana trof (öngörüde asıl aktif olan) ve tali trof (derin kesik alçaklarda görülür, yağışı zayıf).","Şekle göre: V (sivri) trof hızlı ve aktif, kısa süreli şiddetli yağış; U (geniş) trof yavaş, rüzgar dönmesi zayıf."],basit:["Ana trof takımın kaptanı, tali troflar yedek oyuncular.","V trof hızlı geçen sert bir sağanak; U trof yavaş, yayvan bir bulut örtüsü."],ben:["Ben önce ana trofu bulurum; tali trofları ancak kesik bir alçakta ararım.","Şekline de bakarım: V ise «kısa ama sert», U ise «yavaş ve zayıf» diye not alırım."]},sekil:[{src:"img/ders1/trof-v-u.png",alt:"V (sivri) trof ve U (geniş) trof şemaları, kesikli eksenleriyle",cap:"Üstte V trof: dar, keskin, hızlı. Altta U trof: geniş, yavaş, rüzgar dönmesi zayıf.",kaynak:na}],alt:[{id:"ana-trof",baslik:"Ana trof",ozet:"Önde SW, arkada NW, üstünde batılı (270°) akış; öngörüde en aktif trof.",anlam:"dinamik",ses:{teknik:["Önündeki SW akış konvektif etkinliğe uygundur: düşey hareket, pozitif (+) vortisite.","Arkasında negatif (−) vortisite ve çökme (subsidence); tam üstünde ± bölge, yağış olasılığı ~%50."],basit:["Ana trofun önü kaynayan bir kazan, arkası yukarıdan bastıran serin bir kapak.","Tam üstündeysen yazı-tura: yağış olabilir de, olmayabilir de."],ben:["Ben ana trofu, önünde SW arkasında NW rüzgarlar olan oluk diye tanırım.","Yağış için hep eksenin doğusuna bakarım."]},kaynak:"TROUGHS AND RIDGES"},{id:"tali-trof",baslik:"Tali (ikincil) trof",ozet:"Derin kesik alçaklarda ana trofla birlikte en fazla 3 tali trof; toplam 4 eksen.",anlam:"dinamik",ses:{teknik:["Tali troflar SW–SE, SE–NE, NE–NW rüzgar dönmeleriyle oluşur; ana trof kadar aktif değildir, yağışları zayıftır.","Önü ve arkası güçlü sırtlarla kilitli durağan alçakta ana ve tali troflar yer değiştirir; yağış günlerce sürebilir."],basit:["Kesik bir alçak, çevresine birkaç kol uzatan bir ahtapot gibidir; en kalın kol ana trof.","Kollar sırayla öne geçtikçe aynı bölge günlerce ıslanabilir."],ben:["Ben kapalı bir alçakta rüzgarın döndüğü her yöne kesikli çizgi atabileceğimi hatırlarım: en fazla dört.","Ama yağış öngörüsünü ana trofa göre veririm."]},sekil:[{src:"img/ders1/trof-ana-tali.png",alt:"Derin kapalı alçakta bir ana trof ve üç tali trof ekseni",cap:"Kesik (kapalı) alçakta ana trof ve tali troflar: en fazla dört eksen.",kaynak:na}],kaynak:"TROUGHS AND RIDGES"},{id:"v-trof",baslik:"V (sivri) trof",ozet:"Konturlar V çizer; hızlı ve aktif, rüzgar dönmesi kuvvetli, yağış kısa ama şiddetli.",anlam:"dinamik",ses:{teknik:["Dar trof bölgesi nedeniyle yağış çabuk başlar, çabuk biter; rüzgar dönmesi güçlüdür.","Hareketi düzenli olduğu için katlama yöntemiyle (folding method) ilerleme mesafesi iyi kestirilir."],basit:["V trof hızlı bir tren: gelir, ıslatır, gider.","Hızı düzenli olduğu için ne zaman geleceğini hesaplamak kolaydır."],ben:["Ben V trof görünce «kısa ama sert sağanak» derim.","Son 6 saatteki yer değiştirmesini ölçüp ileriye katlarım."]},kaynak:"TROUGHS AND RIDGES; derste geçenler"},{id:"u-trof",baslik:"U (geniş) trof",ozet:"Geniş alana yayılmış, rüzgar dönmesi zayıf; hareketi ve etkinliği sınırlı.",anlam:"dinamik",ses:{teknik:["U trof geniş alanlıdır, rüzgar dönmesi azdır; hareketi ve etkinliği sınırlıdır.","Trof kenarlarında genelde önemli bir hadise yoktur."],basit:["U trof, yavaş akan geniş bir nehir kıvrımı gibidir.","Kenarlarında hava pek değişmez."],ben:["Ben U trofta büyük bir olay beklemem.","Rüzgar dönmesi zayıf olduğu için ekseni çizerken daha çok kontur şekline güvenirim."]},kaynak:"TROUGHS AND RIDGES"}],kaynak:"TROUGHS AND RIDGES"},{id:"on-arka",baslik:"Trofun önü ve arkası",ozet:"Önü: +vortisite, üstte diverjans, yükselme, kötü hava. Arkası: −vortisite, çökme, açılma.",anlam:"dinamik",ses:{teknik:["Önde SW akış, pozitif vortisite, üst seviyede diverjans ve yükselme: bulut, sağanak, kötü hava.","Arkada N–NW akış, negatif vortisite, üstte konverjans ve çökme: yağış şansı düşük (aşırı soğuk hava, orografi hariç).","Trofun yağış vermesi için yer basıncı alçak olmalı, eğilimler aşırı artmamalı; cephesiz troflar daha aktiftir."],basit:["Trofun önünde hava yokuş yukarı tırmanır: tırmanan hava soğur, bulut olur.","Arkasında hava yukarıdan bastırır: bastırılan hava ısınır, bulut dağılır."],ben:["Ben yağış sorulduğunda cevabı hep kesikli çizginin doğusunda ararım.","Batısında kalan istasyona «açılıyor, serin» yazarım."]},tablo:{baslik:["Bölge","Akış","Vortisite","Düşey hareket","Hava"],satirlar:[["Önü (doğu)","SW","+","yükselme","bulut, yağış"],["Üstü","W (270°)","±","belirsiz","yağış ~%50"],["Arkası (batı)","NW–N","−","çökme","açık, serin"]]},tuzak:"Cephe geçtikten sonra gelen trof genelde daha zayıftır; ilk enerjiyi cephe harcar.",sorular:[{s:"Trof ekseni İstanbul'un 300 km batısında ve doğuya ilerliyor. Önümüzdeki saatler için ne dersin?",c:["İstanbul trofun önünde: SW akış, +vortisite, yükselme.","Bulutlanma ve yağış olasılığı artar; trof geçince NW akış ve açılma beklenir."]}],kaynak:"TROUGHS AND RIDGES; derste geçenler"},{id:"akis-desenleri",baslik:"Akış desenleri: kesik alçak, omega, zonal/meridyonel",ozet:"Dalga ya düz akar, ya kıvrılır, ya da kopar; kopan ve tıkanan sistemler havayı günlerce kilitler.",anlam:"dinamik",ses:{teknik:["Zonal akış: batı–doğu yönlü, küçük genlikli dalgalar; meridyonel akış: büyük genlikli trof ve sırtlar, kuzey–güney taşınım.","Dalga koparsa kesik alçak (cut-off low), sırt iki alçak arasında Ω çizerse omega blokajı oluşur."],basit:["Akış bazen düz bir otoyol, bazen yılan gibi kıvrılan bir dağ yolu, bazen de kapanmış bir göl.","Kıvrımlar büyüdükçe hava daha uç ve daha kalıcı olur."],ben:["Ben 500 hPa'ya bakıp önce akışın düz mü kıvrımlı mı olduğunu söylerim.","Kapalı bir kontur ya da Ω şekli görürsem «bu sistem kolay gitmez» derim."]},alt:[{id:"kesik-alcak",baslik:"Kesik alçak (cut-off low)",ozet:"Ana batı akımından kopmuş, tamamen kapanmış alçak merkez; yavaş ya da durağan.",anlam:"dinamik",ses:{teknik:["Kontur kendi üstüne kapanıp ana akımdan koptuysa sistem «cut-off yaptı» denir; doğuya taşınması yavaşlar.","Derin kesik alçakta ana trofla birlikte tali troflar görülür; etkisindeki bölgede yağış uzun sürer."],basit:["Nehirden kopup kenarda dönen bir girdap gibi: akıntı onu kolay götüremez.","Bu yüzden «yarın geçer» denemez; günlerce kalabilir."],ben:["Ben 500 hPa'da kendi üstüne kapanmış bir kontur görünce «kesik alçak» diye işaretlerim.","Tam kapalı değil de sadece girinti varsa «trof» derim, cut-off demem."]},kaynak:"TROUGHS AND RIDGES; Isobar; derste geçenler"},{id:"omega",baslik:"Omega blokajı",ozet:"Sırt, iki trof/alçak arasında Ω çizer; akış tıkanır, hava 4–5 günden fazla aynı kalabilir.",anlam:"dinamik",ses:{teknik:["Trof–sırt–trof dizisi Ω biçimini alır; ortadaki sırt doğuya ilerlemeyi keser (blocking).","Sırt altında sıcak-kuru, iki yandaki troflarda yağışlı hava günlerce sürer; jet sistemi sürüklemezse blokaj kalıcıdır."],basit:["Omega, yola park etmiş bir kamyon gibi: arkasındaki bütün trafik durur.","Kamyonun altındaki yer günlerce güneşli, iki yanı günlerce yağışlı kalır."],ben:["Ben Ω şeklini görünce öngörüme «kalıcı» kelimesini eklerim.","Yağışlı taraftaysam birkaç gün daha yağış, sırt altındaysam birkaç gün daha ılık hava derim."]},kaynak:"derste geçenler; factsheet_11-interpreting-weather-charts"},{id:"zonal-meridyonel",baslik:"Zonal ↔ meridyonel akış",ozet:"Zonal: düz batılı akış, hızlı geçen sistemler. Meridyonel: derin trof-sırt, uç olaylar.",anlam:"dinamik",ses:{teknik:["Zonal akışta konturlar enlem çemberine yakın, dalgalar sığdır; sistemler hızla doğuya geçer.","Meridyonel akışta derin troflar soğuğu güneye, sırtlar sıcağı kuzeye taşır; kesik alçak ve blokaj olasılığı artar."],basit:["Zonal düz bir otoyol: araçlar hızlı geçer, hava sık değişir ama sert değildir.","Meridyonel keskin virajlı bir yol: hava yavaşlar, sıcak ve soğuk uçlar belirginleşir."],ben:["Ben konturlar neredeyse yatay ise «zonal, sistemler çabuk geçer» derim.","Konturlar kuzey-güney uzanıyorsa «meridyonel; kalıcı ve uç hava olabilir» derim."]},kaynak:"genel sinoptik bilgi; derste geçenler"},{id:"eksen-egimi",baslik:"Eksenin yükseklikle batıya eğimi",ozet:"Gelişen sistemde üst seviye trof/alçak, yer alçağının batısında (gerisinde) kalır.",anlam:"dinamik",ses:{teknik:["Baroklinik modelde yer siklonu ile üst seviye alçağı yükseklikle geriye (batıya) eğik bir eksende dizilir; sistem hareketlidir.","Barotropik modelde merkezler aynı düşey eksendedir; sistem durağandır, günlerce kalabilir."],basit:["Gelişen bir fırtına eğik bir merdivene benzer: üst basamak geride kalır.","Merdiven dikleşip basamaklar üst üste binince fırtına gücünü yitirmeye başlar."],ben:["Ben 500 hPa trofunu yer alçağının batısında görürsem «sistem gelişiyor» derim.","Tam üstündeyse «olgun ya da dolmaya yakın» diye not alırım."]},kaynak:"ADVECTION; derste geçenler"}],kaynak:"TROUGHS AND RIDGES; ADVECTION; factsheet_11-interpreting-weather-charts; derste geçenler"}]},{id:"siklon",no:"7",baslik:"Siklon ve antisiklon",ozet:"Siklon kapalı alçak, antisiklon kapalı yüksektir. Orta enlem siklonu dalga olarak doğar, olgunlaşır, oklüzyona girer, söner.",neden:"Tanım soruları (KYK'de dönüş yönü, A/Y), «her siklonda cephe var mı?» tipi D/Y ve çekirdek tipleri (Basra, Azor, Sibirya, İzlanda) gelebilir.",widget:"trof",oz:"Siklon saat tersine, konverjans, kötü hava; antisiklon saat yönünde, diverjans, açık hava. Her cephe bir siklonda, her siklonda cephe yok.",kavramlar:[{id:"siklon-tanim",baslik:"Siklon (alçak, A / L)",ozet:"KYK'de saat tersine dönen, basıncın merkeze doğru azaldığı sistem; konverjans alanı.",anlam:"basinc",ses:{teknik:["KYK'de rüzgar saat yönünün tersine döner ve basınç çevreden merkeze azalırsa siklon (alçak basınç merkezi) denir.","Siklonlar konverjans alanıdır; genelde yağış, rüzgar ve fırtınayla ilişkilidir. Gezicilerin yanında kalıcı merkezler de var.","Her cephe bir siklon içinde oluşur, ama her siklonun cephesi olmak zorunda değildir (tropikal siklonlar cephesizdir)."],basit:["Siklon, havanın içine çekildiği ve yukarı tırmandığı dev bir girdap.","Tırmanan hava soğur, bulut ve yağış yapar; bu yüzden alçak «bozuk hava» demektir."],ben:["Ben A harfi görünce saat tersine bir halka çizer, cephe ararım; bulamazsam şaşırmam.","Cephe çizdiğimde ise mutlaka bir alçağa bağlarım."]},tuzak:"«Her siklonda cephe vardır» yanlıştır; doğrusu: her cephe bir siklona bağlıdır.",kaynak:"Isobar; factsheet_11-interpreting-weather-charts; derste geçenler"},{id:"antisiklon",baslik:"Antisiklon (yüksek, Y / H)",ozet:"KYK'de saat yönünde dönen, basıncın merkeze doğru arttığı sistem; diverjans ve çökme.",anlam:"basinc",ses:{teknik:["KYK'de saat yönünde dolaşım, merkeze doğru artan basınç; diverjans ve çökme alanı. Üst seviyede sırtlarla ilişkilidir.","Genelde sakin ve açık hava; ama sis, pus ve duman oluşumuna ve yerde soğuk–yukarıda sıcak inversiyona katkı yapar.","Blokaj yüksekleri doğuya ilerleyen alçak, trof ve sırtları günlerce, hatta haftalarca durdurabilir."],basit:["Antisiklon, yukarıdan aşağı bastıran ağır bir kapak; bulutlar dağılır.","Kışın bu kapağın altında soğuk ve kirli hava sıkışıp sis ve pus yapabilir."],ben:["Ben Y görünce «açık hava» derim, ama kışsa sabah sisini de not ederim.","Y uzun süre yerinden kıpırdamıyorsa blokaj diye düşünürüm."]},kaynak:"Isobar; factsheet_11-interpreting-weather-charts"},{id:"yasam-dongusu",baslik:"Orta enlem siklonunun yaşam döngüsü",ozet:"Durağan sınır → dalga → olgun siklon → oklüzyon → soğuk hava hakim, sönme.",anlam:"dinamik",ses:{teknik:["Norveç siklon modeli: 1) soğuk ve sıcak hava arasında durağan sınır, 2) sınırda dalga ve alçak, 3) olgun siklon.","4) Soğuk cephe sıcak cepheyi yakalar: oklüzyon. 5) Soğuk hava sistemi doldurur, alçak dolar ve söner.","Olgun evrede sıcak ve soğuk cephe arasında sıcak sektör bulunur; merkez basıncı düştükçe sistem derinleşir."],basit:["Siklon, iki farklı hava kütlesinin sınırında bir kıvrım olarak doğar; kıvrım büyüyüp bir girdaba dönüşür.","Soğuk hava sıcak havayı yerden koparıp yukarı itince girdap yaşlanır ve söner."],ben:["Ben cephelerin şekline bakıp evreyi söylerim: düz çizgi doğum, V şekli olgunluk, mor çizgi yaşlılık.","Mor oklüzyon uzadıkça «sistem dolmaya gidiyor» derim."]},tablo:{baslik:["Evre","Haritada ne görülür"],satirlar:[["1 Durağan sınır","soğuk ve sıcak hava yan yana, durağan cephe"],["2 Dalga","cephede kıvrım, küçük bir A"],["3 Olgun","belirgin A, sıcak + soğuk cephe, sıcak sektör"],["4 Oklüzyon","mor oklüzyon merkezden dışa uzar, sıcak sektör daralır"],["5 Sönme","soğuk hava hakim, alçak dolar"]]},sekil:[{src:"img/ders1/siklon-yasam-dongusu.png",alt:"Norveç siklon modelinin beş adımı: durağan cephe, dalga, olgun siklon, oklüzyon, sönme",cap:"1 durağan sınır · 2 dalga · 3 olgun · 4 oklüzyon · 5 soğuk hava hakim.",kaynak:"Ders dosyası: Air Masses and Fronts"}],sorular:[{s:"Haritada A merkezinden mor bir cephe uzuyor, sıcak sektör daralmış. Siklon hangi evrede?",c:["Mor çizgi = oklüzyon.","Sıcak sektör daralmış → 4. evre (oklüzyon); sırada sönme var."]}],kaynak:"Air Masses and Fronts_2025_Spring; factsheet_11-interpreting-weather-charts"},{id:"ust-iliski",baslik:"Üst seviye trofla ilişki",ozet:"Yer alçağı üst trofun önünde beslenir; baroklinik sistem eğik eksenli ve hareketli, barotropik durağan.",anlam:"dinamik",ses:{teknik:["Troflar üst seviyelerde alçak merkezlerin bulunduğu yerlerdir; trof önündeki yükselme ve +vortisite yer alçağını besler.","Baroklinik model: kontur ve izotermler kesişir (adveksiyon), eksen yükseklikle geriye eğik, sistem hareketli ve cepheli.","Barotropik model: kontur ile izoterm paralel, merkezler aynı eksende, sistem durağan; Türkiye'de kırkikindi yağışları."],basit:["Üstteki oluk yerden havayı yukarı emer; alttaki alçak bu emişle derinleşir.","Üst ve alt merkezler üst üste gelince emiş biter, sistem sakinleşir."],ben:["Ben yer alçağını bulunca hemen 500'e bakıp batısında bir trof var mı diye ararım.","Konturlar izotermleri kesiyorsa «baroklinik, hareketli» diye not alırım."]},tuzak:"Türkiye'de baroklinik sistemler geç sonbahar, kış ve erken ilkbaharda; barotropikler Nisan–Haziran'da sık görülür.",kaynak:"ADVECTION; TROUGHS AND RIDGES; derste geçenler"},{id:"cekirdek",baslik:"Sıcak ve soğuk çekirdek",ozet:"Sıcak çekirdekli alçağın üstünde yüksek, soğuk çekirdekli yükseğin üstünde alçak bulunur.",anlam:"sicaklik",ses:{teknik:["Sıcak çekirdekli alçak: yerde A, 500 hPa civarından itibaren Y/sırt; etkinliği az (ör. yazın Basra alçağı).","Soğuk çekirdekli alçak: her seviyede A, çok aktif, yağış olasılığı yüksek (İzlanda alçağı). Sıcak çekirdekli yüksek: her seviyede Y (Azor).","Soğuk çekirdekli yüksek: yerde Y, yukarıda A (Sibirya yükseği); kıtasal polar (cP) hava kütlesinin temsilcisi."],basit:["Sıcak hava sütunu yukarı doğru şişer, soğuk sütun büzülür; bu yüzden üst kattaki işaret alttakinden farklı olabilir.","Soğuk çekirdekli alçak her katta alçak olduğu için en hırçın olanıdır."],ben:["Ben bir alçağın ne kadar ciddi olduğunu 500'e bakarak anlarım: orada da A varsa ciddiyim.","Yerde A ama 500'de sırt görürsem «Basra tipi, sıcak ve kuru» derim."]},tablo:{baslik:["Tip","Yerde","Yukarıda","Örnek","Hava"],satirlar:[["Sıcak çekirdekli alçak","A","Y / sırt","Basra alçağı","sıcak, yağış seyrek"],["Soğuk çekirdekli alçak","A","A","İzlanda alçağı","çok aktif, yağışlı"],["Sıcak çekirdekli yüksek","Y","Y","Azor yükseği","sıcak, açık"],["Soğuk çekirdekli yüksek","Y","A","Sibirya yükseği","kışın şiddetli soğuk, don"]]},sekil:[{src:"img/ders1/alcak-cekirdek-tipleri.png",alt:"Sıcak ve soğuk çekirdekli alçağın düşey kesiti: seviyelere göre A ve Y",cap:"Solda sıcak çekirdek: yerde A, yukarıda Y. Sağda soğuk çekirdek: her seviyede A.",kaynak:he},{src:"img/ders1/yuksek-cekirdek-tipleri.png",alt:"Sıcak ve soğuk çekirdekli yüksek basıncın düşey kesiti: seviyelere göre Y ve A",cap:"Solda sıcak çekirdek: her seviyede Y. Sağda soğuk çekirdek: yerde Y, üst seviyelerde A.",kaynak:he}],kaynak:"Isobar; factsheet_11-interpreting-weather-charts"},{id:"turkiye",baslik:"Türkiye'yi etkileyen merkezler",ozet:"İzlanda alçağı, Azor yükseği, Sibirya yükseği, Basra alçağı ve Akdeniz siklonları.",anlam:"basinc",ses:{teknik:["Yazın Azor yükseği Balkanlar ve batı Türkiye'ye uzanır; Basra alçağıyla birlikte kuzey ve batıda N–NE rüzgarları doğurur.","Kışın Sibirya yükseği zaman zaman bölgemize uzanır: aşırı soğuma ve şiddetli don.","Sibirya kaynaklı soğuk hava Akdeniz cephe sistemini besler; Akdeniz siklonlarının sık geliştiği yıllar bol yağış demektir."],basit:["Türkiye'nin havası dört büyük merkezin halat çekmesi gibi: batıda Azor ve İzlanda, kuzeydoğuda Sibirya, güneydoğuda Basra.","Kış yağışımızın çoğu Akdeniz üzerinde doğan alçaklarla gelir."],ben:["Ben brifingde merkezleri adıyla anarım: «İzlanda alçağı derinleşmiş, Azor yükseği sırt yapıyor.»","İstanbul bir sırtın altındaysa ılık ve sakin, bir kesik alçak geldiyse günlerce yağışlı derim."]},tablo:{baslik:["Merkez","Tip","Mevsim / etki"],satirlar:[["İzlanda alçağı","soğuk çekirdekli alçak","batıdan gelen sistemlerin kaynağı"],["Azor yükseği","sıcak çekirdekli yüksek","yazın sırt yapar; kuru, sıcak"],["Sibirya yükseği","soğuk çekirdekli yüksek","kışın soğuk hava akını, don"],["Basra alçağı","sıcak çekirdekli alçak","yazın sıcak, yağış seyrek"],["Akdeniz siklonları","cepheli alçak","kış yağışlarının taşıyıcısı"]]},alt:[{id:"siklogenez",baslik:"Siklogenez nerede olur?",ozet:"Siklonlar sıcak-soğuk hava sınırlarında, üst trofun önünde doğar; Akdeniz bizim için kilit alan.",anlam:"dinamik",ses:{teknik:["Siklogenez (cyclogenesis) ana cephe kuşaklarında olur: polar cephe, arktik cephe, Akdeniz cephesi; üst trofun önü tetikler.","Akdeniz'de kışın sık siklogenez alanları Cenova Körfezi ve Kıbrıs çevresidir (genel literatür)."],basit:["Siklon, sıcak ve soğuk havanın sürtündüğü sınırlarda bir kıvılcım gibi doğar.","Bizim için en önemli sınır, kışın Akdeniz üzerinde kurulan cephedir."],ben:["Ben kışın Akdeniz'de bir dalga görünce birkaç gün içinde Türkiye'ye yağış getirebileceğini düşünürüm.","Kuzeyden Akdeniz'e soğuk hava inişini siklogenezin habercisi sayarım."]},kaynak:"Air Masses and Fronts_2025_Spring (ana cepheler); Isobar; genel literatür"}],kaynak:"Isobar; Air Masses and Fronts_2025_Spring; brifing örneği; derste geçenler"}]}],or={"zincir.gozlem":{baslik:"1 · Gözlem",anlam:"kimlik",ses:{teknik:["İstasyonlar aynı anda ölçer: ana sinoptik 00-06-12-18, ara sinoptik 03-09-15-21 UTC.","Ölçülenler: basınç, sıcaklık, çiy noktası, rüzgar, bulut, görüş, hadise, yağış."],basit:["Herkes aynı anda gökyüzünün fotoğrafını çeker.","Fotoğraflar birleşince dünyanın havası tek karede görünür."],ben:["Ben gözlemi zincirin temeli sayarım: yanlış ölçüm, yanlış harita.","Saati hep UTC olarak düşünürüm."]}},"zincir.kod":{baslik:"2 · Kod (SYNOP)",anlam:"kimlik",ses:{teknik:["Gözlem AAXX başlıklı SYNOP'a, 5 haneli gruplar hâlinde yazılır.","Bölüm 1'de gruplar göstergeyle tanınır: 1 T, 2 Td, 3 aktüel P, 4 deniz seviyesi P, 5 eğilim…"],basit:["Uzun bir hava raporu birkaç satır rakama sıkıştırılır.","Her paketin ilk rakamı içinde ne olduğunu söyler."],ben:["Ben kodu görünce önce 333 ve 555'i işaretleyip bölümleri ayırırım.","Sonra iw'ye bakıp rüzgar birimini öğrenirim."]}},"zincir.cizim":{baslik:"3 · Çizim (plotting)",ses:{teknik:["Çözülen değerler istasyon modelinde sabit konumlara işlenir: solda T-VV-ww-Td, sağda PPP-eğilim-W1W2.","Basınç 3 hane yazılır (042 → 1004,2 hPa); rüzgar çubuk ve tüylerle çizilir."],basit:["Rakamlar harita üstünde küçük bir resme dönüşür.","Her istasyon bir mini bilgi kartı olur."],ben:["Ben modelde önce basıncı ve rüzgarı doğru yere koyarım; izobar onlara dayanır.","Konumu karıştırırsam bütün analiz bozulur."]}},"zincir.analiz":{baslik:"4 · Analiz",anlam:"basinc",ses:{teknik:["Yerde 4 hPa aralıkla izobar; üstte kontur (850: 3 dam, 500: 6 dam) ve 2,5 °C aralıkla izoterm çizilir.","Eğriler kesişmez, ya kapanır ya kenarda biter; rüzgar okları sağlama yapar."],basit:["Noktaları birleştirip haritaya şekil kazandırırsın.","Şekiller ortaya çıkınca hava sistemleri görünür olur."],ben:["Ben önce merkezleri bulur, sonra eğrileri sırayla doldururum.","Eğrim rüzgarla çelişiyorsa rüzgarı değil eğrimi düzeltirim."]}},"zincir.teshis":{baslik:"5 · Teşhis",anlam:"dinamik",ses:{teknik:["Desenlerden sistem tanınır: kapalı alçak (A), yüksek (Y), trof (kesikli), sırt (dalgalı), cepheler.","Seviyeler birlikte okunur: yer alçağı + 500 hPa trofu + 850 hPa izoterm deseni."],basit:["Şekillere isim verirsin: bu bir girdap, bu bir oluk, bu bir tümsek.","İsim koyunca ne yapacaklarını da bilirsin."],ben:["Ben her sistemi haritada işaretleyip yanına adını yazarım.","Yer kartında gördüğümü 500'de doğrularım."]}},"zincir.ongoru":{baslik:"6 · Öngörü",anlam:"hava",ses:{teknik:["Sistemlerin hareketi (ör. 6 saatlik yer değiştirme) ve gelişmesi kestirilir; trof önü yağış, arkası açılma.","Tahmin dili: yön-hız-hamle (030–040'tan 15–20 kt, hamle 25–30) ve kesinlik derecesi."],basit:["Şekillerin nereye gideceğini bulunca yarının havasını söylersin.","Hızlı V trof kısa ve sert, kesik alçak uzun ve inatçı hava getirir."],ben:["Ben öngörümü hep gerekçesiyle söylerim: «trofun önündeyiz, yağış bekliyorum».","Emin olmadığımda «olası» derim, «kesin» demem."]}},"zincir.dogrulama":{baslik:"7 · Doğrulama",ses:{teknik:["Tahmin, geçerlilik saatindeki gözlem ve analizle karşılaştırılır.","Hata kaynağı aranır: yanlış analiz mi, yanlış hareket kestirimi mi?"],basit:["Söylediğin oldu mu diye kontrol edersin.","Yanıldığın yer, bir sonraki tahminin dersidir."],ben:["Ben ertesi gün aynı bölgenin analizine bakıp kendi tahminimi puanlarım.","Dışarıda hissettiğim rüzgarı da tahminimle kıyaslarım."]}},"harita.alcak":{baslik:"Alçak basınç merkezi (A / L)",anlam:"basinc",ses:{teknik:["Kapalı izobarlarla çevrili, basıncın merkeze doğru azaldığı alan; KYK'de saat tersine dönüş.","Yerde konverjans ve yükselme: bulut, yağış, rüzgar. Her cephe bir alçağa bağlıdır."],basit:["Havanın içine çekildiği bir çukur.","Çukura dolan hava yukarı tırmanır, bulut olur."],ben:["Ben A'yı görünce çevresine saat tersine oklar çizerim.","Merkez değeri düşüyorsa «derinleşiyor» derim."]}},"harita.yuksek":{baslik:"Yüksek basınç merkezi (Y / H)",anlam:"basinc",ses:{teknik:["Basıncın merkeze doğru arttığı, KYK'de saat yönünde dönen alan; diverjans ve çökme.","Genelde açık hava; kışın sis, pus ve inversiyon."],basit:["Havanın yukarıdan bastırdığı bir tepe.","Bastırılan havada bulut dağılır."],ben:["Ben Y'yi görünce açık hava derim ama sabah sisini unutmam.","Uzun süre kımıldamıyorsa blokaj diye düşünürüm."]}},"harita.soguk":{baslik:"Soğuk cephe",anlam:"sicaklik",ses:{teknik:["Mavi çizgi, sıcak havaya bakan mavi üçgenler; eğim 1/50–1/100; önünde Cu/Cb, sağanak ve gök gürültülü fırtına.","Geçerken rüzgar saat yönünde döner (veer), sıcaklık düşer; ardından açılma ve yer yer sağanak."],basit:["Soğuk hava, sıcak havanın altına kama gibi girip onu hızla yukarı fırlatır.","Kısa ama sert bir yağış şeridi geçer, sonra hava serinler."],ben:["Ben mavi üçgenlerin baktığı yöne cephenin ilerlediğini bilirim.","Geçişten sonra serin ve parlak hava yazarım."]}},"harita.sicak":{baslik:"Sıcak cephe",anlam:"sicaklik",ses:{teknik:["Kırmızı çizgi, soğuk havaya bakan kırmızı yarım daireler; eğim 1/150–1/300; St, kapalı gök, sis, yaygın yağmur ya da kar.","Yağış kuşağı cephenin önünde geniştir; geçerken rüzgar veer eder, hava ılır ama kapalı kalır."],basit:["Sıcak hava, soğuk havanın üstüne yavaşça tırmanır.","Önce bulut kalınlaşır, sonra uzun süren hafif-orta yağış başlar."],ben:["Ben kırmızı yarım daireleri görünce saatlerce sürecek bir yağış beklerim.","Cephe geçince ılık ama bulutlu hava yazarım."]}},"harita.oklu":{baslik:"Oklüzyon (kapanmış cephe)",anlam:"sicaklik",ses:{teknik:["Mor çizgi, hareket yönüne bakan sıralı mor üçgen ve yarım daireler; soğuk cephe sıcak cepheyi yakalayınca oluşur.","Önünde sıcak cephe havası, arkasında soğuk cephe havası; sıcak ve soğuk tipli iki türü vardır."],basit:["Soğuk cephe sıcak cepheye yetişip sıcak havayı yerden koparır.","Sıcak hava yukarıda kalır, siklon yaşlanmaya başlar."],ben:["Ben mor çizgiyi siklonun yaşlılık işareti sayarım.","850'de onu sıcak izoterm dilinin ortasında ararım."]}},"harita.durgun":{baslik:"Durağan cephe",anlam:"sicaklik",ses:{teknik:["Kırmızı yarım daireler ile mavi üçgenler zıt yönlere bakar; iki hava kütlesi arasında neredeyse hareketsiz sınır.","Hava sıcak cepheye benzer ama genelde daha zayıftır; siklon dalgası bu sınırda doğabilir."],basit:["İki hava kütlesi karşı karşıya durmuş, kimse geri çekilmiyor.","Sınır boyunca bulut ve hafif yağış günlerce sürebilir."],ben:["Ben durağan cepheyi üzerinde dalga doğabilecek bir çizgi olarak izlerim.","Üzerinde bir kıvrım görürsem yeni bir alçak beklerim."]}},"harita.sektor":{baslik:"Sıcak sektör",anlam:"sicaklik",ses:{teknik:["Olgun siklonda sıcak cephe ile soğuk cephe arasında kalan, sıcak ve nemli havanın bulunduğu bölge.","Sıcak cephe geçince girilir: ılık, kapalı gök, yer yer çisenti; soğuk cephenin geçişiyle sona erer."],basit:["İki cephenin arasında kalan ılık bir koridor.","Oklüzyon ilerledikçe bu koridor daralır."],ben:["Ben sıcak sektördeki istasyonda yüksek çiy noktası ve güneybatılı rüzgar beklerim.","Sektör daraldıysa siklonun yaşlandığını düşünürüm."]}},"harita.trof":{baslik:"Yüzey trofu",anlam:"dinamik",ses:{teknik:["İzobarların alçağa doğru içbükey olduğu, eğriliğin en büyük olduğu eksen; Türk analizlerinde kesikli çizgi.","Cephesiz troflar da genelde bulutlu ve sağanaklıdır; Met Office trofu düz kalın çizgiyle çizer."],basit:["Alçağın uzattığı bir parmak.","Parmağın geçtiği yerde bulut ve sağanak olur."],ben:["Ben izobarların en keskin kıvrıldığı noktaları birleştirip trofu çizerim.","Çizginin üstünde sembol yoksa cephe değil, trof derim."]}},"harita.sirt":{baslik:"Yüzey sırtı",anlam:"dinamik",ses:{teknik:["Yüksekten uzanan, izobarların dil gibi çıkıntı yaptığı alan (wedge); antisiklonik, genelde iyi hava.","Ekseni dalgalı/kırık çizgiyle çizilir."],basit:["Yüksek basıncın uzattığı bir dil.","Dilin altında hava genelde sakin ve açık."],ben:["Ben sırtı dalgalı çizgiyle işaretlerim, trofla karışmasın diye.","Sırtın arkasından gelecek trofu da hemen ararım."]}},"harita.siksik":{baslik:"Sık izobarlar",anlam:"ruzgar",ses:{teknik:["İzobar aralığı daraldıkça basınç gradyanı ve geostrofik rüzgar artar.","Fırtına alanı sık izobarların olduğu yerdedir; kart köşesindeki skala hızı knot'a çevirir."],basit:["Dik bir yokuş: hava hızla akar.","Çizgiler sıklaştıkça rüzgar sertleşir."],ben:["Ben sık izobar görünce «kuvvetli ve hamleli rüzgar» derim.","Brifingde yönü de söylerim: «şu yönden şu knot»."]}},"harita.seyrek":{baslik:"Seyrek izobarlar",anlam:"ruzgar",ses:{teknik:["Geniş izobar aralığı = zayıf gradyan = hafif rüzgar ya da sakin.","Yüksek merkez yakınında ve geniş (U) troflarda tipiktir."],basit:["Düz bir ova: hava pek hareket etmez.","Sakin havada sis ve pus daha kolay oluşur."],ben:["Ben seyrek izobar görünce brifingde «hava sakinleşmiş» derim.","Kışsa sis olasılığını not ederim."]}},"harita.istasyon":{baslik:"İstasyon modeli",anlam:"kimlik",ses:{teknik:["Tek istasyonun gözlemi dairenin çevresinde sabit konumlarda: solda T-VV-ww-Td, sağda PPP-eğilim-W1W2, merkezde N.","Rüzgar çubuğu rüzgarın geldiği yöne uzanır; kısa tüy 5, uzun tüy 10, bayrak 50 kt."],basit:["Haritadaki her küçük daire bir istasyonun kimlik kartı.","Kartı okumayı bilen haritanın tamamını okur."],ben:["Ben her modelde önce basıncı ve rüzgarı okurum.","Sonra T − Td farkından havanın ne kadar nemli olduğunu kestiririm."]}},"sev.yuzey":{baslik:"Yüzey (yer kartı)",anlam:"basinc",ses:{teknik:["Deniz seviyesine indirgenmiş basınç, 1000 hPa referansla 4 hPa aralıklı izobarlar; cepheler, merkezler, istasyon modelleri.","Cevapladığı soru: sistemler nerede, rüzgar nereden ne hızla esiyor, cephe nerede?"],basit:["Hissettiğimiz havanın katı.","Yağmur, rüzgar ve sis burada yaşanır."],ben:["Ben brifinge hep yer kartıyla başlarım.","Merkezleri adıyla söyler, izobar sıklığını yorumlarım."]}},"sev.850":{baslik:"850 hPa (~1,5 km)",anlam:"sicaklik",ses:{teknik:["Kontur 150 gpdam referansla 3 dam; izotermler 2,5 °C. Sıcaklık adveksiyonu ve cephe analizi bu katta yapılır.","Cevapladığı soru: sıcak mı soğuk mu hava geliyor, cephe nerede, nem taşınıyor mu?"],basit:["Sürtünmenin bittiği, hava kütlesinin gerçek yüzünü gösteren kat.","Yarının sıcaklığını en iyi bu kat söyler."],ben:["Ben 850'de kontur izotermi kesiyor mu diye bakarım.","Soğuk adveksiyon görürsem yarın için serinleme yazarım."]}},"sev.700":{baslik:"700 hPa (~3 km)",anlam:"nem",ses:{teknik:["Kontur 300 gpdam referansla 6 dam; bağıl nem ve trof yerleri izlenir.","Cevapladığı soru: yağış için yeterli nem var mı, trof hangi bölgede?"],basit:["Bulutların gövdesinin bulunduğu kat.","Burası kuruysa trof gelse bile yağmur cılız kalabilir."],ben:["Ben yağış öngörüsünden önce 700'ün nemine bakarım.","Nemli bant ile trofun örtüştüğü yere yağış yazarım."]}},"sev.500":{baslik:"500 hPa (~5,5 km)",anlam:"dinamik",ses:{teknik:["Kontur 552 gpdam referansla 6 dam; ana akım, trof/sırt, kesik alçak, omega ve vortisite.","Cevapladığı soru: dalga nerede, bize doğru mu geliyor, ne kadar derin?"],basit:["Atmosferin orta katındaki büyük nehir.","Aşağıdaki sistemleri bu nehir taşır."],ben:["Ben öngörüye 500'den başlarım.","552'nin altına inen konturları soğuk ve trof işareti sayarım."]}},"sev.300":{baslik:"300 / 250 / 200 hPa (jet katı)",anlam:"ruzgar",ses:{teknik:["300 hPa'da kontur 900 gpdam referansla 6 dam; izotaklar 60 kt referansla 20 kt aralıkla çizilir.","Cevapladığı soru: jet nerede, çekirdeği ne kadar hızlı, sistemleri hangi yöne sürükleyecek?"],basit:["Gökyüzünün otobanı.","Jet ne kadar güçlüyse sistemler o kadar hızlı taşınır."],ben:["Ben 300'de izotakların en sık toplandığı şeridi jet diye işaretlerim.","Jet bir sistemi bırakmışsa o sistemin yerinde kalabileceğini düşünürüm."]}},"trof.eksen":{baslik:"Trof ekseni (kesikli çizgi)",anlam:"dinamik",ses:{teknik:["Konturların en keskin kıvrıldığı noktalardan geçen kesikli çizgi; üzerinde rüzgar dönmesi olmalı.","Önündeki ve arkasındaki rüzgarlara paralel çizgilerin oluşturduğu açının açıortayından geçer."],basit:["Oluğun dibinden geçen bir dikiş çizgisi.","Çizginin iki yanında rüzgar farklı yönlerden eser."],ben:["Ben ekseni çizmeden önce iki yandaki okları karşılaştırırım.","Okların döndüğü yerden kesikli çizgimi geçiririm."]}},"trof.sirt":{baslik:"Sırt ekseni (dalgalı çizgi)",anlam:"dinamik",ses:{teknik:["Yüksek değerli dilin ekseni; arkasında SW, önünde NW akış, antisiklonik eğrilik.","Bir sıcak hava dili besler; sırt ve sırt önünde genelde iyi hava (sis hariç)."],basit:["Hava nehrinin kuzeye kabaran tümseği.","Altında ılık, sakin günler."],ben:["Ben sırtı dalgalı çizgiyle çizerim.","Sırt arkasında yağışa da hazırlıklı olurum; sıradaki trof oradan gelir."]}},"trof.onu":{baslik:"Trofun önü (doğusu)",anlam:"dinamik",ses:{teknik:["SW akış, pozitif vortisite, üst seviyede diverjans: yükselme, bulut, sağanak.","Yağış öngörüsünün asıl yeri; cephe sistemleri de trofun önünde bulunur."],basit:["Havanın yokuş yukarı tırmandığı taraf.","Tırmanan hava soğur ve yağmur bırakır."],ben:["Ben yağışı hep kesikli çizginin doğusunda ararım.","Trof yaklaşırken rüzgarın backing yaptığını görürüm."]}},"trof.arkasi":{baslik:"Trofun arkası (batısı)",anlam:"dinamik",ses:{teknik:["N–NW akış, negatif vortisite, üst seviyede konverjans ve çökme: açılma, serinleme.","İstisna: çok soğuk hava geldiyse ya da dağ yamacında (orografik) sağanak görülebilir."],basit:["Havanın yukarıdan aşağı bastırdığı taraf.","Bulutlar dağılır, hava serin ve berrak olur."],ben:["Ben trof geçince «açılıyor ama serin» derim.","Çok soğuk hava geldiyse sağanak ihtimalini de not ederim."]}},"trof.kesik":{baslik:"Kesik alçak (cut-off low)",anlam:"dinamik",ses:{teknik:["Konturları tamamen kapanıp ana batı akımından kopmuş alçak merkez; yavaş ya da durağan.","Ana trofun yanında tali troflar görülür; yağış günlerce sürebilir."],basit:["Nehirden kopup kenarda dönen bir girdap.","Akıntı onu kolay götürmez, hava günlerce aynı kalır."],ben:["Ben kapalı kontur görünce «yarın geçer» demem.","Tam kapalı değilse kesik alçak değil, trof derim."]}},"trof.omega":{baslik:"Omega blokajı",anlam:"dinamik",ses:{teknik:["Trof–sırt–trof dizisi Ω çizer; ortadaki sırt doğuya ilerlemeyi keser.","Sırt altında 4–5 günden uzun sıcak-kuru, yanlardaki troflarda 4–5 günden uzun yağışlı hava eğilimi."],basit:["Yola park etmiş bir kamyon: arkasındaki trafik durur.","Kamyonun altı güneşli, iki yanı yağışlı kalır."],ben:["Ben Ω görünce öngörüme «kalıcı» yazarım.","Jet bu sistemi sürüklemiyorsa blokajın süreceğini düşünürüm."]}},"trof.zonal":{baslik:"Zonal ↔ meridyonel akış",anlam:"dinamik",ses:{teknik:["Zonal: konturlar enleme paralel, sığ dalgalar, sistemler hızlı geçer.","Meridyonel: derin trof ve sırtlar, kuzey–güney taşınım; kesik alçak ve blokaj olasılığı artar."],basit:["Zonal düz bir otoyol, meridyonel virajlı bir dağ yolu.","Virajlar arttıkça hava daha uç ve daha kalıcı olur."],ben:["Ben konturlar yataysa «hızlı değişen hava» derim.","Derin kıvrımlar varsa «uzun süreli sıcak ya da soğuk» derim."]}},"trof.ruzgar":{baslik:"Rüzgar dönmesi: 310 → 270 → 240",anlam:"ruzgar",ses:{teknik:["Ana trofta arkada NW (~310–320°), üstünde W (270°), önde SW (~240°).","Aynı istasyonda zamanla 310 → 270 → 240 backing: trof yaklaşıyor; 240 → 270 → 310 veering: sırt yaklaşıyor."],basit:["Rüzgarın yönü bir saat ibresi gibi döner; dönüş yönü neyin geldiğini söyler.","Saat tersine dönüş trofu, saat yönünde dönüş sırtı haber verir."],ben:["Ben üç oku yan yana koyar, sayılar azalıyorsa «backing» derim.","Backing'de soğuma, veering'de ısınma beklerim."]}},"trof.egim":{baslik:"Eksenin yükseklikle batıya eğimi",anlam:"dinamik",ses:{teknik:["Baroklinik sistemde üst seviye trof/alçak, yer alçağının batısında (gerisinde) kalır: eksen yükseklikle geriye eğik.","Eğim kayboldukça (merkezler üst üste) sistem olgunlaşır ve dolmaya gider; barotropik sistem dik eksenli ve durağandır."],basit:["Gelişen bir fırtına eğik bir merdivene benzer: üst basamak geride.","Merdiven dikleşince fırtına gücünü kaybeder."],ben:["Ben 500 hPa trofunu yer alçağının batısında görünce «gelişiyor» derim.","Tam üstündeyse «olgun» derim."]}}},dr=[{id:"d1-s01",konu:"gozlem-kod",tip:"kod çözme",olasilik:3,s:"Decode the Section 1 group 11025. (Bölüm 1'deki 11025 grubunu çöz.)",adimlar:["İlk rakam 1 → sıcaklık grubu (1snTTT).","İkinci rakam sn = 1 → sıcaklık sıfırın altında.","TTT = 025 → 2,5; işaretle birlikte −2,5 °C."],cevap:"Hava sıcaklığı −2,5 °C.",widget:"kodcoz"},{id:"d1-s02",konu:"gozlem-kod",tip:"kod çözme",olasilik:3,s:"A report contains 30022 and 40184. Which one is plotted on the surface chart, and what are the values? (Raporda 30022 ve 40184 var. Hangisi yer kartına işlenir, değerler ne?)",adimlar:["3 grubu = istasyon (aktüel) basıncı; 4 grubu = deniz seviyesine indirgenmiş basınç.","Binler hanesi atılmış: 0022 → 1002,2 hPa; 0184 → 1018,4 hPa.","İzobar analizi deniz seviyesi basıncıyla yapılır."],cevap:"Haritaya 40184 → 1018,4 hPa işlenir; 30022 istasyon basıncıdır (1002,2 hPa).",widget:"kodcoz"},{id:"d1-s03",konu:"gozlem-kod",tip:"kod çözme",olasilik:2,s:"Decode 14124 (Section 0) and 73603. Give the wind direction, speed and unit. (14124 ve 73603'ü çöz: rüzgar yönü, hızı ve birimi?)",adimlar:["YYGGiw: YY = 14 (ayın 14'ü), GG = 12 UTC, iw = 4 → anemometre, knot.","Nddff: N = 7 → 7/8 kapalı; dd = 36 → 355–004°, yani kuzey.","ff = 03 → 3 kt."],cevap:"Kuzeyden (~360°) 3 kt; gök 7/8 kapalı; gözlem ayın 14'ü, 12 UTC.",widget:"kodcoz"},{id:"d1-s04",konu:"gozlem-kod",tip:"kod çözme",olasilik:2,s:"In the group iRixhVV the visibility code is VV = 56. What is the visibility? (VV = 56 ise görüş kaç?)",adimlar:["VV 50'den büyük; 51–55 kullanılmaz, 56 → 56–80 aralığında.","Bu aralıkta görüş = kod − 50 (km).","56 − 50 = 6 km."],cevap:"6 km (5,6 km değil).",widget:"kodcoz"},{id:"d1-s05",konu:"istasyon-modeli",tip:"istasyon modeli okuma",olasilik:3,s:"A station plot shows 042 at the upper right and 05 with a falling symbol below it. Decode both. (Modelde sağ üstte 042, altında 05 ve düşen sembol var. İkisini de çöz.)",adimlar:["042: ilk hane 0 < 5 → başına 10 → 10042.","Son hane ondalık → 1004,2 hPa.","05 + düşen sembol → son 3 saatte 0,5 hPa düşüş."],cevap:"Deniz seviyesi basıncı 1004,2 hPa; son 3 saatte 0,5 hPa düşmüş.",widget:"kurucu"},{id:"d1-s06",konu:"istasyon-modeli",tip:"istasyon modeli okuma",olasilik:3,s:"A wind barb extends from the station toward the southwest with one pennant and two full barbs. What is the wind? (Çubuk güneybatıya uzanıyor; 1 bayrak ve 2 uzun tüy var. Rüzgar ne?)",adimlar:["Çubuk rüzgarın geldiği yönü gösterir → güneybatıdan (~225°).","Hız: bayrak 50 + 2 × 10 = 70 kt.","Tahmin diliyle: «225'ten 70 kt»."],cevap:"Güneybatıdan 70 kt.",widget:"kurucu"},{id:"d1-s07",konu:"istasyon-modeli",tip:"hesap",olasilik:2,s:"The wind is dd = 240°, ff = 20 kt. Compute the u and v components. (dd = 240°, ff = 20 kt için u ve v bileşenlerini hesapla.)",adimlar:["u = −ff·sin(dd), v = −ff·cos(dd).","sin 240° = −0,866 →
