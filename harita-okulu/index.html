u = −20 × (−0,866) = +17,3 kt.","cos 240° = −0,5 → v = −20 × (−0,5) = +10 kt."],cevap:"u ≈ +17,3 kt (doğuya), v = +10 kt (kuzeye); rüzgar kuzeydoğuya doğru eser.",widget:"kurucu"},{id:"d1-s08",konu:"yuzey-haritasi",tip:"harita yorumu",olasilik:3,s:"On a surface chart the isobars are tightly packed over the Aegean but widely spaced over Central Anatolia. Compare the winds. (İzobarlar Ege'de sık, İç Anadolu'da seyrek. Rüzgarları karşılaştır.)",adimlar:["Sık izobar = büyük basınç gradyanı.","Gradyan büyükse geostrofik rüzgar büyük: Ege'de kuvvetli, hamleli rüzgar.","Seyrek izobar = zayıf gradyan: İç Anadolu'da hafif rüzgar ya da sakin."],cevap:"Ege'de kuvvetli, İç Anadolu'da hafif rüzgar.",widget:"harita"},{id:"d1-s09",konu:"yuzey-haritasi",tip:"doğru-yanlış",olasilik:3,s:"True or false: On the surface chart the wind blows parallel to the isobars. (Doğru mu yanlış mı: Yer kartında rüzgar izobarlara paralel eser.)",adimlar:["Paralellik geostrofik dengede, sürtünmesiz seviyede geçerlidir.","Yerde sürtünme rüzgarı yavaşlatır, Coriolis zayıflar.","Gradyan kuvveti baskın çıkar: rüzgar izobarları alçağa doğru keser."],cevap:"Yanlış. Yerde rüzgar izobarları keser: alçakta içe, yüksekte dışa doğru.",widget:"harita"},{id:"d1-s10",konu:"seviyeler",tip:"tanım",olasilik:3,s:"What are the reference contour and the contour interval on the 500 hPa chart? Give those of 850 hPa too. (500 hPa'da referans kontur ve aralık kaç? 850 hPa'nınkini de ver.)",adimlar:["Üst seviye kartlarında kontur = eş jeopotansiyel yükseklik (gpdam).","500 hPa: 552 gpdam referans, 6 dam aralık (546, 552, 558…).","850 hPa: 150 gpdam referans, 3 dam aralık."],cevap:"500 hPa: 552 gpdam, 6 dam; 850 hPa: 150 gpdam, 3 dam (yer kartında izobar 4 hPa).",widget:"seviyeler"},{id:"d1-s11",konu:"trof-sirt",tip:"harita yorumu",olasilik:3,s:"Three stations a, b, c report 500 hPa winds of 320°, 270° and 240°. Locate the trough axis and the area of likely precipitation. (a 320°, b 270°, c 240°. Trof ekseni nerede, yağış nerede beklenir?)",adimlar:["Rüzgar a'dan c'ye saat tersine dönüyor (backing): aralarından trof geçiyor.","Ana trof: arkada NW, üstünde W (270°), önde SW → eksen b'den geçer.","Yağış trofun önünde (c tarafı: SW akış, +vortisite); a tarafında çökme; b üzerinde ~%50."],cevap:"Trof ekseni b üzerinden geçer; yağış c tarafında (trofun önü), a tarafı açılır.",widget:"trof"},{id:"d1-s12",konu:"trof-sirt",tip:"tanım",olasilik:3,s:"How are trough and ridge axes drawn on Turkish analyses, and how does the Met Office show a trough? (Türk analizlerinde trof ve sırt ekseni nasıl çizilir, Met Office trofu nasıl gösterir?)",adimlar:["Trof: konturların en keskin kıvrımından geçen kesikli çizgi (- - -).","Sırt: dalgalı/kırık çizgi (~).","Met Office: trof düz kalın çizgi; üzerinde cephe sembolü yoktur."],cevap:"Trof kesikli, sırt dalgalı çizgi; Met Office trofu sembolsüz düz kalın çizgiyle çizer.",widget:"trof"},{id:"d1-s13",konu:"siklon",tip:"doğru-yanlış",olasilik:3,s:"True or false: Every cyclone has a frontal system. (Doğru mu yanlış mı: Her siklonun bir cephe sistemi vardır.)",adimlar:["Cepheler siklonların içinde oluşur: her cephe bir siklona bağlıdır.","Tersi zorunlu değildir: tropikal siklonlar ve sıcak çekirdekli alçaklar (ör. Basra) cephesiz olabilir."],cevap:"Yanlış. Her cephe bir siklondadır, ama her siklonda cephe yoktur.",widget:"harita"},{id:"d1-s14",konu:"siklon",tip:"tanım",olasilik:2,s:"There is a low at the surface but a ridge at 500 hPa above it. What type of low is this? Give an example affecting Turkey. (Yerde alçak, 500 hPa'da sırt var. Bu ne tip alçak? Türkiye'den örnek ver.)",adimlar:["Yerde A, yukarıda Y/sırt → sütun sıcak ve kalın: çekirdek sıcak.","Sıcak çekirdekli alçak: etkinliği az, yağış seyrek.","Örnek: yazın güneydoğudan etkileyen Basra alçağı."],cevap:"Sıcak çekirdekli alçak; örnek: Basra alçağı (yaz).",widget:"seviyeler"}],mr=[{id:"adveksiyon",no:"8",baslik:"Adveksiyon — rüzgar sıcaklığı taşır",ozet:"Rüzgar izotermleri keserse sıcak ya da soğuk hava taşır. 850 hPa'da izohips × izoterm kesişimiyle bulunur.",neden:"Sıcaklık değişiminin ve düşey hareketin anahtarı. Ödevde ve sınavda 850 hPa kartına X işaretleme olarak gelme eğiliminde.",widget:"adveksiyon",kavramlar:[{id:"adv-tanim",baslik:"Adveksiyon nedir?",ozet:"Sıcaklık, nem gibi bir özelliğin rüzgarla yatay taşınması.",anlam:"sicaklik",ses:{teknik:["Adveksiyon (advection): sıcak, soğuk, nemli ya da kuru havanın rüzgarla yatay taşınması.","Termal adveksiyon = −V·∇T; sabit bir noktada sıcaklığın taşınmayla değişimini verir.","Adveksiyonlu sistemler baroklinik ve aktiftir; çoğu zaman bir cephe sistemi içerir."],basit:["Rüzgar bir taşıma bandı: güneyden esiyorsa sıcağı, kuzeyden esiyorsa soğuğu getirir.","Sıcaklık yerinde değişmez; başka yerden gelen hava onu değiştirir."],ben:["Ben «rüzgar neyi nereye taşıyor?» diye sorarım; cevap adveksiyonun adıdır.","Formüldeki eksiyi unutmam: rüzgar sıcak taraftan esiyorsa sonuç pozitif, yani ısınma."]},formul:[{satir:"(∂T/∂t)adv = −V · ∇T = −(u ∂T/∂x + v ∂T/∂y)",terimler:[["(∂T/∂t)adv","taşınmadan doğan yerel sıcaklık değişimi","K/s"],["V","yatay rüzgar vektörü (u, v)","m/s"],["∇T","yatay sıcaklık gradyanı (soğuktan sıcağa yönelir)","K/m"],["u, v","rüzgarın doğu ve kuzey bileşenleri","m/s"]],not:"Rüzgar sıcaktan soğuğa eserse −V·∇T > 0: sıcak adveksiyon. Soğuktan sıcağa eserse < 0: soğuk adveksiyon."}],sorular:[{s:"850 hPa'da güneyi 10 °C, kuzeyi 0 °C olan bir alanda güneyli rüzgar esiyor. Hangi adveksiyon?",c:["Rüzgar sıcak taraftan (güney) soğuk tarafa (kuzey) esiyor.","Sıcaktan soğuğa akış = sıcak adveksiyon; bulunduğun noktada sıcaklık artar."]}],kaynak:"ADVECTION"},{id:"adv-850",baslik:"850 hPa'da adveksiyon bulma",ozet:"Konturun izotermi kestiği her noktaya X koy; akış yönüne bakıp türünü söyle.",anlam:"sicaklik",ses:{teknik:["Üst seviye kartında kontur (izohips) izotermi kesiyorsa o noktada adveksiyon vardır.","Jeostrofik rüzgar konturlara paralel eser; KYK'de alçak değer akışın solunda kalır.","Soğuk izotermden sıcağa akış: soğuk adveksiyon (mavi X). Sıcaktan soğuğa: sıcak adveksiyon (kırmızı X)."],basit:["Konturlar nehir yatağı, izotermler sıcaklık şeritleri: nehir şeridi kestiği yerde sıcaklık taşınır.","Akışla birlikte yürü: daha soğuk şeride giriyorsan yanında sıcak hava taşıyorsun."],ben:["Ben rüzgar okunu izotermlere çarptırırım; sıcaktan geliyorsa sıcak adveksiyon derim.","Önce akış yönünü bulurum: alçak değerli kontur solumda kalacak şekilde yürürüm."]},tablo:{baslik:["Akış","Tür","Noktada ne olur?"],satirlar:[["Soğuk izotermden sıcak izoterme","Soğuk adveksiyon (CAA)","İzoterm değeri düşer"],["Sıcak izotermden soğuk izoterme","Sıcak adveksiyon (WAA)","İzoterm değeri artar"],["Kontur ∥ izoterm (kesişme yok)","Adveksiyon yok","Sıcaklık taşınmaz (barotropik)"]]},sekil:[{src:"img/ders2/adv-soguk.png",alt:"Alçak merkez çevresinde konturlar ve kesik izotermler; kesişim noktalarında mavi X işaretleri",cap:"Soğuk adveksiyon: akış soğuk izotermden sıcağa doğru keser; kesişimlere mavi X.",kaynak:"Ders dosyası: ADVECTION"},{src:"img/ders2/adv-sicak.png",alt:"Yüksek (Y) merkez çevresinde konturlar, noktalı izotermler ve kırmızı X işaretleri",cap:"Sıcak adveksiyon: akış sıcak izotermden soğuğa doğru keser; kesişimlere kırmızı X.",kaynak:"Ders dosyası: ADVECTION"}],tuzak:"Kontur ile izoterm paralelse adveksiyon yoktur; rüzgar ne kadar kuvvetli olursa olsun sıcaklık taşınmaz.",sorular:[{s:"850 hPa'da kuzeybatılı akış konturları izleyerek −15 °C izoterminden −5 °C izotermine geçiyor. Ne işaretlersin?",c:["Akış soğuk (−15) taraftan sıcak (−5) tarafa.","Soğuk adveksiyon: kesişim noktalarına mavi X.","Bu noktalarda önümüzdeki saatlerde sıcaklık düşer."],ipucu:"Akış yönü: arkanı rüzgara ver, alçak değer solunda."}],alt:[{id:"adv-yon",baslik:"Akış yönünü doğru bulmak",ozet:"KYK'de jeostrofik akışta alçak yükseklik solda, yüksek sağda kalır (Buys Ballot).",anlam:"ruzgar",ses:{teknik:["Buys Ballot: KYK'de arkanı rüzgara verirsen alçak basınç (yükseklik) sol elinde kalır.","Alçak merkez çevresinde akış saat tersine, yüksek merkez çevresinde saat yönünde."],basit:["Alçak merkezin etrafında hava saatin tersine, yüksekte saat yönünde döner.","Yönü bulmadan X'in rengini seçemezsin."],ben:["Ben 500 hPa'da 552 solumda, 564 sağımda kalacak şekilde ok çizerim.","Sonra bu okun izotermleri hangi sırayla kestiğine bakarım."]},kaynak:"ADVECTION; factsheet_11-interpreting-weather-charts"}],kaynak:"ADVECTION; FRONTS_2"},{id:"adv-siddet",baslik:"Şiddet: açı ve sıklık",ozet:"Kesişme açısı 90°'ye yaklaştıkça, rüzgar hızlandıkça ve izotermler sıklaştıkça adveksiyon güçlenir.",anlam:"sicaklik",ses:{teknik:["|V·∇T| = |V|·|∇T|·|cos α|: rüzgar hızı, sıcaklık gradyanı ve aradaki açı birlikte belirler.","Kontur–izoterm açısı 90°'ye yakınsa en güçlü; paralele yakınsa sıfıra yakın.","Pratik: sık kontur (hızlı rüzgar) × sık izoterm × dik açı = kuvvetli adveksiyon."],basit:["Taşıma bandı hızlıysa ve iki uç arasındaki sıcaklık farkı büyükse, değişim de büyük olur.","Rüzgar izotermlere dik eserse taşıma tam verimli; yan yan eserse yarım kalır."],ben:["Ben kesişimlerin oluşturduğu kutulara bakarım: küçük, kareye yakın kutular = güçlü adveksiyon.","Uzun, ince, paralele yakın kutular görürsem «zayıf» yazarım."]},formul:[{satir:"|V · ∇T| = |V| · |∇T| · |cos α|",terimler:[["|V|","rüzgar hızı (kontur sıklığıyla artar)","m/s"],["|∇T|","sıcaklık gradyanı (izoterm sıklığı)","K/100 km"],["α","rüzgar yönü ile sıcaklık gradyanı arasındaki açı","°"]],not:"α = 0° ya da 180°: rüzgar izotermlere dik, adveksiyon en büyük. α = 90°: rüzgar izotermlere paralel, adveksiyon yok."}],sorular:[{s:"Rüzgar 20 m/s, izotermlere dik ve soğuktan sıcağa esiyor; gradyan 5 K/100 km. Saatlik etki?",c:["20 m/s × 3600 s ≈ 72 km/saat yol.","72 km × 5 K/100 km ≈ 3,6 K.","Soğuk taraftan geldiği için yaklaşık −3,6 K/saat (yalnız adveksiyon; ısınma, karışma hariç)."]}],kaynak:"ADVECTION"},{id:"adv-sonuc",baslik:"Adveksiyonun sonuçları",ozet:"Sıcak adveksiyon yükselme ve bulut getirir; soğuk adveksiyon çökme, soğuma ve trof derinleşmesi.",anlam:"dinamik",ses:{teknik:["Sıcak adveksiyon (WAA): yükselme, bulut ve uygun nemde yağış; üst seviye sırtını kuvvetlendirir.","Soğuk adveksiyon (CAA): çökme, bulut açılması; kolon soğur, üst seviye trofu derinleşir.","Soğuk cephe geçişindeki sıcaklık düşüşünü kuzeybatılı akıştaki soğuk adveksiyon sağlar."],basit:["Sıcak hava gelince hafifler ve yükselir: bulut ve yağış.","Soğuk hava gelince ağırlaşır ve çöker: hava açar ama soğur, yukarıdaki çukur derinleşir."],ben:["Ben trofun önünde kırmızı X görünce «yağış adayı» diye not alırım.","Trofun arkasında mavi X yığını varsa «trof derinleşecek, soğuma gelecek» derim."]},tablo:{baslik:["","Sıcak adveksiyon","Soğuk adveksiyon"],satirlar:[["Düşey hareket","Yükselme","Çökme"],["Bulut / yağış","Artar (nem varsa yağış)","Azalır; deniz üstünde sağanak olabilir"],["Üst seviye","Sırt kuvvetlenir","Trof derinleşir"],["Tipik akış","Güney – güneybatı","Kuzey – kuzeybatı"],["Cephe ilişkisi","Sıcak cephe önü","Soğuk cephe arkası"]]},sorular:[{s:"500 hPa trofunun batısında, 850 hPa'da yoğun soğuk adveksiyon var. Trof ne olur?",c:["Soğuk adveksiyon kolonu soğutur, tabaka kalınlığı azalır.","Üst seviye yükseklikleri düşer: trof derinleşir, güneye sarkabilir."]}],kaynak:"ADVECTION; FRONTS_2"},{id:"adv-baroklinik",baslik:"Barotropik mi, baroklinik mi?",ozet:"Kontur ve izoterm kesişmiyorsa barotropik (yavaş), kesişiyorsa baroklinik (hareketli, cepheli) model.",anlam:"dinamik",ses:{teknik:["Barotropik: kontur ∥ izoterm, adveksiyon yok; yer ve üst merkez aynı düşey eksende, sistem yavaş.","Baroklinik: kontur × izoterm, adveksiyon var; eksen yükseklikle geriye eğik, cepheli ve hareketli.","Türkiye: barotropik Nisan–Haziran başı (kırkikindi), baroklinik geç sonbahar, kış ve erken ilkbahar."],basit:["Barotropik alçak yerinde dönen bir topaç; baroklinik alçak sıcak-soğuk farkıyla yürüyen bir motor.","Barotropik sistem günlerce aynı yerde kalıp her öğleden sonra sağanak yapabilir."],ben:["Ben merkez çevresinde hiç X göremiyorsam «barotropik, pek kıpırdamaz» derim.","Kırkikindi = ilkbahar + barotropik alçak + öğleden sonra kararsızlık; böyle aklımda."]},sekil:[{src:"img/ders2/baroklinik-model.png",alt:"Alçak (A) merkez çevresinde kontur ve izotermlerin kesiştiği yatay kesit ve geriye eğik düşey eksen şeması",cap:"Baroklinik model: kontur × izoterm (mavi X soğuk, kırmızı X sıcak); yer → 850 → 500 merkez ekseni eğik.",kaynak:"Ders dosyası: ADVECTION"}],tuzak:"Barotropik alçak «zayıf» demek değildir; yerinde kalıp günlerce sağanak üretebilir.",kaynak:"ADVECTION"},{id:"adv-nem",baslik:"Nem adveksiyonu",ozet:"Aynı mantık nem için: rüzgar nemli bölgeden kuru bölgeye eserse nem taşınır.",anlam:"nem",ses:{teknik:["Nem adveksiyonu = −V·∇q (q: özgül nem); 850 ve 700 hPa'da çiy noktası ve bağıl nemle izlenir.","Nem adveksiyonu + yükselme (trof önü, sıcak adveksiyon) = yağış potansiyeli.","Türkiye için nem kaynakları: Akdeniz ve Ege (G-GB akış), Karadeniz (K-KD akış)."],basit:["Rüzgar denizden geliyorsa nemi de getirir; kuru karadan geliyorsa havayı kurutur.","Sıcak ve nemli taşınma birlikteyse yağış ihtimali katlanır."],ben:["Ben 850'de çiy noktası sayılarına bakar, rüzgarın nemli havayı nereye ittiğini izlerim.","İstanbul için poyraz (KD) Karadeniz nemi, lodos (GB) Marmara-Ege nemi demek."]},kaynak:"ADVECTION"}],oz:"Rüzgar sıcaktan soğuğa akıyorsa sıcak, soğuktan sıcağa akıyorsa soğuk adveksiyon; kesişme yoksa adveksiyon yok."},{id:"termal-ruzgar",no:"9",baslik:"Termal rüzgar — yükseklikle dönen rüzgar",ozet:"İki seviye arasındaki jeostrofik rüzgar farkı ortalama izotermlere paraleldir; dönme yönü adveksiyonu söyler.",neden:"Tek bir sondanın rüzgar profilinden sıcak/soğuk adveksiyonu okumanın yolu; jetin cephe bölgesi üstünde olmasını açıklar.",widget:"termal",kavramlar:[{id:"tr-tanim",baslik:"Termal rüzgar nedir?",ozet:"Üst ve alt seviye jeostrofik rüzgar vektörlerinin farkı: V_T = V_g(üst) − V_g(alt).",anlam:"ruzgar",ses:{teknik:["Yatay sıcaklık gradyanı varsa hidrostatik denge gereği jeostrofik rüzgar düşeyde değişir (shear).","Termal rüzgar (thermal wind) V_T = V_g(p₂) − V_g(p₁), p₂ < p₁; gerçek bir rüzgar değil, vektör farkı.","V_T kalınlık (thickness) çizgilerine paraleldir; KYK'de düşük kalınlık (soğuk) solda kalır."],basit:["Alttaki ve üstteki rüzgar okunu aynı noktadan çiz; alt okun ucundan üst okun ucuna giden ok termal rüzgardır.","Kimse «termal rüzgar» hissetmez; o, sıcaklık farkının rüzgar profilinde bıraktığı izdir."],ben:["Ben V_T'yi alt rüzgarın ucundan üst rüzgarın ucuna çizerim.","Sonra okun üstünde yürüdüğümü düşünürüm: soğuk sol elimde, sıcak sağ elimde."]},formul:[{satir:"V_T = V_g(p₂) − V_g(p₁) = (g/f) · k × ∇p(Z₂ − Z₁)",terimler:[["V_T","termal rüzgar vektörü","m/s"],["V_g(p₁), V_g(p₂)","alt (p₁) ve üst (p₂) seviyedeki jeostrofik rüzgar","m/s"],["g","yerçekimi ivmesi (≈ 9,81)","m/s²"],["f","Coriolis parametresi (2Ω sin φ)","1/s"],["k ×","düşey birim vektörle çarpım: gradyanı 90° sola döndürür","—"],["Z₂ − Z₁ = ΔZ","tabaka kalınlığı (thickness)","gpm"]],not:"Ders dosyası (3.58): V_T kalınlık gradyanıyla orantılı ve ona diktir."},{satir:"V_T = (R/f) · ln(p₁/p₂) · k × ∇p T̄",terimler:[["R","kuru hava gaz sabiti (287)","J/(kg·K)"],["p₁, p₂","alt ve üst basınç seviyesi (p₁ > p₂)","hPa"],["T̄","tabakanın ortalama sıcaklığı","K"],["∇p T̄","ortalama sıcaklığın izobarik yüzeydeki gradyanı","K/m"]],not:"Kalınlık ortalama sıcaklıkla orantılı (ΔZ = R·T̄/g · ln(p₁/p₂)): kalınlık çizgileri = ortalama izotermler (3.59)."}],sekil:[{src:"img/ders2/termal-kalinlik.png",alt:"1000 hPa ve 500 hPa konturları, 500–1000 hPa kalınlık çizgileri ve V_G1000, V_G500, V_T vektörleri",cap:"V_G1000'den V_G500'e saat yönünde dönüş; fark V_T kalınlık çizgilerine paralel, düşük kalınlık solda.",kaynak:"Ders dosyası: Thermal Wind"}],sorular:[{s:"1000 hPa rüzgarı batıdan 10 m/s, 500 hPa rüzgarı batıdan 30 m/s. Termal rüzgar nedir?",c:["Yön aynı; fark yalnız şiddette: V_T = 20 m/s, batıdan doğuya.","Kalınlık çizgileri doğu-batı uzanır; soğuk solda: kuzey soğuk, güney sıcak.","Yükseklikle dönme yok → katmanda sıcaklık adveksiyonu yok."]}],kaynak:"Thermal Wind"},{id:"tr-veering",baslik:"Veering = sıcak adveksiyon",ozet:"Rüzgar yükseldikçe saat yönünde dönüyorsa (ör. G → GB → B) katmanda sıcak adveksiyon var.",anlam:"sicaklik",ses:{teknik:["Veering: yükseklikle saat yönünde dönüş, ör. 180° → 225° → 270° (derece artar).","Alt seviye rüzgarı kalınlık çizgilerini sıcaktan soğuğa doğru keser: katmanda sıcak adveksiyon.","Tipik yer sıcak cephe önü; ders tablosunda sıcak cephe için üst rüzgarlar «veer with height»."],basit:["Yukarı çıktıkça rüzgar saat ibresi gibi dönüyorsa aşağıya sıcak hava taşınıyor.","Akıl kancası: Saat yönü = Sıcak (iki S)."],ben:["Ben sondanın rüzgar bayraklarını aşağıdan yukarı okurum; saat yönünde dönüyorsa «sıcak» yazarım.","«Saat yönü = Sıcak» — iki S, unutmuyorum."]},sekil:[{src:"img/ders2/termal-vektor.jpg",alt:"Elle çizilmiş üç vektör üçgeni: V_g1, V_g2 ve kırmızı V_T",cap:"Sol: alt → üst saat yönünde (veering, sıcak adv.). Orta: saat tersine (backing, soğuk adv.). Sağ: aynı yön, hız artışı.",kaynak:"Ders dosyası: Thermal Wind"}],sorular:[{s:"Sonda: 850 hPa 160°/15 kt, 700 hPa 210°/25 kt, 500 hPa 250°/40 kt. Ne var?",c:["Yön 160 → 210 → 250: derece artıyor, saat yönünde dönüş (veering).","Veering → 850–500 katmanında sıcak adveksiyon.","Yorum: sıcak cephe ya da trof önü; yükselme ve bulut beklenir."]}],kaynak:"Thermal Wind; FRONTS_2"},{id:"tr-backing",baslik:"Backing = soğuk adveksiyon",ozet:"Rüzgar yükseldikçe saat tersine dönüyorsa (ör. KB → B → GB) katmanda soğuk adveksiyon var.",anlam:"sicaklik",ses:{teknik:["Backing: yükseklikle saat tersine dönüş, ör. 300° → 270° → 240° (derece azalır).","Alt rüzgar kalınlık çizgilerini soğuktan sıcağa keser: soğuk adveksiyon, çökme, trof derinleşmesi.","Ders tablosunda soğuk cephe için üst rüzgarlar «backs with height»."],basit:["Yukarı çıktıkça rüzgar saatin tersine dönüyorsa aşağıya soğuk hava doluyor.","Soğuk cephenin arkasında böyle bir profil görmek olağandır."],ben:["Ben derece sayıları yukarı doğru azalıyorsa «backing, soğuk» derim.","340° → 020° geçişini azalma sanmam: bu +40°, yani veering."]},tuzak:"360° geçişine dikkat: 340° → 020° saat yönündedir (veering); derece «küçüldü» diye backing deme.",sorular:[{s:"850 hPa 320°/30 kt, 500 hPa 270°/50 kt. Hangi adveksiyon?",c:["320 → 270: −50°, saat tersine dönüş (backing).","Backing → soğuk adveksiyon; soğuk cephe arkası için tipik."]}],kaynak:"Thermal Wind; FRONTS_2"},{id:"tr-jet",baslik:"Termal rüzgar ve jet",ozet:"Güçlü sıcaklık gradyanı üstünde V_T büyür; rüzgar yukarı doğru hızlanır ve jet oluşur.",anlam:"ruzgar",ses:{teknik:["Sık kalınlık çizgisi = büyük ∇T̄ = büyük V_T: rüzgar troposfer boyunca artar, tropopoz altında jet olur.","Polar cephe jeti cephe bölgesinin üstündedir; genç (oklüzyonsuz) sistemde cephelere paralel uzanır.","Oklüzyonlu sistemde jet ekseni oklüzyonun başladığı noktayı keser."],basit:["Kuzey ile güney arasındaki sıcaklık farkı büyüdükçe yukarıdaki rüzgar hızlanır: jet bu farkın ürünü.","Kışın fark büyük olduğu için jet de daha güçlüdür."],ben:["Ben 300 hPa'da jet görünce altında, 850'de sıkışık izoterm kuşağı ararım.","Jet ekseninin soğuk tarafı solumda kalır; tıpkı termal rüzgar gibi."]},kaynak:"Thermal Wind; FRONTS_2"},{id:"tr-kalinlik",baslik:"Kalınlık haritası okuma",ozet:"H500 − H1000 kalınlığı tabakanın ortalama sıcaklığıdır: kalın = sıcak, ince = soğuk.",anlam:"sicaklik",ses:{teknik:["Kalınlık (thickness, rölatif topografya) H500 − H1000; tabaka ortalama sıcaklığıyla doğru orantılı.","Her kalınlık değeri bir ortalama sıcaklığa denk gelir; kalınlık çizgileri ortalama izoterm gibi okunur.","Yer rüzgarı kalınlık çizgilerini yüksek değerden alçağa keserse sıcak adveksiyon vardır."],basit:["Isınan hava genleşir: aynı iki basınç seviyesi arasındaki mesafe uzar.","Kalınlık 540 dam civarına inerse kışın kar–yağmur sınırı konuşulur (yaygın kural)."],ben:["Ben kombine kartta renkli kalınlık alanına bakıp «sıcak dil nereye uzanıyor» diye sorarım.","Kalınlık çizgisi dil gibi kuzeye uzanıyorsa oraya sıcak hava taşınıyor demektir."]},kaynak:"Thermal Wind; FRONTS_2"}],oz:"Yükseldikçe saat yönünde dönüyorsa (veering) sıcak, saat tersine dönüyorsa (backing) soğuk adveksiyon."},{id:"cepheler",no:"10",baslik:"Hava kütleleri ve cepheler",ozet:"Sıcaklık ve nemi farklı iki hava kütlesinin sınırı cephedir; türü sembolden, geçişi istasyon verisinden okunur.",neden:"Yer kartının en çok soru üreten öğesi: sembol tanıma, geçiş tablosu ve 850 hPa'da cephe yerleştirme sınavda klasik.",widget:"cephe",kavramlar:[{id:"hk-tanim",baslik:"Hava kütlesi",ozet:"Sıcaklığı ve nemi yatayda benzer, büyük hava gövdesi; adını kaynak bölgesinden alır.",anlam:"sicaklik",ses:{teknik:["Hava kütlesi (air mass): yatayda benzer sıcaklık ve nem; kaynakta 3 gün – 1-2 hafta kalarak oluşur.","Sıcaklığa göre Tropikal (T), Polar (P), Arktik (A); nem ve kaynağa göre Denizel (m), Karasal (c).","Isınan bölgeye giden kütle altta ısınır, kararsızlaşır, BN düşer; soğuğa giden kararlılaşır, BN artar."],basit:["Hava kütlesi, uzun süre aynı yerde bekleyip o yerin huyunu alan dev bir hava yığını.","Denizden gelen nemli, karadan gelen kuru; kuzeyden gelen soğuk, güneyden gelen sıcak."],ben:["Ben iki harfle okurum: küçük harf nem (m/c), büyük harf sıcaklık (P/T/A).","Kütle sıcak bir denizin üstüne inerse alttan ısınır, kararsızlaşır: sağanak beklerim."]},tablo:{baslik:["Kütle","Özellik","Türkiye için kaynak","Tipik hava"],satirlar:[["mP (Denizel Polar)","serin, nemli","İzlanda / Grönland","Sağanak; kışın kar; iyi görüş"],["cP (Karasal Polar)","soğuk, kuru","Sibirya","Ayaz; Karadeniz'i geçerse kıyıda kar"],["mT (Denizel Tropikal)","ılık, nemli","Azor Adaları","Alçak bulut, çisenti, sis"],["cT (Karasal Tropikal)","sıcak, kuru","Kuzey Afrika","Sıcak dalga, toz taşınımı"],["A (Arktik)","çok soğuk, kuru","Kutup bölgesi","Şiddetli soğuk (nadir)"]],not:"Kaynak bölgeler ders dosyasından; «tipik hava» sütunu genel bilgidir."},sekil:[{src:"img/ders2/hava-kutleleri.png",alt:"Kuzey yarımküre üzerinde mP, cP, mT, cT ve cA hava kütlesi kaynak bölgeleri, arktik ve polar cephe",cap:"Hava kütlesi kaynak bölgeleri ile arktik ve polar cephe.",kaynak:"Ders dosyası: Air Masses and Fronts"}],sorular:[{s:"Türkiye'yi etkileyen dört hava kütlesi ve kaynakları nelerdir?",c:["mP: İzlanda / Grönland.","mT: Azor Adaları.","cP: Sibirya.","cT: Kuzey Afrika."]}],kaynak:"Air Masses and Fronts_2025_Spring"},{id:"cp-soguk",baslik:"Soğuk cephe",ozet:"Soğuk hava sıcağın yerini alır: dik eğim, dar yağış bandı, Cb ve sağanak, ani soğuma.",anlam:"sicaklik",ses:{teknik:["Sembol: mavi çizgi, üçgenler sıcak havaya (hareket yönüne) bakar. Eğim ort. 1:50 (1:50–1:100).","Kalın bulut katmanı, aktif cephede gömülü Cb; dar ve yer yer kuvvetli yağış bandı, dolu ve oraj riski.","Geçişte T ve Td ani düşer, basınç hızla yükselir, rüzgar sertçe saat yönünde döner (veer), hamle yapar."],basit:["Soğuk hava bir kama gibi sıcak havanın altına girip onu hızla yukarı iter.","Kısa ama sert: birkaç saatlik sağanak, ardından serin ve berrak hava."],ben:["Ben barometrede «önce düşüş, sonra hızlı yükseliş» görünce soğuk cephe geçti derim.","İstanbul'da lodosun birden karayele (KB) dönmesi bana soğuk cepheyi anlatır."]},tablo:{baslik:["Öğe","Soğuk cephe (ders tablosu)"],satirlar:[["Eğim","Ort. 1:50; aktif cephede daha dik"],["Bulut","Kalın katmanlı bulut, gömülü Cb; arkada konvektif ve parçalı"],["Hava","Cephe çevresinde dar yağış bandı, yer yer kuvvetli; Cb varsa dolu, oraj"],["Sıcaklık","Genelde düşer; arkadaki berrak havada güneşlenmeyle yükselebilir"],["Çiy noktası","Geçişte düşer"],["Görüş","Yağışta orta; arkada hızla iyi–çok iyi"],["Basınç","Yaklaşırken düşer; geçişte ve arkada hızla yükselir"],["Yer rüzgarı","Önde hafif backing; geçişte sert veering"],["Üst rüzgar","Yükseklikle backing"],["Hareket","Cepheye dik jeostrofik bileşenle"]]},sekil:[{src:"img/ders2/soguk-cephe-kesit.png",alt:"Soğuk cephe düşey kesiti: dik cephe yüzeyi, Cb, sağanak, jet ekseni, tropopoz",cap:"Soğuk cephe kesiti: dik yüzey; Cb ve sağanak cephe üstünde ve hemen arkasında.",kaynak:"Ders dosyası: FRONTS_2"},{src:"img/ders2/soguk-cephe-istasyon.png",alt:"Mavi soğuk cephe çizgisi boyunca istasyon modelleri, sıcaklıklar ve rüzgar bayrakları",cap:"Yatay kesit: cephenin iki yanında sıcaklık sıçrar, rüzgar yönü saat yönünde döner.",kaynak:"Ders dosyası: Fronts"}],tuzak:"Soğuk cephe arkasında sıcaklık her zaman düşmez: berrak havada gündüz güneşlenmeyle yükselebilir.",kaynak:"FRONTS_2; Fronts; Air Masses and Fronts_2025_Spring"},{id:"cp-sicak",baslik:"Sıcak cephe",ozet:"Sıcak hava soğuğun üstüne yavaşça tırmanır: yatık eğim, geniş bulut dizisi, uzun süreli yağış.",anlam:"sicaklik",ses:{teknik:["Sembol: kırmızı çizgi, yarım daireler soğuk havaya (hareket yönüne) bakar. Eğim ort. 1:150 (1:150–1:300).","Bulut dizisi Ci → Cs → As → Ns (St); üst bulut cepheden ~800 km, yağış ~200–400 km önde başlar.","Geçişte T ve Td yükselir, basınç düşüşü durur, rüzgar saat yönünde döner; sıcak sektörde St, Sc, çisenti."],basit:["Sıcak hava, soğuk havanın sırtına rampa gibi yavaş yavaş tırmanır.","Önce ince tüy bulutlar, sonra gri örtü, en sonunda saatlerce süren yağmur."],ben:["Ben gökte Ci ve hale yapan Cs görünce «birkaç saat sonra sıcak cephe yağışı» derim.","Rüzgar önce saat tersine dönüp sertleşiyorsa (backing) sıcak cephe yaklaşıyor."]},tablo:{baslik:["Öğe","Sıcak cephe (ders tablosu)"],satirlar:[["Eğim","Ort. 1:150; aktif cephede daha dik"],["Bulut","Üst bulut artar, kalınlaşır, alçalır; ön kenar ~800 km önde"],["Hava","~200–400 km önde hafif yağış, cepheye yakın orta; geçişten sonra durur"],["Sıcaklık","Geçişte yükselebilir; yağış serinletirse belirgin olmayabilir"],["Çiy noktası","Önde yükselmeye başlar, geçişte sabitlenir"],["Görüş","Önde iyi, yağışta orta; sıcak sektörde zaman zaman zayıf"],["Basınç","Yaklaştıkça artan hızla düşer; sıcak sektörde sabitlenir"],["Yer rüzgarı","Önde backing ve hızlanma; geçişte veering"],["Üst rüzgar","Yükseklikle veering"],["Hareket","Denizde dik jeostrofik bileşenin 4/5–5/6'sı, karada 1/2–2/3'ü"]]},sekil:[{src:"img/ders2/sicak-cephe-kesit.png",alt:"Sıcak cephe düşey kesiti: yatık cephe yüzeyi, Ci, Cs, As, Ns bulut dizisi ve yağış bandı",cap:"Sıcak cephe kesiti: yatık yüzey; bulut ve yağış cephenin önünde, geniş bir alanda.",kaynak:"Ders dosyası: FRONTS_2"}],tuzak:"Sıcak cephe yağışı geçişten önce, cephenin önünde düşer; soğuk cephede yağış cephe üstünde ve hemen arkasındadır.",kaynak:"FRONTS_2; Air Masses and Fronts_2025_Spring; factsheet_11-interpreting-weather-charts"},{id:"cp-oklu-durgun",baslik:"Oklüzyon ve durgun cephe",ozet:"Soğuk cephe sıcak cepheyi yakalayınca sıcak sektör yerden kalkar: oklüzyon. Kımıldamayan sınır: durgun cephe.",anlam:"sicaklik",ses:{teknik:["Oklüzyon: mor çizgi, üçgen ve yarım daire aynı yönde; dik soğuk cephe (1:50) yatık sıcak cepheden (1:150) hızlı.","Soğuk tip: arkadaki hava öndekinden soğuk. Sıcak tip: arkadaki hava öndekinden daha az soğuk.","Durgun (quasi-stationary) cephe: semboller zıt yönlere bakar; hava sıcak cepheye benzer ama daha zayıf."],basit:["Hızlı koşan soğuk cephe yavaş sıcak cepheye yetişir; aradaki sıcak hava yerden koparılıp yukarı itilir.","Durgun cephe: iki hava kütlesi de geri adım atmıyor, sınır yerinde sayıyor."],ben:["Ben oklüzyonu «önü sıcak cephe gibi, arkası soğuk cephe gibi» diye aklımda tutarım.","Durgun cephe görürsem aynı bölgeye günlerce hafif-orta yağış yazarım."]},sekil:[{src:"img/ders2/cephe-sembolleri.png",alt:"Cephe sembolleri tablosu: soğuk, sıcak, oklüzyon, durgun cephe; yerde ve yukarıda; frontogenez ve frontoliz",cap:"Cephe sembolleri: yerde ve yukarıda; cephe oluşumu (frontogenesis) ve sönümü (frontolysis).",kaynak:"Ders dosyası: FRONTS_2"}],tuzak:"Oklüzyonda tüm semboller hareket yönüne bakar; durgun cephede üçgen ve yarım daire zıt yönlerdedir.",alt:[{id:"cp-norvec",baslik:"Norveç siklon modeli: 5 adım",ozet:"Sınır → dalga → olgun siklon → oklüzyon → soğuk hava hâkim, sistem söner.",anlam:"dinamik",ses:{teknik:["1) Belirsiz sınır, 2) sınırda dalga, 3) olgun siklon ve sıcak sektör, 4) oklüzyon, 5) soğuk hava hâkim.","Oklüzyon ilerledikçe sıcak sektör daralır; merkez soğuk havada kalır ve sistem dolmaya başlar."],basit:["Bir siklonun hayatı: doğar (dalga), büyür (sıcak sektör), yaşlanır (oklüzyon), ölür (soğuk hava).","Oklüzyon gördüğün sistem yaşlı bir sistemdir."],ben:["Ben sıcak sektörün genişliğine bakarak sistemin yaşını tahmin ederim.","Uzun bir oklüzyon kolu = olgun ya da sönmeye yakın siklon."]},kaynak:"Air Masses and Fronts_2025_Spring"}],kaynak:"FRONTS_2; Air Masses and Fronts_2025_Spring; factsheet_11-interpreting-weather-charts"},{id:"cp-bulma",baslik:"Cepheyi haritada bulma",ozet:"Dört ölçüt: sıkışık izoterm (sıcak kenar), rüzgar dönmesi, basınç oluğu, çiy noktası sıçraması.",anlam:"dinamik",ses:{teknik:["Yerde: T ve Td sıçraması, izobarlarda V biçimli oluk (trof), rüzgarın saat yönünde dönmesi, tandans değişimi.","850 hPa: cephe sıkışık izoterm kuşağının sıcak kenarına; soğuk cephe soğuk adveksiyonun başladığı yere.","Sıcak cephe sıcak adveksiyon alanları arasına; oklüzyon sıcak izoterm dilinin ortasına çizilir."],basit:["Haritada «kırışık» ararsın: sıcaklığın birden değiştiği, rüzgarın kıvrıldığı, izobarın büküldüğü çizgi.","Cephe her zaman bir oluğun dibindedir; ama her oluk cephe değildir."],ben:["Ben önce rüzgar bayraklarının birden döndüğü istasyon çiftini bulur, çizgiyi aralarından geçiririm.","Tandansta «düşüş sonra yükseliş» eğrisi görürsem o istasyondan soğuk cephe geçmiş derim."]},sekil:[{src:"img/ders2/850-soguk-cephe-adv.png",alt:"850 hPa şeması: konturlar, kesik izotermler, mavi X soğuk adveksiyonlar ve soğuk cephe",cap:"Soğuk cephe 850 hPa'da soğuk adveksiyonların (mavi X) başladığı yere çizilir.",kaynak:"Ders dosyası: FRONTS_2"},{src:"img/ders2/850-okluzyon-dil.png",alt:"850 hPa izotermlerinin oluşturduğu sıcak dil ve ortasından geçen oklüzyon cephesi",cap:"Oklüzyon 850 hPa'da sıcak izoterm dilinin ortasından geçer.",kaynak:"Ders dosyası: FRONTS_2"}],tuzak:"Cepheyi sıkışık izoterm kuşağının ortasına ya da soğuk kenarına değil, sıcak kenarına çiz.",sorular:[{s:"Komşu iki istasyon: A 15/12 °C, 210°/15 kt; B 8/2 °C, 300°/20 kt. Cephe nerede, türü ne?",c:["T ve Td'de 7–10 °C sıçrama; rüzgar 210 → 300, saat yönünde dönüş.","Cephe A ile B arasında; soğuk taraf B (kuzeybatılı akış).","A sıcak sektörde, B cephenin arkasında: soğuk cephe, A'ya doğru ilerliyor."]}],alt:[{id:"cp-jet-kalinlik",baslik:"Cephe – jet – kalınlık ilişkisi",ozet:"Genç sistemde jet cephelere paralel; oklüzyonlu sistemde jet oklüzyon başlangıç noktasını keser.",anlam:"ruzgar",ses:{teknik:["Jet eksenleri genç (oklüzyonsuz) cephe sistemlerine paralel uzanır.","Oklüzyonlu sistemde jet ekseni oklüzyon başlangıç noktasından geçer, sıcak ve soğuk cepheye paralel uzanır.","Kalınlık kartında cepheler, kalınlık çizgilerinin sıklaştığı kuşakta aranır."],basit:["Cephe ile jet kardeştir: biri yerde, biri yukarıda, aynı sıcaklık farkından doğarlar.","Jetin yerini bilirsen cepheyi aramaya nereden başlayacağını bilirsin."],ben:["Ben 300 hPa jetini yer kartına kurşun kalemle taşır, cepheyi ona yakın ararım.","Kalınlık çizgileri sıkışmışsa orada bir cephe olduğundan şüphelenirim."]},kaynak:"FRONTS_2"}],kaynak:"FRONTS_2; Fronts; factsheet_11-interpreting-weather-charts"},{id:"cp-gecis",baslik:"Bir istasyondan polar cephe depresyonunun geçişi",ozet:"Sıcak cephe önü → sıcak cephe → sıcak sektör → soğuk cephe → soğuk cephe arkası: her adımda ne değişir?",anlam:"hava",ses:{teknik:["Sıcak cephe önü: basınç sürekli düşer, Ci–Cs–As–Ns, sürekli yağış; geçişte T ve Td ani yükselir.","Sıcak sektör: GB'dan sabit rüzgar, St/Sc, çisenti, zayıf görüş; basınç hafif düşer.","Soğuk cephe: sert veering, hamle, T ve Td ani düşer, basınç yükselir; arkada Cu/Cb, sağanak, çok iyi görüş."],basit:["Önce uzun gri bir yağmur, sonra ılık ve nemli bir ara, en sonunda kısa sert bir sağanak ve serin berrak hava.","Rüzgar her cephede saat yönünde biraz daha döner: G → GB → KB."],ben:["Ben bu sırayı bir film şeridi gibi düşünürüm; widget'ta istasyonu cepheden geçirip kontrol ederim.","Sınavda tablo sorulursa satır satır: rüzgar, sıcaklık, çiy, basınç, bulut, yağış, görüş."]},tablo:{baslik:["Öğe","Sıcak cephe önü","Sıcak cephede","Sıcak sektör","Soğuk cephede","Soğuk cephe arkası"],satirlar:[["Rüzgar","Hızlanır, hafif backing, güneyli","Sert veering","Sabit, GB'lı","Sert veering, hamle, bora","Sabit ya da hafif veering, KB'lı"],["Sıcaklık","Düşük, sabit","Ani yükseliş","Sabit","Ani düşüş","Düşük, sabit"],["Çiy noktası","Düşük, sabit","Ani yükseliş","Sabit","Ani düşüş","Düşük, sabit"],["Basınç","Sürekli düşüş","Düşüş durur","Hafif düşüş","Yükselmeye başlar","Yavaş yükseliş"],["Bulut","8/8'e artar, taban alçalır: Ci, Cs, As, Ns","8/8, taban çok alçak: Ns, St","6/8–8/8, taban alçak: St, Sc","6/8–8/8, taban yükselir: Cu, Cb, bazen Ns","~6/8, taban yükselir: Cu, Cb"],["Yağış","As'den hafif sürekli, Ns'den orta-kuvvetli","Orta ya da kuvvetli sürekli","Hafif yağmur, çisenti","Kuvvetli sağanak yağmur/kar, oraj, dolu","Sağanak, zaman zaman kuvvetli; dolu, oraj olası"],["Görüş","Zayıflar","Çok zayıf, sis olabilir","Zayıf; kışın adveksiyon sisi","Yağış dışında iyi","Sağanak dışında çok iyi"]]},kaynak:"FRONTS_2"}],oz:"Soğuk cephe dik (1:50), dar bant, sağanak; sıcak cephe yatık (1:150), geniş bant, sürekli yağış; geçişte rüzgar saat yönünde döner."},{id:"kararlilik",no:"11",baslik:"Adyabatik süreçler, kararlılık ve indeksler",ozet:"Parseli çevresiyle kıyasla: parsel sıcaksa yükselir. Kararsızlık indeksleri bunu tek sayıya indirir.",neden:"Sağanak, oraj ve dolu öngörüsünün temeli; kısa sınavda indeks hesabı ve Skew-T yorumu sık gelme eğiliminde.",widget:"indeks",kavramlar:[{id:"ky-adyabat",baslik:"Adyabatik süreç: DALR ve SALR",ozet:"Isı alışverişi olmadan genişleyen parsel soğur: kuru 1 °C/100 m, doymuş ort. 0,6 °C/100 m.",anlam:"kararlilik",ses:{teknik:["Adyabatik: çevreyle ısı alışverişi yok; yükselen parsel genişler ve soğur, alçalan sıkışır ve ısınır.","Kuru adyabatik azalma oranı (DALR) sabittir: 1 °C/100 m (~3 °C/1000 ft).","Doymuş (SALR) gizli ısı yüzünden küçüktür: orta enlem alt seviyede ort. 0,6 °C/100 m."],basit:["Bisiklet pompası sıkıştırınca ısınır, yangın tüpünden çıkan gaz genleşince soğur: aynı ilke.","Bulut içindeki parsel daha yavaş soğur, çünkü yoğuşma ona ısı verir."],ben:["Ben iki sayı tutarım: kuru 1, doymuş yaklaşık 0,6 (°C/100 m).","Soğuk havada ve yükseklerde SALR'nin DALR'ye yaklaştığını unutmam."]},formul:[{satir:"Γd = g / cp ≈ 9,8 K/km (≈ 1 °C/100 m)",terimler:[["Γd","kuru adyabatik azalma oranı (DALR)","K/km"],["g","yerçekimi ivmesi","m/s²"],["cp","kuru havanın sabit basınçta özgül ısısı (≈ 1004)","J/(kg·K)"]],not:"SALR sabit değil: ekvatorda < 0,6; orta enlem alt seviyede ~0,6; kutupta ve yükseklerde > 0,6 °C/100 m."}],tablo:{baslik:["Bölge","DALR (°C/100 m)","Sıcaklık","SALR (°C/100 m)"],satirlar:[["Kutup alt seviye; tüm enlemlerde yüksek seviye","1","Soğuk","> 0,6"],["Orta enlem alt seviye","1","Orta","0,6"],["Ekvator alt seviye","1","Sıcak","< 0,6"]]},kaynak:"Adiabatics and Stability"},{id:"ky-turler",baslik:"Kararlılık türleri",ozet:"Çevre azalma oranı (ELR) DALR ve SALR ile kıyaslanır: mutlak kararsız, şartlı, nötr, mutlak kararlı.",anlam:"kararlilik",ses:{teknik:["ELR > DALR: mutlak kararsız (absolute instability). ELR < SALR: mutlak kararlı (absolute stability).","DALR > ELR > SALR: şartlı kararsız (conditional instability): kuru parsel için kararlı, doymuş için kararsız.","ELR = DALR (kuru) ya da ELR = SALR (doymuş): nötr (neutral)."],basit:["İtilen top geri dönerse kararlı, yuvarlanıp giderse kararsız, bırakıldığı yerde kalırsa nötr.","Şartlı kararsız: hava kuruyken sakin, doyduğu anda yükselmeye hazır."],ben:["Ben ELR'yi iki çizginin arasına koyarım: DALR'den hızlıysa kararsız, SALR'den yavaşsa kararlı.","«Conditional stability» diye bir meteoroloji terimi yok; sınavda görürsem yanlış sayarım."]},tablo:{baslik:["Durum","Koşul","Tipik hava"],satirlar:[["Mutlak kararsız","ELR > DALR","Kümülüs bulutları, orta-kuvvetli sağanak; sağanak dışında iyi görüş"],["Şartlı kararsız","DALR > ELR > SALR","Doyma ve tetik varsa konveksiyon"],["Nötr","ELR = DALR ya da SALR","Parsel bırakıldığı yerde kalır"],["Mutlak kararlı","ELR < SALR","Açık ya da katmanlı bulut; sis, orta-zayıf görüş, hafif sürekli yağış"]]},sekil:[{src:"img/ders2/sartli-kararsizlik.png",alt:"Tepeye itilen kuru ve doymuş parsel şeması; ELR 0,8 °C/100 m",cap:"DALR > ELR > SALR: kuru parsel 300 m'de çevreden soğuk (geri döner), doymuş parsel sıcak (yükselir).",kaynak:"Ders dosyası: Adiabatics and Stability"}],sorular:[{s:"ELR = 0,8 °C/100 m. Kuru ve doymuş parsel için durum nedir?",c:["DALR (1) > 0,8 > SALR (0,6): şartlı kararsız.","Kuru parsel çevreden hızlı soğur → çevreden soğuk kalır, geri döner (kararlı).","Doymuş parsel çevreden yavaş soğur → çevreden sıcak kalır, yükselir (kararsız)."]}],kaynak:"Adiabatics and Stability"},{id:"ky-skewt",baslik:"Skew-T okuma: LCL, LFC, EL",ozet:"Parseli yerden kuru adyabatla LCL'ye, sonra nemli adyabatla yukarı çıkar; çevre eğrisiyle kıyasla.",anlam:"kararlilik",ses:{teknik:["LCL (lifting condensation level): parselin kuru adyabatla yükselip doyduğu seviye; bulut tabanı.","LFC (level of free convection): parselin çevreden ısınmaya başladığı seviye; EL (equilibrium level): yeniden eşitlendiği seviye.","LFC–EL arası pozitif alan CAPE; yer–LFC arası negatif alan CIN."],basit:["Parsel önce kuru yokuşu çıkar, bulut tabanında (LCL) doyar, sonra nemli yokuştan devam eder.","LFC'den sonra parsel kendi kendine yükselir; EL'de durur, örs bulutunun tavanı orasıdır."],ben:["Ben sağdaki çizgiyi sıcaklık, soldakini çiy noktası diye okurum; aradaki açıklık kuruluk demek.","İzotermler 45° sağa yatık; sıcaklığı alt eksene dik değil, eğik çizgi boyunca indiririm."]},sekil:[{src:"img/ders2/skewt-istanbul.png",alt:"İstanbul/Kartal 17064 Skew-T log-P sondası; sağda sıcaklık, solda çiy noktası eğrisi, sağ kenarda rüzgar bayrakları",cap:"Örnek sonda (İstanbul, 17064): sağ eğri T, sol eğri Td; 600 hPa civarında çok kuru katman.",kaynak:"Ders dosyası: brifing örneği"}],tuzak:"Skew-T'de izotermler dik değildir; 500 hPa sıcaklığını alt eksene eğik izoterm boyunca indirerek oku.",sorular:[{s:"Örnek sondada LCL = 951 hPa, yer basıncı ≈ 1013 hPa. Bulut tabanı kabaca kaç metre?",c:["Alt seviyede ≈ 8–9 m/hPa: (1013 − 951) × 8,5 ≈ 530 m.","Sondanın kendi çıktısı ≈ 584 m; kaba hesap aynı mertebede."]}],kaynak:"Instability indexes; Adiabatics and Stability; brifing_örneği"},{id:"ky-parsel",baslik:"Parsel indeksleri: LI ve SI",ozet:"500 hPa'da çevre sıcaklığı eksi parsel sıcaklığı: negatif çıkarsa parsel sıcak, hava kararsız.",anlam:"kararlilik",ses:{teknik:["LI = T500(çevre) − T500(parsel); parsel sınır tabakası ortalama sıcaklık ve neminden kaldırılır.","SI: parsel 850 hPa'dan kuru adyabatla LCL'ye, sonra nemli adyabatla 500'e; aynı fark alınır.","LI: > 0 kararlı, 0…−3 sınırda, −3…−6 orta, −6…−9 çok, < −9 aşırı kararsız."],basit:["500 hPa'ya varan balon çevresinden sıcaksa yükselmeye devam eder: indeks eksi çıkar.","Eksi büyüdükçe fırtınanın güçlü olma ihtimali artar."],ben:["Ben «çevre eksi parsel» sırasını ters yazmam; LI = −5 ise parsel 5 derece sıcak.","Altta sığ soğuk hava varsa SI'ye, nem 850'ye ulaşmıyorsa LI'ye güvenirim."]},formul:[{satir:"LI = T500(çevre) − T500(parsel)",terimler:[["T500(çevre)","500 hPa çevre sıcaklığı","°C"],["T500(parsel)","sınır tabakasından kaldırılan parselin 500 hPa sıcaklığı","°C"]],not:"LI = 1–3 olsa bile güçlü kaldırma varsa zayıf konveksiyon olabilir."},{satir:"SI = T500(çevre) − T500(850 hPa'dan kaldırılan parsel)",terimler:[["T500(850'den parsel)","850'den LCL'ye kuru, sonra 500'e nemli adyabatla çıkan parselin sıcaklığı","°C"]],not:"SI genelde LI kadar kararsız çıkmaz (cephenin kuzeyindeki sığ soğuk hava durumu hariç)."}],sorular:[{s:"500 hPa'da çevre −18 °C, kaldırılan parsel −23 °C. LI ve yorum?",c:["LI = −18 − (−23) = +5.","Pozitif: parsel çevreden soğuk, hava kararlı."]}],kaynak:"Instability indexes"},{id:"ky-seviye",baslik:"Seviye indeksleri: K ve TT",ozet:"Yalnız 850, 700, 500 hPa T ve Td ile hesaplanır; kısa sınavda elle hesap için ideal.",anlam:"kararlilik",ses:{teknik:["K = T850 − T500 + Td850 − (T700 − Td700): azalma oranı + alt seviye nem − 700 hPa kuruluğu.","TT = VT + CT = T850 + Td850 − 2·T500; VT = T850 − T500, CT = Td850 − T500.","TT: 45–50 oraj olası; 50–55 daha olası, şiddetli olabilir; 55–60 şiddetli oraj en olası."],basit:["K: «alt kat sıcak ve nemli, üst kat soğuk, orta kat da nemli mi?» sorusunun puanı.","TT: alt kat sıcak-nemli ve 500 hPa soğuksa puan büyür."],ben:["Ben K'yı üç parça yazarım: (T850 − T500) + Td850 − DD700. Böylece işaret hatası yapmam.","TT'de T500'ü iki kez çıkarıyorum; eksi işarete dikkat: −2·(−20) = +40."]},formul:[{satir:"K = (T850 − T500) + Td850 − (T700 − Td700)",terimler:[["T850, T700, T500","850 / 700 / 500 hPa sıcaklığı","°C"],["Td850, Td700","850 / 700 hPa çiy noktası","°C"],["T700 − Td700 = DD700","700 hPa çiy noktası açığı (kuruluk)","°C"]],not:"700 hPa kuruysa K düşük çıkar; alt seviyede nem, kararsızlık ve tetik varsa yine de şiddetli oraj olabilir."},{satir:"TT = T850 + Td850 − 2·T500 = VT + CT",terimler:[["VT = T850 − T500","dikey toplam: 850–500 statik kararlılık (40 ≈ kuru adyabatik)","°C"],["CT = Td850 − T500","çapraz toplam: 850 nemi + 500 soğukluğu (> 18 çoğu zaman gerekli)","°C"]],not:"VT ≈ 26 ve üstü nemden bağımsız yeterli statik kararsızlık; güçlü inversiyon (cap) varsa yüksek TT'ye rağmen konveksiyon olmayabilir."}],tuzak:"K'da T700 çıkarılır, Td700 eklenir; ikisini aynı işaretle almak en sık hatadır.",sorular:[{s:"T850 = 4,3; Td850 = −1,7; T700 = −5,6; Td700 = −13,5; T500 = −20,6 °C. K ve TT?",c:["VT = 4,3 − (−20,6) = 24,9; DD700 = −5,6 − (−13,5) = 7,9.","K = 24,9 + (−1,7) − 7,9 = 15,3.","TT = 4,3 + (−1,7) + 41,2 = 43,8.","K < 30 ve TT < 45: oraj potansiyeli düşük; kuru-kararlı profil (örnek İstanbul sondası)."]}],kaynak:"Instability indexes; brifing_örneği"},{id:"ky-cape",baslik:"CAPE, CIN ve SWEAT",ozet:"CAPE: LFC–EL arası pozitif alan (J/kg). CIN: önündeki fren. SWEAT: şiddetli hava potansiyeli.",anlam:"kararlilik",ses:{teknik:["CAPE: 0–1000 sınırda, 1000–2500 orta, 2500–3500 çok, 3500–4000 üstü aşırı kararsız (J/kg).","CIN: parseli LFC'ye çıkarmak için gereken iş; büyük CIN + zayıf tetik = yüksek CAPE'e rağmen konveksiyon yok.","SWEAT: 850 nemi, TT, 850/500 rüzgarı ve veering'i birleştirir; > 300 şiddetli oraj, > 400 hortum potansiyeli."],basit:["CAPE yakıt deposu, CIN kapak; kapak açılmadan (tetik olmadan) yakıt yanmaz.","SWEAT hem yakıta hem rüzgara bakar: sıradan değil, şiddetli fırtına içindir."],ben:["Ben w_max ≈ √(2·CAPE) ile kaba yukarı hız bulur, sonra yarıya bölerim (yağış yükü, karışma).","Aynı CAPE'te ince-uzun alan = verimli yağış; kısa-şişman alan = hızlı ivme, dönme riski."]},formul:[{satir:"CAPE = g ∫(LFC→EL) [(T_parsel − T_çevre) / T_çevre] dz",terimler:[["g","yerçekimi ivmesi","m/s²"],["T_parsel, T_çevre","parsel ve çevre sıcaklığı (mutlak)","K"],["LFC, EL","serbest konveksiyon seviyesi ve denge seviyesi (integral sınırları)","m"],["dz","düşey yükseklik adımı","m"]],not:"w_max = √(2·CAPE); ör. 1500–2500 J/kg → ~50–70 m/s. Gerçek değer kabaca bunun yarısı."},{satir:"SWEAT = 12·Td850 + 20·(TT − 49) + 2·f8 + f5 + 125·(S + 0,2)",terimler:[["Td850","850 hPa çiy noktası (negatifse terim 0)","°C"],["TT","Total Totals (TT < 49 ise terim 0)","°C"],["f8, f5","850 ve 500 hPa rüzgar hızı","kt"],["S","sin(dd500 − dd850): kesme (shear) terimi","—"]],not:"Kesme terimi 0: dd850 130–250° dışı, dd500 210–310° dışı, dd500 − dd850 ≤ 0 ya da f8/f5 < 15 kt ise. Hiçbir terim negatif olamaz."}],alt:[{id:"ky-ankara",baslik:"Örnek vaka: Ankara'da çok hücreli fırtına",ozet:"CAPE yalnız ~979 J/kg ama 0–6 km kesme ~40 kt: hamleli, organize fırtına.",anlam:"kararlilik",ses:{teknik:["SI −4,2; LI −4,2; K 45,3; TT 53,2; CAPE 979 J/kg; SWEAT 311; DCAPE 463 J/kg.","Düşük-orta CAPE + güçlü derin tabaka kesmesi (~40 kt) organize, hamleli fırtına üretebilir."],basit:["Yakıt azdı ama rüzgar kesmesi fırtınayı organize etti: tek indekse güvenme.","Hamle ~79 kt, 20 dakikada ~22 mm yağış: kısa ama yıkıcı."],ben:["Ben CAPE'e bakıp «zayıf» demeden önce rüzgar kesmesine bakarım.","Birkaç indeks aynı yönü gösteriyorsa güvenim artar."]},kaynak:"Instability indexes"}],kaynak:"Instability indexes"}],oz:"Parsel çevreden sıcaksa kararsız: LI/SI negatif, K ve TT büyük, CAPE büyük → oraj; ama nem ve tetik de şart."},{id:"ongoru",no:"12",baslik:"Haritalardan öngörüye",ozet:"Genelden özele: üst seviye dalgası → orta seviye nem → alt seviye adveksiyon → yer → yerel öngörü.",neden:"Brifing, proje raporu ve sınav yorumu aynı zinciri ister: gözlem → mekanizma → öngörü → güven.",widget:"ongoru",kavramlar:[{id:"og-adimlar",baslik:"Adım adım yöntem (genelden özele)",ozet:"300/500 → 700 → 850 → yüzey → uydu/radar → sonda → model → İstanbul için yerel öngörü.",anlam:"dinamik",ses:{teknik:["300/500 hPa: jet, trof/sırt, kesik alçak. 700: nem (T−Td, BN). 850: adveksiyon, 0 °C izotermi.","Yüzey: merkezler, cepheler, tandans. Uydu/radar: bulut ve yağışın gerçek yeri. Sonda: indeksler.","Model ve meteogram: zamanlama ve miktar. Son adım yerel etkiler: deniz, topografya, rüzgar yönü."],basit:["Önce büyük resmi gör (hangi dalga?), sonra katları tek tek in, en son kendi sokağına bak.","Her kat bir soru sorar: üst kat «nereye gidiyor?», orta kat «nemli mi?», alt kat «ısınıyor mu?»"],ben:["Ben her seviyeden tek cümle not alırım; cümleler birleşince öngörüm çıkıyor.","Model çıktısına en son bakarım: önce kendi analizim, sonra modelle kıyas."]},tablo:{baslik:["Adım","Ürün","Sorulacak soru"],satirlar:[["1","300 hPa","Jet nerede? Kuvvetli rüzgar kuşağı bize yakın mı?"],["2","500 hPa","Trof/sırt nerede, hangi yöne gidiyor? 552 dam nerede?"],["3","700 hPa","Orta seviye nemli mi (T−Td küçük, BN yüksek)?"],["4","850 hPa","Sıcak mı soğuk mu adveksiyon? 0 °C izotermi nerede?"],["5","Yüzey","Alçak/yüksek, cepheler, tandans, rüzgar"],["6","Uydu / radar","Bulut sistemi ve yağış şu an nerede?"],["7","Sonda / indeks","LI, SI, K, TT, CAPE ne diyor?"],["8","Model / meteogram","Ne zaman, ne kadar? Modeller uyumlu mu?"],["9","Yerel öngörü","İstanbul: Karadeniz/Marmara etkisi, rüzgar yönü"]]},kaynak:"brifing_örneği; Proje_raporu_örneği; factsheet_11-interpreting-weather-charts"},{id:"og-model",baslik:"Kavramsal modeller",ozet:"Trof önü + sıcak adveksiyon + nem → yükselme ve yağış; trof arkası + soğuk adveksiyon → açılma, soğuma.",anlam:"dinamik",ses:{teknik:["Trof önü (doğusu): diverjans ve 850 sıcak adveksiyonu → yükselme; 700 nemliyse yaygın yağış.","Trof arkası (batısı): soğuk adveksiyon → çökme, soğuma; soğuk hava deniz üstünden geçerse sağanak.","Sırt altı: çökme, açık hava; kışın inversiyon, sis, pus ve hava kirliliği."],basit:["Trofun önü «yağış kapısı», arkası «soğuk ve açık hava kapısı».","Sırt, atmosferin üstüne kapatılmış bir kapak: hava sakin, kışın puslu."],ben:["Ben 500'de trof eksenini çizerim; İstanbul eksenin doğusundaysa yağış, batısındaysa soğuma derim.","Sonra 850'de X'lerle doğrularım: önde kırmızı, arkada mavi."]},tablo:{baslik:["Gördüğün","Mekanizma","Beklenen"],satirlar:[["500 trof önü + 850 sıcak adv. + 700 nemli","Yükselme","Yaygın yağış; kışın kar sınırı 850 sıcaklığına bağlı"],["500 trof arkası + 850 soğuk adv.","Çökme, soğuma","Açılma; Karadeniz üstünden sağanak/kar"],["Sırt + yer yüksek basıncı","Çökme, inversiyon","Açık ya da puslu; kışın sis"],["Kesik alçak + kararsız sonda","Uzun süreli yükselme","Günlerce sağanak, oraj, sel riski"],["Yaz: zayıf gradyan + yüksek CAPE","Gündüz ısınmasıyla konveksiyon","Öğleden sonra yer yer oraj"]]},kaynak:"ADVECTION; FRONTS_2; Instability indexes"},{id:"og-istanbul",baslik:"İstanbul için yerel ayar",ozet:"Rüzgar yönü İstanbul'un havasını belirler: poyraz (KD) serin-nemli, lodos (GB) ılık-sert.",anlam:"ruzgar",ses:{teknik:["Poyraz (KD): Karadeniz üstünden gelir; kışın soğuk hava + ılık deniz = kar sağanağı; yazın serinletir.","Lodos (GB): alçak merkezin önünde, sıcak sektörde; kuvvetli rüzgar, deniz kabarması, ılık hava.","Karayel / yıldız (KB / K): soğuk cephe arkası; ani soğuma, sağanak, ardından açılma."],basit:["Lodos estiyse alçak yaklaşıyor; ardından soğuk cephe ve karayel gelir.","Kışın poyrazla gelen soğuk hava Karadeniz'den nem alır ve İstanbul'a kar bırakabilir."],ben:["Ben İstanbul için önce yer rüzgarını öngörürüm; gerisini rüzgar yönü anlatır.","Lodostan karayele dönüş görürsem «cephe geçti» derim."]},kaynak:"Air Masses and Fronts_2025_Spring; FRONTS_2 (İstanbul uyarlaması)"},{id:"og-kontrol",baslik:"Kontrol listesi",ozet:"Önce künye (UTC saat, seviye, birim, aralık), sonra tutarlılık: katlar aynı hikayeyi anlatıyor mu?",anlam:"kimlik",ses:{teknik:["Künye: tarih ve saat (UTC), seviye, birim (hPa, dam, °C), kontur ve izoterm aralığı.","Tutarlılık: 500 trofu, 850 adveksiyonu, yer cephesi ve uydu bulutu aynı yerde örtüşmeli.","Hız: ardışık iki kart (6–12 saat) arasındaki yer değiştirmeyle sistemi ileriye ötele (extrapolation)."],basit:["Haritanın saatine bakmadan yorum yapma; dünkü harita bugünü anlatmaz.","Katlar çelişiyorsa bir yerde yanlış okuma vardır; geri dön."],ben:["Ben iki ardışık kartta merkezi işaretler, aradaki mesafeyle 24 saat sonrasını kabaca öngörürüm.","Uydudaki bulut bandı çizilen cepheyle örtüşmüyorsa cephenin yanlış yere atılmış olabileceğini düşünürüm."]},kaynak:"factsheet_11-interpreting-weather-charts; brifing_örneği"},{id:"og-guven",baslik:"Güven ve belirsizlik dili",ozet:"Öngörüye olasılık ve güven ekle: «yüksek olasılıkla», «yer yer», «zamanlama belirsiz».",anlam:"kimlik",ses:{teknik:["Belirsizlik kaynakları: başlangıç verisi, model farkı, zamanlama, yerel konveksiyon.","Modellerin (GFS–ECMWF) ve ardışık koşuların uyumu güveni artırır; ayrışma güveni düşürür.","Konvektif yağışta yer ve miktar her zaman cephesel yağıştan daha belirsizdir."],basit:["«Yarın kesin yağacak» deme; «yağış olasılığı yüksek, öğleden sonra artacak» de.","Güveni üç kademeyle ver: düşük, orta, yüksek."],ben:["Ben her öngörünün sonuna «güven: orta, çünkü modeller zamanlamada ayrışıyor» gibi bir cümle eklerim.","Sağanak ve oraj için «yer yer» derim; nereye düşeceğini kimse tam bilemez."]},tablo:{baslik:["İfade","Kabaca olasılık"],satirlar:[["Düşük olasılık","< %30"],["Olası (possible)","%30–60"],["Muhtemel (likely)","%60–80"],["Yüksek olasılıkla (very likely)","> %80"]],not:"Yaygın meteoroloji pratiği; kurumdan kuruma değişebilir."},kaynak:"Proje_raporu_örneği; brifing_örneği"}],oz:"Trof önü + 850 sıcak adveksiyon + 700 nem (+ kararsızlık) = yağış; her öngörüye bir güven cümlesi ekle."},{id:"sinav",no:"13",baslik:"Kısa sınav (quiz) stratejisi",ozet:"Soru tipini tanı, verileri topla, formülü yaz, sayıyla hesapla, tek cümleyle yorumla.",neden:"Kısa sınavlar derste ve ödevde görülenlerin benzerlerinden gelme eğiliminde; sorular İngilizce olabilir.",kavramlar:[{id:"sn-tipler",baslik:"Soru tipleri",ozet:"Hesap, harita yorumu, kod çözme, tanım, doğru-yanlış: önce tipi tanı, sonra kalıbı uygula.",anlam:"kimlik",ses:{teknik:["Hesap: K, TT (VT, CT), LI/SI, SWEAT; verilen T/Td'den formülle; sonuç eşik tablosuyla yorumlanır.","Harita yorumu: 850 hPa'da adveksiyon X'leri, cephe yeri, trof/sırt ekseni, rüzgar okları.","Tanım: termal rüzgar, veering/backing, şartlı kararsızlık, hava kütlesi kısaltmaları, cephe eğimleri."],basit:["Soruyu okuyunca kendine sor: «sayı mı istiyor, çizim mi, cümle mi?»","Her tipin bir kalıbı var; kalıbı bilirsen işin yarısı biter."],ben:["Ben kağıdı alınca önce hesap sorularını işaretler, en hızlı puanları toplarım.","İngilizce soruda anahtar kelimelerin altını çizerim: veer, back, advection, stable."]},tablo:{baslik:["Tip","Ne verilir","Kalıp cevap"],satirlar:[["Hesap","T ve Td (850 / 700 / 500)","Formül → sayı → birim → eşik → yorum"],["Harita yorumu","850 / 500 kartı","Akış yönü → izoterm sırası → X → sonuç"],["Kod çözme","SYNOP ya da sonda çıktısı","Grupları ayır → kod kağıdıyla eşle"],["Tanım","Terim","Tanım + formül ya da çizim + örnek"],["Doğru-yanlış","İfade","Eşik veya tanımla karşılaştır, gerekçe yaz"]]},kaynak:"Instability indexes; ADVECTION; Thermal Wind; FRONTS_2"},{id:"sn-elde",baslik:"Eldeki bilgiyle ilerleme",ozet:"Kod kağıdı, harita ya da sonda verildiyse: önce künyeyi oku, veriyi listeye dök, sonra formül.",anlam:"kimlik",ses:{teknik:["Sonda verilirse: 850 / 700 / 500 T ve Td'yi liste yap; Skew-T'de izotermi eğik izle.","Harita verilirse: saat (UTC), seviye, birim; akış yönünü «alçak solda» kuralıyla belirle.","Kod kağıdı verilirse: ezber yerine kağıttaki tabloyu kullan; grup sırasını say."],basit:["Önce masanı düzenle: verileri bir köşeye liste yap, sonra hesapla.","Bilmediğin bir şey sorulursa bildiğin ilkeye bağla: «sıcaklık farkı → rüzgar yükseklikle değişir»."],ben:["Ben ara sonuçları (VT, CT, DD700) ayrı yazarım; son sayı yanlış çıksa da adım puanı alırım.","Emin olmadığım yerde varsayımımı bir cümleyle yazar, devam ederim."]},sorular:[{s:"Sonda çıktısında yalnız VT = 28 ve CT = 22 verilmiş. TT kaç ve ne anlama gelir?",c:["TT = VT + CT = 50.","50–55 bandı: oraj daha olası, şiddetli olabilir."]}],kaynak:"Instability indexes; brifing_örneği"},{id:"sn-zaman",baslik:"Zaman yönetimi",ozet:"Önce kısa hesaplar, sonra harita, en son uzun yorum; her soruya puanı kadar süre.",anlam:"kimlik",ses:{teknik:["İlk 1–2 dakika: tüm soruları tara, puanları ve tipleri işaretle.","Süre ≈ puan oranı: 30 dakikalık sınavda 10 puanlık soruya ~3 dakika.","Son 3 dakika: işaret (+/−), birim ve eşik yorumu kontrolü."],basit:["Takıldığın soruda kalma; işaret koy, sonra dön.","Boş bırakma: bir ilke cümlesi bile puan getirebilir."],ben:["Ben süreyi takip ederim: sürenin yarısında soruların yarısı bitmiş olmalı.","Hesapta takılırsam formülü yazıp geçerim; formül de puan."]},kaynak:"Genel sınav stratejisi (dersin işleyişinden; ayrı ders dosyası yok)"},{id:"sn-hatalar",baslik:"Sık hatalar",ozet:"İşaret hatası, ters akış yönü, cepheyi yanlış kenara çizmek, veering ile backing'i karıştırmak.",anlam:"kimlik",ses:{teknik:["Negatif sayılarda işaret: T500 = −20 ise −2·T500 = +40.","LI/SI sırası çevre − parsel; ters yazınca kararlıyı kararsız sanırsın.","360° geçişi: 330° → 030° veering'dir; derece küçüldü diye backing deme."],basit:["Eksi ile eksi artı yapar: puanlar en çok burada kaçıyor.","Rüzgar yönü rüzgarın nereden estiğidir, nereye gittiği değil."],ben:["Ben her hesabın sonunda «bu mantıklı mı?» diye bakarım: K = 80 gibi bir sayı çıkmaz.","Rüzgar bayrağında yönü, direğin geldiği taraftan okurum."]},tablo:{baslik:["Hata","Doğrusu"],satirlar:[["K'da DD700'ü eklemek","DD700 çıkarılır (T700 eksi, Td700 artı)"],["LI = parsel − çevre","LI = çevre − parsel"],["Cepheyi izoterm kuşağının soğuk kenarına çizmek","Sıcak kenarına"],["Kontur ∥ izotermde X koymak","Kesişme yoksa adveksiyon yok"],["Veering = soğuk","Veering = sıcak, backing = soğuk"],["«Conditional stability»","Doğru terim: şartlı kararsızlık (conditional instability)"]]},kaynak:"Instability indexes; Adiabatics and Stability; Thermal Wind; FRONTS_2"},{id:"sn-olasi",baslik:"Çıkma olasılığı yüksek konular",ozet:"Derste ve ödevde yapılanların benzerleri gelme eğiliminde: indeks hesabı, 850 adveksiyonu, cephe tanıma.",anlam:"kimlik",ses:{teknik:["Yüksek: K / TT / LI hesabı + eşik yorumu; 850 hPa'da sıcak/soğuk adveksiyon işaretleme.","Yüksek: cephe sembolü, eğim (1:50, 1:150), geçiş tablosu; hava kütlesi kaynakları.","Orta: veering/backing, şartlı kararsızlık, oklüzyonu 850'de bulma, barotropik/baroklinik ayrımı."],basit:["Ödev haritalarına benzer çizim soruları bekle; sürprizden çok tekrar eğilimi var.","Sorular İngilizce gelebilir; terimleri iki dilde bil."],ben:["Ben ödev haritalarımı bir kez daha baştan çizerek tekrar ederim.","İndeks formüllerini sınavdan önce kağıda birkaç kez yazarım."]},tablo:{baslik:["Konu","Olasılık","Neden"],satirlar:[["İndeks hesabı (K, TT, LI)","Yüksek","Kısa, sayısal, notlaması kolay"],["850 hPa adveksiyon analizi","Yüksek","Derste ve ödevde haritada uygulandı"],["Cephe tanıma ve geçiş","Yüksek","Yer kartının temel öğesi"],["Veering / backing","Orta","Tek sondadan adveksiyon okuma"],["Kararlılık türleri (ELR–DALR–SALR)","Orta","Tanım + kısa hesap"],["SWEAT ve CAPE formülü","Düşük–orta","Uzun; daha çok yorum olarak"]],not:"Olasılıklar eğilim tahminidir, kesin bilgi değildir."},kaynak:"ADVECTION; FRONTS_2; Instability indexes; Air Masses and Fronts_2025_Spring"}],oz:"Her cevap = veri + kural + sonuç; birimi ve işareti yaz, yorumsuz sayı bırakma."}],ur={"adv.sicak":{baslik:"Sıcak adveksiyon (warm advection)",anlam:"sicaklik",ses:{teknik:["Akış izotermleri sıcaktan soğuğa doğru keser: −V·∇T > 0, noktada sıcaklık artar.","Yükselme, bulut ve yağış; üst sırtı kuvvetlendirir. Tipik akış G–GB, sıcak cephe önü."],basit:["Rüzgar güneyin sıcaklığını kuzeye taşıyor.","Sıcak hava hafiftir, yükselir: bulut gelir."],ben:["Ben kırmızı X koyar, «burada ısınma ve bulut» diye not alırım.","Okun kuyruğu sıcakta, ucu soğukta: sıcak adveksiyon."]}},"adv.soguk":{baslik:"Soğuk adveksiyon (cold advection)",anlam:"sicaklik",ses:{teknik:["Akış izotermleri soğuktan sıcağa doğru keser: −V·∇T < 0, noktada sıcaklık düşer.","Çökme, bulut açılması; üst trofu derinleştirir. Tipik akış K–KB, soğuk cephe arkası."],basit:["Rüzgar kuzeyin soğuğunu güneye taşıyor.","Soğuk hava ağırdır, çöker: hava açar ama soğur."],ben:["Ben mavi X koyar, «burada soğuma, trof derinleşecek» diye not alırım.","Okun kuyruğu soğukta, ucu sıcakta: soğuk adveksiyon."]}},"adv.notr":{baslik:"Adveksiyon yok (nötr)",anlam:"sicaklik",ses:{teknik:["Kontur ∥ izoterm: rüzgar izotermi kesmez, −V·∇T = 0.","Barotropik durum: sistem yavaş, aynı yerde günlerce kalabilir."],basit:["Rüzgar sıcaklık şeridi boyunca akıyor; taşıyacak bir fark yok.","Hava hareket ediyor ama sıcaklık değişmiyor."],ben:["Ben paralel çizgilere X koymam.","Rüzgar ne kadar kuvvetli olursa olsun, kesişme yoksa «nötr» yazarım."]}},"term.veering":{baslik:"Veering — yükseklikle saat yönünde dönüş",anlam:"sicaklik",ses:{teknik:["Rüzgar yönü yükseklikle saat yönünde döner (ör. 180° → 270°): katmanda sıcak adveksiyon.","Sıcak cephe önü ve trof önü için tipik; yükselme ve bulut beklenir."],basit:["Yukarı çıktıkça rüzgar saat ibresi gibi dönüyor: aşağıya sıcak hava geliyor.","Akıl kancası: Saat yönü = Sıcak."],ben:["Ben derece yukarı doğru artıyorsa «veering, sıcak» derim.","360'ı geçerken de saat yönündeyse veering sayarım (340° → 020°)."]}},"term.backing":{baslik:"Backing — yükseklikle saat tersine dönüş",anlam:"sicaklik",ses:{teknik:["Rüzgar yönü yükseklikle saat tersine döner (ör. 300° → 240°): katmanda soğuk adveksiyon.","Soğuk cephe arkası ve trof arkası için tipik; çökme ve soğuma beklenir."],basit:["Yukarı çıktıkça rüzgar saatin tersine dönüyor: aşağıya soğuk hava doluyor.","Ters dönüş = soğuk hava."],ben:["Ben derece yukarı doğru azalıyorsa «backing, soğuk» derim.","Soğuk cephe tablosundaki «backs with height» satırını hatırlarım."]}},"term.tanim":{baslik:"Termal rüzgar (thermal wind)",anlam:"ruzgar",ses:{teknik:["V_T = V_g(üst) − V_g(alt): iki seviye arasındaki jeostrofik rüzgar vektör farkı.","Ortalama izotermlere (kalınlık çizgilerine) paralel; KYK'de soğuk hava solda kalır."],basit:["Alt rüzgar okunun ucundan üst rüzgar okunun ucuna çizilen ok.","Sıcaklık farkı ne kadar büyükse bu ok o kadar uzun."],ben:["Ben V_T okunun üstünde yürür gibi düşünürüm: soğuk solumda, sıcak sağımda.","Ok uzunsa altında sıkışık izotermler ve yukarıda jet ararım."]}},"cephe.soguk":{baslik:"Soğuk cephe (cold front)",anlam:"sicaklik",ses:{teknik:["Mavi çizgi, üçgenler hareket yönüne; eğim ort. 1:50. Soğuk hava sıcağın yerini alır.","Geçişte T ve Td ani düşer, basınç yükselir, rüzgar sert veering; Cb, sağanak, dolu olası."],basit:["Soğuk hava sıcak havanın altına dalıp onu hızla yukarı fırlatıyor.","Kısa sert sağanak, sonra serin ve berrak hava."],ben:["Ben lodosun karayele dönüp sıcaklığın birden düştüğünü görünce soğuk cephe derim.","Basınç dibe vurup yükselmeye başladıysa cephe geçmiştir."]}},"cephe.sicak":{baslik:"Sıcak cephe (warm front)",anlam:"sicaklik",ses:{teknik:["Kırmızı çizgi, yarım daireler hareket yönüne; eğim ort. 1:150. Sıcak hava soğuğun yerini alır.","Ci → Cs → As → Ns; yağış cepheden 200–400 km önde başlar; geçişte T ve Td yükselir, rüzgar veer eder."],basit:["Sıcak hava soğuk havanın üstüne rampa gibi yavaşça tırmanıyor.","Tüy bulutlar, gri örtü, saatlerce süren yağmur; sonra ılık ve nemli hava."],ben:["Ben Ci ve hale görünce sıcak cephenin yaklaştığını düşünürüm.","Basınç sürekli düşüyor ve rüzgar güneye dönüyorsa sıcak cephe önündeyim."]}},"cephe.oklu":{baslik:"Oklüzyon (occluded front)",anlam:"sicaklik",ses:{teknik:["Mor çizgi, üçgen ve yarım daire birlikte hareket yönüne. Soğuk cephe sıcak cepheyi yakalar.","Soğuk tip: arkadaki hava öndekinden soğuk; sıcak tip: arkadaki hava öndekinden ılık. 850'de sıcak dilin ortası."],basit:["Hızlı soğuk cephe yavaş sıcak cepheye yetişiyor; sıcak hava yerden kopuyor.","Önü sıcak cephe gibi yağışlı, arkası soğuk cephe gibi sağanaklı."],ben:["Ben oklüzyonu yaşlı siklonun imzası olarak okurum.","Arkadaki ve öndeki havayı kıyaslayıp soğuk mu sıcak mı tip olduğuna karar veririm."]}},"cephe.durgun":{baslik:"Durgun cephe (quasi-stationary front)",anlam:"sicaklik",ses:{teknik:["Üçgen ve yarım daireler zıt yönlere bakar; iki hava kütlesi arasındaki sınır neredeyse hareketsiz.","Hava sıcak cepheye benzer ama genelde daha zayıftır; aynı bölgede uzun süre yağış olabilir."],basit:["İki hava kütlesi de geri adım atmıyor; sınır yerinde sayıyor.","Hafif-orta yağış günlerce aynı yere düşebilir."],ben:["Ben durgun cephe görürsem «uzun süreli yağış, sel riski» diye not alırım.","Cephe salınırsa istasyondaki değişim küçük ve yavaş olur."]}}},yr={soguk:[{param:"Sıcaklık",once:"Sıcak sektörde ılık, sabit",gecis:"Ani düşüş",sonra:"Düşük, sabit (gündüz güneşle biraz artabilir)"},{param:"Çiy noktası",once:"Yüksek, sabit",gecis:"Ani düşüş",sonra:"Düşük, sabit"},{param:"Basınç",once:"Cephe yaklaştıkça düşer",gecis:"Dibe vurur, hızla yükselmeye başlar",sonra:"Yavaş yükseliş"},{param:"Rüzgar",once:"GB'lı, sabit; cephe önünde hafif backing",gecis:"Sert veering (GB → B/KB), hamle ve bora",sonra:"KB'lı, sabit ya da hafif veering"},{param:"Bulut",once:"St, Sc; 6/8–8/8, taban alçak",gecis:"Cu, Cb, bazen Ns; taban alçak ama yükseliyor",sonra:"Cu, Cb ~6/8; taban yükselir, açılmalar"},{param:"Yağış",once:"Hafif yağmur, çisenti",gecis:"Kuvvetli sağanak yağmur/kar; oraj ve dolu olası",sonra:"Aralıklı sağanak, zaman zaman kuvvetli"},{param:"Görüş",once:"Zayıf; kışın adveksiyon sisi olası",gecis:"Yağışta orta, dışında iyi",sonra:"Çok iyi (sağanak dışında)"},{param:"Üst rüzgar",once:"Sıcak sektörde GB akış",gecis:"Cephe bölgesinde yükseklikle backing",sonra:"Yükseklikle backing (soğuk adveksiyon)"}],sicak:[{param:"Sıcaklık",once:"Düşük, sabit",gecis:"Ani yükseliş (yağış serinletirse sınırlı)",sonra:"Yüksek, sabit (sıcak sektör)"},{param:"Çiy noktası",once:"Düşük; cepheye yaklaşınca yükselmeye başlar",gecis:"Ani yükseliş",sonra:"Yüksek, sabit"},{param:"Basınç",once:"Sürekli düşüş, yaklaştıkça hızlanır",gecis:"Düşüş durur",sonra:"Hafif düşüş ya da sabit (alçak derinleşiyorsa düşmeye devam)"},{param:"Rüzgar",once:"Hızlanır, hafif backing, genelde güneyli",gecis:"Sert veering (G → GB)",sonra:"GB'lı, sabit"},{param:"Bulut",once:"Ci → Cs → As → Ns; 8/8'e artar, taban alçalır",gecis:"8/8, taban çok alçak: Ns, St",sonra:"6/8–8/8 St, Sc; yer yer açıklık"},{param:"Yağış",once:"As'den hafif sürekli, Ns'den orta-kuvvetli sürekli",gecis:"Orta ya da kuvvetli sürekli",sonra:"Hafif yağmur, çisenti"},{param:"Görüş",once:"Giderek zayıflar",gecis:"Çok zayıf, sis olabilir",sonra:"Zayıf; kışın adveksiyon sisi olası"},{param:"Üst rüzgar",once:"Yükseklikle veering (sıcak adveksiyon)",gecis:"Veering sürer",sonra:"Sıcak sektörde GB, daha az dönme"}],oklu:[{param:"Sıcaklık",once:"Serin, sabit",gecis:"Soğuk tipte düşer, sıcak tipte hafif yükselir",sonra:"Soğuk tipte daha soğuk, sıcak tipte biraz ılık"},{param:"Çiy noktası",once:"Düşük; yağışla yükselir",gecis:"Küçük değişim (sıcak sektör havası yerde yok)",sonra:"Soğuk tipte düşer"},{param:"Basınç",once:"Düşer",gecis:"Düşüş durur (oluğun dibi)",sonra:"Yükselir"},{param:"Rüzgar",once:"Backing, G–GD'lu, hızlanır",gecis:"Veering (ör. G → B/KB)",sonra:"B–KB'lı"},{param:"Bulut",once:"Sıcak cephe dizisi: Ci, Cs, As, Ns",gecis:"Ns; gömülü Cb olabilir",sonra:"Soğuk cephe arkası gibi: Cu, Sc; açılmalar"},{param:"Yağış",once:"Sürekli, giderek artar",gecis:"Orta-kuvvetli; soğuk tipte sağanak karışır",sonra:"Sağanaklar, giderek azalır"},{param:"Görüş",once:"Yağışta zayıflar",gecis:"Zayıf",sonra:"İyileşir"}],durgun:[{param:"Sıcaklık",once:"Soğuk tarafta düşük, sabit",gecis:"Cephe salınırsa küçük sıçrama",sonra:"Az değişim; günlerce benzer"},{param:"Çiy noktası",once:"Soğuk tarafta düşük",gecis:"Hafif artış ya da azalış",sonra:"Az değişim"},{param:"Basınç",once:"Hafif düşüş ya da sabit",gecis:"Oluk dibinde en düşük",sonra:"Az değişim"},{param:"Rüzgar",once:"Cepheye paralele yakın, zayıf-orta",gecis:"Yön değişimi zayıf ve yavaş",sonra:"Cepheye paralele yakın"},{param:"Bulut",once:"As, Ns, St (sıcak cepheye benzer, daha zayıf)",gecis:"Kapalı, taban alçak",sonra:"Kapalı ya da parçalı"},{param:"Yağış",once:"Hafif-orta sürekli",gecis:"Uzun süreli hafif-orta yağış",sonra:"Günlerce süren yağış olası (sel riski)"},{param:"Görüş",once:"Orta",gecis:"Yağışta zayıf, sis olası",sonra:"Orta"}]},br={K:{ad:"K İndeksi (K Index)",formul:"K = (T850 − T500) + Td850 − (T700 − Td700)",esikler:[{max:30,yorum:"Düşük K; ama 700 hPa kuruysa alt nem + tetikle kuvvetli yağışlı/şiddetli oraj yine olabilir"},{min:30,max:40,yorum:"Kuvvetli yağışlı oraj potansiyeli daha iyi"},{min:40,yorum:"Çok kuvvetli yağışlı oraj için en iyi potansiyel"}],not:"Derste kullanılan tablo bu. K büyüdükçe kuvvetli yağış potansiyeli artar; düşük K'ya körü körüne güvenme (700 hPa kuruluğu K'yı düşürür).",kaynak:"Instability indexes"},TT:{ad:"Total Totals (TT)",formul:"TT = T850 + Td850 − 2·T500 = VT + CT",esikler:[{max:45,yorum:"Tablo eşiğinin altı: oraj potansiyeli düşük"},{min:45,max:50,yorum:"Oraj olası"},{min:50,max:55,yorum:"Oraj daha olası, şiddetli olabilir"},{min:55,max:60,yorum:"Şiddetli oraj en olası"},{min:60,yorum:"Tablonun üstü: şiddetli oraj potansiyeli çok yüksek"}],not:"Alt seviye nem 850 hPa'nın altında kalıyorsa temsil gücü düşer; güçlü inversiyon (cap) varsa yüksek TT'ye rağmen konveksiyon olmayabilir.",kaynak:"Instability indexes"},LI:{ad:"Lifted Index (LI) — Kaldırma İndeksi",formul:"LI = T500(çevre) − T500(sınır tabakasından kaldırılan parsel)",esikler:[{min:0,yorum:"Kararlı; güçlü kaldırmayla LI = 1–3'te zayıf konveksiyon olabilir"},{min:-3,max:0,yorum:"Sınırda kararsız"},{min:-6,max:-3,yorum:"Orta derecede kararsız"},{min:-9,max:-6,yorum:"Çok kararsız"},{max:-9,yorum:"Aşırı kararsız"}],not:"Parselin kaldırıldığı seviyeye bağlıdır; LCL ile 500 hPa arasındaki profil ayrıntısını göremez.",kaynak:"Instability indexes"},SI:{ad:"Showalter İndeksi (SI)",formul:"SI = T500(çevre) − T500(850 hPa'dan LCL'ye kuru, sonra 500'e nemli adyabatla çıkan parsel)",esikler:[{min:0,yorum:"Kararlı; güçlü kaldırmayla SI = 1–2'de zayıf konveksiyon olabilir"},{min:-3,max:0,yorum:"Orta derecede kararsız"},{min:-6,max:-3,yorum:"Çok kararsız"},{max:-6,yorum:"Aşırı kararsız"}],not:"Ders tablosunda −3 ile −4 arası tanımsız; burada «çok kararsız» sınıfına bağlandı. SI genelde LI kadar kararsız çıkmaz; alt nem 850'ye ulaşmıyorsa temsil gücü düşer.",kaynak:"Instability indexes"}},Z={baslik:"Örnek sonda: İstanbul/Kartal (17064)",T850:4.3,Td850:-1.7,T700:-5.6,Td700:-13.5,T500:-20.6,beklenen:{K:15.3,TT:43.8,SI:6.9}},ve=[{id:"lodos-soguk-cephe",baslik:"Sonbahar: lodos ve yaklaşan soğuk cephe",ipuclari:[{seviye:"300 hPa",gozlem:"Kuvvetli GB jet (≈ 120 kt) Ege üzerinden Karadeniz'e uzanıyor."},{seviye:"500 hPa",gozlem:"Trof ekseni Yunanistan üzerinde, doğuya ilerliyor; İstanbul trof önünde, GB akışta."},{seviye:"850 hPa",gozlem:"Marmara'da GB rüzgar +8 °C'den +4 °C'ye doğru izotermleri kesiyor; Ege'de sıkışık izoterm kuşağı."},{seviye:"Yüzey",gozlem:"Batı Karadeniz'de 998 hPa alçak; soğuk cephe Ege kıyısında; İstanbul sıcak sektörde, GB 25 kt, basınç sürekli düşüyor."},{seviye:"Uydu",gozlem:"Ege üzerinde dar, parlak, kuzey-güney uzanan konvektif bulut bandı."},{seviye:"Sonda",gozlem:"850 → 500 rüzgar 190° → 240° (veering); K = 28, TT = 48."}],secenekler:[{t:"Lodos sürer; 6–12 saat içinde cephe geçişiyle kısa süreli kuvvetli sağanak, olası oraj; ardından karayel, soğuma ve basınç yükselişi.",dogru:!0,neden:"Trof önü + sıcak sektör + dar Cb bandı = soğuk cephe; geçişte veering, T düşüşü, basınç yükselişi beklenir."},{t:"Sıcak cephe geçişi: günlerce sürecek hafif çisenti.",dogru:!1,neden:"Yüzeydeki cephe soğuk cephe; bulut bandı dar ve konvektif, yatık sıcak cephe dizisi yok."},{t:"Değişiklik yok; sıcak sektör hava birkaç gün sürer.",dogru:!1,neden:"500 hPa trofu doğuya ilerliyor ve cephe Ege'de; sistem İstanbul'a yaklaşıyor."},{t:"Cephe geçince ani ısınma ve açık hava.",dogru:!1,neden:"Soğuk cephe arkasında KB akışla soğuk adveksiyon olur; sıcaklık düşer."}],ses:{teknik:["Trof önünde GB akış ve sıcak adveksiyon; sondadaki veering bunu doğruluyor.","Soğuk cephe geçişinde sert veering (GB → KB), T ve Td düşüşü, basınç yükselişi, Cb sağanağı.","Güven orta-yüksek; zamanlama trofun hızına bağlı."],basit:["Lodos kapıyı çalan soğuk cephenin habercisi.","Önce sert bir sağanak, sonra serin ve berrak hava."],ben:["Ben yüzeyde cepheyi, uyduda bandı, sondada veering'i görünce «akşama sağanak, gece karayel» derim.","Basınç dibe vurup yükselince cephenin geçtiğini anlarım."]}},{id:"kis-poyraz-kar",baslik:"Kış: poyraz ve Karadeniz etkili kar",ipuclari:[{seviye:"500 hPa",gozlem:"Trof ekseni İstanbul'un hemen doğusuna geçmiş; Trakya üzerinde 540 dam altı konturlar."},{seviye:"700 hPa",gozlem:"Karadeniz üzerinde T−Td ≈ 2 °C; nemli katman ince."},{seviye:"850 hPa",gozlem:"−6 °C izotermi Marmara'ya inmiş; KD akış izotermleri soğuktan sıcağa kesiyor (soğuk adveksiyon)."},{seviye:"Yüzey",gozlem:"Balkanlar'da 1035 hPa yüksek, Doğu Akdeniz'de alçak; İstanbul'da KD 20–25 kt (poyraz)."},{seviye:"Uydu",gozlem:"Karadeniz üzerinde rüzgar yönünde dizilmiş konvektif bulut bantları."},{seviye:"Sonda",gozlem:"Alt 1,5 km'de azalma oranı kuru adyabatiğe yakın; 700 hPa civarında inversiyon."}],secenekler:[{t:"Poyrazla aralıklı kar sağanağı; Karadeniz'e bakan ilçelerde birikim, güven orta-yüksek.",dogru:!0,neden:"Soğuk adveksiyon + ılık denizden alttan ısınma ve nem → sığ konveksiyon; 850 T ≈ −6 °C kar için yeterli."},{t:"Lodosla ılık ve yağmurlu hava.",dogru:!1,neden:"Yer rüzgarı KD; 850'de soğuk adveksiyon var; lodos için alçağın batıdan yaklaşması gerekir."},{t:"Açık ve ayazlı, yağışsız.",dogru:!1,neden:"Deniz ile hava arasındaki büyük sıcaklık farkı konvektif bulut üretiyor; uydu bantları gösteriyor."},{t:"Kuvvetli, gök gürültülü yaz tipi oraj.",dogru:!1,neden:"İnversiyon 700 hPa'da konveksiyonu sınırlıyor; derin konveksiyon için CAPE yetersiz."}],ses:{teknik:["Trof arkasında KD akış ve 850 soğuk adveksiyonu; Karadeniz üstünde alttan ısınma ile kararsız sınır tabakası.","Sığ konveksiyon, inversiyonla sınırlı: kar sağanağı, kıyıda birikim. Güven orta-yüksek."],basit:["Soğuk hava ılık denizin üstünden geçerken nem kapıp İstanbul'a kar olarak bırakıyor.","Kar her yere eşit yağmaz; kuzey kıyı ilçeleri daha çok alır."],ben:["Ben 850'de −5 °C altı, KD rüzgar ve Karadeniz üstünde bulut bandı görünce «poyraz karı» derim.","Yağışın yerini «yer yer» diye veririm; bant nereye denk gelirse orası beyazlar."]}},{id:"yaz-oraj",baslik:"Yaz: öğleden sonra oraj",ipuclari:[{seviye:"500 hPa",gozlem:"Balkanlar'dan inen zayıf kesik alçak; soğuk çekirdek İstanbul'un batısında, T500 = −16 °C."},{seviye:"700 hPa",gozlem:"T−Td = 4 °C; orta seviye nemli."},{seviye:"850 hPa",gozlem:"T = +14 °C, Td = +8 °C; konturlar izotermlere paralele yakın, adveksiyon zayıf."},{seviye:"Yüzey",gozlem:"Zayıf basınç gradyanı; sabah rüzgar zayıf, öğleden sonra deniz meltemi."},{seviye:"Uydu / radar",gozlem:"Sabah açık; öğlene doğru Trakya ve Kocaeli'de kümülüs gelişimi."},{seviye:"Sonda",gozlem:"LI = −5, K = 34, TT = 54, CAPE ≈ 1500 J/kg, CIN küçük."}],secenekler:[{t:"Öğleden sonra yer yer kuvvetli sağanak, oraj ve dolu; yer ve miktar belirsiz.",dogru:!0,neden:"Orta kararsızlık (LI −5, CAPE ~1500) + nem + gündüz ısınması ve meltem tetiği = konveksiyon."},{t:"Gün boyu sürekli hafif yağmur.",dogru:!1,neden:"Cephe ve geniş ölçekli yükselme yok; yağış konvektif ve kısa süreli olur."},{t:"Yaygın sis, yağışsız gün.",dogru:!1,neden:"Kararsız profil ve kümülüs gelişimi; sis için kararlı, nemli yüzey katmanı gerekir."},{t:"Anadolu yakasına kesin 30 mm yağış.",dogru:!1,neden:"Konvektif yağışta noktasal miktar kesin verilemez; güven dili kullanılmalı."}],ses:{teknik:["K = (14 + 16) + 8 − 4 = 34; TT = 14 + 8 + 32 = 54: oraj olasılığı yüksek, şiddetli olabilir.","Barotropik yapı ve zayıf adveksiyon; tetik gündüz ısınması ve meltem yakınsaması."],basit:["Sabah güneşli diye kandırma yok; öğleden sonra kara bulutlar kabarır.","Kısa ama sert sağanak, yer yer dolu."],ben:["Ben indeksleri hesaplar, hepsi aynı yönü gösterince «öğleden sonra yer yer oraj» yazarım.","Yer ve miktar için güveni düşük tutarım."]}},{id:"kis-sirt-sis",baslik:"Kış: sırt altında sis ve pus",ipuclari:[{seviye:"500 hPa",gozlem:"Balkanlar–Türkiye üzerinde kuvvetli sırt, 576 dam; geniş alanda çökme."},{seviye:"850 hPa",gozlem:"+6 °C, zayıf rüzgar; yerde +2 °C → sıcaklık terselmesi (inversiyon)."},{seviye:"Yüzey",gozlem:"1032 hPa yüksek basınç; rüzgar sakin; gece açık."},{seviye:"Uydu",gozlem:"Sabah Marmara havzasında alçak bulut / sis alanı, üstü açık."},{seviye:"Sonda",gozlem:"Yerden 900 hPa'ya kadar inversiyon; LI = +8; yüzeyde T−Td = 1 °C."}],secenekler:[{t:"Sabah sis ve pus, görüş yer yer 1 km altı; öğlene doğru kısmen dağılma; yağış yok.",dogru:!0,neden:"Sırt + çökme + gece ışınımsal soğuma + nemli yüzey katmanı + inversiyon = sis; kararlı profil."},{t:"Kar yağışı.",dogru:!1,neden:"850 hPa +6 °C ve çökme var; nem yalnız yüzeyde, yükselme yok."},{t:"Kuvvetli lodos.",dogru:!1,neden:"Basınç gradyanı zayıf, merkez üstümüzde; rüzgar sakin."},{t:"Öğleden sonra oraj.",dogru:!1,neden:"LI = +8 çok kararlı ve inversiyon konveksiyonu bastırır."}],ses:{teknik:["Sırt altı çökme ve inversiyon; gece ışınımsal soğumayla yüzeyde doyma: sis ve pus.","Mutlak kararlı profil; yağış beklenmez, görüş ve hava kalitesi ana risk."],basit:["Üstte sıcak bir kapak, altta soğuk nemli hava: sis kapanı.","Güneş öğlen biraz delik açar ama tam temizlemez."],ben:["Ben 500'de sırt, yerde sakin rüzgar ve küçük T−Td görünce «sabah sis» derim.","Havalimanı için görüş uyarısını öne koyarım."]}},{id:"ilkbahar-sicak-cephe",baslik:"İlkbahar: sıcak cephe önünde sürekli yağış",ipuclari:[{seviye:"500 hPa",gozlem:"Trof Adriyatik üzerinde; İstanbul trof önünde, GB akışta."},{seviye:"700 hPa",gozlem:"T−Td ≤ 2 °C, BN %90 üstü; geniş nemli alan."},{seviye:"850 hPa",gozlem:"G–GB akış izotermleri sıcaktan soğuğa kesiyor; yükseklikle veering."},{seviye:"Yüzey",gozlem:"Sıcak cephe Kuzey Ege'de, İstanbul'un GB'sında; basınç sürekli düşüyor; rüzgar GD'ya dönüp hızlanıyor."},{seviye:"Uydu",gozlem:"Batıdan geniş Ci–Cs örtüsü, arkasında kalın As/Ns kalkanı."},{seviye:"Sonda",gozlem:"LI = +3, K = 26; kararlı ama 850–500 arası doymuşa yakın."}],secenekler:[{t:"Önce bulutlanma, sonra saatlerce süren orta şiddette sürekli yağmur; görüş azalır; cephe geçince ılık, nemli hava.",dogru:!0,neden:"Sıcak adveksiyon + geniş yükselme + nemli 700 = sürekli (stratiform) yağış; kararlı profil sağanak değil."},{t:"Kısa süreli kuvvetli sağanak ve dolu, ardından açılma.",dogru:!1,neden:"Bu soğuk cephe ya da konvektif hava; LI = +3 kararlı."},{t:"Soğuk cephe geçişi ve belirgin soğuma.",dogru:!1,neden:"850'de sıcak adveksiyon ve veering var; yaklaşan cephe sıcak cephe."},{t:"Açık ve güneşli gün.",dogru:!1,neden:"Ci–Cs'den As/Ns'ye kalınlaşan bulut kalkanı ve nemli 700 hPa yağışı gösterir."}],ses:{teknik:["Trof önü + 850 sıcak adveksiyon (veering) + nemli 700 hPa: geniş ölçekli yükselme ve sürekli yağış.","Kararlı profil (LI +3) sağanak değil, katmanlı bulut ve sürekli yağış verir. Güven yüksek."],basit:["Gök yavaş yavaş griye döner, ardından gün boyu yağmur.","Yağmur durunca hava ılık ve nemli olur."],ben:["Ben Ci–Cs dizisini ve düşen basıncı görünce «sıcak cephe geliyor, uzun yağmur» derim.","Kararlı sondada «sağanak» değil «sürekli yağış» yazarım."]}}],gr=[{id:"d2-k-hesap",konu:"kararlilik",tip:"hesap",olasilik:3,s:"Calculate the K index: T850 = 12 °C, Td850 = 8 °C, T700 = 2 °C, Td700 = −4 °C, T500 = −16 °C. Interpret it. (K indeksini hesapla ve yorumla.)",adimlar:["K = (T850 − T500) + Td850 − (T700 − Td700)","T850 − T500 = 12 − (−16) = 28; DD700 = 2 − (−4) = 6","K = 28 + 8 − 6 = 30","Eşik: 30–40 bandının alt sınırı → kuvvetli yağışlı oraj potansiyeli artıyor"],cevap:"K = 30 °C: kuvvetli yağışlı oraj potansiyeli (30–40 bandının alt sınırı).",widget:"indeks"},{id:"d2-tt-hesap",konu:"kararlilik",tip:"hesap",olasilik:3,s:"Compute VT, CT and TT for T850 = 10 °C, Td850 = 6 °C, T500 = −20 °C. What does TT suggest? (VT, CT ve TT'yi hesapla; TT ne söylüyor?)",adimlar:["VT = T850 − T500 = 10 − (−20) = 30","CT = Td850 − T500 = 6 − (−20) = 26","TT = VT + CT = 56","55–60 bandı → şiddetli oraj en olası"],cevap:"VT = 30, CT = 26, TT = 56: şiddetli oraj en olası (55–60).",widget:"indeks"},{id:"d2-li",konu:"kararlilik",tip:"hesap",olasilik:3,s:"At 500 hPa the environment is −15 °C and the lifted parcel is −10 °C. Find the LI and classify the stability. (LI'yi bul, kararlılığı sınıflandır.)",adimlar:["LI = T500(çevre) − T500(parsel)","LI = −15 − (−10) = −5","−3 ile −6 arası → orta derecede kararsız"],cevap:"LI = −5: orta derecede kararsız; parsel çevreden 5 °C sıcak.",widget:"indeks"},{id:"d2-sweat",konu:"kararlilik",tip:"hesap",olasilik:2,s:"SWEAT: Td850 = 12 °C, TT = 55, 850 hPa wind 200°/30 kt, 500 hPa wind 250°/50 kt. Compute and interpret. (SWEAT'i hesapla ve yorumla.)",adimlar:["Kesme koşulları: dd850 = 200 (130–250 ✓), dd500 = 250 (210–310 ✓), fark +50 ✓, hızlar ≥ 15 kt ✓","12·12 = 144; 20·(55 − 49) = 120; 2·30 = 60; f5 = 50","S = sin 50° ≈ 0,77 → 125·(0,77 + 0,2) ≈ 121","Toplam ≈ 144 + 120 + 60 + 50 + 121 ≈ 495"],cevap:"SWEAT ≈ 495 (> 400): hortum potansiyeli; şiddetli oraj ortamı.",widget:"indeks"},{id:"d2-adv-tur",konu:"adveksiyon",tip:"harita yorumu",olasilik:3,s:"On an 850 hPa chart the flow crosses isotherms from −10 °C toward 0 °C. Which advection is this and how will temperature change? (Hangi adveksiyon; sıcaklık nasıl değişir?)",adimlar:["Akış yönü: soğuk (−10) izotermden sıcak (0) izoterme","Soğuktan sıcağa akış = soğuk adveksiyon (−V·∇T < 0)","Kesişim noktalarına mavi X; noktada sıcaklık düşer"],cevap:"Soğuk adveksiyon; sıcaklık düşer (çökme, trof derinleşmesi beklenir).",widget:"adveksiyon"},{id:"d2-adv-siddet",konu:"adveksiyon",tip:"harita yorumu",olasilik:2,s:"Point A: contours almost parallel to isotherms. Point B: contours cross tightly packed isotherms at ~90°. Where is advection stronger, and why? (Adveksiyon nerede güçlü, neden?)",adimlar:["|V·∇T| = |V|·|∇T|·|cos α|","A: paralel → rüzgar izotermlere paralel, terim ≈ 0","B: dik kesişim + sık izoterm → terim en büyük"],cevap:"B noktasında: dik kesişim ve sık izotermler adveksiyonu en büyük yapar; A'da adveksiyon yok denecek kadar az.",widget:"adveksiyon"},{id:"d2-veering",konu:"termal-ruzgar",tip:"harita yorumu",olasilik:3,s:"A sounding shows 850 hPa 180°/20 kt, 700 hPa 220°/30 kt, 500 hPa 260°/45 kt. Veering or backing? What advection? (Veering mi backing mi; hangi adveksiyon?)",adimlar:["Yön 180 → 220 → 260: derece artıyor","Yükseklikle saat yönünde dönüş = veering","Veering → katmanda sıcak adveksiyon"],cevap:"Veering; 850–500 hPa katmanında sıcak adveksiyon (yükselme, bulut beklenir).",widget:"termal"},{id:"d2-backing",konu:"termal-ruzgar",tip:"harita yorumu",olasilik:2,s:"Winds: 850 hPa 300°, 700 hPa 270°, 500 hPa 240°. Name the turning and the thermal advection. (Dönüşün adı ve sıcaklık adveksiyonu?)",adimlar:["Yön 300 → 270 → 240: derece azalıyor","Yükseklikle saat tersine dönüş = backing","Backing → soğuk adveksiyon"],cevap:"Backi
