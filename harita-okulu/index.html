ng; soğuk adveksiyon (soğuk cephe / trof arkası için tipik).",widget:"termal"},{id:"d2-termal-tanim",konu:"termal-ruzgar",tip:"tanım",olasilik:2,s:"Define the thermal wind and state its orientation relative to the mean isotherms in the Northern Hemisphere. (Termal rüzgarı tanımla; ortalama izotermlere göre yönü nedir?)",adimlar:["V_T = V_g(üst) − V_g(alt): iki seviye arasındaki jeostrofik rüzgar vektör farkı","Kalınlık (ortalama izoterm) çizgilerine paralel","KYK'de soğuk hava (düşük kalınlık) solda kalır"],cevap:"İki seviye arasındaki jeostrofik rüzgar farkı; ortalama izotermlere paralel, soğuk hava solda (KYK).",widget:"termal"},{id:"d2-soguk-cephe",konu:"cepheler",tip:"tanım",olasilik:3,s:"At a station the pressure falls then rises sharply, the wind veers from SW to NW with gusts, temperature and dew point drop suddenly, and heavy showers occur. Which front passed? (Hangi cephe geçti?)",adimlar:["Basınç: düşüş → hızlı yükseliş","Rüzgar: sert veering (GB → KB), hamle","T ve Td ani düşüş + kuvvetli sağanak"],cevap:"Soğuk cephe.",widget:"cephe"},{id:"d2-sicak-cephe",konu:"cepheler",tip:"harita yorumu",olasilik:2,s:"Cirrus, then cirrostratus with halo, then altostratus appear; pressure falls steadily and the wind backs to south. What is approaching and what weather follows? (Ne yaklaşıyor, hangi hava gelir?)",adimlar:["Bulut dizisi Ci → Cs → As: sıcak cephe önü","Sürekli basınç düşüşü + backing: cephe yaklaşıyor","Sonra Ns'den sürekli yağış; geçişte T ve Td yükselir, rüzgar veer eder"],cevap:"Sıcak cephe; saatlerce sürekli yağış, ardından ılık ve nemli sıcak sektör.",widget:"cephe"},{id:"d2-hava-kutle",konu:"cepheler",tip:"tanım",olasilik:2,s:"Name the air masses that affect Turkey and their source regions. (Türkiye'yi etkileyen hava kütleleri ve kaynakları?)",adimlar:["Sıcaklık harfi: P (polar), T (tropikal); nem harfi: m (denizel), c (karasal)","mP – İzlanda/Grönland; mT – Azorlar","cP – Sibirya; cT – Kuzey Afrika"],cevap:"mP (İzlanda/Grönland), mT (Azorlar), cP (Sibirya), cT (Kuzey Afrika)."},{id:"d2-sartli",konu:"kararlilik",tip:"tanım",olasilik:3,s:"The ELR is 0.8 °C/100 m (DALR = 1, SALR = 0.6 °C/100 m). What is the stability of the layer? (Tabakanın kararlılığı nedir?)",adimlar:["Sıralama: DALR (1) > ELR (0,8) > SALR (0,6)","Kuru parsel çevreden soğuk kalır → kararlı","Doymuş parsel çevreden sıcak kalır → kararsız"],cevap:"Şartlı kararsız (conditional instability).",widget:"indeks"},{id:"d2-850-cephe",konu:"cepheler",tip:"harita yorumu",olasilik:2,s:"On an 850 hPa chart, where do you draw the cold front relative to the packed isotherms and the cold advection? (Soğuk cepheyi nereye çizersin?)",adimlar:["Sıkışık izoterm kuşağını bul","Cepheyi kuşağın sıcak kenarına yerleştir","Soğuk adveksiyonların (mavi X) başladığı çizgiyle karşılaştır"],cevap:"Sıkışık izoterm kuşağının sıcak kenarına, soğuk adveksiyonun başladığı yere.",widget:"cephe"},{id:"d2-okluzyon",konu:"cepheler",tip:"harita yorumu",olasilik:1,s:"On an 850 hPa chart the isotherms form a warm tongue between two colder areas. Which front do you analyse and where? (Hangi cepheyi, nereye çizersin?)",adimlar:["Sıcak izoterm dili = yerden kalkmış sıcak sektör havası","Oklüzyonu dilin ortasından geçir","Arkadaki ve öndeki havayı kıyasla: arka daha soğuksa soğuk tip, değilse sıcak tip"],cevap:"Oklüzyon; sıcak izoterm dilinin ortasından. Tipi, arka ve ön soğuk havaların kıyasıyla belirlenir.",widget:"cephe"},{id:"d2-ongoru",konu:"ongoru",tip:"harita yorumu",olasilik:3,s:"Istanbul is ahead of a 500 hPa trough; the 850 hPa chart shows warm advection and 700 hPa is moist (T−Td ≤ 2 °C). Give a short forecast with confidence. (Güven ifadesiyle kısa öngörü ver.)",adimlar:["500 trof önü → geniş ölçekli yükselme","850 sıcak adveksiyon → yükselmeyi destekler","700 nemli → bulut ve yağış için nem var","Güven: modeller uyumluysa yüksek, zamanlama belirsizse orta"],cevap:"Bulutlanma ve yaygın yağış beklenir; kışın kar/yağmur ayrımı 850 sıcaklığına bağlı. Güven orta-yüksek.",widget:"ongoru"}],B=e=>`img/brifing/${e}`,D={yer:{src:B("yer-analizi.png"),alt:"Avrupa yüzey analizi: izobarlar, cepheler ve istasyon modelleri",cap:"Cepheli yüzey analizi (T = Tief/alçak, H = Hoch/yüksek; izobar aralığı 5 hPa).",kaynak:"DWD (Deutscher Wetterdienst) — brifing örneği"},topo:{src:B("500-mslp-topo.png"),alt:"500 hPa jeopotansiyel, yer basıncı ve rölatif topografya kompozit haritası",cap:"Siyah: 500 hPa konturu (gpdam) · Beyaz: yer basıncı (hPa) · Renk: H500−H1000 kalınlığı.",kaynak:"wetter3 (GFS) — brifing örneği"},genel:{src:B("ecmwf-genel.jpg"),alt:"ECMWF genel bakış: anlık yağış şiddeti, bulut, sıcaklık ve basınç",cap:"Model öngörüsü: yağış, bulut ve basınç tek panelde. Başlıkta Run ve Valid saatleri.",kaynak:"WXCharts (ECMWF HRES) — brifing örneği"},t850:{src:B("850-sicaklik-mslp.jpg"),alt:"850 hPa sıcaklık ve deniz seviyesi basıncı haritası",cap:"850 hPa sıcaklığı (renk) + MSLP (çizgi): hava kütlesi ve adveksiyon.",kaynak:"WXCharts (ECMWF HRES) — brifing örneği"},rh700:{src:B("700-nem.png"),alt:"700 hPa bağıl nem haritası",cap:"700 hPa bağıl nem: yeşil nemli, beyaz kuru; F > %95, T < %15.",kaynak:"wetter3 (GFS) — brifing örneği"},z500:{src:B("500-mslp.jpg"),alt:"500 hPa jeopotansiyel yükseklik ve yer basıncı haritası",cap:"500 hPa yüksekliği (renk, gpdam) + MSLP: trof, sırt ve yer merkezleri.",kaynak:"WXCharts (ECMWF HRES) — brifing örneği"},vort:{src:B("500-vortisite.jpg"),alt:"500 hPa jeopotansiyel ve bağıl vortisite haritası",cap:"Kırmızı pozitif (siklonik), mavi negatif (antisiklonik) vortisite; konturlar 500 hPa.",kaynak:"Model görseli (GFS/ECMWF; site etiketi yok) — brifing örneği"},jet:{src:B("200-jet.png"),alt:"200 hPa akım çizgileri ve izotaklar (jet akımı)",cap:"200 hPa akım çizgileri + rüzgar hızı (m/s): jet kuşakları ve girdaplar.",kaynak:"Model görseli (site etiketi yok) — brifing örneği"},cape:{src:B("cape.jpg"),alt:"CAPE ve 500 hPa jeopotansiyel haritası",cap:"CAPE (J/kg) + 500 hPa konturları; başlıkta Run ve Valid.",kaynak:"WXCharts (ECMWF HRES) — brifing örneği"},meteo:{src:B("meteogram.png"),alt:"Meteogram: rüzgar, sıcaklık-çiy noktası, 850 hPa sıcaklık ve basınç",cap:"Tek noktanın zaman serisi. Konum etiketini kontrol et (bu örnekte 54K 7D).",kaynak:"WXCharts — brifing örneği"},skewt:{src:B("skewt-17064.png"),alt:"17064 İstanbul/Kartal Skew-T log-P diyagramı",cap:"Sağ kalın çizgi sıcaklık, sol kalın çizgi çiy noktası; sağda rüzgar barbları.",kaynak:"University of Wyoming — brifing örneği"},istasyon:{src:B("istasyon-konumlari.png"),alt:"İstasyon modeli: değerlerin daire etrafındaki konumları",cap:"İstasyon dairesi etrafında her değerin sabit yeri.",kaynak:"Met Office — brifing örneği"},synop:{src:B("synop-ogimet.png"),alt:"Ogimet SYNOP listesi, 17022 Zonguldak",cap:"Ogimet SYNOP çıktısı: satır başında tarih-saat, sonra AAXX ve gruplar.",kaynak:"Ogimet — brifing örneği"}},cr=[{id:"buyuk-resim",no:"1",baslik:"Büyük resim: dört teslim",ozet:"Dersin dört teslimi aynı beceriyi ölçer: haritayı oku, teşhis koy, öngörünü gerekçesiyle söyle.",neden:"Neyin ne zaman, nasıl puanlandığını bilmeden hazırlık dağılır; bu bölüm yol haritası.",kavramlar:[{id:"dort-teslim",baslik:"Dört teslim tek bakışta",ozet:"Brifing, proje sunumu, İngilizce rapor ve elle harita analizi: ne, nasıl, ne zaman.",anlam:"kimlik",ses:{teknik:["Brifing: 5 kişilik grup, «Weather Analysis and Forecast for Istanbul», sırası gelen Salı uygulama saatinde.","Proje: gerçek bir sinoptik vakanın (siklon, cephe, blokaj) analizi; grup sunumu + İngilizce rapor.","MAP ANALYSIS: basılı yüzey, 850, 700, 500 ve 300 hPa haritalarına elle çizim; elden teslim."],basit:["İki kez sahneye çıkıyorsun: önce günün havasını, sonra seçtiğin fırtınanın hikâyesini anlatıyorsun.","Bir de kalemle harita çiziyorsun; bu da sınavdaki çizim sorularının provası."],ben:["Ben dört işi tek beceri gibi görüyorum: haritaya bak, ne olduğunu söyle, sonra ne olacağını söyle.","Takvime dört tarihi yazdım; brifing sıramı ve 1 Aralık'ı kırmızıyla işaretledim."]},tablo:{baslik:["Teslim","Ne istenir","Nasıl teslim","Not etkisi"],satirlar:[["Brifing sunumu","İstanbul için analiz + öngörü","Sunum sabahı Ninova'ya yükle, Salı sun","Proje notunun 1/3'ü"],["Proje sunumu","Vakanın oluşum mekanizması","Grup sunumu","Proje notunun 1/3'ü"],["Proje raporu","İngilizce akademik rapor","Ninova, 1 Aralık sabahı (tüm gruplar)","Proje notunun 1/3'ü"],["Harita analizi","5 haritaya elle çizim","Basılı, MED-C binasına elden, Aralık başı","Ödev; benzeri sınavda"]],not:"Proje notu = brifing + proje raporu + proje sunumu ortalaması (Ninova duyurusu)."},sorular:[{s:"Proje raporu hangi dilde, ne zaman teslim edilir?",c:["İngilizce, grup olarak.","Son tarih tüm gruplar için aynı: 1 Aralık sabahı, Ninova."]}],tuzak:"Brifingi «ısınma turu» sanmak: proje notunun üçte biri brifingden gelir.",kaynak:"Ninova duyuruları: Brifing, Proje Ödevi, MAP ANALYSIS"},{id:"proje-notu",baslik:"Proje notu nasıl oluşur?",ozet:"Üç parçanın ortalaması; raporun içinde içerik-düzen 60, atıf 20, referans 20.",anlam:"kimlik",ses:{teknik:["Proje notu üç bileşenin aritmetik ortalamasıdır: brifing, proje raporu, proje sunumu.","Rapor puanının 40'ı atıf ve referans düzeninden gelir; iyi içerik tek başına yetmez.","İntihal tespit edilirse rapor 0 puan; size ait olmayan her bilgi ve figür atıflanır."],basit:["Üç ayaklı tabure: biri kısa kalırsa not sallanır.","Rapordaki puanın neredeyse yarısı «bunu nereden aldın?» sorusunun düzgün cevabı."],ben:["Ben brifingi hafife almıyorum; proje notunun üçte biri orada.","Raporu bitirince önce atıfları sayıyorum: her figürün altında kaynak var mı?"]},formul:[{satir:"Proje notu = (Brifing + Proje raporu + Proje sunumu) / 3",terimler:[["Brifing","İstanbul analiz-öngörü sunumu","puan"],["Proje raporu","İngilizce rapor (60 + 20 + 20)","puan"],["Proje sunumu","seçilen vakanın sunumu","puan"]],not:"İntihal = 0 puan."}],tablo:{baslik:["Rapor kalemi","Puan","Ne bakılır"],satirlar:[["İçerik ve düzen","60","Mantıklı bölümler (ABSTRACT, INTRODUCTION…), figür/tablo adları, kapak, isim-numara"],["Metin içi atıf","20","(Annex-3 ICAO, 2018) · (Soyad et al., 2019) biçimi; size ait olmayan her bilgi ve figür"],["Referans listesi","20","APA, alfabetik, hepsi REFERENCES altında; «WEB LINK 1» gibi ifade yok"]]},sorular:[{s:"Brifing 80, rapor 70, proje sunumu 90 ise proje notu kaç?",c:["(80 + 70 + 90) / 3","= 240 / 3 = 80"]}],tuzak:"«Sadece analiz önemli» sanmak: atıf + referans düzeni tek başına 40 puan.",kaynak:"Ninova duyurusu: Proje Ödevi"},{id:"ortak-zincir",baslik:"Ortak beceri: gör → anla → bekle",ozet:"Her teslim aynı zinciri ister: gözlem, fiziksel anlam, öngörü.",anlam:"dinamik",ses:{teknik:["Analiz (diagnosis): desen ve değeri tespit et — merkez, kontur, izoterm, nem.","Yorum: deseni fiziğe bağla — adveksiyon, vortisite, dikey hareket, kararlılık.","Öngörü (prognosis): yerdeki havaya etkisi; zaman ve yer bilgisiyle birlikte."],basit:["Doktor gibi: önce belirti, sonra teşhis, en son «yarın şöyle olacak».","«Hava güzel» tek başına yetmez; neden güzel ve ne kadar sürecek?"],ben:["Ben her haritada üç cümle kuruyorum: ne görüyorum, bu ne demek, ne bekliyorum.","Cümlemde sayı yoksa analiz değil yorum yapmışımdır; hemen bir değer eklerim."]},tablo:{baslik:["Adım","Soru","Örnek cümle"],satirlar:[["Gördüğüm","Haritada ne var?","«İstanbul'un batısında 552 gpdam'lık trof ekseni var.»"],["Anlamı","Fizik ne diyor?","«Trofun önündeyiz; pozitif vortisite adveksiyonu yükselmeyi destekler.»"],["Beklentim","Yerde ne olur?","«Yarın öğleden sonra bulutluluk ve sağanak olasılığı artar.»"]]},sekil:[D.topo],sorular:[{s:"«İstanbul'da hava açık.» cümlesi zincirin hangi halkalarını eksik bırakıyor?",c:["Gözlemin sayısı yok (basınç, nem, bulut).","Nedeni (ör. sırt altında çökme) ve süresi (yarın da mı?) yok."]}],kaynak:"Brifing örneği (hocanın slaytları); derste geçenler: Salı brifing uygulamaları"},{id:"takvim",baslik:"Takvim ve teslim yolu",ozet:"Brifing sıran gelince; rapor 1 Aralık sabahı; harita ödevi Aralık başı elden.",anlam:"kimlik",ses:{teknik:["Brifing materyali sunum sabahı Ninova'ya yüklenir; grupta tek kişinin yüklemesi yeterli görülüyor.","Proje raporu: tüm gruplar için aynı son tarih, 1 Aralık sabahı (Ninova).","MAP ANALYSIS: basılı haritalar elle çizilir, MED-C binasına elden verilir; son tarih Aralık başı."],basit:["Brifing canlı veriyle yapılır; haritaları son güne kadar taze tutarsın.","Rapor ve çizim ödevi aynı haftalara düşüyor; erken başlamak tek çare."],ben:["Ben slayt iskeletini önceden kurup haritaları sunumdan önceki akşam yeniliyorum.","Harita ödevine kurşun kalemle erkenden başlıyorum ki raporla çakışmasın."]},sorular:[{s:"Brifing haritalarını neden bir hafta önceden hazırlamamalısın?",c:["Brifing güncel analiz ve öngörü ister.","Eski veriyle yapılan öngörü sunum günü çoktan geçmiş olur; bu fark ediliyor."]}],tuzak:"Brifing haritalarını erken indirip bırakmak: veri eskir, öngörü boşa düşer.",kaynak:"Ninova duyuruları; derste geçenler: Salı brifing uygulamaları"},{id:"kirmizi-cizgiler",baslik:"Kırmızı çizgiler",ozet:"İntihal sıfır, rapor İngilizce, kaynaksız şekil yok, çizim elle ve kendi işin.",anlam:"kimlik",ses:{teknik:["İntihal tespit edilen rapor 0 puan alır; kaynaksız konan figür de intihal sayılır.","Rapor dili İngilizce; kısaltma ilk geçişte açık yazılır: Mean Sea Level Pressure (MSLP).","Harita analizi elle, basılı harita üzerinde yapılır; ödevler bireysel emek olarak değerlendiriliyor."],basit:["Kendi cümlen + kaynağı yazılmış başkasının şekli = güvenli.","Silgi izli ama kendi çizdiğin harita, kopyalanmış kusursuz haritadan değerlidir."],ben:["Ben her figürün altına kaynağını o an yazıyorum; sonraya bırakınca unutuyorum.","Arkadaşıma «nasıl yaptın» diye soruyorum ama çizgiyi kendi elimle çekiyorum."]},sorular:[{s:"Raporda «WEB LINK 1» yazıp linki dipnota koymak neden puan kaybettirir?",c:["Duyuruda bu ifade açıkça yasak.","Tüm kaynaklar REFERENCES altında APA biçiminde, alfabetik olmalı."]}],tuzak:"Kendi çizdiğin figürde veri kaynağını yazmamak: «data: ERA5» bile bir atıftır.",kaynak:"Ninova duyuruları: Proje Ödevi, MAP ANALYSIS"}],oz:"Dört teslim, tek zincir: gördüğüm → anlamı → beklentim; her şekil kaynaklı, her öngörü gerekçeli."},{id:"brifing",no:"2",baslik:"Brifing: ne isteniyor?",ozet:"İstanbul için güncel haritalardan analiz ve öngörü; 20–25 dakikada, grupça, herkes konuşur.",neden:"Proje notunun üçte biri; harita okuma ve soru-cevap becerisi en açık burada görünür.",widget:void 0,kavramlar:[{id:"brifing-nedir",baslik:"Brifing nedir, ne edindirir?",ozet:"Operasyonel meteorolog provası: haritayı oku, teşhis koy, İstanbul için öngörü ver.",anlam:"kimlik",ses:{teknik:["Konu sabit: «Weather Analysis and Forecast for Istanbul»; Avrupa ölçeğinden İstanbul'a inilir.","Süre: grup başına en fazla 20–25 dk, kişi başı ~5 dk; her üye bir harita grubunu anlatır.","İçerik: yer ve üst seviye analizi + model öngörüsü + gözlemle doğrulama (uydu, radar, SYNOP)."],basit:["Televizyondaki hava sunucusu gibi, ama nedenini de anlatan bir uzman gibi konuşursun.","Amaç ezber değil: haritaya bakıp «yarın şemsiye lazım mı?» sorusuna gerekçeli cevap."],ben:["Ben brifingi hikâye gibi kuruyorum: büyük sistem → bize etkisi → yarın ne olacak.","Benim payım 5 dakika; iki harita ve tek net cümleyle bitiriyorum."]},sekil:[D.genel],alt:[{id:"edinimler",baslik:"Edindirilmek istenenler",ozet:"Çok seviyeli harita okuma, analizden öngörüye geçiş, terimle konuşma, ekip tutarlılığı.",anlam:"dinamik",ses:{teknik:["Yüzey → 850 → 700 → 500 → 200/300 hPa haritalarından üç boyutlu atmosfer resmi kurmak.","Analizden öngörüye geçiş: aynı sistemin 24–48 sa sonraki konumunu ve etkisini söylemek.","Terimi doğru kullanmak: kontur (contour), trof (trough), sırt (ridge), adveksiyon, vortisite, jet."],basit:["Tek tek fotoğraflardan bir film çıkarmayı öğreniyorsun.","Grup tek hikâye anlatır; biri «yağmur» derken öbürü «kuru» dememeli."],ben:["Ben bunu iş görüşmesi provası gibi görüyorum; hava brifingi gerçek bir meslek işi.","Bilmediğim soruda «haritaya bakıp söyleyeyim» diyorum, uydurmuyorum."]},kaynak:"Brifing örneği (hocanın slaytları); derste geçenler"}],sorular:[{s:"Grubunuz 5 kişi, süre 25 dakika. Bir kişiye kaç dakika düşer, ne anlatır?",c:["~5 dakika.","Birbirine bağlı 2–3 harita ve tek cümlelik bir beklenti."]}],tuzak:"Herkesin aynı haritaları tekrar anlatması: rol dağılımı yapılmazsa süre biter, öngörüye sıra gelmez.",kaynak:"Ninova duyurusu: Brifing; derste geçenler: Salı brifing uygulamaları"},{id:"konusma-kalibi",baslik:"Konuşma kalıbı: gördüğüm → anlamı → beklentim",ozet:"Her harita için üç cümle; ilk cümlede mutlaka bir değer ve bir yer adı.",anlam:"dinamik",ses:{teknik:["Gözlem cümlesi: ürün + seviye + yer + değer («850 hPa'da İstanbul üzerinde ~8 °C»).","Anlam cümlesi: süreç adı (soğuk adveksiyon, PVA, çökme, kararsızlık).","Beklenti cümlesi: yerdeki etki + zaman («yarın öğleden sonra sağanak olasılığı artar»)."],basit:["Önce «ne görüyorum», sonra «bu ne demek», en son «yani yarın ne olur».","Sayı söyleyen konuşmacıya güvenilir; «hava güzel» tek başına boş kalır."],ben:["Ben her slaytın notuna bu üç cümleyi yazıp yüksek sesle deniyorum.","Haritadaki sayıyı okuyamıyorsam o haritayı büyütüp yeniden alıyorum."]},tablo:{baslik:["Harita","Gördüğüm","Anlamı","Beklentim"],satirlar:[["Yüzey (MSLP)","İstanbul'da izobarlar seyrek, ~1018 hPa","Zayıf gradyan, yüksek basınç etkili","Hafif rüzgar, az bulut"],["850 hPa T","Kuzeyli akış soğuk dili güneye taşıyor","Soğuk adveksiyon (CAA)","Sıcaklık birkaç derece düşer"],["700 hPa RH","Marmara'da RH ≥ %90","Orta troposfer doygun","Bulut ve yağış olası"],["500 hPa Z","Trof ekseni batımızda","Trof önü: PVA, yükselme","Yarın sağanak artabilir"],["Skew-T","T–Td farkı büyük, alt seviyede inversiyon","Kuru ve kararlı alt katman","Konvektif yağış beklenmez"]],not:"Değerler örnektir; kendi haritandaki sayıyı oku."},sekil:[D.t850],sorular:[{s:"«Türkiye'de izobarlar çok sık değil.» cümlesini kalıba tamamla.",c:["Anlamı: basınç gradyanı zayıf.","Beklentim: rüzgar hafif, hava sakin; fırtına beklemiyorum."]}],tuzak:"Anlam cümlesini atlayıp gözlemden doğrudan öngörüye sıçramak: gerekçesiz öngörü ikna etmez.",kaynak:"Derste geçenler: Salı brifing uygulamaları"},{id:"harita-rolleri",baslik:"Her harita neyi kanıtlar?",ozet:"Her ürün zincirde tek bir halkayı taşır; aynı şeyi iki kez anlatma.",anlam:"dinamik",ses:{teknik:["Yüzey ve 850 hPa termodinamiği, 500 hPa dinamiği, 200/300 hPa üst akışı (jet) gösterir.","CAPE, Skew-T ve indeksler yükselen havanın bulut mu sağanak mı yapacağını söyler.","Uydu, radar ve SYNOP gerçeğe bakar; brifingin doğrulama (verification) ayağıdır."],basit:["Bina gibi düşün: zemin kat yüzey, orta katlar 850–500, çatı jet.","Model «olacak» der, uydu-radar-gözlem «oldu» der; ikisi birlikte inandırır."],ben:["Ben her slaytı bir soruya bağlıyorum: bu harita hangi soruma cevap veriyor?","İki harita aynı şeyi söylüyorsa birini hızlı geçip zamanı öngörüye ayırıyorum."]},tablo:{baslik:["Ürün","Kanıtladığı","İngilizce"],satirlar:[["Yüzey analizi","Merkezler, cepheler, rüzgar","Surface analysis, MSLP"],["850 hPa T + MSLP","Hava kütlesi, sıcaklık adveksiyonu","Temperature advection"],["700 hPa RH","Orta seviye nem, bulut-yağış alanı","Relative humidity"],["500 hPa Z + vortisite","Trof/sırt, dikey hareket","Geopotential height, vorticity"],["200/300 hPa rüzgar","Jet, üst diverjans","Jet stream, isotachs"],["CAPE, Skew-T","Kararlılık, konveksiyon potansiyeli","Instability"],["Meteogram","Bir noktada zamanla değişim","Meteogram"],["Uydu, radar, SYNOP","Gerçekte ne oldu?","Verification"]]},sekil:[D.yer,D.rh700,D.jet],sorular:[{s:"Yağış öngörüne en güçlü desteği hangi üç harita birlikte verir?",c:["500 hPa: trof önü yükselme.","700 hPa: RH ≥ %90 doygunluk.","24 sa yağış / meteogram: modelin yağış miktarı."]}],tuzak:"Haritaları albüm gibi art arda göstermek: her slaytın zincirdeki görevi söylenmezse bağlantı kopar.",kaynak:"Brifing örneği (hocanın slaytları)"},{id:"iyi-brifing",baslik:"İyi brifingin ölçütleri",ozet:"Güncel, aynı saatli, sayılı, tutarlı, öngörülü ve süreye uygun.",anlam:"kimlik",ses:{teknik:["Haritalar arası tutarlılık ve öngörüye geçiş öne çıkıyor; yalnız analizde kalmak eksik bulunabiliyor.","Bugünün analizinin hemen ardından ertesi günün öngörü haritasını göstermek öneriliyor.","Bir olgudan söz edilecekse görselinin de slaytta olması bekleniyor."],basit:["İzleyen bir hikâye bekler: dün-bugün-yarın, hepsi aynı sisteme bağlı.","«Bu ne?» sorusu gelirse cevap haritanın üstünde olmalı, kafanda değil."],ben:["Ben son slayta tek satırlık İstanbul öngörüsü koyuyorum; herkes onu hatırlıyor.","Provada kronometre tutuyorum; 5 dakikayı geçen arkadaşımı uyarıyorum."]},tablo:{baslik:["Ölçüt","Nasıl görünür"],satirlar:[["Güncel veri","Sunuma en yakın analiz ve en yeni run"],["Aynı zaman","Tüm haritalar aynı geçerlilik saatinde (ör. 12 UTC), başlıkta yazılı"],["Genelden özele","Avrupa → Türkiye → Marmara → İstanbul"],["Analiz + öngörü","Bugünün analizi, ardından +24/+48 sa öngörü haritası"],["Tutarlılık","«Haritalar birbirini destekliyor mu?» sorusuna açık cevap"],["Lejant ve birim","dBZ, J/kg, gpdam, % bir cümleyle açıklanır"],["Net sonuç","Son slaytta yarın İstanbul: sıcaklık, rüzgar, bulut, yağış"],["Süre","Grup 20–25 dk, kişi başı ~5 dk"]]},sekil:[D.meteo],sorular:[{s:"Analiz haritaların hepsi bugüne ait. Brifingi güçlendirmek için ne eklersin?",c:["Aynı ürünlerin +24 sa öngörü haritasını.","Sistemin nereye kaydığını ve İstanbul'a etkisini tek cümleyle."]}],tuzak:"Uzun metinli slayt: izleyen okumaya başlar, seni ve haritayı kaçırır.",kaynak:"Derste geçenler: Salı brifing uygulamaları"},{id:"sik-hatalar",baslik:"Sık hatalar",ozet:"Terim karışıklığı, sayısız yorum, eski veri ve radarı kesin yağış sanmak.",anlam:"dinamik",ses:{teknik:["500 hPa'daki çizgiler izobar değil kontur/izohips (isohypse): basınç yüzeyinin yüksekliği.","wetter3 renkleri basınç değil rölatif topografya (H500−H1000): kalın = sıcak, ince = soğuk tabaka.","Radar yansıması (dBZ) havadaki hidrometeoru gösterir; yere ulaşan yağışı tek başına kanıtlamaz."],basit:["Yanlış isim, doğru haritayı yanlış anlatmak demektir.","Radar «havada su var» der; yere düşüp düşmediğini gözlem söyler."],ben:["Ben slayt notuma her haritanın çizgi ve renk anlamını yazıyorum, karıştırmıyorum.","Çiy noktası her zaman sıcaklıktan düşük ya da eşit; meteogramda çizgileri böyle ayırıyorum."]},tablo:{baslik:["Hata","Doğrusu"],satirlar:[["500 hPa siyah çizgilerine «izobar» demek","Kontur / izohips (gpdam)"],["Renkli dolguyu basınç sanmak","Kalınlık (H500−H1000): sıcak/soğuk tabaka"],["Üst seviyede «basınç gradyanı»","«Yükseklik gradyanı»: sık kontur = kuvvetli rüzgar"],["«Hava güzel» deyip geçmek","Değer söyle: «İstanbul 1018 hPa, 850'de 9 °C»"],["Farklı saatlerin haritalarını karıştırmak","Hepsi aynı geçerlilik saati; başlıkta yaz"],["Yalnız bugünü göstermek","Analiz + ertesi gün öngörüsü yan yana"],["Lejantı atlamak","Birim ve renk anlamını bir cümleyle söyle"],["Radar yansıması = kesin yağış","Olasılık; 700/500 hPa ve gözlemle destekle"],["T ile Td'yi karıştırmak","Td ≤ T; eşitse hava doymuş"],["Meteogram konumuna bakmamak","İstanbul ≈ 41°K 29°D"],["Basınç kodunu yanlış tamamlamak","230 → 1023,0 hPa; 980 → 998,0 hPa"]]},sekil:[D.topo],sorular:[{s:"Haritada «230» yazan bir izobar değeri kaç hPa?",c:["Kısaltılmış değer: başa 10 gelir.","1023,0 hPa (1230 hPa gerçek dışı bir değerdir)."]}],tuzak:"Üst seviyede «basınç gradyanı yüksek» demek: doğru terim yükseklik gradyanı; sık kontur kuvvetli rüzgar demek.",kaynak:"Derste geçenler: Salı brifing uygulamaları"},{id:"gelebilecek-sorular",baslik:"Gelebilecek sorular",ozet:"Merkez adları, okunan değer, vortisite işareti, jet türü, T–Td ve «dün yağdı mı?»",anlam:"kimlik",ses:{teknik:["Sorular çoğunlukla haritadan bir değer okuma ya da bir terimi tanımlama üzerine geliyor.","Fiziksel neden soruları da olası: jet nasıl oluşur, pozitif vortisite neden yükselmeyle ilişkili.","Doğrulama soruları: «İstanbul'da dün yağış oldu mu?» — SYNOP/METAR ile cevaplanır."],basit:["Soru gelince haritaya dön ve göster; cevap çoğu zaman orada.","Bilmediğini söyleyip mantıkla düşünmek, uydurmaktan iyidir."],ben:["Ben bu listeyi gruba atıyorum; prova sonunda birbirimize soruyoruz.","Soruya önce terimin tanımıyla, sonra haritadan bir örnekle cevap veriyorum."]},sekil:[D.vort],sorular:[{s:"Kuzey Atlantik'teki kalıcı alçak ve orta Atlantik'teki yüksek nasıl adlandırılır?",c:["İzlanda alçağı (Icelandic Low) ve Azor yükseği (Azores High).","Bölgemiz için ayrıca: Basra alçağı, Sibirya yükseği."]},{s:"İstanbul üzerinden 850 hPa'da kaç derece geçiyor?",c:["Skala renginden ya da izotermlerden değeri oku, iki izoterm arasındaysa enterpole et.","Birimiyle söyle: «yaklaşık 8 °C»."],ipucu:"Değer okunmadan verilen cevap «yorum» sayılır."},{s:"Pozitif vortisite alçak basınçla mı, yüksekle mi ilişkili?",c:["Kuzey yarımkürede saat yönünün tersine dönüş pozitif (siklonik) vortisitedir.","Alçak basınç ve trofla ilişkili; negatif vortisite sırt ve yüksekle."]},{s:"Haritadaki jetin adı ne, nasıl oluşur?",c:["Kuzeydeki polar cephe jeti: kutup ve orta enlem havası arasındaki keskin sıcaklık farkı (termal rüzgar).","Güneydeki subtropikal jet: Hadley hücresinin üst kolunda açısal momentumun korunması."]},{s:"Meteogramda hangi çizgi sıcaklık, hangisi çiy noktası?",c:["Çiy noktası sıcaklıktan büyük olamaz.","Üstteki çizgi sıcaklık, alttaki çiy noktası; birleşirlerse hava doymuştur."]},{s:"İstanbul'da dün yağış oldu mu?",c:["Ogimet'te İstanbul istasyonlarının SYNOP'una bak: 6RRRtR grubu ve ww.","Modelin 24 sa yağışıyla karşılaştır; uyuşmazlığı açıkça söyle."]},{s:"İnversiyon nedir, Skew-T'de nasıl görünür?",c:["Sıcaklığın yükseklikle artmasıdır.","Sıcaklık çizgisi yukarı çıkarken sağa kırılır; kararlı bir kapak oluşturur."]},{s:"Omega blokajı nedir?",c:["500 hPa'da iki kesik alçak arasında kuzeye uzanan geniş sırt: Ω harfi gibi.","Batı-doğu akışı kilitlenir; hava günlerce aynı kalma eğilimindedir."]}],tuzak:"Soruya slayttan okuyarak cevap vermek: haritaya dönüp göstermek daha ikna edici.",kaynak:"Derste geçenler: Salı brifing uygulamaları"}],oz:"İyi brifing = güncel ve aynı saatli haritalar + her haritada sayı + analizden yarına geçen tek tutarlı hikâye."},{id:"brifing-hazirlik",no:"3",baslik:"Brifing: adım adım hazırlık",ozet:"Saat ve run seçimi, harita sepeti, slayt düzeni, SYNOP çözümü ve süreli prova.",neden:"Hataların çoğu hazırlıkta doğar; sıra doğru kurulursa brifing kendiliğinden tutarlı olur.",kavramlar:[{id:"saat-run",baslik:"Saat ve model koşusu (run) seçimi",ozet:"Analiz için en son 00/12 UTC; öngörü için en yeni run ve +24/+48 saat.",anlam:"kimlik",ses:{teknik:["Analiz haritası (diagnostic) gözlem anını, öngörü haritası (prognostic) gelecek anı gösterir.","Tüm ürünlerde aynı geçerlilik saatini seç (ör. 12 UTC); farklı saatler yanlış tutarlılık yargısı doğurur.","Sinoptik saatler 00, 06, 12, 18 UTC; radyosonde 00 ve 12 UTC'de atılır."],basit:["Run fotoğrafın çekildiği an, Valid fotoğrafta görünen gelecekteki an.","12 UTC, İstanbul'da öğleden sonra 3 (TSİ) demek."],ben:["Ben kapağa «Analiz: 12 UTC · Öngörü: +24 sa · Run: 00Z» yazıp haritaları buna göre indiriyorum.","Almanca günleri öğrendim: Montag Pzt, Dienstag Salı, Mittwoch Çrş, Donnerstag Prş, Freitag Cuma."]},formul:[{satir:"Geçerlilik zamanı (Valid) = Run saati + öngörü süresi",terimler:[["Run","modelin başlatıldığı saat (00Z, 06Z, 12Z, 18Z)","UTC"],["+h","öngörü adımı (lead time)","saat"],["Valid","haritanın gösterdiği an","UTC"]],not:"wetter3 örneği: «Donnerstag 06 + 114» → Perşembe 06 UTC + 114 sa = Salı 00 UTC."},{satir:"TSİ = UTC + 3",terimler:[["UTC","eşgüdümlü evrensel zaman","saat"],["TSİ","Türkiye saati","saat"]]}],sekil:[D.cape],sorular:[{s:"Başlık: «Run: Thu 24 Sep 00Z · Valid: Tue 29 Sep 12 UTC». Kaç saatlik öngörü?",c:["Perşembe 00Z → Salı 00Z = 5 gün = 120 sa.","+12 sa → 132 saatlik öngörü; analiz değil."]}],tuzak:"Run saatini geçerlilik saati sanmak: «00Z» yazan harita beş gün sonrasının öngörüsü olabilir.",kaynak:"Brifing örneği (hocanın slaytları): wetter3 ve WXCharts başlıkları"},{id:"harita-sepeti",baslik:"Hangi siteden hangi harita?",ozet:"Örnek sunumun sepeti: DWD, wetter3, WXCharts, Wyoming, EUMETSAT, Ogimet.",anlam:"kimlik",ses:{teknik:["Ürün başına tek güvenilir kaynak seç; hangi haritanın hangi modelden (GFS/ECMWF) geldiğini söyle.","Her slaytın altına site adı yazılır; görseldeki logo kaynak yerine geçmez.","Geçmiş tarih gerekiyorsa wetter3 ve Meteociel arşivleri GFS haritalarını sunar."],basit:["Market alışverişi gibi: listeyle git, her ürünü bilinen raftan al.","Örnekte hem GFS hem ECMWF var; hangisi olduğunu söylersen karışıklık olmaz."],ben:["Ben site listesini grubun ortak dosyasına koydum; herkes aynı yerden indiriyor.","Dosya adına kaynağı yazıyorum: «wetter3_500_12UTC.png»."]},tablo:{baslik:["Ürün","Site","İpucu"],satirlar:[["Yer analizi (cepheli)","DWD — dwd.de","T = Tief (alçak), H = Hoch (yüksek); izobar 5 hPa"],["500 hPa + MSLP + rölatif topografya","wetter3 — wetter3.de","Arşiv ve animasyon sayfası var"],["700 hPa bağıl nem","wetter3 — wetter3.de","F > %95 nemli, T < %15 kuru"],["Genel bakış, 24 sa yağış, 850 T, 500 Z, CAPE","WXCharts — wxcharts.com","Başlıkta Run ve Valid"],["500 hPa vortisite, 200 hPa jet","Model görseli (ör. tropicaltidbits.com)","Örnekte site etiketi görünmüyor"],["Meteogram","WXCharts — wxcharts.com","Konumu İstanbul'a ayarla (~41K 29D)"],["Skew-T + indeksler","Wyoming — weather.uwyo.edu","17064 İstanbul/Kartal, 00 ve 12 UTC"],["Uydu","EUMETSAT — view.eumetsat.int","Natural Colour RGB: camgöbeği = buz bulutu"],["SYNOP","Ogimet — ogimet.com","Türkiye istasyonları 17 ile başlar"]]},sekil:[D.rh700],sorular:[{s:"wetter3'ün 700 hPa nem haritasında «T» harfi ne anlatır?",c:["Almanca trocken: kuru.","Bağıl nem %15'in altında; alçak basınç merkezi değil."]}],tuzak:"Logo yeterli sanmak: slaytın altına site adını ayrıca yazmazsan kaynak belirsiz kalır.",kaynak:"Brifing örneği (hocanın slaytları); Yararlanılabilecek web siteleri (Ninova)"},{id:"slayt-duzeni",baslik:"Slayt düzeni",ozet:"Örnek sunumun sırası: yüzeyden jete, kararlılıktan gözleme, en sonda SYNOP.",anlam:"kimlik",ses:{teknik:["Bir slayt = bir ürün; başlıkta ürün, seviye, geçerlilik saati ve kaynak yazar.","Akış genelden özele ve yerden yukarı; ardından kararlılık ve gözlemle doğrulama.","Grup üyeleri kapakta; isimler not için alındığından herkesin kendi kısmını anlatması bekleniyor."],basit:["Slaytta bir harita ve bir-iki ok/daire yeter; uzun metin değil.","Herkes bir katı anlatır: zemin, orta kat, çatı, kararlılık, gözlem."],ben:["Ben İstanbul'u haritada kırmızı daireyle işaretliyorum; işaretçi görünmese de yerini herkes görüyor.","Kapanış slaytına tek cümle yazıyorum: «Yarın İstanbul: …»."]},tablo:{baslik:["Sıra","Slayt","Kim (öneri)"],satirlar:[["1","Kapak: başlık, tarih, grup üyeleri","—"],["2–3","Yer analizi; 500 hPa + MSLP + rölatif topografya","Üye 1"],["4–6","Genel bakış, 24 sa yağış, 850 hPa T + MSLP","Üye 2"],["7–10","700 hPa nem, 500 hPa + MSLP, vortisite, 200 hPa jet","Üye 3"],["11–13","CAPE, meteogram, Skew-T + indeksler","Üye 4"],["14–17","Uydu, radar, istasyon modelli harita, SYNOP çözümü","Üye 5"],["Son","İstanbul için öngörü özeti","Hep birlikte"]],not:"Sıra örnek sunumdan; üye dağılımı öneridir."},sorular:[{s:"Neden yüzeyden başlayıp yukarı çıkılır?",c:["Önce yerdeki sistemi (merkez, cephe) tanıtırsın.","Sonra onu besleyen üst akışı gösterip nedeni açıklarsın."]}],tuzak:"Kapanış slaytını unutmak: analiz bitince söylenecek tek cümle «yarın ne olacak» olmalı.",kaynak:"Brifing örneği (hocanın slaytları); derste geçenler"},{id:"synop",baslik:"SYNOP seçimi ve çözümü",ozet:"Ogimet'ten İstanbul'a yakın istasyonların son SYNOP'larını al; grup grup çöz.",anlam:"kimlik",ses:{teknik:["Ogimet'te ülke, tarih ve saati seç; Türkiye'nin WMO blok numarası 17 (ör. 17064 Kartal).","Kısım 0, 1 ve 3'ü grup grup çöz; grubun ilk rakamı göstergedir (1 sıcaklık, 2 çiy noktası…).","Çözümü istasyon modeline işle: sıcaklık sol üst, çiy noktası sol alt, basınç sağ üst."],basit:["SYNOP, istasyonun havayı 5'li sayılarla yazdığı kısa mesaj.","Her beşli bir kutu: önce kutunun adına (ilk rakam), sonra içine bak."],ben:["Ben kod kağıdını yanıma alıp her grubu tabloya yazıyorum; tablo sınavda da veriliyor.","Çözdüğüm değeri haritadaki modelle karşılaştırıyorum; tutuyorsa doğru çözmüşüm."]},tablo:{baslik:["Grup","Örnek","Anlamı"],satirlar:[["YYGGiw","14124","Ayın 14'ü, 12 UTC, rüzgar knot (anemometre)"],["IIiii","17022","17 = Türkiye, 022 = Zonguldak"],["iRiXhVV","12670","Yağış grubu var; insanlı, 7-grubu yok; bulut tabanı 1000–1500 m; görüş 20 km"],["Nddff","73603","Bulutluluk 7/8; rüzgar 360°, 3 kt"],["1SnTTT","10192","Sıcaklık +19,2 °C"],["2SnTdTdTd","20130","Çiy noktası +13,0 °C"],["3P0P0P0P0","30022","İstasyon basıncı 1002,2 hPa"],["4PPPP","40184","Deniz seviyesi basıncı 1018,4 hPa"],["5appp","58003","3 sa öncesinden düşük; fark 0,3 hPa"],["6RRRtR","60001","Son 6 saatte yağış yok"],["8NhCLCMCH","82108","Alçak bulut 2/8; Cu (CL=1); orta bulut yok; Cs (CH=8)"],["333 8NsChshs","82834 · 87270","2/8 Cu ~1000 m (~3400 ft); 7/8 Cs ~6000 m (~20000 ft)"],["907tt · 911ff","90760 · 91106","Son 6 saat (tt=60) içinde en yüksek hamle 6 kt"]],not:"Örnek: brifing örneğindeki Zonguldak SYNOP'u. 9-gruplarını kod tablosuyla doğrula."},sekil:[D.synop],alt:[{id:"istasyon-modeli",baslik:"İstasyon modeli: değer nereye yazılır?",ozet:"Daire toplam bulut; solda sıcaklık-nem-hava, sağda basınç-eğilim, çubuk rüzgar.",anlam:"kimlik",ses:{teknik:["İstasyon modeli SYNOP'un harita üstündeki özetidir; her parametrenin sabit konumu vardır.","Basınç son üç haneyle yazılır: 042 → 1004,2 hPa; eğilim 0,1 hPa biriminde ve trend işaretiyle.","Rüzgar çubuğu esişin geldiği yönü gösterir; tam çentik 10 kt, yarım 5 kt, üçgen 50 kt."],basit:["Her istasyonun küçük kimlik kartı: sıcaklık, nem, rüzgar, bulut tek bakışta.","Konumları bir kez öğrenince bütün harita okunur hale gelir."],ben:["Ben İstanbul'a en yakın istasyonu büyütüp değerleri saat yönünde tek tek okuyorum.","Örnek modeli çözüp SYNOP koduyla eşleştiriyorum: aynı bilgi iki biçimde."]},tablo:{baslik:["Konum","Değer","Örnek"],satirlar:[["Daire","Toplam bulut (N, okta)","Dolu daire = 8/8"],["Sol üst","Sıcaklık","23 → 23 °C"],["Sol alt","Çiy noktası","18 → 18 °C"],["Sol orta","Hadise (ww)","Üç nokta → sürekli orta yağmur"],["En sol","Görüş (VV kodu)","56 → 6 km"],["Sağ üst","Basınç, son üç hane","042 → 1004,2 hPa"],["Sağ orta","Basınç eğilimi + trend","05 ↘ → 0,5 hPa düşüş"],["Sağ alt","Geçmiş hava (W)","İki nokta → yağmur"],["Üst","Orta ve yüksek bulut cinsi","Altostratus, cirrus"],["Alt","Alçak bulut cinsi, miktar/yükseklik","6/4 → 6 okta, yükseklik kodu 4"],["Çubuk","Rüzgar yönü ve hızı","3 tam çentik GB'dan → ~30 kt"],["Sağ üst köşe","Hamle","G45 → 45 kt"]],not:"Örnek, brifing örneğindeki Met Office istasyon modeli çözümüdür."},sekil:[D.istasyon],sorular:[{s:"Modelde basınç «184» yazıyor. Kaç hPa?",c:["Son üç hane: 18,4.","500'ün altı olduğu için başa 10 gelir: 1018,4 hPa."]}],tuzak:"Basıncın başını yanlış eklemek: 500–999 arası değerlere 9 (980 → 998,0), 000–499 arasına 10 eklenir.",kaynak:"Brifing örneği (hocanın slaytları): Met Office istasyon modeli anlatımı"}],sorular:[{s:"40184 ile 30022 neden farklı?",c:["30022: istasyon seviyesindeki basınç (1002,2 hPa).","40184: deniz seviyesine indirgenmiş basınç (1018,4 hPa); fark istasyon yüksekliğinden (136 m)."]},{s:"82108'de «2» toplam bulutluluk mu?",c:["Hayır: Nh, alçak bulutun (yoksa orta bulutun) miktarıdır.","Toplam bulutluluk Nddff'teki N'dir: 7/8."]}],tuzak:"8-grubundaki Nh'yi toplam bulutluluk sanmak; toplam N, Nddff grubundadır.",kaynak:"Brifing örneği (hocanın slaytları): Ogimet SYNOP ve çözüm; ders dosyası: sinoptik kod kağıdı"},{id:"prova",baslik:"Prova ve kontrol listesi",ozet:"Süreli prova, sayılar slayt notunda, sorulara hazırlık, sabah tek kişi yükler.",anlam:"kimlik",ses:{teknik:["Prova kronometreyle yapılır; geçişler için bağlaç cümleleri hazırlanır («şimdi 500 hPa'ya çıkıyoruz»).","Her üye kendi haritasından bir değeri ve bir terimin tanımını slayta bakmadan söyleyebilmeli.","Sınıfta işaretçi görünmeyebilir; önemli yerler slaytta önceden ok ya da daireyle işaretlenir."],basit:["Bir kez yüksek sesle, saat tutarak dene; ikinci provada süre kendiliğinden oturur.","Soru provası yap: bir arkadaşın soru soran rolünde olsun."],ben:["Ben provada her cümlemde haritada bir yeri gösteriyorum; gösteremiyorsam o cümleyi siliyorum.","Sabah dosyayı ben yüklüyorum ve gruba «yüklendi» diye yazıyorum."]},tablo:{baslik:["Kontrol","Soru"],satirlar:[["Tarih-saat","Tüm haritalar aynı geçerlilik saatinde mi, başlıkta yazıyor mu?"],["Güncellik","Haritalar sunumdan önceki son analiz/run'dan mı?"],["Öngörü","Analizin yanında +24/+48 sa öngörü haritası var mı?"],["Sayılar","Her haritada İstanbul için okunmuş bir değer var mı?"],["Lejant","Birim ve renk anlamı bir cümleyle anlatılıyor mu?"],["Konum","Meteogram ve Skew-T İstanbul'a mı ait (17064, ~41K 29D)?"],["Doğrulama","Uydu/radar/SYNOP öngörüyle tutarlı mı; değilse söylendi mi?"],["Kaynak","Her slaytın altında site adı var mı?"],["Süre","Grup ≤ 25 dk, kişi ~5 dk; kronometreyle denendi mi?"],["Yükleme","Sunum sabahı bir kişi Ninova'ya yükledi mi?"]]},sorular:[{s:"Provada süre 32 dakika çıktı. Nereden kısaltırsın?",c:["Aynı şeyi söyleyen haritalardan birini hızlı geç.","Lejant anlatımını bir cümleye indir; öngörü slaytına dokunma."]}],tuzak:"Provayı sessiz okumayla yapmak: yüksek sesle söylenen metin hep daha uzun sürer.",kaynak:"Ninova duyurusu: Brifing; derste geçenler: Salı brifing uygulamaları"}],oz:"Önce saati ve run'ı sabitle, tüm haritaları o saatten indir, sayıları oku, sonra kronometreyle prova et."},{id:"proje",no:"4",baslik:"Proje: bir sinoptik olayın hikâyesi",ozet:"Gerçek bir siklon, cephe ya da blokajı başlangıç-zirve-bitiş anlarında haritalarla çöz ve mekanizmasını yaz.",neden:"Proje notunun iki ayağı (sunum + rapor) bu vakaya dayanır; mekanizma sentezi asıl puan kaynağı.",kavramlar:[{id:"vaka-secimi",baslik:"Vaka seçimi",ozet:"Derinleşen siklon, cephe sistemi ya da blokaj; verisi bol, ömrü net bir olay seç.",anlam:"dinamik",ses:{teknik:["Uygun vaka: belirgin yaşam döngüsü olan sinoptik ölçekli sistem (siklon, cephe, Omega/Rex blokajı).","Ölçüt: ERA5 ile tüm seviyeler, Ogimet ile gözlem, uydu ile bulut görüntüsü erişilebilir olmalı.","Etkisi belgelenmiş olay (şiddetli yağış, kar, fırtına, sıcak dalgası) girişi ve atıfı kolaylaştırır."],basit:["Kahramanı belli, başı-ortası-sonu olan bir hikâye seç.","Haberlere çıkmış bir fırtına iyi aday: hem verisi hem kaynağı bol."],ben:["Ben üç aday yazdım, 500 hPa haritalarına bakıp trofu en net olanı seçtim.","Seçtiğim olayın tarihini ve etkisini resmi bir rapor ya da haberle doğruladım."]},tablo:{baslik:["Olay türü","Neye bakılır","İyi işaret"],satirlar:[["Derinleşen siklon","Merkez basıncının zamanla değişimi","24 saatte belirgin düşüş, sıklaşan izobarlar"],["Cephe sistemi","850 hPa sıcaklık gradyanı, rüzgar dönmesi","Keskin izoterm kuşağı, uzun bulut bandı"],["Blokaj","500 hPa'da Ω ya da Rex deseni","Günlerce yerinde duran sırt ve kesik alçaklar"]]},sorular:[{s:"Bir olayın proje için uygun olup olmadığını hangi iki soruyla hızla anlarsın?",c:["Başlangıç, zirve ve bitişi ayırt edilebiliyor mu?","Yüzey + 500 hPa verisi ve gözlem o tarihler için erişilebilir mi?"]}],tuzak:"Çok kısa ömürlü ya da belirsiz olay seçmek: üç anı ayıramazsan analiz düzleşir.",kaynak:"Ninova duyurusu: Proje Ödevi"},{id:"yasam-dongusu",baslik:"Başlangıç → zirve → bitiş",ozet:"Üç anı ölçütle seç; her anda aynı harita setini, aynı bölge ve skalayla koy.",anlam:"dinamik",ses:{teknik:["Siklonda zirveyi merkez basıncının minimumu belirler; başlangıç ve bitiş bu ana göre seçilir.","Her an için en az yüzey MSLP + 500 hPa jeopotansiyel; rüzgar ve sıcaklık eklenebilir.","Gelişen siklonda yer alçağı üst trofun doğusundadır; eksen dikleşince sistem olgunlaşır, dolmaya başlar."],basit:["Bir fırtınanın doğduğu gün, en güçlü olduğu gün ve vedalaştığı gün.","Üç fotoğrafı aynı açıdan çek ki fark görünsün."],ben:["Ben merkez basıncını 6 saatte bir tabloya yazıp en düşüğünü zirve seçtim.","Üç anın haritalarını yan yana koyup aynı renk skalasını kullandım."]},formul:[{satir:"Derinleşme hızı = ΔP_merkez / Δt",terimler:[["ΔP_merkez","merkez basıncındaki düşüş","hPa"],["Δt","zaman aralığı (genelde 24 sa)","saat"]],not:"60° enlemde ≥ 24 hPa/24 sa «patlayıcı» (bomb) sayılır; daha güneyde eşik enlemle küçülür."}],tablo:{baslik:["An","Siklon için ölçüt","Blokaj için ölçüt"],satirlar:[["Başlangıç","İlk kapalı izobar; üst trof yaklaşıyor","Sırt kuzeye uzanmaya başlıyor"],["Zirve","En düşük merkez basıncı, en sık izobar, en kuvvetli rüzgar/yağış","Ω ya da Rex deseni en belirgin; akış kilitli"],["Bitiş","Merkez doluyor, oklüzyon, sistem zayıflıyor","Blok çözülüyor, akış yeniden batıdan doğuya"]]},sekil:[D.topo],sorular:[{s:"Yer alçağı 500 hPa trofunun tam altına geldi. Sistem hangi evrede?",c:["Dikey eğiklik kaybolmuş.","Olgun/dolma evresi: gelişme durur, merkez dolmaya başlar."]}],tuzak:"Üç anı farklı bölge kesiti ya da skalayla vermek: karşılaştırma imkânsızlaşır.",kaynak:"Ninova duyurusu: Proje Ödevi; ders dosyası: TROUGHS AND RIDGES"},{id:"harita-seti",baslik:"Hangi haritalar, ne aranır?",ozet:"Çekirdek: yüzey basıncı + 500 hPa jeopotansiyel. Destek: rüzgar, sıcaklık, vortisite, uydu, radar.",anlam:"basinc",ses:{teknik:["İstenen çekirdek: başlangıç, zirve, bitiş için yüzey basınç + 500 hPa jeopotansiyel haritaları.","Yorum: termal adveksiyon, vortisite, üst seviye trof ve sırt yerleşimi; uydu ve radarla destek.","Skew-T (Wyoming) ve SYNOP (Ogimet) yerel etkiyi sayılarla gösterir."],basit:["Her harita bir tanık; çok tanık aynı şeyi söylerse hikâye sağlamlaşır.","Önce iki temel harita, sonra gerektikçe destekleyiciler."],ben:["Ben her figürde aynı bölge kesitini kullanıyorum (ör. 20°B–50°D, 25–70°K).","Figür sayısını şişirmiyorum; her figürün metinde en az bir cümlesi var."]},tablo:{baslik:["Harita","Ne aranır","Mekanizmaya katkısı"],satirlar:[["Yüzey MSLP","Merkez, izobar sıklığı, cephe","Sistemin yerdeki izi ve şiddeti"],["500 hPa Z","Trof/sırt ekseni, kesik alçak","Üst seviye zorlaması"],["850 hPa T + rüzgar","Termal adveksiyon (WAA/CAA)","Dalganın büyümesi, cephe"],["500 hPa vortisite","Pozitif vortisite adveksiyonu (PVA)","Yükselme alanı"],["250/300 hPa rüzgar","Jet ve jet çekirdeği","Üst diverjans"],["Uydu, radar","Bulut bandı, virgül bulutu, yağış","Analizin gözlemle doğrulanması"]]},sekil:[D.z500,D.t850],sorular:[{s:"Yalnız iki harita koyabilsen hangilerini seçersin?",c:["Yüzey MSLP: sistemin kendisi.","500 hPa jeopotansiyel: onu yöneten üst seviye dalga."]}],tuzak:"Figürü koyup metinde hiç anmamak: her figür «Figure N» diye metinde çağrılmalı.",kaynak:"Ninova duyurusu: Proje Ödevi"},{id:"mekanizma",baslik:"Mekanizma sentezi",ozet:"Haritaları tek bir neden-sonuç zincirine bağla: üst zorlama → dikey hareket → yerdeki sistem.",anlam:"dinamik",ses:{teknik:["Trof önünde PVA ve üst diverjans → yükselme → yer basıncı düşer → siklon derinleşir.","Trof önünde WAA sırtı, arkasında CAA trofu güçlendirir; dalga genliği büyür (baroklinik gelişme).","Blokajda Ω sırtı akışı keser; yerde kalıcı yüksek, kenarlarda kesik alçaklarla uzun süren hava."],basit:["Üstte hava dağılırsa altta eksik kalır; yerden hava emilir, basınç düşer.","Sıcak hava önden, soğuk hava arkadan iterek dalgayı büyütür."],ben:["Ben sonucu zincir gibi yazıyorum: «çünkü… bu yüzden… sonuçta…».","Her halkanın yanına onu gösteren figürün numarasını koyuyorum."]},tablo:{baslik:["Halka","Kanıt figürü"],satirlar:[["Üst trof yaklaşır","500 hPa jeopotansiyel"],["Trof önünde PVA","500 hPa vortisite"],["Jet çekirdeği çıkışında diverjans","250/300 hPa rüzgar"],["Yerde basınç düşer, siklon derinleşir","MSLP haritaları, merkez basıncı tablosu"],["Önde WAA, arkada CAA","850 hPa sıcaklık + rüzgar"],["Bulut bandı ve yağış","Uydu, radar, SYNOP"]]},sekil:[D.vort,D.jet],sorular:[{s:"500 hPa trofunun doğusunda neden bulut ve yağış beklenir?",c:["Trofun önünde pozitif vortisite adveksiyonu (PVA) vardır.","PVA üst seviyede diverjans ve yükselme demektir.","Yükselen hava soğur, doyar: bulut ve yağış."]}],tuzak:"Haritaları tek tek anlatıp bağlamamak: sentez yoksa analiz bir «albüm» olarak kalır.",kaynak:"Ninova duyurusu: Proje Ödevi; ders dosyaları: TROUGHS AND RIDGES, ADVECTION"},{id:"veri-kaynaklari",baslik:"Veri kaynakları",ozet:"ERA5, NCEP/NCAR, Ogimet, Meteociel, Wetter3; kullandığın her biri REFERENCES'ta.",anlam:"kimlik",ses:{teknik:["ERA5 en ayrıntılı seçenek: saatlik, ~0,25°, 37 basınç seviyesi; NCEP/NCAR daha kaba (2,5°) ama hızlı.","Gözlem (SYNOP/METAR), yeniden analizin yerdeki doğrulamasıdır; aynı saat için karşılaştır.","Her veri setinin adı, sağlayıcısı ve erişim tarihi raporun REFERENCES bölümüne girer."],basit:["Yeniden analiz geçmişin «en iyi tahmini» haritası; gözlem o gün termometrenin gösterdiği.","Bir siteden aldığın her şekil bir kaynaktır; künyesini o an not et."],ben:["Ben dosya adına site ve tarihi yazıyorum; referans listesi kolaylaşıyor.","Hazır harita için Meteociel/wetter3 arşivi, kendi çizimim için ERA5 kullanıyorum."]},tablo:{baslik:["Kaynak","Ne verir","Adres"],satirlar:[["ERA5 (Copernicus CDS)","Saatlik yeniden analiz, tüm seviyeler","cds.climate.copernicus.eu"],["NCEP/NCAR (NOAA PSL)","Yeniden analiz, hızlı günlük haritalar","psl.noaa.gov"],["Ogimet","SYNOP ve METAR arşivi","ogimet.com"],["Meteociel","Arşiv model ve yeniden analiz haritaları","meteociel.fr"],["Wetter3","GFS arşiv haritaları (500, 850, 700 RH)","wetter3.de"],["Wyoming","Radyosonde, Skew-T, indeksler","weather.uwyo.edu"],["EUMETSAT / NASA Worldview","Uydu görüntüleri","view.eumetsat.int · worldview.earthdata.nasa.gov"]]},sorular:[{s:"ERA5 ile NCEP/NCAR arasındaki temel fark nedir?",c:["ERA5: ~0,25° ve saatlik, daha ayrıntılı.","NCEP/NCAR: 2,5°, daha kaba ama hızlı harita üretimine uygun."]}],tuzak:"Veri kaynağını yalnız figür altında yazıp REFERENCES'a eklememek: her atıfın listede karşılığı olmalı.",kaynak:"Ninova duyurusu: Proje Ödevi; Yararlanılabilecek web siteleri (Ninova)"},{id:"rapor",baslik:"Rapor: yapı, puan, atıf",ozet:"İngilizce; kapak → ABSTRACT → bölümler → REFERENCES. İçerik-düzen 60, atıf 20, referans 20.",anlam:"kimlik",ses:{teknik:["Figür başlığı figürün altına, tablo başlığı tablonun üstüne: «Figure 2. … (Wetter3, 2026).»","Kısaltma ilk geçişte açık yazılır: «Mean Sea Level Pressure (MSLP)»; sonra yalnız kısaltma.","Örnek raporda kaynak listesi alfabetik; yazar adları ve yıl kalın yazılmış."],basit:["Rapor bir dosya dolabı: her çekmece (bölüm) kendi işini yapar.","Her şeklin altında «bu ne, ne zaman, nereden» yazmalı."],ben:["Ben önce boş iskeleti (başlıklar + figür yerleri) kurdum, sonra içini doldurdum.","Abstract'ı en son yazıyorum; neyi bulduğumu ancak o zaman biliyorum."]},tablo:{baslik:["Bölüm","İçinde ne var"],satirlar:[["Kapak","Üniversite, fakülte, bölüm, MTO302E, dönem, CRN, öğretim üyesi, proje başlığı, öğrenci ad-numara"],["ABSTRACT","≤ 250 kelime: amaç, yöntem, bulgu, sonuç; atıf ve kısaltma yok; 3–5 keyword"],["1. INTRODUCTION","Küreselden yerele önem, önceki çalışmalar, boşluk ve amaç"],["2. STUDY REGION, DATA AND METHOD","2.1 bölge (haritayla), 2.2 veri, 2.3 yöntem"],["3. ANALYSIS","Başlangıç-zirve-bitiş haritaları ve yorum"],["4. CONCLUSION","Mekanizma özeti, yöntemin katkısı, öneri"],["ACKNOWLEDGMENTS · REFERENCES","Teşekkür; APA, alfabetik kaynak listesi"]]},sekil:[D.skewt],alt:[{id:"atif",baslik:"Metin içi atıf",ozet:"Size ait olmayan her bilgi ve figür, parantez içinde yazar/kurum ve yılla.",anlam:"kimlik",ses:{teknik:["Kurum ya da belge: (Annex-3 ICAO, 2018); üç ve üstü yazar: (Soyad et al., 2019).","Cümle başında anlatı biçimi: «Soyad et al. (2019) showed that…».","Figür altında kaynak parantez içinde: «… 12 UTC (Wetter3, 2026).»"],basit:["Bir bilgiyi kimden aldıysan adını cümlenin sonuna küçük bir etiketle koy.","Etiketin uzun hali referans listesinde durur."],ben:["Ben her paragrafı bitirince «bu bilgi benim mi?» diye soruyorum; değilse atıf ekliyorum.","Kendi çizdiğim haritaya da veri kaynağını yazıyorum: «data: ERA5»."]},tablo:{baslik:["Durum","Biçim"],satirlar:[["Kurum / belge","(Annex-3 ICAO, 2018) · (ECMWF, 2024)"],["Tek yazar","(Soyad, 2020)"],["İki yazar","(Soyad & Soyad, 2021)"],["Üç ve fazlası","(Soyad et al., 2019)"],["Cümle başında","Soyad et al. (2019) showed that…"],["Figür altında","Figure 3. 500 hPa geopotential height, 12 UTC (Wetter3, 2026)."]]},sorular:[{s:"Wyoming'den aldığın Skew-T'yi rapora koydun. Altına ne yazarsın?",c:["Numara + içerik + zaman: «Figure 4. Skew-T log-P diagram of 17064 Istanbul/Kartal, 00 UTC».","Sonuna atıf: «(University of Wyoming, 2026)»."]}],tuzak:"Atıfı yalnız metne koyup figürlere koymamak: her figür de bir kaynaktır.",kaynak:"Ninova duyurusu: Proje Ödevi; Proje raporu örneği (Ninova)"},{id:"apa",baslik:"Referans listesi (APA)",ozet:"Hepsi REFERENCES altında, alfabetik; «WEB LINK 1» gibi ifade yok.",anlam:"kimlik",ses:{teknik:["APA: Yazar/kurum. (Yıl). Başlık [tür]. Yayıncı. URL — liste soyada/kurum adına göre alfabetik.","Web haritalarında erişim tarihi verilir: «Retrieved November 20, 2026, from https://…».","Metindeki her atıfın listede, listedeki her kaynağın metinde karşılığı olmalı."],basit:["Referans listesi kütüphane kartı gibi: aynı düzen, aynı sıra.","Link tek başına kaynak değildir; kimin, ne zaman, ne yayınladığı yazılır."],ben:["Ben kaynakları bir tabloda tutuyorum, sonunda alfabetik sıralayıp kopyalıyorum.","Son kontrolde metindeki atıfları tek tek listede arıyorum."]},tablo:{baslik:["Tür","Örnek"],satirlar:[["Veri seti","Copernicus Climate Change Service. (2023). ERA5 hourly data on pressure levels from 1940 to present [Data set]. ECMWF. https://cds.climate.copernicus.eu"],["Belge","ICAO. (2018). Annex 3: Meteorological service for international air navigation (20th ed.). International Civil Aviation Organization."],["Web haritası","Wetter3. (2026). GFS archive [Map]. Retrieved November 20, 2026, from https://www.wetter3.de"],["Sondaj verisi","University of Wyoming. (2026). Atmospheric soundings [Data set]. https://weather.uwyo.edu/upperair/sounding.shtml"],["Makale","Soyad, A., Soyad, B., & Soyad, C. (2019). Title of the article. Journal Name, 12(3), 45–67. https://doi.org/…"]],not:"Soyad ve başlıklar yer tutucudur; kendi kaynağının bilgisini yaz."},sorular:[{s:"Listede «WEB LINK 1: www.wetter3.de» yazıyor. Nasıl düzeltirsin?",c:["Kurum yazar olur: «Wetter3. (2026).»","Başlık, tür, erişim tarihi ve tam URL eklenir; alfabetik yerine konur."]}],tuzak:"Kaynakları kullanım sırasına göre numaralamak: APA'da liste alfabetiktir.",kaynak:"Ninova duyurusu: Proje Ödevi; Proje raporu örneği (Ninova)"}],sorular:[{s:"Abstract'ta hangi üç şey bulunmaz?",c:["Atıf (referans).","Açıklanmamış kısaltma.","Figür ve tablo."]}],tuzak:"Figür başlığını üste, tablo başlığını alta koymak: örnek raporda kural tam tersi.",kaynak:"Ninova duyurusu: Proje Ödevi; Proje raporu örneği (Ninova)"}],oz:"Aynı harita setini üç anda karşılaştır, farkı fizikle açıkla, her şekle atıf ver, raporu İngilizce ve APA ile kapat."},{id:"harita-analizi",no:"5",baslik:"Harita analizi ödevi (elle çizim)",ozet:"Basılı yüzey, 850, 700, 500 ve 300 hPa haritalarına izobar, izohips ve izoterm çiz; seviyenin sorusunu yorumla.",neden:"Ödev olarak elden teslim edilir; benzer çizimlerin sınavda da sorulma eğilimi var.",kavramlar:[{id:"odev-nedir",baslik:"Ödev ne istiyor?",ozet:"Beş harita; her birinde taban değer ve sabit aralıkla çizim, sonra seviyeye özgü analiz.",anlam:"basinc",ses:{teknik:["Taban, çizilen ilk referans çizgidir; diğerleri sabit aralıkla eklenir/çıkarılır (552 → 558, 546…).","1 gpdam = 10 gpm: 150 gpdam ≈ 1500 m (850 hPa), 300 ≈ 3000 m, 552 ≈ 5520 m, 900 ≈ 9000 m.","İzotermler 2,5 °C aralıkla; belirli değerler renkli (0 °C mavi … −40 °C siyah)."],basit:["Merdiven gibi: ilk basamak taban, her basamak aynı yükseklikte.","Önce kurşun kalemle hafif çiz, emin olunca belirginleştir."],ben:["Ben her haritanın köşesine «taban / aralık» yazıp sonra çizmeye başlıyorum.","Değerleri sıralıyorum: 546, 552, 558, 564; birini atlarsam hemen görüyorum."]},tablo:{baslik:["Harita","Çizgi","Taban","Aralık","Analiz"],satirlar:[["Yüzey (sinoptik)","İzobar","1000 hPa","4 hPa","Merkezler (A/Y · L/H)"],["850 hPa","İzohips + izoterm","150 gpdam","3 gpdam","Sıcaklık adveksiyonu"],["700 hPa","İzohips","300 gpdam","6 gpdam","Sırt-trof"],["500 hPa","İzohips","552 gpdam","6 gpdam","Sırt-trof"],["300 hPa","İzohips","900 gpdam","6 gpdam","Jet"]],not:"İzotermler 2,5 °C aralıkla. Basılı haritalar MED-C binasına elden; son tarih Aralık başı (Ninova)."},sorular:[{s:"850 hPa haritasında hangi konturlar çizilir?",c:["Taban 150 gpdam, aralık 3 gpdam.","…144, 147, 150, 153, 156… (1500 m civarı)."]},{s:"Yüzey haritasında 1000'in iki altı ve iki üstü hangi izobarlar?",c:["4 hPa aralıkla.","992, 996, 1000, 1004, 1008."]}],tuzak:"Hazır haritadaki aralığı kopyalamak: örneğin DWD yer haritası 5 hPa kullanır, ödev 4 hPa ister.",kaynak:"Ninova duyurusu: MAP ANALYSIS; derste geçenler: kontur aralıkları"},{id:"cizim-kurallari",baslik:"Çizim kuralları",ozet:"Kesişmez, çatallanmaz, ortada bitmez; değerlerin arasından enterpolasyonla geçer.",anlam:"basinc",ses:{teknik:["Eğriler kesişmez, birleşmez; ya harita kenarında biter ya da kendi üstüne kapanır.","Çizgi istasyon değerleri arasından doğrusal enterpolasyonla geçer: 1004,2 hPa istasyon 1004'e çok yakındır.","Üst seviyede rüzgar konturlara yaklaşık paraleldir (geostrofik); barb yönü çizimini denetler."],basit:["Çizgi, aynı değerli noktaları birleştiren bir ip; ip kopmaz, düğümlenmez.","Rüzgar oku çizginle ters düşüyorsa yanlış olan çoğu zaman çizgidir."],ben:["Ben önce en yüksek ve en alçak merkezleri bulup işaretliyorum, sonra aradan dolduruyorum.","Her çizginin iki ucuna değerini yazıyorum; kontrol ederken çok işe yarıyor."]},sekil:[D.yer],sorular:[{s:"İki istasyon: 1006 ve 1014 hPa. Hangi izobarlar aralarından, nereden geçer?",c:["4 hPa aralıkla 1008 ve 1012 geçer.","1008, 1006'dan 1/4 mesafede; 1012, 1006'dan 3/4 mesafede."]},{s:"Yüzeyde rüzgar izobarları neden hafifçe keser?",c:["Sürtünme rüzgarı yavaşlatır, Coriolis etkisi zayıflar.","Rüzgar alçak basınca doğru içeri sapar."]}],tuzak:"Değer atlamak: 1008 ile 1016 arasında 1012 mutlaka vardır; bitince sırayı kontrol et.",kaynak:"Derste geçenler: el analizi; ders dosyası: Isobar"},{id:"izoterm-renk",baslik:"İzotermler ve renk kuralı",ozet:"2,5 °C aralık; 0 mavi, −20 mavi, −25 yeşil, −30 sarı, −35 kahverengi, −40 siyah.",anlam:"sicaklik",ses:{teknik:["İzotermler 2,5 °C aralıkla çizilir (…, −22,5, −20, −17,5, …); renkli değerler kılavuz çizgidir.","Sıcak dil (warm tongue) kuzeye, soğuk dil (termal trof) güneye uzanır; izohipslerle karşılaştır.","Termal trof kontur trofunun batısında (gerisinde) kalırsa sistem derinleşme eğilimindedir."],basit:["Renkler, havanın ne kadar soğuk olduğunu tek bakışta söyleyen işaretler.","Kalem renklerini önceden sırala; ödevin yarısı düzen."],ben:["Ben renkli kalemleri izoterm sırasıyla masaya diziyorum.","Bir istasyonda −27 görürsem çizgiyi −25 (yeşil) ile −30 (sarı) arasından geçiriyorum."]},tablo:{baslik:["İzoterm","Renk","Genelde görüldüğü seviye"],satirlar:[["0 °C","Mavi","850 hPa (donma çizgisi)"],["−20 °C","Mavi","500 hPa"],["−25 °C","Yeşil","500 hPa"],["−30 °C","Sarı","500 / 300 hPa"],["−35 °C","Kahverengi","300 hPa"],["−40 °C","Siyah","300 hPa"]],not:"Renk listesi Ninova duyurusundan; listede olmayan izotermler için duyuruyu kontrol et."},sorular:[{s:"850 hPa'da İstanbul'un kuzeyinden 0 °C izotermi geçiyor. Neden önemli?",c:["850 hPa'da 0 °C donma çizgisidir; kışın yağış türü için ilk bakılan çizgilerdendir.","Yerde kar için genelde daha soğuk 850 değerleri (ör. −5 °C civarı) aranır; çizgi güneye inerse karla karışık yağış olasılığı artar."]}],tuzak:"Bazı kurum haritalarında 5'in katları kalın çizilir; ödevde tüm izotermler aynı koyulukta isteniyor.",kaynak:"Ninova duyurusu: MAP ANALYSIS; derste geçenler: izoterm çizimi"},{id:"adveksiyon",baslik:"850 hPa: adveksiyon analizi",ozet:"Rüzgar sıcaktan soğuğa eserse sıcak, soğuktan sıcağa eserse soğuk adveksiyon.",anlam:"sicaklik",ses:{teknik:["850 hPa'da rüzgar konturlara yaklaşık paraleldir; konturlar izotermleri kesiyorsa adveksiyon vardır.","Kesişim açısı büyük, oluşan kutular küçükse adveksiyon kuvvetli; çizgiler paralelse adveksiyon yok.","Sıcak adveksiyon (WAA) yükselme ve sırt gelişimi, soğuk adveksiyon (CAA) çökme ve trof derinleşmesiyle ilişkili."],basit:["Rüzgar sıcak yerden geliyorsa sıcağı, soğuk yerden geliyorsa soğuğu taşır.","Çizgiler satranç tahtası gibi küçük kareler yapıyorsa taşıma güçlü."],ben:["Ben barbın kuyruğuna bakıp «nereden geliyor, orası sıcak mı soğuk mu?» diye soruyorum.","WAA alanına «W», CAA alanına «C» yazıp hafifçe tarıyorum."]},formul:[{satir:"Sıcaklık adveksiyonu = −V · ∇T",terimler:[["V","yatay rüzgar vektörü","m/s"],["∇T","yatay sıcaklık gradyanı","K/m"],["−V·∇T > 0","sıcak adveksiyon (WAA)","K/s"]],not:"Kontur-izoterm kesişimlerinin oluşturduğu kutular küçüldükçe adveksiyon güçlenir."}],sekil:[D.t850],sorular:[{s:"850 hPa'da kuzeyli rüzgar; kuzeyde 0 °C, güneyde +10 °C izotermi var. Ne adveksiyonu?",c:["Rüzgar soğuk bölgeden (kuzey) sıcağa (güney) esiyor.","Soğuk adveksiyon (CAA): sıcaklık düşmesi beklenir."]}],tuzak:"Yüzey rüzgarıyla 850 hPa adveksiyonunu yorumlamak: 850 hPa haritasının kendi barblarını kullan.",kaynak:"Ninova duyurusu: MAP ANALYSIS; ders dosyası: ADVECTION"},{id:"trof-sirt",baslik:"700 ve 500 hPa: trof-sırt analizi",ozet:"Trof ekseni kesikli çizgi, sırt ekseni kırık (zikzak) çizgi; en büyük eğrilikten geçer.",anlam:"dinamik",ses:{teknik:["Trof (trough): konturların güneye çöktüğü siklonik eğrilik; eksen en büyük eğrilik noktalarından geçer.","Sırt (ridge): kuzeye kabaran antisiklonik eğrilik; ekseni kırık çizgiyle gösterilir.","Kapalı konturlu alçak kesik alçaktır (cut-off low); iki alçak arasında kuzeye uzanan sırt Ω blokajı."],basit:["Trof vadi, sırt tepe: vadinin önünde bulut, tepenin altında açık hava.","Kesik alçak ana akıştan kopmuş bir girdap; günlerce yerinde kalabilir."],ben:["Ben önce düz bir çizgiyle ekseni çekip sonra silgiyle aralık açarak kesikli yapıyorum.","Kontur trofunu siyah, izotermlerdeki termal trofu kırmızı çiziyorum."]},tablo:{baslik:["Öğe","Simge","Anlamı"],satirlar:[["Trof ekseni","Kesikli çizgi (- - -)","Soğuk hava; önünde yükselme"],["Sırt ekseni","Kırık / zikzak çizgi","Sıcak hava; çökme, açık hava"],["Kontur trofu","Siyah","Jeopotansiyel çöküntü"],["Termal trof","Kırmızı","İzotermlerde soğuk dil"],["Merkez","L/H (EN) · A/Y (TR) · T/H (DE)","Alçak / yüksek"]],not:"Bazı ülke haritalarında trof düz çizgiyle gösterilir; ödevde derste gösterilen gösterimi kullan."},sekil:[D.topo],sorular:[{s:"500 hPa'da 552 gpdam konturu İstanbul'un batısında güneye V çiziyor. Ne çizersin, ne beklersin?",c:["V'nin dibinden geçen kesikli çizgiyle trof ekseni.","Trofun doğusunda (önünde) yükselme, bulut ve yağış; batısında açılma."]}],tuzak:"Trof eksenini konturların ortasından rastgele çizmek: eksen her konturun en güneye sarktığı noktadan geçer.",kaynak:"Derste geçenler: trof-sırt çizimi; ders dosyası: TROUGHS AND RIDGES"},{id:"jet",baslik:"300 hPa: jet analizi",ozet:"Konturların en sık, barbların en güçlü olduğu kuşak jet; eksenini ve çekirdeğini işaretle.",anlam:"ruzgar",ses:{teknik:["Jet ekseni (jet axis) en kuvvetli rüzgarın izlediği hattır; konturlara paralel, en sık kontur kuşağında.","Barb okuma: üçgen 50 kt, tam çentik 10 kt, yarım 5 kt; jet için genelde ≥ 60 kt (~30 m/s) aranır.","Jet çekirdeğinin (jet streak) çıkış solu ve giriş sağı üst diverjans alanıdır; yer siklonunu besler."],basit:["Jet atmosferin otoyolu; konturların sıkıştığı yerde araçlar hızlanır.","Otoyolun bittiği yerde hava dağılır, altta alçak basınç beslenir."],ben:["Ben önce en büyük barbları işaretleyip onları bir okla birleştiriyorum.","Eksen üzerinde en hızlı yere «J» yazıp hızını not ediyorum."]},sekil:[D.jet],sorular:[{s:"Bir barbda bir üçgen ve iki tam çentik var. Hız kaç knot?",c:["Üçgen 50 kt + 2 × 10 kt.","70 kt (~36 m/s): jet hızında."]},{s:"Polar cephe jeti ile subtropikal jet farkı nedir?",c:["Polar jet: orta enlem ile kutup havası arasındaki keskin sıcaklık farkından (termal rüzgar).","Subtropikal jet: Hadley hücresinin kutba yakın ucunda, daha yüksekte (~200 hPa)."]}],tuzak:"Jet eksenini konturları dik kesecek biçimde çizmek: jet akışı izler, konturlara paraleldir.",kaynak:"Ninova duyurusu: MAP ANALYSIS; derste geçenler: jet soruları"}],oz:"Doğru taban + sabit aralık + kesişmeyen yumuşak çizgi; sonra seviyenin sorusu: 850 adveksiyon, 700/500 trof-sırt, 300 jet."}],hr=[{no:"1",baslik:"Yer analizi (cepheli)",urun:"Yüzey analizi: MSLP izobarları, cepheler, istasyon modelleri",site:["DWD (Deutscher Wetterdienst) — https://www.dwd.de"],bak:["Alt köşedeki tarih-saat: «Boden» = yüzey, saat UTC","Alçak (T) ve yüksek (H) merkezler ve merkez değerleri","Cepheler: soğuk (üçgen), sıcak (yarım daire), oklüzyon (ikisi bir arada)","İzobar sıklığı: sık = kuvvetli rüzgar, seyrek = sakin","Türkiye ve İstanbul çevresindeki izobar ve cephe"],soyle:{teknik:["Kuzey Avrupa'da 975 hPa'lık derin alçak ve cephe sistemi; izobarlar sık, gradyan kuvvetli.","Türkiye üzerinde izobarlar seyrek: zayıf basınç gradyanı, hafif rüzgar."],basit:["Büyük girdaplar nerede, cepheler hangi yöne gidiyor: haritanın özeti bu.","Çizgiler birbirine yakınsa rüzgar sert, uzaksa hava sakin."],ben:["Ben bu slaytta önce en derin alçağı ve değerini, sonra İstanbul'un hangi sisteme yakın olduğunu söylerim.","«T» Almanca Tief, «H» Hoch; Türkçede A ve Y diye eklerim."]},hata:"Harfleri İngilizce okumak: T burada «sıcak» değil, alçak (Tief) demek.",soru:[{s:"Haritadaki «T» ve «H» ne demek?",c:["Almanca: T = Tief (alçak), H = Hoch (yüksek).","Türkçe haritada A ve Y, İngilizcede L ve H."]}],gorsel:B("yer-analizi.png")},{no:"2",baslik:"500 hPa + yer basıncı + rölatif topografya",urun:"Kompozit: 500 hPa jeopotansiyel (siyah), MSLP (beyaz), H500−H1000 kalınlığı (renk) — GFS",site:["wetter3 — https://www.wetter3.de"],bak:["Siyah konturlar: 500 hPa yüksekliği (gpdam); 552 referans","Beyaz çizgiler: yer basıncı (hPa)","Renk: kalınlık; turuncu sıcak, mavi-yeşil soğuk tabaka","Trof, sırt, kesik alçak ve Ω deseni","Alt satır: geçerlilik saati ve «run + saat»"],soyle:{teknik:["Atlantik'te 536 gpdam'lık derin trof, Akdeniz'den Orta Avrupa'ya uzanan sırt; Karadeniz kuzeyinde kesik alçak.","Kalınlık sırt altında büyük (sıcak), trof altında küçük (soğuk); yer sistemleriyle uyumlu."],basit:["Üç harita üst üste: yukarıdaki nehir, yerdeki girdaplar ve havanın ne kadar ılık olduğu.","Mavi bölge soğuk cep, turuncu bölge sıcak kubbe."],ben:["Ben bu slaytta «renkler basınç değil kalınlık» cümlesini mutlaka söylerim.","Sonra İstanbul'un sırtta mı trofta mı olduğunu ve bunun yarına etkisini söylerim."]},hata:"Renkli alanı basınç, siyah konturları izobar diye okumak.",soru:[{s:"Renk skalası neyi gösteriyor, 552'nin altı ne anlatır?",c:["H500−H1000 kalınlığı (gpdam): tabakanın ortalama sıcaklığı.","Küçük kalınlık soğuk hava; 552'nin altı soğuk, trofa yakın bölge."]}],gorsel:B("500-mslp-topo.png")},{no:"3",baslik:"ECMWF genel bakış",urun:"Anlık yağış şiddeti, bulut, sıcaklık ve MSLP (ECMWF HRES)",site:["WXCharts — https://www.wxcharts.com"],bak:["Başlıktaki Run ve Valid saatleri","Yağış alanları ve renk skalası","Bulut örtüsü ve basınç merkezleri","İstanbul ve Marmara'da bulut/yağış var mı?"],soyle:{teknik:["Seçilen geçerlilik saatinde yağış şiddeti, bulut ve basınç alanını tek panelde gösteren model öngörüsü.","Yağış alanlarını cephe ve trof konumlarıyla eşleştirip öngörüye bağla."],basit:["Uydu fotoğrafına benzeyen bir tahmin: nerede bulut, nerede yağmur olacak.","Önce büyük resme, sonra İstanbul'a bak."],ben:["Ben bu slayta «bu bir öngörü haritası, şu run'dan şu saate» diye başlarım.","Sonra İstanbul'un yağış alanının içinde mi dışında mı kaldığını söylerim."]},hata:"Öngörü haritasını gözlem gibi anlatmak: «yağıyor» değil «yağış bekleniyor».",soru:[{s:"Bu harita analiz mi öngörü mü? Nereden anlarsın?",c:["Başlıktaki Run ve Valid farklıysa öngörüdür.","Örnekte Run Perşembe 00Z, Valid Salı: birkaç günlük öngörü."]}],gorsel:B("ecmwf-genel.jpg")},{no:"4",baslik:"24 saat birikimli yağış",urun:"24 saatlik toplam yağış (mm) — ECMWF",site:["WXCharts — https://www.wxcharts.com"],bak:["Hangi 24 saati kapsıyor (Valid saatinden geriye)?","En yüksek toplamlar nerede, kaç mm?","Dağ ve kıyı etkisi: orografik yağış","İstanbul'da toplam kaç mm?"],soyle:{teknik:["Birikimli yağış belirli aralıktaki model yağışının toplamıdır; şiddet değil miktar gösterir.","Yüksek toplamları trof önü, cephe ve orografik yükselmeyle açıkla."],basit:["Bir kova koysan 24 saatte ne kadar dolardı, onu gösterir.","Dağ yamaçları denizden gelen nemli havayı yükseltip yağmuru artırır."],ben:["Ben bu slaytta İstanbul için «yaklaşık şu kadar mm» diye tek sayı söylerim.","En çok yağan yeri neden orası olduğuyla birlikte gösteririm."]},hata:"Anlık yağış şiddeti ile 24 saatlik toplamı karıştırmak.",soru:[{s:"İstanbul'da dün gerçekten yağış oldu mu? Nasıl doğrularsın?",c:["Ogimet'ten İstanbul SYNOP'larına bak: 6RRRtR grubu ve ww.","Model toplamıyla karşılaştır; tutmuyorsa açıkça söyle."]}],gorsel:B("yagis-24sa.jpg")},{no:"5",baslik:"850 hPa sıcaklık + MSLP",urun:"850 hPa sıcaklığı (renk, °C) ve deniz seviyesi basıncı (çizgi) — ECMWF",site:["WXCharts — https://www.wxcharts.com"],bak:["Renk: 850 hPa (~1500 m) sıcaklığı","İstanbul üzerinden geçen değer","Sıcak dil / soğuk dil ve hava kütleleri","İzobarlara göre akış yönü → adveksiyon"],soyle:{teknik:["850 hPa sıcaklığı günlük döngüden az etkilenir; hava kütlesini ve adveksiyonu temiz gösterir.","Kuzeyli akışla gelen soğuk dil soğuk adveksiyon (CAA), güneyliyle gelen sıcak dil WAA demektir."],basit:["Yerden 1,5 km yukarıdaki sıcaklık: havanın gerçek «kimliği».","Rüzgar sıcak yerden geliyorsa ısınma, soğuk yerden geliyorsa serinleme."],ben:["Ben «İstanbul üzerinden 850 hPa'da yaklaşık şu derece geçiyor» cümlesini sayıyla söylerim.","Gündüz yerde bundan yaklaşık 10 °C daha sıcak olabileceğini eklerim."]},hata:"Değer okumadan «sıcak» ya da «soğuk» demek; skaladan sayıyı oku.",soru:[{s:"İstanbul üzerinden 850 hPa'da kaç derece geçiyor?",c:["Renk skalasından İstanbul'un rengini oku (ör. 8–10 °C).","Gündüz yerde ~18–20 °C beklenebilir."]}],gorsel:B("850-sicaklik-mslp.jpg")},{no:"6",baslik:"700 hPa bağıl nem",urun:"700 hPa bağıl nem (%), 15–30–45–60–75–90 eğrileri — GFS",site:["wetter3 — https://www.wetter3.de"],bak:["Yeşil tonlar nemli, beyaz alan kuru","F harfi > %95 (feucht), T harfi < %15 (trocken)","≥ %90 alanlar: bulut ve yağış adayı","Nem bandının trof ya da cepheyle çakışması"],soyle:{teknik:["700 hPa (~3 km) orta troposfer nemini gösterir; RH ≥ %90 bulutlu, yağışa uygun katman demektir.","Yüksek basınç altında çökme orta seviyeyi kurutur; geniş kuru alan antisiklonu doğrular."],basit:["Gökyüzünün orta katındaki nem: ıslak sünger mi, kuru sünger mi?","Kuru bölge açık hava, nemli bant bulut kuşağı."],ben:["Ben «Marmara'da RH yüzde şu; bu yüzden bulut bekliyorum/beklemiyorum» derim.","T harfinin burada «trocken» (kuru) olduğunu, sıcaklık olmadığını söylerim."]},hata:"Haritadaki F ve T harflerini basınç merkezi sanmak.",soru:[{s:"700 hPa'da yoğun yağış için RH'nin kaç olması beklenir?",c:["Genelde %90 ve üzeri.","Yükselmeyle (trof önü, cephe) birleşirse yağış olasılığı artar."]}],gorsel:B("700-nem.png")},{no:"7",baslik:"500 hPa jeopotansiyel + MSLP",urun:"500 hPa yüksekliği (renk, gpdam) ve yer basıncı (beyaz çizgi) — ECMWF",site:["WXCharts — https://www.wxcharts.com"],bak:["Renk: 500 hPa yüksekliği; sıcak renkler sırt","Beyaz çizgiler: yer basıncı","Trof ve sırt eksenleri, Ω deseni","İstanbul trofun önünde mi arkasında mı?"],soyle:{teknik:["500 hPa (~5,5 km) akışın yönünü gösterir; yer sistemleri bu akışla taşınır (steering).","Trof önü yükselme ve kötü hava, sırt altı çökme ve kararlı hava demektir."],basit:["Hava sistemlerini taşıyan yüksek irtifa nehrinin haritası.","Vadide (trof) yağmur, tepede (sırt) güneş."],ben:["Ben trof eksenini fareyle çizerek gösterir, İstanbul'a uzaklığını söylerim.","Ertesi günün aynı haritasını yanına koyup trofun nereye kaydığını gösteririm."]},hata:"Üst seviyede «basınç gradyanı» demek; doğrusu yükseklik gradyanı, sık kontur.",soru:[{s:"Haritada Ω blokajı var mı, nasıl anlarsın?",c:["İki kesik alçak arasında kuzeye uzanan geniş sırt Ω harfine benzer.","Akış günlerce kilitlenir; hava aynı kalma eğilimindedir."]}],gorsel:B("500-mslp.jpg")},{no:"8",baslik:"500 hPa vortisite",urun:"500 hPa jeopotansiyel (kontur) + bağıl vortisite (renk, 10⁻⁵ s⁻¹)",site:["Model görseli; örnekte site etiketi yok — benzeri: Tropical Tidbits, https://www.tropicaltidbits.com"],bak:["Kırmızı pozitif (siklonik), mavi negatif (antisiklonik) vortisite","Trof eksenindeki vortisite maksimumu","Trofun önü: pozitif vortisite adveksiyonu (PVA)","Kesik alçağın çevresindeki vortisite halkası"],soyle:{teknik:["KYK'de pozitif bağıl vortisite siklonik dönüştür; trof ve alçaklarda maksimum yapar.","Rüzgarın pozitif vortisiteyi taşıdığı yer (PVA) üst diverjans ve yükselme alanıdır."],basit:["Hava ne kadar «dönüyor»? Kırmızı saat yönünün tersine, mavi saat yönünde.","Kırmızı girdabın rüzgarla itildiği yön, bulutun doğduğu yer."],ben:["Ben «pozitif vortisite alçak basınçla, negatif yüksekle gider» cümlesiyle başlarım.","Sonra İstanbul'un PVA alanına girip girmediğini söylerim."]},hata:"Vortisitenin kendisini yükselme sanmak; yükselmeyi asıl vortisite adveksiyonu verir.",soru:[{s:"Pozitif vortisite alçak basınçla mı, yüksekle mi ilişkili?",c:["KYK'de saat yönünün tersine dönüş pozitif (siklonik) vortisitedir.","Alçak ve trofla ilişkili; negatif vortisite sırt ve yüksekle."]}],gorsel:B("500-vortisite.jpg")},{no:"9",baslik:"200 hPa akım çizgisi + izotak (jet)",urun:"200 hPa akım çizgileri ve rüzgar hızı (renk, m/s)",site:["Model görseli; örnekte site etiketi yok — benzeri: Tropical Tidbits, https://www.tropicaltidbits.com"],bak:["Mavi tonlar: rüzgar hızı; ≥ 30 m/s jet","Akım çizgileri: akış yönü ve kapalı girdaplar","Polar cephe jeti (kuzey) ve subtropikal jet (güney)","Jet çekirdeğinin giriş ve çıkış bölgeleri"],soyle:{teknik:["Jet, sıcaklık kontrastının en keskin olduğu kuşakta termal rüzgarla güçlenir.","Jet çekirdeği çıkışının solu ve girişinin sağı (KYK) üst diverjans alanıdır; yer sistemini besler."],basit:["Atmosferin tavanındaki hızlı rüzgar şeridi.","Şeridin başladığı ve bittiği yerlerde aşağıdaki hava hareketlenir."],ben:["Ben jetin İstanbul'a uzak mı yakın mı olduğunu ve adını (polar/subtropikal) söylerim.","Birim m/s ise knot'a çeviririm: 1 m/s ≈ 2 kt."]},hata:"Jetin bir parçasını trof sanmak: jet hız alanıdır, trof kontur çöküntüsüdür.",soru:[{s:"Bu jet nasıl oluşur?",c:["Polar jet: kutup ve orta enlem havası arasındaki keskin sıcaklık farkı yükseldikçe rüzgarı artırır (termal rüzgar).","Subtropikal jet: Hadley hücresinin üst kolunda kutba giden havanın açısal momentumu."]}],gorsel:B("200-jet.png")},{no:"10",baslik:"CAPE",urun:"CAPE (J/kg) + 500 hPa jeopotansiyel — ECMWF",site:["WXCharts — https://www.wxcharts.com"],bak:["Renk: CAPE; 1000 J/kg üstü belirgin, 2500 üstü kuvvetli","En yüksek CAPE nerede (çoğu zaman sıcak deniz üstü)?","İstanbul'daki değer ve 500 hPa akışıyla birleşimi","Tetik var mı: trof, cephe, orografi"],soyle:{teknik:["CAPE, yükselen parselin çevresinden sıcak kaldığı katmandaki kaldırma enerjisidir (J/kg).","Yüksek CAPE tek başına fırtına değildir; tetikleyici yükselme ve nem gerekir."],basit:["Atmosferin «yay gerginliği»: ne kadar gerginse fırlayan bulut o kadar güçlü.","Yay gergin ama bırakan yoksa (tetik yoksa) bir şey olmaz."],ben:["Ben «İstanbul'da CAPE düşük, konvektif fırtına beklemiyorum» gibi net bir cümle kurarım.","Yüksek CAPE'li bölgeyi trof önüyle eşleştirip olası sağanak bölgesi derim."]},hata:"CAPE'yi yağış miktarı sanmak; o bir potansiyeldir, olasılık ve şiddet hakkında fikir verir.",soru:[{s:"CAPE yüksek ama gökyüzü açık. Neden olabilir?",c:["Tetikleyici yok ya da inversiyon (CIN) parseli tutuyor.","Kuru orta katman bulut gelişimini kesiyor olabilir."]}],gorsel:B("cape.jpg")},{no:"11",baslik:"Meteogram",urun:"Tek nokta zaman serisi: 10 m rüzgar-hamle, 2 m T ve Td, 850 hPa T ve MSLP",site:["WXCharts — https://www.wxcharts.com"],bak:["Konum etiketi: İstanbul mu (~41K 29D)?","10 m rüzgar ve hamle","2 m sıcaklık ve çiy noktası: aradaki fark","850 hPa sıcaklık ve MSLP eğilimi","Model ve run (GFS / ECMWF HRES, 00/12)"],soyle:{teknik:["Meteogram tek noktada birkaç parametrenin günlere yayılan öngörüsüdür; ensemble sekmesi belirsizliği gösterir.","T ile Td yaklaşırsa hava doyuma gider; MSLP düşüşü ve rüzgar dönmesi sistem geçişini işaretler."],basit:["Bir şehrin önümüzdeki günlerinin «nabız grafiği».","Sıcaklık ve çiy noktası çizgileri birleşirse sis ya da yağmur yakındır."],ben:["Ben önce konumun İstanbul olduğunu söyler, sonra en dikkat çekici günü gösteririm.","Basıncın düştüğü ve rüzgarın döndüğü saati «sistem geliyor» diye işaretlerim."]},hata:"Konumu kontrol etmemek: varsayılan koordinat başka bir yer olabilir (örnek görselde 54K 7D).",soru:[{s:"Hangi çizgi sıcaklık, hangisi çiy noktası?",c:["Çiy noktası sıcaklıktan büyük olamaz.","Üstteki sıcaklık, alttaki çiy noktası; birleşirlerse hava doymuştur."]}],gorsel:B("meteogram.png")},{no:"12",baslik:"Skew-T + indeksler",urun:"Radyosonde profili (Skew-T log-P) ve kararlılık indeksleri — 17064 İstanbul/Kartal",site:["University of Wyoming — https://weather.uwyo.edu/upperair/sounding.shtml"],bak:["İstasyon ve saat: 17064, 00 ya da 12 UTC","Sağ kalın çizgi T, sol kalın çizgi Td: aradaki açıklık","İnversiyon: sıcaklığın yükseklikle arttığı kırılma","Sağdaki barblar: rüzgarın yükseklikle dönmesi","İndeksler: LI, K, TT, CAPE, PW (örnekte K 15,3, TT 43,8, MUCAPE 234 J/kg: zayıf)"],soyle:{teknik:["T–Td farkı büyük katmanlar kuru, küçük katmanlar doygundur; kalın doygun katman bulut demek.","İnversiyon kararlı bir kapak gibidir; altında sis ve kirlilik birikebilir."],basit:["Balonun yukarı çıkarken ölçtüğü sıcaklık ve nem profili.","İki çizgi yakınsa nemli, uzaksa kuru; çizgi sağa kırılıyorsa yukarıda sıcak bir kapak var."],ben:["Ben «yerde T ile Td arası açık, hava kuru; alt seviyede inversiyon var» diye okurum.","İndekslerden bir-ikisini eşiğiyle söylerim: «K = 15, oraj olasılığı zayıf»."]},hata:"T ile Td çizgisini ters okumak: Td her zaman solda (daha düşük).",soru:[{s:"İnversiyon nedir, Skew-T'de nasıl görünür?",c:["Sıcaklığın yükseklikle artmasıdır.","T çizgisi yukarı çıkarken sağa kırılır; kararlı katmandır."]}],gorsel:B("skewt-17064.png")},{no:"13",baslik:"Uydu ve radar: doğrulama",urun:"Uydu (MSG, Natural Colour RGB) ve radar yansıması (dBZ, PPI/kompozit)",site:["EUMETSAT — https://view.eumetsat.int","EUMETrain ePort — https://eumetrain.org","Türkiye radar ve uydu sayfası (ders site listesinde) — https://www.mgm.gov.tr"],bak:["Görüntü saati haritalarla aynı mı?","Natural Colour: camgöbeği buz bulutu, beyaz su bulutu, yeşil-kahve yüzey","Radar: dBZ skalası, PPI/kompozit, tarama menzili","Bulut ve yansıma alanları öngördüğün sistemle çakışıyor mu?"],soyle:{teknik:["Uydu ve radar gözlemdir; model analizini doğrular ya da çürütür.","Radar yansıması hidrometeoru gösterir; yere ulaşan yağışı gözlemle teyit et."],basit:["Uydu yukarıdan fotoğraf, radar bulutun içine bakan fener.","Model «yağacak» der; radar «şu an orada su damlası var» der."],ben:["Ben «uydu da radar da İstanbul'da açık hava gösteriyor; analizle uyumlu» diye bağlarım.","Uyumsuzluk varsa saklamam; nedenini (zamanlama, model hatası) söylerim."]},hata:"Radar yansımasını kesin yağış sanmak; 700/500 hPa ve gözlemle birlikte yorumla.",soru:[{s:"Natural Colour RGB'de camgöbeği (cyan) ne gösterir?",c:["Buz kristalli yüksek ve kalın bulut tepeleri.","Kar örtüsü de camgöbeği görünebilir; konuma ve harekete bak."]}]},{no:"14",baslik:"İstasyon modelli yer haritası",urun:"İstasyon modelleri işlenmiş yüzey haritası + model anlatımı",site:["Met Office — https://www.metoffice.gov.uk (istasyon modeli açıklaması)"],bak:["Her istasyonda değerlerin standart konumu","Bulutluluk dairesi (okta) ve rüzgar çubuğu","Basınç: son üç hane ve eğilim","Hadise sembolü (ww): yağmur, sis, sağanak"],soyle:{teknik:["İstasyon modeli SYNOP'un harita üstündeki özetidir; her değer sabit konumdadır.","Basınç son üç haneyle yazılır: 042 → 1004,2 hPa; 184 → 1018,4 hPa."],basit:["Her istasyonun küçük kimlik kartı: sıcaklık, nem, rüzgar, bulut tek bakışta.","Konumları bir kez öğrenince bütün harita okunur hale gelir."],ben:["Ben İstanbul'a en yakın istasyonu büyütüp değerleri tek tek okurum.","Örnek modeli çözüp SYNOP koduyla eşleştiririm: aynı bilgi iki biçimde."]},hata:"Basıncın başını yanlış eklemek: 980 → 998,0 hPa; 042 → 1004,2 hPa.",soru:[{s:"Modelde basınç «184» yazıyor. Kaç hPa?",c:["Son üç hane 18,4; 500'ün altı olduğu için başa 10 gelir.","1018,4 hPa."]}],gorsel:B("istasyon-konumlari.png")},{no:"15",baslik:"SYNOP ve çözümü",urun:"Ogimet SYNOP listesi + grup grup çözüm (ör. 17022 Zonguldak)",site:["Ogimet — https://www.ogimet.com"],bak:["İstasyon başlığı: numara, ad, koordinat, yükseklik","Satır başı tarih-saat (yıl-ay-gün-saat-dakika)","AAXX sonrası Kısım 0 ve 1; «333» sonrası Kısım 3","NIL = o saatte rapor yok","Liste yeniden eskiye sıralı"],soyle:{teknik:["Kısım 0 kimlik, Kısım 1 temel gözlem, Kısım 3 bölgesel ek gruplar (bulut katmanları, hamle).","Grubun ilk rakamı göstergedir: 1 sıcaklık, 2 çiy noktası, 3-4 basınç, 5 eğilim, 6 yağış, 8 bulut."],basit:["Rakamlarla yazılmış bir hava raporu; kod kağıdı onun sözlüğü.","Beşli grupları tek tek kutulara ayır, her kutuyu sözlükten çevir."],ben:["Ben tek bir SYNOP'u slayta büyük yazıp grup grup renklendirerek çözerim.","Sonunda «bu istasyonda şu an hava şöyle» diye tek cümleyle bağlarım."]},hata:"Tablodan bakmadan tahminle çözmek; özellikle 9-grupları ve 8-grubundaki Nh.",soru:[{s:"73603 grubunu çöz.",c:["N = 7: gökyüzü 7/8 kapalı.","dd = 36: rüzgar 360° (kuzeyden); ff = 03: 3 kt."]}],gorsel:B("synop-ogimet.png")},{no:"16",baslik:"Kapanış: İstanbul öngörüsü (önerilen ek)",urun:"Özet öngörü slaytı: yarın için sıcaklık, rüzgar, bulut, yağış",site:["Önceki slaytların sentezi"],bak:["Yarın İstanb
