:{baslik:"Soğuk cephe",kisa:{teknik:"Soğuk hava kütlesinin sıcak havanın yerini aldığı sınır; mavi çizgi, üçgenler hareket yönünde.",basit:"Soğuk havanın sıcak havayı iterek ilerlediği çizgi; kısa ama sert yağış getirir.",ben:"Mavi üçgenleri görünce «sağanak geçer, sonra serinler» derim."},neden:{teknik:["Yoğun soğuk hava sıcak havanın altına kama gibi girer; dik eğim (1/50–1/100) güçlü zorlamalı yükselme ve Cb verir.","Cephe bir basınç trofu içinde durur: geçerken basınç düşüşü yükselişe döner, rüzgar saat yönünde döner (veer)."],basit:["Ağır soğuk hava, hafif sıcak havayı alttan kaldırır.","Hızla kalkan hava kalın bulut ve sağanak yapar."],ben:["Ben soğuk cepheyi kar küreği gibi düşünürüm: sıcak havayı alttan kazıyıp yukarı atar.","Dik eğim yüzünden yağış şeridinin dar olduğunu hatırlarım."]},bak:{teknik:["Mavi çizgi; üçgenler sıcak sektöre, yani hareket yönüne bakar.","İzobarlar cephede keskin kırılır (V); arkadaki istasyonda T düşük, rüzgar kuzeybatılı, basınç yükseliyor."],basit:["Mavi çizgi ve üzerinde mavi üçgenler.","Üçgenler cephenin gittiği yöne bakar."],ben:["Ben üçgenlerin ucunu takip edip cephenin nereye gittiğini bulurum.","İki yanındaki istasyonların sıcaklığını karşılaştırırım."]},hata:{teknik:"Üçgenleri soğuk havaya bakacak çizmek: semboller hareket yönüne, yani sıcak hava tarafına konur.",basit:"Üçgenler soğuk tarafa değil, cephenin ilerlediği sıcak tarafa bakar.",ben:"Ben çizmeden önce «cephe nereye gidiyor?» diye sorarım; üçgeni o tarafa koyarım."},dene:{s:"İstasyonları aç: soğuk cephenin arkasındaki ve sıcak sektördeki istasyonun sıcaklıkları kaç, fark ne?",c:{teknik:"Arkada 8 °C, sektörde 17 °C: cephe boyunca 9 °C'lik fark, belirgin bir yatay sıcaklık gradyanı.",basit:"8 °C ile 17 °C: cephe geçince hava 9 °C kadar soğuyabilir.",ben:"Ben 17 − 8 = 9 °C bulurum ve brifingde «cephe arkası belirgin serin» derim."}},kaynak:"AMS Glossary of Meteorology: cold front; Wallace & Hobbs 2006; Met Office Fact Sheet 11"},"harita.sicak":{baslik:"Sıcak cephe",kisa:{teknik:"Sıcak havanın çekilen soğuk havanın yerini aldığı sınır; kırmızı çizgi, yarım daireler hareket yönünde.",basit:"Ilık havanın soğuk havanın üstüne yavaşça tırmandığı çizgi; uzun süren yağış getirir.",ben:"Kırmızı yarım daireleri görünce «saatlerce sürecek yağış» derim."},neden:{teknik:["Hafif sıcak hava soğuk kamanın üstünde yavaşça kayar (eğim 1/150–1/300): geniş katmanlı bulut (As, Ns).","Yaklaşırken bulut sırası Ci → Cs → As → Ns; yağış kuşağı cephenin önünde, soğuk hava tarafında geniştir."],basit:["Sıcak hava hafif olduğu için soğuk havanın üstüne yokuş tırmanır gibi çıkar.","Tırmanış yavaş ama geniş; bulut ve yağış uzun sürer."],ben:["Ben sıcak cepheyi uzun ve yavaş bir rampa gibi düşünürüm.","Gökte önce ince tüy bulutları (Ci) görürsem sıcak cephenin yaklaştığını düşünürüm."]},bak:{teknik:["Kırmızı çizgi; yarım daireler soğuk havaya, yani hareket yönüne bakar.","Cephenin güneyi sıcak sektör (açık kırmızı gölge); izobarlar cephede kırılır."],basit:["Kırmızı çizgi ve üzerinde kırmızı yarım daireler.","Çizginin hemen güneyi ılık bölge."],ben:["Ben yarım dairelerin baktığı tarafa geniş bir yağış alanı çizerim.","Cephenin üçlü noktadan doğu-güneydoğuya uzandığını görürüm."]},hata:{teknik:"Yağışı sıcak cephenin arkasında aramak: asıl yağış kuşağı cephe çizgisinin önünde, soğuk hava tarafındadır.",basit:"Sıcak cephede yağmur cephe gelmeden başlar; geçince çoğunlukla çiseltiye döner ya da kesilir.",ben:"Ben sıcak cephede yağış alanını hep yarım dairelerin önüne koyarım."},dene:{s:"Sıcak sektördeki istasyonda rüzgar 200°'den esiyor. Sıcak cephe geçmeden önce rüzgar daha çok hangi yöndendi?",c:{teknik:"Doğu–güneydoğu kesiminden: sıcak cephe geçişinde rüzgar saat yönünde döner (veering).",basit:"Daha doğudan eserdi; cephe geçince rüzgar güneye, güneybatıya döndü.",ben:"Ben veering'i saat ibresi gibi düşünürüm: doğudan güneye dönen rüzgar sıcak cephenin geçtiğini söyler."}},kaynak:"AMS Glossary of Meteorology: warm front; Wallace & Hobbs 2006 (Norveç siklon modeli)"},"harita.oklu":{baslik:"Oklüzyon (kapanmış cephe)",kisa:{teknik:"Soğuk cephenin sıcak cepheyi yakalayıp sıcak havayı yerden kaldırdığı cephe (occluded front).",basit:"İki cephenin birleştiği yer; sıcak hava artık yukarıda kalmıştır.",ben:"Mor çizgiyi görünce «bu siklon yaşlanıyor» derim."},neden:{teknik:["Soğuk cephe sıcak cepheden hızlı ilerler; aradaki sıcak sektör daralır, sıcak hava yukarı itilir.","Yerde sıcak hava beslemesi kesilir; siklon olgunluğa erişir, ardından genelde dolmaya başlar."],basit:["Arkadaki soğuk cephe öndekine yetişir.","Sıcak hava yerden koparılıp yukarı itilir; fırtına yavaş yavaş söner."],ben:["Ben oklüzyonu fermuar gibi düşünürüm: iki cephe merkezden başlayarak kapanır.","Fermuar uzadıkça siklonun yaşlandığını söylerim."]},bak:{teknik:["Mor çizgi; üzerinde aynı tarafa dizili, sırayla üçgen ve yarım daire.","A merkezinden üçlü noktaya (triple point) uzanır; orada soğuk ve sıcak cepheye ayrılır."],basit:["Mor renkli kısa çizgi.","A harfinden çıkıp iki cephenin birleştiği noktaya gider."],ben:["Ben mor çizginin bittiği noktaya «üçlü nokta» derim.","Oradan mavi ve kırmızı çizgilerin ayrıldığını görürüm."]},hata:{teknik:"Oklüzyonu durağan cepheyle karıştırmak: durağanda semboller zıt yönlere, oklüzyonda aynı yöne bakar; çizgi mordur.",basit:"Mor çizgi oklüzyon; kırmızı-mavi parçalı çizgi durağan cephe. Renk ve sembol yönü ayırır.",ben:"Ben renge bakarım: mor ise oklüzyon, kırmızı-mavi kesik kesik ise durağan cephe."},dene:{s:"Laboratuvarda oklüzyon hangi iki noktayı birleştiriyor? Bu, siklonun yaşı hakkında ne söyler?",c:{teknik:"A merkezini üçlü noktaya bağlar; oklüzyon başlamış, siklon olgunluk evresine girmiş.",basit:"Alçağın ortasından iki cephenin birleştiği yere gider; siklon yaşlanmaya başlamış.",ben:"Ben kısa bir mor çizgi görürüm ve «oklüzyon yeni başlamış, siklon olgun» derim."}},kaynak:"AMS Glossary of Meteorology: occluded front; Wallace & Hobbs 2006"},"harita.durgun":{baslik:"Durağan cephe",kisa:{teknik:"İki hava kütlesi arasında neredeyse hareketsiz sınır (stationary front); semboller zıt yönlerde.",basit:"İki hava kütlesinin karşı karşıya durduğu, kimsenin ilerlemediği çizgi.",ben:"Durağan cepheyi görünce «üzerinde yeni bir alçak doğabilir» diye izlerim."},neden:{teknik:["Rüzgar cepheye neredeyse paralel eser; cepheyi dik yönde iten bileşen çok küçüktür.","Sıcaklık farkı sürdüğü için üzerinde cephe dalgası (frontal wave) ve yeni siklon gelişebilir."],basit:["Rüzgar çizgi boyunca eser, çizgiyi itmez.","İki taraf arasındaki sıcaklık farkı sürdükçe yeni bir girdap doğabilir."],ben:["Ben durağan cephede rüzgarın çizgiye paralel aktığını hatırlarım.","Çizgide bir kıvrım görürsem yeni alçağın doğumunu beklerim."]},bak:{teknik:["Kırmızı ve mavi parçaları sırayla değişen çizgi; yarım daireler soğuk, üçgenler sıcak havaya bakar.","Laboratuvarda haritanın kuzeyinde doğu-batı uzanır; izobarlar cepheye neredeyse paraleldir."],basit:["Kırmızı-mavi kesik kesik bir çizgi.","Üzerinde hem yarım daire hem üçgen var, ama ters taraflarda."],ben:["Ben haritanın üst kenarındaki kırmızı-mavi çizgiyi bulurum.","Sembollerin iki ayrı tarafa baktığını kontrol ederim."]},hata:{teknik:"Durağan cephe = hava değişmez sanmak: sıcak cepheye benzer bulut-yağış günlerce sürebilir, üzerinde dalga gelişebilir.",basit:"«Durağan» sakin hava demek değil; cephe yerinde durduğu için bulut ve yağış aynı yerde uzun kalır.",ben:"Ben durağan cepheye «bekleyen» değil «uzun süren» hava diye bakarım."},dene:{s:"Durağan cephede rüzgar cepheye göre nasıl eser ve bu, cephenin neden ilerlemediğini nasıl açıklar?",c:{teknik:"Cepheye neredeyse paralel eser; cepheye dik bileşen çok küçük olduğundan sınır yerinden pek oynamaz.",basit:"Rüzgar çizgi boyunca kayar, çizgiyi itmez; bu yüzden cephe olduğu yerde kalır.",ben:"Ben rüzgarı çizgiye paralel çizerim; iten bir akış yoksa cephe de yürümez derim."}},kaynak:"AMS Glossary of Meteorology: stationary front, frontal wave; Wallace & Hobbs 2006"},"harita.trof":{baslik:"Yüzey trofu",kisa:{teknik:"İzobarların alçaktan dışa dil gibi uzandığı, siklonik eğriliğin en büyük olduğu eksen (trough).",basit:"Alçak basıncın uzattığı oluk; geçtiği yerde bulut ve sağanak olabilir.",ben:"Kesikli çizgiyi görünce «cephe yok ama hava bozabilir» derim."},neden:{teknik:["Trof ekseninde siklonik eğrilik ve vortisite en büyüktür; yerde sürtünmeyle konverjans ve yükselme olur.","Rüzgar eksende yön değiştirir; cephesiz troflar da konveksiyonu tetikleyip sağanak verebilir."],basit:["Oluğun içine iki yandan hava dolar.","Dolan hava yukarı kalkar, bulut ve sağanak yapar."],ben:["Ben trofu küçük bir alçak gibi düşünürüm: içine hava toplanır, yukarı çıkar.","Eksenin iki yanında rüzgar yönünün farklı olduğunu hatırlarım."]},bak:{teknik:["Kesikli çizgi; izobarların en keskin büküldüğü noktalardan geçer, üzerinde cephe sembolü yoktur.","Laboratuvarda A'nın güneybatısında, soğuk cephenin arkasında (batısında) uzanır."],basit:["Kesikli çizgi; üzerinde üçgen ya da yarım daire yok.","Çizgi boyunca izobarlar V gibi kıvrılır."],ben:["Ben izobar kıvrımlarının uçlarını birleştirip kesikli çizgimi geçiririm.","Sembol yoksa «trof» derim, cephe demem."]},hata:{teknik:"Her trofu soğuk cephe diye çizmek: cephe için sıcaklık ve nem farkı gerekir; yalnız izobar kıvrımı varsa trof çizilir.",basit:"Her kıvrık izobar cephe değildir; sıcaklık farkı yoksa sadece trof.",ben:"Ben cephe çizmeden önce iki yandaki istasyonların sıcaklık ve çiy noktasını karşılaştırırım."},dene:{s:"Laboratuvarda yüzey trofu ile soğuk cepheyi nasıl ayırırsın, hangisi daha batıda?",c:{teknik:"Trof sembolsüz kesikli çizgi, cephe mavi üçgenli; trof soğuk cephenin batısında (arkasında).",basit:"Üçgen varsa cephe, sadece kesik çizgi varsa trof; trof daha batıda.",ben:"Ben sembollere bakarım; kesikli çizginin mavi çizginin solunda kaldığını görürüm."}},kaynak:"AMS Glossary of Meteorology: trough; Met Office Fact Sheet 11 (Interpreting weather charts)"},"harita.sirt":{baslik:"Yüzey sırtı",kisa:{teknik:"Yüksek basıncın izobarlarla dil gibi uzandığı, antisiklonik eğriliğin en büyük olduğu eksen (ridge, wedge).",basit:"Yüksek basıncın uzattığı dil; altında hava genelde sakin.",ben:"Sırtı görünce «kısa bir iyi hava arası» derim."},neden:{teknik:["Antisiklonik eğrilik: yerde sürtünmeyle hafif diverjans ve çökme olur; bulut oluşumu bastırılır.","Sırt iki trof arasında yer alır; sırt geçince sıradaki trof yaklaşır."],basit:["Hava dilin altından dışarı yayılır, yukarıdan hava iner.","İnen hava bulutları dağıtır."],ben:["Ben sırtı küçük bir Y gibi düşünürüm: hava dağılır, gök açılır.","Sırttan sonra sıradaki trofun geleceğini unutmam."]},bak:{teknik:["Turuncu zikzak çizgi; Y'den kuzeye uzanır, izobarlar eksen boyunca dışa doğru kabarır.","Y'ye yakın kesimde izobarlar seyrek: rüzgar zayıf."],basit:["Turuncu zikzak çizgi.","Y harfinden yukarı doğru uzanır."],ben:["Ben izobarların dışa doğru kabardığı noktaları birleştirip sırt eksenini çizerim.","Zikzak çizerim ki kesikli trof çizgisiyle karışmasın."]},hata:{teknik:"Sırt ile trofu karıştırmak: trof alçak basıncın, sırt yüksek basıncın uzantısıdır; dilin içindeki değerlere bak.",basit:"Dilin içindeki sayılar çevresinden büyükse sırt, küçükse trof.",ben:"Ben dilin hangi merkezden çıktığına bakarım: Y'den çıkıyorsa sırt, A'dan çıkıyorsa trof."},dene:{s:"Laboratuvardaki sırt hangi merkezden uzanıyor ve altında nasıl hava beklenir?",c:{teknik:"Y'den kuzeye uzanır; antisiklonik akış ve çökme nedeniyle genelde az bulutlu, hafif rüzgarlı hava.",basit:"Y'den çıkar; altında çoğunlukla sakin ve açık hava.",ben:"Ben «Y'nin dili» derim ve brifingde «sırt altında hava iyi, rüzgar hafif» yazarım."}},kaynak:"AMS Glossary of Meteorology: ridge, wedge; Met Office Fact Sheet 11"},"harita.sektor":{baslik:"Sıcak sektör",kisa:{teknik:"Olgun siklonda sıcak ve soğuk cephe arasında kalan sıcak, nemli hava bölgesi (warm sector).",basit:"İki cephenin arasında kalan ılık ve nemli koridor.",ben:"Sıcak sektöre girince «ılık, kapalı, nemli» diye yazarım."},neden:{teknik:["Sektör, siklonun ekvator tarafından gelen sıcak hava kütlesidir; güneyli-güneybatılı akışla beslenir.","Oklüzyon ilerledikçe soğuk cephe sıcak cepheye yaklaşır ve sektör daralır."],basit:["Bu bölgeye güneyden ılık hava taşınır.","Arkadan gelen soğuk cephe bölgeyi giderek sıkıştırır."],ben:["Ben sektörü siklonun «yakıt deposu» gibi düşünürüm: ılık ve nemli hava buradan gelir.","Depo daraldıkça siklonun söneceğini düşünürüm."]},bak:{teknik:["Açık kırmızı gölgeli bölge: kuzeyde sıcak cephe, batıda soğuk cephe ile sınırlı.","Sektördeki istasyon: T 17 °C, Td 15 °C, rüzgar 200°'den, kapalı gök ve çisenti (ww 51)."],basit:["A'nın güneydoğusundaki açık kırmızı gölgeli alan.","Mavi ve kırmızı çizginin arasında kalır."],ben:["Ben istasyonları açıp sektördeki modelde T ile Td'nin ne kadar yakın olduğuna bakarım.","Güneyli rüzgarı da sektörün imzası sayarım."]},hata:{teknik:"Sıcak sektörü sıcak cephenin önüne yerleştirmek: sektör sıcak cephenin arkasında, soğuk cephenin önündedir.",basit:"Ilık bölge iki cephenin arasında kalır; sıcak cephenin önü değil, arkasıdır.",ben:"Ben sırayı ezberlerim: sıcak cephe geçer, sektöre girerim; soğuk cephe geçer, sektörden çıkarım."},dene:{s:"Sektördeki istasyon modelinde T − Td farkı kaç? Bu, hava hakkında ne söyler?",c:{teknik:"17 − 15 = 2 °C: hava doymaya yakın; alçak bulut, çisenti ve sis olasılığı yüksek.",basit:"2 °C fark var: hava çok nemli, gök kapalı ve çiseliyor.",ben:"Ben 2 °C'yi «neredeyse doymuş» diye okurum; modeldeki çisenti işareti de bunu doğrular."}},kaynak:"AMS Glossary of Meteorology: warm sector; Wallace & Hobbs 2006 (Norveç siklon modeli)"},"harita.siksik":{baslik:"Sık izobarlar",kisa:{teknik:"İzobar aralığı darsa basınç gradyanı büyük, geostrofik rüzgar kuvvetlidir.",basit:"Çizgiler sıklaştıkça rüzgar sertleşir.",ben:"Sık izobar görünce «kuvvetli, hamleli rüzgar» derim."},neden:{teknik:["Vg = (1/ρf)·Δp/Δn: Δp sabit 4 hPa olduğundan aralık Δn yarıya inerse Vg iki katına çıkar.","Sürtünmesiz seviyede rüzgar izobara paraleldir; yerde sürtünme onu yavaşlatıp alçağa doğru saptırır."],basit:["Dik yokuşta su hızlı akar; sık çizgi dik bir basınç yokuşudur.","Yerde sürtünme rüzgarı biraz yavaşlatır."],ben:["Ben izobar aralığını cetvel gibi kullanırım: aralık yarıya inerse rüzgar iki katına çıkar.","Yerde rüzgarın biraz daha zayıf ve alçağa doğru eğik estiğini hatırlarım."]},bak:{teknik:["İzobarların birbirine en çok yaklaştığı şerit; çoğunlukla alçak merkezin ve cephelerin çevresi.","Boş haritaya dokununca çıkan ok uzun: gradyan büyük, rüzgar kuvvetli; ok izobarlara paralel."],basit:["Çizgilerin üst üste bindiği yerler.","Dokununca uzun ok çıkıyorsa rüzgar kuvvetli."],ben:["Ben dokunduğum yerde okun uzunluğuna bakar, komşu bir yerle karşılaştırırım.","Okun izobarlara paralel olduğunu ve alçağın solunda kaldığını kontrol ederim."]},hata:{teknik:"Aralığı tersten okumak: sık izobar kuvvetli rüzgardır; ayrıca aynı aralık düşük enlemde daha güçlü rüzgar verir.",basit:"Çok çizgi = çok rüzgar; az çizgi = az rüzgar. Tersini düşünme.",ben:"Ben «çizgiler sık, rüzgar hızlı» cümlesini kendime tekrarlayıp ters okumayı önlerim."},dene:{s:"Aynı enlemde izobar aralığı yarıya inerse geostrofik rüzgar ne olur?",c:{teknik:"İki katına çıkar: Vg, izobarlar arası dik uzaklık Δn ile ters orantılıdır.",basit:"Rüzgar iki kat hızlanır.",ben:"Ben formülde Δn'nin paydada olduğunu hatırlarım: payda yarıya inerse sonuç iki katı olur."}},kaynak:"AMS Glossary of Meteorology: geostrophic wind; Holton & Hakim 2013"},"harita.seyrek":{baslik:"Seyrek izobarlar",kisa:{teknik:"Geniş izobar aralığı: zayıf basınç gradyanı, hafif geostrofik rüzgar ya da sakin.",basit:"Çizgiler uzaksa rüzgar hafif.",ben:"Seyrek izobar görünce «hava sakin, yerel rüzgarlar öne çıkar» derim."},neden:{teknik:["Δn büyük → Δp/Δn küçük → Vg küçük; gradyan kuvveti zayıfken yerel etkiler (meltem, dağ-vadi rüzgarı) baskın olur.","Yüksek merkez yakınında gradyan doğal olarak zayıftır."],basit:["Düz ovada su yavaş akar; seyrek çizgi düz bir basınç ovasıdır.","Büyük sistemler zayıfken deniz meltemi gibi küçük rüzgarlar öne çıkar."],ben:["Ben seyrek izobarda rüzgarı haritanın değil, kıyının ve dağın belirleyeceğini düşünürüm.","Kışsa sakin gecede sis ihtimalini not ederim."]},bak:{teknik:["Geniş aralıklı izobarlar; çoğunlukla yüksek merkezin çevresinde görülür.","Dokununca çıkan ok kısa: gradyan küçük."],basit:["Çizgilerin arasının açıldığı yerler.","Dokununca kısa ok çıkar."],ben:["Ben kısa oku görünce brifinge «rüzgar hafif» yazarım.","Merkezin tam ortasında okun neredeyse kaybolduğunu da fark ederim."]},hata:{teknik:"«Seyrek izobar = rüzgar yok» demek: geostrofik rüzgar zayıftır ama meltem, sağanak hamlesi gibi yerel rüzgarlar esebilir.",basit:"Hafif rüzgar «hiç rüzgar yok» demek değil; deniz meltemi esebilir.",ben:"Ben seyrek izobarda «sinoptik rüzgar zayıf» derim, «rüzgar yok» demem."},dene:{s:"Y merkezine yakın bir noktaya dokununca ok neden kısa çıkar?",c:{teknik:"İzobarlar seyrek, basınç gradyanı küçük; geostrofik rüzgar gradyanla orantılı olduğundan zayıftır.",basit:"Çizgiler uzak, basınç farkı az; rüzgar da hafif.",ben:"Ben izobar aralığına bakarım: aralık genişse ok kısa, rüzgar hafif derim."}},kaynak:"AMS Glossary of Meteorology: geostrophic wind, sea breeze; Met Office Fact Sheet 11"},"harita.istasyon":{baslik:"İstasyon modeli (haritada)",kisa:{teknik:"Bir istasyonun SYNOP gözleminin daire çevresinde sabit konumlara dizilmiş hâli (station model).",basit:"Haritadaki küçük daire bir istasyonun özet kartı.",ben:"Bir modelde önce rüzgarı ve basıncı, sonra T ile Td'yi okurum."},neden:{teknik:["Sabit düzen sayesinde çok sayıda gözlem tek bakışta karşılaştırılır; izobar ve cephe analizi bu verilere dayanır.","Cephenin yerini istasyonlar arası T, Td, rüzgar ve basınç eğilimi sıçramaları belirler."],basit:["Her bilgi hep aynı yerde durur, böylece hızlı okunur.","Haritadaki çizgiler bu küçük kartlardan çıkarılır."],ben:["Ben izobarı da cepheyi de istasyonlara bakarak çizerim; çizgi gözleme uymalı.","İki komşu istasyon arasında rüzgar ve sıcaklık sıçraması görürsem cepheyi oraya koyarım."]},bak:{teknik:["Sol üstte T, sol altta Td, sağ üstte PPP, sağda eğilim (a, ppp); rüzgar çubuğu rüzgarın geldiği yöne uzanır.","Tüyler: kısa 5, uzun 10, bayrak 50 kt; ortadaki dairenin doluluğu toplam bulut (N, okta)."],basit:["Dairenin ne kadar dolu olduğu bulut miktarını gösterir.","Daireden çıkan çubuk rüzgarın nereden geldiğini gösterir."],ben:["Ben PPP'yi okurken başına 10 ya da 9 eklerim: 098 → 1009,8 hPa.","Cephe arkasındaki istasyonda basınç eğiliminin yükseliş gösterdiğine bakarım."]},hata:{teknik:"Rüzgar çubuğunu esiş (gidiş) yönü sanmak: çubuk rüzgarın geldiği yöne uzanır; 310° çubuğu kuzeybatıyı gösterir.",basit:"Çubuk rüzgarın gittiği değil, geldiği yönü gösterir.",ben:"Ben çubuğu rüzgar gülü gibi okurum: çubuk nereyi gösteriyorsa rüzgar oradan gelir."},dene:{s:"Soğuk cephenin arkasındaki istasyonda rüzgar hangi yönden ve yaklaşık kaç knot?",c:{teknik:"310°'den (kuzeybatı): iki uzun ve bir kısa tüy, yaklaşık 25 kt; cephe arkası akış.",basit:"Kuzeybatıdan, yaklaşık 25 knot.",ben:"Ben iki uzun tüyü 20, kısa tüyü 5 sayarım: yaklaşık 25 kt kuzeybatılı derim."}},kaynak:"WMO-No. 306 (Manual on Codes), FM 12 SYNOP; Met Office Fact Sheet 11"},"sev.300":{baslik:"300 hPa (≈ 9 km) · jet katı",kisa:{teknik:"Jet akımı (jet stream) katı: izohips ile akış, izotak ile rüzgar hızı ve jet çekirdeği okunur.",basit:"Gökyüzünün otobanı; en hızlı rüzgarlar burada.",ben:"300'e jetin nerede olduğunu ve sistemleri nereye taşıyacağını görmek için bakarım."},neden:{teknik:["Termal rüzgar: alttaki yatay sıcaklık farkı büyüdükçe rüzgar yükseklikle artar; en hızlısı tropopozun hemen altında.","Jet çekirdeğinin giriş bölgesinin sağı ve çıkış bölgesinin solu üst seviye diverjansı ve yükselme verir."],basit:["Aşağıda soğuk ve sıcak hava ne kadar keskin ayrılırsa yukarıdaki rüzgar o kadar hızlanır.","Jetin bazı köşelerinde hava yukarı emilir ve aşağıdaki alçak güçlenir."],ben:["Ben jeti, altındaki sıcak-soğuk sınırının yukarıdaki izi diye düşünürüm.","Jet çıkışının sol tarafını yer alçağının derinleşebileceği yer olarak işaretlerim."]},bak:{teknik:["İzohips taban 900 gpdm, aralık 6 gpdm; izotaklar 60 kt'tan başlayıp 20 kt aralıkla çizilir.","İzohipslerin en sık, izotakların en yüksek olduğu şerit jet eksenidir; laboratuvarda turkuaz bant."],basit:["Çizgilerin en sıkıştığı uzun şerit jetin yeri.","Turkuaz kalın bant jeti gösterir."],ben:["Ben 60 kt'lık ilk izotakı bulup içe doğru sayarım: 80, 100…","En içteki izotakın ortasından jet eksenini geçiririm."]},hata:{teknik:"Jeti yalnız 300 hPa'da aramak: çekirdek mevsime ve enleme göre 250 ya da 200 hPa'da olabilir; en büyük izotakı izle.",basit:"Jet hep aynı yükseklikte değil; bazen biraz daha yukarıdadır.",ben:"Ben 300'de jet zayıf görünürse 250 ve 200 hPa kartına da bakarım."},dene:{s:"300 hPa ödev kartında izohips tabanı ve aralığı kaç? İzotaklar kaç knottan başlar?",c:{teknik:"Taban 900 gpdm, aralık 6 gpdm; izotaklar 60 kt'tan başlayıp 20 kt arayla çizilir.",basit:"900'den başla, 6'şar say; rüzgar çizgileri 60 kt'tan başlar.",ben:"Ben «900 ve 6, rüzgar 60 ve 20» diye ezberlerim."}},kaynak:"AMS Glossary of Meteorology: jet stream, thermal wind, jet streak; Holton & Hakim 2013"},"sev.500":{baslik:"500 hPa (≈ 5,5 km) · dalga katı",kisa:{teknik:"Orta troposfer: trof ve sırtlarıyla Rossby dalgalarını, yani yer sistemlerini taşıyan akışı gösterir.",basit:"Atmosferin orta katındaki büyük hava nehri; aşağıdaki sistemleri o taşır.",ben:"Öngörüye 500'den başlarım: dalga nerede, bize doğru mu geliyor?"},neden:{teknik:["Atmosfer kütlesinin yaklaşık yarısı 500 hPa'nın üstündedir; seviye diverjanssız seviyeye (level of nondivergence) yakındır.","Bu yüzden mutlak vortisite yaklaşık korunur; akış yer sistemlerine yön veren (steering) akış gibi davranır."],basit:["Bu kat atmosferin tam ortası gibidir.","Buradaki rüzgar, aşağıdaki alçak ve yükseklerin yolunu çizer."],ben:["Ben 500'ü «direksiyon katı» diye hatırlarım: yerdeki sistemler buradaki akışa uyar.","Dalgayı doğuya kaydırarak yarın için kaba bir tahmin kurarım."]},bak:{teknik:["İzohips taban 552 gpdm, aralık 6 gpdm (546, 552, 558…); trof ekseni kesikli, sırt ekseni zikzak.","Güneye sarkan düşük değerli konturlar trof, kuzeye kabaran yüksek değerliler sırttır."],basit:["Çizgilerin aşağı doğru çöktüğü yer oluk (trof).","Yukarı doğru kabardığı yer tümsek (sırt)."],ben:["Ben kalın 552 çizgisini bulup onun güneye en çok sarktığı yeri ararım.","Laboratuvarda zamanı ilerletip dalganın doğuya kaydığını izlerim."]},hata:{teknik:"500 hPa konturlarına izobar demek: bu kartta basınç her yerde 500 hPa'dır; çizilen jeopotansiyel yüksekliktir (izohips).",basit:"Bu karttaki çizgiler basıncı değil, 500 hPa yüzeyinin yüksekliğini gösterir.",ben:"Ben 552'yi «5520 m» diye okurum; böylece izobarla karıştırmam."},dene:{s:"500 hPa'da konturlar güneye sarkmış ve değerleri çevresinden düşük. Bu ne, doğusunda nasıl hava beklenir?",c:{teknik:"Trof; doğusunda PVA ve üst seviye diverjansıyla yükselme: bulut ve yağış beklenir.",basit:"Bu bir oluk (trof); doğusunda bulut ve yağmur olur.",ben:"Ben «trof» der, yağışı kesikli çizginin doğusuna yazarım."}},kaynak:"Holton & Hakim 2013 (barotropik vortisite denklemi); AMS Glossary of Meteorology: level of nondivergence"},"sev.700":{baslik:"700 hPa (≈ 3 km) · nem katı",kisa:{teknik:"Bağıl nem ve düşey hareket katı: yağış için hem nem hem yükselme var mı, sorusunu cevaplar.",basit:"Bulutların gövdesinin bulunduğu kat; yağmur için nem var mı, buradan bakılır.",ben:"Yağış yazmadan önce 700'de nemli bant ile trofun üst üste gelip gelmediğine bakarım."},neden:{teknik:["Yağış için nem ve yükselme birlikte gerekir; 700 hPa çoğu yağış bulutunun içinden geçer.","Düşey hareket basınç koordinatında ω = dp/dt ile verilir: ω < 0 yükselme, ω > 0 çökme."],basit:["Yağmur yağması için hem nem hem de yukarı kalkan hava lazım.","Burası kuruysa trof gelse bile yağış cılız kalır."],ben:["Ben «nem + yükselme = yağış» formülünü 700'de kontrol ederim.","ω eksiyse havanın yükseldiğini, artıysa çöktüğünü hatırlarım."]},bak:{teknik:["İzohips taban 300 gpdm, aralık 6 gpdm; yeşil gölge yüksek bağıl nemli kuşakları gösterir.","Nemli kuşak trof önüyle örtüşüyorsa yağış; kuru dil (dry slot) giriyorsa açılma."],basit:["Yeşil alan nemli hava demek.","Yeşil alan trofun doğusundaysa yağmur şansı yüksek."],ben:["Ben önce yeşil nem alanını, sonra trof eksenini bulurum.","İkisinin çakıştığı yere yağış yazarım."]},hata:{teknik:"Yer nemine bakıp yağış yazmak: yer nemli ama 700 hPa kuruysa derin bulut oluşmaz; yağış zayıf kalır ya da hiç olmaz.",basit:"Yerde hava nemli diye yağmur yağmaz; yukarısı da nemli olmalı.",ben:"Ben yer kartındaki nemle yetinmem, 700'ün nemini de kontrol ederim."},dene:{s:"700 hPa ödev kartında izohips tabanı ve aralığı kaç? Yağış için hangi iki şeyin örtüşmesine bakarsın?",c:{teknik:"Taban 300 gpdm, aralık 6 gpdm; yüksek bağıl nem ile yükselme (trof önü, ω < 0) örtüşmeli.",basit:"300'den başla, 6'şar say; nemli alan ile trof önü üst üste gelmeli.",ben:"Ben «300 ve 6» der, yeşil nem alanı trofun doğusundaysa yağış yazarım."}},kaynak:"AMS Glossary of Meteorology: omega, relative humidity, dry slot; Wallace & Hobbs 2006"},"sev.850":{baslik:"850 hPa (≈ 1,5 km) · sıcaklık katı",kisa:{teknik:"Sınır tabakasının çoğunlukla üstü: hava kütlesi sıcaklığı ve sıcaklık adveksiyonu okunur.",basit:"Gelen havanın sıcak mı soğuk mu olduğunu en iyi gösteren kat.",ben:"850'de konturların izotermleri kesip kesmediğine bakarım."},neden:{teknik:["Günlük ısınma-soğuma ve sürtünme etkisi bu katta azdır; izotermler hava kütlesinin asıl sıcaklığını gösterir.","Rüzgar konturlara paralel eser; izotermleri sıcaktan soğuğa keserse sıcak, soğuktan sıcağa keserse soğuk adveksiyon."],basit:["Burada gün ile gece arasındaki fark azdır; havanın asıl sıcaklığı görünür.","Rüzgar sıcak yerden geliyorsa ısıtır, soğuk yerden geliyorsa soğutur."],ben:["Ben rüzgarın hangi izotermden hangisine aktığına bakarım.","Sıcaktan soğuğa akıyorsa «sıcak adveksiyon» derim."]},bak:{teknik:["İzohips taban 150 gpdm, aralık 3 gpdm; izotermler 2,5 °C aralıklı (kesikli kırmızı).","Konturların izotermleri dike yakın açıyla kestiği sık bölgeler güçlü adveksiyondur; 0 °C izotermi kar için ilk ipucu."],basit:["Kırmızı kesikli çizgiler sıcaklık çizgileri.","İki tür çizginin birbirini kestiği yerde hava değişiyor."],ben:["Ben 0 °C izotermini bulup İstanbul'a göre nerede olduğuna bakarım.","Kesişen çizgilerin sıklığından adveksiyonun gücünü kestiririm."]},hata:{teknik:"850 sıcaklığını yer sıcaklığı sanmak: ≈ 1,5 km'deki değerdir; yer gündüz karışımla daha sıcak, gece inversiyonla daha soğuk olabilir.",basit:"850'deki sıcaklık termometrenin gösterdiği değil; yaklaşık 1,5 km yukarıdaki sıcaklık.",ben:"Ben 850 değerini yere taşırken günün saatini ve bulutluluğu da düşünürüm."},dene:{s:"850 hPa'da rüzgar 0 °C izoterminden −5 °C izotermine doğru esiyor. Hangi adveksiyon var?",c:{teknik:"Sıcak adveksiyon: akış sıcak bölgeden soğuk bölgeye; ısınma ve yükselme eğilimi.",basit:"Sıcak adveksiyon: daha ılık hava soğuk bölgeye taşınıyor.",ben:"Ben «rüzgar sıcaktan geliyor» der, ısınma yazarım."}},kaynak:"AMS Glossary of Meteorology: temperature advection; Wallace & Hobbs 2006"},"sev.yuzey":{baslik:"Yer (yüzey) kartı",kisa:{teknik:"Deniz seviyesine indirgenmiş basınç (MSLP) izobarları, cepheler, merkezler ve istasyon modelleri.",basit:"Hissettiğimiz havanın haritası: rüzgar, yağış, sis burada.",ben:"Brifinge hep yer kartıyla başlarım: merkezler, cepheler, rüzgar."},neden:{teknik:["İstasyon basıncı yüksekliğe göre değişir; deniz seviyesine indirgenince yatay basınç farkları karşılaştırılabilir.","Yerde sürtünme rüzgarı izobarlardan alçağa doğru saptırır; yer kartında rüzgar izobara tam paralel değildir."],basit:["Dağdaki ve kıyıdaki istasyonları aynı seviyeye getirince basınçlar kıyaslanabilir.","Yerde rüzgar sürtünmeyle yavaşlar ve biraz alçağa doğru kayar."],ben:["Ben MSLP'yi «herkesi deniz seviyesine indirmek» diye hatırlarım.","Yerde okların izobarı hafifçe alçağa doğru kesmesini beklerim."]},bak:{teknik:["İzobarlar 1000 hPa taban, 4 hPa aralıkla (1004, 1008, 1012…); A ve Y merkezleri, renkli cephe sembolleri.","İstasyon modelleriyle uyum: rüzgar, basınç eğilimi ve T-Td sıçramaları izobar ve cepheyi doğrulamalı."],basit:["Kapalı halkalar basınç merkezleri, renkli çizgiler cepheler.","Küçük daireler istasyonlar."],ben:["Ben önce A ve Y'yi, sonra cepheleri, en son izobar sıklığını okurum.","Laboratuvardaki her öğeye dokunup kendi anlatımımla karşılaştırırım."]},hata:{teknik:"İzobar değerini istasyonun ölçtüğü basınç sanmak: kartta MSLP vardır; yüksek bir istasyonun gerçek basıncı çok daha düşüktür.",basit:"Haritadaki basınç, dağdaki istasyonun ölçtüğü değil; deniz seviyesine çevrilmiş değer.",ben:"Ben izobar değerini okurken «bu, deniz seviyesine indirgenmiş basınç» diye kendime hatırlatırım."},dene:{s:"Yer kartında izobar tabanı ve aralığı kaç? 1000 hPa'dan sonraki iki izobar hangileri?",c:{teknik:"Taban 1000 hPa, aralık 4 hPa: 1004 ve 1008 hPa (aşağı doğru 996, 992).",basit:"1000'den 4'er say: 1004, 1008.",ben:"Ben «bin ve dört» diye ezberler, 1000'den dörder sayarım."}},kaynak:"AMS Glossary of Meteorology: sea level pressure; Met Office Fact Sheet 11"},"trof.eksen":{baslik:"Trof ekseni (500 hPa)",kisa:{teknik:"Konturların siklonik eğriliğinin en büyük olduğu noktalardan geçen çizgi (trough axis); kesikli çizilir.",basit:"Oluğun en dip yerinden geçen çizgi.",ben:"Kesikli çizgiyi görünce yağışı hemen onun doğusunda ararım."},neden:{teknik:["Eksende eğrilik ve göreli vortisite en büyüktür; rüzgar eksenin iki yanında NW'den SW'ye döner.","Dalga batı akımıyla doğuya ilerler; eksen geçerken bölgede hava kötüden iyiye döner."],basit:["Oluğun dibinde hava en çok kıvrılır.","Oluk geçerken rüzgar yön değiştirir, hava da değişir."],ben:["Ben ekseni rüzgarın yön değiştirdiği yer olarak hatırlarım.","Eksen geçince «en kötüsü geride kaldı» derim."]},bak:{teknik:["Kesikli dikey çizgi; konturların güneye en çok sarktığı yerden geçer.","Eksenin doğusu mavi (yükselme), batısı turuncu (çökme) gölgelidir."],basit:["Kesikli düz çizgi.","Solunda turuncu, sağında mavi gölge var."],ben:["Ben konturların sivri uçlarını birleştirip ekseni doğrularım.","Genlik kaydırıcısını artırınca trofun derinleştiğini görürüm."]},hata:{teknik:"Ekseni hep kuzey-güney düz çizmek: gerçek kartta eksen eğik olabilir (pozitif/negatif tilt); kıvrım noktalarını tek tek birleştir.",basit:"Eksen her zaman dimdik değildir; gerçek haritada yan yatabilir.",ben:"Ben eksenin her enlemdeki kıvrım noktasını ayrı işaretler, sonra birleştiririm."},dene:{s:"Zamanı +24 saate getir: trof ekseni hangi yöne ilerledi, İstanbul'un trofa göre yeri nasıl değişti?",c:{teknik:"Eksen doğuya kayar; İstanbul trofa göre batıya, yani arkaya doğru yer değiştirir: önce önü, sonra arkası.",basit:"Oluk doğuya ilerler; İstanbul önce önünde, sonra arkasında kalır.",ben:"Ben kaydırıcıyı oynatıp şeritteki ikonların bulut-yağmurdan güneşe döndüğünü izlerim."}},kaynak:"AMS Glossary of Meteorology: trough, trough line; Holton & Hakim 2013"},"trof.sirt":{baslik:"Sırt ekseni (500 hPa)",kisa:{teknik:"Konturların antisiklonik eğriliğinin en büyük olduğu, yüksek değerli dilin ekseni (ridge axis).",basit:"Hava nehrinin kuzeye kabaran tümseğinin tepe çizgisi.",ben:"Sırtı görünce «sıradaki trof bunun arkasından gelir» derim."},neden:{teknik:["Sırt, sıcak havanın kuzeye taşındığı dildir: sıcak, kalın hava sütunu yüksek kontur değeri verir.","Sırtın önünde (doğusunda) üst seviyede konverjans ve çökme olur: genelde açık hava."],basit:["Sıcak hava kabarır, çizgiler kuzeye itilir.","Altında hava sakin, ılık ve açık olur."],ben:["Ben sırtı sıcak hava dilinin işareti sayarım.","Sırt geçerken iyi hava, arkasından trof beklerim."]},bak:{teknik:["Turuncu zikzak çizgi; konturların kuzeye en çok kabardığı yerden geçer.","Sırtın batısında SW, doğusunda NW akış; eksen üzerinde akış batılıdır."],basit:["Turuncu zikzak çizgi.","Çizgilerin yukarı doğru tümsek yaptığı yer."],ben:["Ben sırtı zikzakla çizerim ki kesikli trof çizgisiyle karışmasın.","İstanbul sırtın altına gelince şeritte güneş ikonu çıktığını görürüm."]},hata:{teknik:"Sırtı sadece «iyi hava» saymak: sırtın batısındaki SW akış sıradaki trofun önüdür; orada bulut artmaya başlar.",basit:"Sırt geçince iyi hava biter; arkasından gelen trof bulut getirir.",ben:"Ben sırt eksenini geçince hemen sıradaki trofa bakarım."},dene:{s:"Sırtın doğusunda ve batısında 500 hPa rüzgarı hangi yönlerden eser?",c:{teknik:"Doğusunda NW, batısında SW akış; eksen üzerinde batılı (W).",basit:"Doğusunda kuzeybatıdan, batısında güneybatıdan.",ben:"Ben «sırtın önü NW, arkası SW» diye ezberlerim."}},kaynak:"AMS Glossary of Meteorology: ridge; Wallace & Hobbs 2006"},"trof.onu":{baslik:"Trofun önü (doğusu)",kisa:{teknik:"Trof ile sonraki sırt arası: PVA, üst seviye diverjansı ve yükselme; bulut ve yağış bölgesi.",basit:"Oluğun doğu tarafı; havanın yükselip yağış yaptığı yer.",ben:"Yağışı hep kesikli çizginin doğusunda ararım."},neden:{teknik:["Pozitif vortisite adveksiyonu (PVA) üst seviye diverjansı verir; kütle korunumu alttan yükselme ister.","Trofta rüzgar subgeostrofik, sırtta süpergeostrofiktir: aradaki bölgede hız diverjansı oluşur."],basit:["Yukarıda hava dağılıp gidiyor; boşluğu doldurmak için alttan hava yükselir.","Yükselen hava soğur, bulut ve yağmur yapar."],ben:["Ben «yukarıda dağılma, aşağıda yükselme» diye hatırlarım.","Yer alçağını ve cepheleri de bu bölgede beklerim."]},bak:{teknik:["Kesikli eksenin doğusundaki mavi gölge: hava yükseliyor; akış SW.","Yer katmanını açınca «yerde alçak» bu bölgede, trofun doğusunda görünür."],basit:["Kesikli çizginin sağındaki mavi alan.","İstanbul buradaysa ikon bulut ya da yağmur olur."],ben:["Ben mavi gölgenin İstanbul'un üstüne gelip gelmediğine bakarım.","Gelmişse brifingde «trof önündeyiz, yağış bekliyorum» derim."]},hata:{teknik:"«Ön» ile batıyı kastetmek: dalga doğuya ilerlediği için trofun önü doğusu, arkası batısıdır.",basit:"Önü = doğusu. Oluk doğuya gittiği için önce önü gelir.",ben:"Ben haritayı soldan sağa akan bir nehir gibi düşünürüm; ön, akıntının gittiği taraftır."},dene:{s:"İstanbul trofun önündeyse 500 hPa rüzgarı hangi yönden eser ve hangi hava beklenir?",c:{teknik:"SW (≈ 240°) akış; PVA ve diverjansla yükselme: bulut ve yağış.",basit:"Güneybatıdan eser; bulut ve yağmur gelir.",ben:"Ben 240° görünce «trof önündeyim, şemsiye gerek» derim."}},kaynak:"Holton & Hakim 2013 (QG omega denklemi); Wallace & Hobbs 2006"},"trof.arkasi":{baslik:"Trofun arkası (batısı)",kisa:{teknik:"Önceki sırt ile trof arası: NVA, üst seviye konverjansı ve çökme; açılma ve serinleme.",basit:"Oluğun batı tarafı; hava çöker, gök açılır ama serinler.",ben:"Trof geçince «açılıyor ama serin» derim."},neden:{teknik:["Negatif vortisite adveksiyonu (NVA) üst seviye konverjansı verir; hava çöker, adyabatik ısınıp kurur.","Alt seviyede NW akış soğuk adveksiyon getirir; sıcaklık düşer."],basit:["Yukarıda hava sıkışır ve aşağı bastırır.","Aşağı inen hava bulutları dağıtır; kuzeyden serin hava gelir."],ben:["Ben arka tarafı «yukarıdan bastırma» diye hatırlarım.","Kuzeybatılı rüzgarla gelen serinliği de not ederim."]},bak:{teknik:["Kesikli eksenin batısındaki turuncu gölge: hava çöküyor; akış NW.","İstanbul bu bölgedeyse şeritteki ikon güneştir."],basit:["Kesikli çizginin solundaki turuncu alan.","Burada güneş ikonu görünür."],ben:["Ben turuncu gölgeyi «açık hava» diye okurum.","Zamanı ilerletip trof geçince ikonun güneşe döndüğünü izlerim."]},hata:{teknik:"Trof arkasında hiç yağış olmaz sanmak: çok soğuk hava girdiyse (kararsızlık) ya da dağ yamacında sağanak görülebilir.",basit:"Arka taraf çoğunlukla açık ama çok soğuk havada sağanak yine gelebilir.",ben:"Ben çok soğuk hava girdiyse «arada sağanak olası» notunu eklerim."},dene:{s:"Trof İstanbul'un doğusuna geçti. 500 hPa rüzgarı hangi yöne döner, hava nasıl değişir?",c:{teknik:"NW'ye (≈ 300°) döner (veering); çökme ve soğuk adveksiyonla açılma ve serinleme.",basit:"Rüzgar kuzeybatıya döner; gök açılır, hava serinler.",ben:"Ben 240'tan 300'e dönüşü «trof geçti» diye okurum."}},kaynak:"Holton & Hakim 2013 (QG omega denklemi); AMS Glossary of Meteorology: subsidence"},"trof.ruzgar":{baslik:"Trofta rüzgar dönmesi: 300° → 270° → 240°",kisa:{teknik:"Trofun batısında NW (≈ 300°), ekseninde W (270°), doğusunda SW (≈ 240°); eksen rüzgarın döndüğü yerdir.",basit:"Oluğu geçerken rüzgar kuzeybatıdan batıya, sonra güneybatıya döner.",ben:"Üç oku soldan sağa okurum: 300, 270, 240; ortadaki eksendir."},neden:{teknik:["500 hPa'da akış konturlara paraleldir; konturlar trofta güneye sarktığı için akış eksende batılıya döner.","Bir istasyonda zamanla 240 → 270 → 300 (veering) trof geçişi, 300 → 270 → 240 (backing) yeni trofun yaklaşmasıdır."],basit:["Rüzgar çizgileri takip eder; çizgi kıvrılınca rüzgar da kıvrılır.","Rüzgar saat yönünde dönerse trof geçmiştir, tersine dönerse yenisi geliyordur."],ben:["Ben sayılar büyüyorsa «veering, trof geçti», küçülüyorsa «backing, trof geliyor» derim.","Rüzgar yönünü hep geldiği yöne göre okurum."]},bak:{teknik:["Eksenin batısında 300°, üstünde 270°, doğusunda 240° yazan üç turkuaz rüzgar oku.","Akış katmanını açınca okların konturlara paralel kıvrıldığı görülür."],basit:["Kesikli çizginin çevresinde üç küçük ok ve derece yazıları.","Oklar soldan sağa yön değiştirir."],ben:["Ben üç oku yan yana koyup aradaki 30°'lik dönüşleri sayarım.","Sonra aynı dönüşü zaman kaydırıcısıyla İstanbul için düşünürüm."]},hata:{teknik:"Dereceyi gidiş yönü sanmak: 240° rüzgar güneybatıdan gelir, kuzeydoğuya gider; trofun önündeki akış SW'dir.",basit:"240° rüzgar güneybatıdan gelir; gittiği yer değil, geldiği yer söylenir.",ben:"Ben derece okurken «nereden geliyor?» diye sorarım; 240 = güneybatıdan."},dene:{s:"Bir istasyonda 500 hPa rüzgarı sırayla 240°, 270°, 300° oluyor. Trof yaklaşıyor mu, geçti mi?",c:{teknik:"Saat yönünde dönüş (veering): trof istasyonun üstünden geçti; çökme ve açılma beklenir.",basit:"Trof geçti; hava açılmaya başlar.",ben:"Ben sayılar büyüdüğü için «veering, trof geride kaldı» derim."}},kaynak:"AMS Glossary of Meteorology: veering, backing; Wallace & Hobbs 2006"},"trof.kesik":{baslik:"Kesik alçak (cut-off low)",kisa:{teknik:"Ana batı akımından kopup kapalı konturlarla güneyde kalan üst seviye alçak; yavaş hareketli, inatçı.",basit:"Hava nehrinden kopup kenarda dönen girdap; hava günlerce aynı kalabilir.",ben:"Kapalı kontur görünce «yarın geçer» demem."},neden:{teknik:["Derin trofun güney ucu ana akımdan ayrılır; onu sürükleyecek güçlü batı akımı olmadığından yavaş ya da durağandır.","Soğuk çekirdekli olduğundan altında kararsızlık ve yükselme sürer: günlerce sağanak ve yağış."],basit:["Akıntıdan kopan girdabı kimse itmez, olduğu yerde döner.","İçindeki soğuk hava, aşağıdaki ılık havayla kararsız bir ortam kurar."],ben:["Ben kesik alçağı «sahipsiz girdap» diye hatırlarım: jet onu bırakmıştır.","Altındaki bölgeye peş peşe günler için yağış yazarım."]},bak:{teknik:["Kırmızı A ile işaretli, en az bir kapalı konturla çevrili merkez; laboratuvarda dalganın güney kesiminde.","Zamanı ilerletince normal trofa göre çok yavaş kayar."],basit:["Konturların kapandığı halka ve ortasında kırmızı A.","Zaman ilerlerken neredeyse yerinde durur."],ben:["Ben kapalı halkayı bulur, en içteki değeri okurum.","Kaydırıcıyı oynatıp ne kadar az kımıldadığını izlerim."]},hata:{teknik:"Kapanmamış derin trofa kesik alçak demek: en az bir kapalı kontur ve ana akımdan kopma gerekir.",basit:"Halka kapanmamışsa kesik alçak değil, sadece derin bir oluk.",ben:"Ben konturu parmağımla dolaşırım: başladığım yere dönüyorsam kesik alçak derim."},dene:{s:"Kesik alçak deseninde zamanı +72 saate getir. Normal dalgayla karşılaştırınca ne görürsün?",c:{teknik:"Merkez çok az ilerler; altındaki bölgede bulut-yağış rejimi uzun sürer, öngörü belirsizliği artar.",basit:"Neredeyse yerinde durur; kötü hava uzun sürer.",ben:"Ben şeritte benzer ikonların günlerce tekrarlandığını görür, «inatçı» yazarım."}},kaynak:"AMS Glossary of Meteorology: cutoff low; Holton & Hakim 2013"},"trof.omega":{baslik:"Omega blokajı (Ω)",kisa:{teknik:"Trof–sırt–trof dizisinin Ω çizdiği blok (omega block); ortadaki sırt batı akımını keser, desen durur.",basit:"Yola park etmiş bir kamyon: arkadaki sistemler ilerleyemez.",ben:"Ω görünce öngörüme «kalıcı» yazarım."},neden:{teknik:["Yüksek genlikli sırt ve iki yanındaki derin troflar neredeyse yerinde durur; batı akımı bloğun çevresinden dolanır.","Sırt altında çökme: uzun süre sıcak-kuru; yan troflarda uzun süre serin ve yağışlı hava."],basit:["Ortadaki büyük tümsek, önündeki ve arkasındaki olukları da yerinde tutar.","Tümseğin altı güneşli, yanları yağışlı kalır."],ben:["Ben omegayı «sıkışmış dalga» diye hatırlarım.","Sırt altında uzun süren sıcak-kuru, yanlarda uzun süren yağışlı hava düşünürüm."]},bak:{teknik:["Ortada mavi Y ve Ω işareti, iki yanda kesikli trof eksenleri.","Zaman kaydırıcısında desen yerinde durur (blok)."],basit:["Konturlar Ω harfi çizer.","Saat ilerlese de şekil kımıldamaz."],ben:["Ben konturların Ω harfini çizdiğini görünce ortadaki Y'yi işaretlerim.","Kaydırıcıyı ilerletip hiçbir şeyin kaymadığını doğrularım."]},hata:{teknik:"Bloğu normal dalga hızıyla doğuya kaydırmak: blok günlerce durur; dalgayı kaydıran öngörü burada yanılır.",basit:"Bloğu normal bir dalga gibi doğuya kaydırma; yerinde kalır.",ben:"Ben Ω görünce «yarın değişir» diyen öngörüleri sorgularım."},dene:{s:"Omega deseninde İstanbul sırtın altındaysa +72 saatte nasıl hava beklersin?",c:{teknik:"Blok yerinde durduğu için çökme sürer: sıcak, kuru, açık hava; yer yer sabah sisi.",basit:"Güneşli ve kuru hava günlerce sürer.",ben:"Ben sırt altındaysam aynı güneşli havanın sürmesini beklerim."}},kaynak:"AMS Glossary of Meteorology: blocking, omega block; Wallace & Hobbs 2006"},"trof.zonal":{baslik:"Zonal akış",kisa:{teknik:"Konturların enlemlere yaklaşık paralel olduğu sığ dalgalı batı akımı (zonal flow); sistemler hızlı geçer.",basit:"Hava nehri düz akıyor; hava çabuk değişir ama uç olmaz.",ben:"Konturlar yataysa «hızlı değişen, ılımlı hava» derim."},neden:{teknik:["Meridyonel bileşen küçük: kuzey-güney sıcaklık taşınımı zayıftır, uç sıcak ya da soğuk hava pek gelmez.","Güçlü batı akımı küçük sistemleri doğuya hızla taşır; karşıtı meridyonel akıştır (derin trof-sırt, blok)."],basit:["Hava kuzeyden güneye pek taşınmaz.","Düz otoyoldaki araçlar gibi sistemler hızla geçer."],ben:["Ben zonal akışı «düz otoyol» diye hatırlarım.","Konturlar kıvrılmaya başlarsa uç hava olasılığını artırırım."]},bak:{teknik:["Neredeyse düz, doğu-batı uzanan, birbirine paralel konturlar; trof/sırt ekseni çizilmez.","Yükselme-çökme gölgesi yoktur: belirgin bir bölge ayrışmaz."],basit:["Çizgiler düz ve yan yana.","Kesikli ya da zikzak çizgi yok."],ben:["Ben zonal desende eksen arayıp bulamayınca «sığ dalga» derim.","Şeritte İstanbul için tek tip bulut ikonu görürüm."]},hata:{teknik:"Zonal akışı «hava sakin» sanmak: batı rüzgarı güçlü olabilir; yalnızca sistemler sığ, hızlı ve kısa ömürlüdür.",basit:"Düz akış hafif rüzgar demek değil; rüzgar güçlü, sistemler kısa ömürlü olabilir.",ben:"Ben zonal akışta «rüzgar var ama büyük bir sistem oturmuyor» derim."},dene:{s:"Zonal ve meridyonel akışta yer sistemlerinin hızı ve kalıcılığı nasıl farklıdır?",c:{teknik:"Zonalda sistemler hızlı ve kısa ömürlü; meridyonelde derin trof-sırt, kesik alçak ve blokla yavaş ve kalıcı.",basit:"Düz akışta hava çabuk değişir, kıvrımlı akışta uzun süre aynı kalır.",ben:"Ben «düz = hızlı, kıvrımlı = kalıcı» diye hatırlarım."}},kaynak:"AMS Glossary of Meteorology: zonal flow, meridional flow, zonal index"},"trof.egim":{baslik:"Yerdeki alçak ve eksenin batıya eğimi",kisa:{teknik:"Gelişen baroklinik sistemde yer alçağı 500 hPa trofunun doğusundadır; eksen yükseklikle batıya eğilir.",basit:"Yerdeki alçak, yukarıdaki oluğun biraz doğusunda durur.",ben:"Yer alçağını 500 trofunun doğusunda görünce «gelişiyor» derim."},neden:{teknik:["Trof önündeki üst diverjans yer alçağının üstüne denk gelir: sütundan kütle çekilir, merkez derinleşir.","Batıya eğim sıcak adveksiyonu önde, soğuk adveksiyonu arkada tutar; potansiyel enerji kinetik enerjiye döner."],basit:["Yukarıdaki emme bölgesi aşağıdaki alçağın tam üstüne gelir ve onu derinleştirir.","Katlar üst üste gelince sistem güçlenmeyi bırakır."],ben:["Ben eğimi «yukarısı geride» diye hatırlarım.","Merkezler üst üste gelince «olgun, dolacak» derim."]},bak:{teknik:["Yer katmanını aç: «yerde alçak» A'sı kesikli eksenin doğusunda, trof ile sırt arasında görünür.","Bu A, mavi gölgeli (yükselme) bölgenin içindedir."],basit:["Alttaki çember içindeki A harfi.","Kesikli çizgiye göre sağda durur."],ben:["Ben kesikli çizgiden doğuya doğru giderek A'yı bulurum.","Aradaki mesafeyi sistemin hâlâ gelişmekte olduğunun ipucu sayarım."]},hata:{teknik:"Yer alçağını 500 hPa trofunun tam altına koymak: gelişen sistemde alçak doğudadır; tam altındaysa sistem olgun ya da dolmaktadır.",basit:"Alçak, oluğun tam altında değil, biraz doğusundadır.",ben:"Ben yer kartını 500'ün üstüne koyar, alçağın doğuya kaymış olmasını beklerim."},dene:{s:"Yer alçağı 500 hPa trofunun doğusunda. Sistem gelişiyor mu, sönüyor mu? Neden?",c:{teknik:"Gelişiyor: alçağın üstünde trof önü diverjansı var; eksen batıya eğik, baroklinik büyüme sürüyor.",basit:"Gelişiyor; yukarıdaki oluk alçağı besliyor.",ben:"Ben «üst seviye geride, sistem büyüyor» der, merkezler üst üste gelene dek derinleşme beklerim."}},kaynak:"Holton & Hakim 2013 (baroklinik kararsızlık); Wallace & Hobbs 2006"}},...{"adv.sicak":{baslik:"Sıcak adveksiyon (warm advection)",kisa:{teknik:"Akış izotermleri sıcaktan soğuğa keser: −V·∇T > 0, noktada sıcaklık artar.",basit:"Rüzgar sıcak taraftan esiyor; bulunduğun yer ısınır.",ben:"Ben okun kuyruğu sıcak, ucu soğuk izotermdeyse «sıcak adveksiyon, kırmızı X» derim."},neden:{teknik:["∇T soğuktan sıcağa yönelir; rüzgar ona ters bileşenle (sıcaktan soğuğa) eserse −V·∇T pozitif olur.","Şiddet |V|·|∇T|·cos α ile büyür: rüzgar izotermlere dik ve izotermler sıkışıksa en güçlü.","Sıcak adveksiyon katman kalınlığını artırır, yükselmeyi destekler, üstteki sırtı kuvvetlendirir."],basit:["Güneyde sıcak hava var; güneyli rüzgar onu kuzeye taşır.","Sıcak hava hafiftir, yavaşça yükselir; bulut ve yağış gelebilir."],ben:["Ben formüldeki eksiyi şöyle hatırlarım: sıcak taraftan gelen rüzgar = artı = ısınma.","Bu labda kuzey soğuk, güney sıcak; rüzgarın güney bileşeni varsa sıcak adveksiyon görürüm."]},bak:{teknik:["Rüzgar oku izoterm değerlerinin azaldığı yöne gidiyorsa (ör. +5 → 0 °C) sıcak adveksiyon.","Haritada akış izohipse paraleldir; izohipsin kesikli izotermi kestiği noktaya kırmızı X.","Kesişme açısı 90°'ye yakın ve izotermler sıkışıksa adveksiyon en güçlüdür."],basit:["Oku izle: sıcak çizgiden soğuk çizgiye doğru gidiyorsa ısınma var.","Ok çizgileri ne kadar dik keserse etki o kadar büyük."],ben:["Ben önce okun kuyruğundaki izoterm değerini, sonra ucundakini okurum.","Kuyruktaki değer büyük, uçtaki küçükse kırmızı X koyarım."]},hata:{teknik:"Rüzgar yönünü gittiği yön sanmak; doğrusu: 180° rüzgar güneyden eser, sıcağı kuzeye taşır.",basit:"Rüzgarın adı geldiği yerdir: «güneyli» rüzgar güneyden gelir, sıcağı getirir.",ben:"Ben 180°'yi «güneye esiyor» diye okumam; «güneyden geliyor, sıcak getiriyor» derim."},dene:{s:"Labda rüzgar 180° (güneyden), 30 kt; izoterm aralığı 2,5 °C / 200 km. Adveksiyonun türü ve yaklaşık değeri nedir?",c:{teknik:"Sıcak adveksiyon: 15,4 m/s × 2,5 °C / 200 km × 3600 s ≈ +0,7 °C/saat.",basit:"Sıcak adveksiyon; saatte yaklaşık 0,7 °C ısınma.",ben:"Ben 30 kt hızı yaklaşık 15 m/s'ye çevirir, gradyanla çarpar, saate taşırım: ≈ +0,7 °C/saat."}},kaynak:"AMS Glossary: advection; ders dosyası ADVECTION"},"adv.soguk":{baslik:"Soğuk adveksiyon (cold advection)",kisa:{teknik:"Akış izotermleri soğuktan sıcağa keser: −V·∇T < 0, noktada sıcaklık düşer.",basit:"Rüzgar soğuk taraftan esiyor; bulunduğun yer soğur.",ben:"Ben okun kuyruğu soğuk, ucu sıcak izotermdeyse «soğuk adveksiyon, mavi X» derim."},neden:{teknik:["Rüzgar ∇T ile aynı yönde bileşen taşır (soğuktan sıcağa akış): V·∇T > 0, yani −V·∇T < 0.","Soğuk adveksiyon katman kalınlığını azaltır, çökmeyi destekler, üst trofu derinleştirir."],basit:["Kuzeyde soğuk hava var; kuzeyli rüzgar onu güneye taşır.","Soğuk hava ağırdır, çöker; bulut açılabilir ama sıcaklık düşer."],ben:["Ben «soğuk taraftan gelen rüzgar = eksi = soğuma» diye ezberlerim.","Bu labda rüzgarın kuzey bileşeni varsa soğuk adveksiyon görürüm."]},bak:{teknik:["Rüzgar oku izoterm değerlerinin arttığı yöne gidiyorsa (ör. −5 → 0 °C) soğuk adveksiyon.","Haritada alçağın batısında kuzeyli akış soğuk havayı güneye taşır: kesişimlere mavi X.","Tipik yerler: trof arkası ve soğuk cephe gerisi."],basit:["Oku izle: soğuk çizgiden sıcak çizgiye doğru gidiyorsa soğuma var.","Alçak merkezin batı yanına bak; orada rüzgar kuzeyden gelir."],ben:["Ben kuyruktaki değer uçtakinden küçükse mavi X koyarım.","Sonra «trof burada derinleşir mi?» diye 500 hPa'ya bakarım."]},hata:{teknik:"İşareti ters almak: soğuktan sıcağa akışta V·∇T > 0 ama adveksiyon terimi −V·∇T < 0, yani soğuma.",basit:"Rüzgar soğuk taraftan geliyorsa güneş açsa bile hava soğur.",ben:"Ben eksiyi unutmamak için önce sözle söylerim: soğuktan geliyor, soğutur."},dene:{s:"Labda rüzgar 0° (kuzeyden) 30 kt eserken hızı 60 kt yaparsan adveksiyon nasıl değişir?",c:{teknik:"Soğuk adveksiyon kalır, büyüklüğü iki katına çıkar (−V·∇T hızla doğrusal): ≈ −0,7'den ≈ −1,4 °C/saate.",basit:"Yine soğuma olur, ama iki kat hızlı.",ben:"Ben hızı ikiye katlayınca sonucu da ikiye katlarım; işaret değişmez."}},kaynak:"AMS Glossary: advection; ders dosyası ADVECTION"},"adv.notr":{baslik:"Adveksiyon yok (nötr)",kisa:{teknik:"Rüzgar izotermlere paralel: V ⟂ ∇T, −V·∇T = 0; sıcaklık taşınmaz.",basit:"Rüzgar sıcaklık şeridi boyunca esiyor; ne ısıtır ne soğutur.",ben:"Ben izohips izotermle paralel akıyorsa o noktaya hiç X koymam."},neden:{teknik:["V·∇T = |V|·|∇T|·cos α; rüzgar izoterme paralelse α = 90°, terim sıfır olur.","Kontur ∥ izoterm = barotropik yapı; sistem yavaştır, yerinde kalabilir."],basit:["Rüzgar aynı sıcaklıktaki havayı aynı sıcaklıktaki yere taşıyor.","Taşıma var, ama taşınan bir sıcaklık farkı yok."],ben:["Ben «rüzgar kaç izoterm kesiyor?» diye sorarım; cevap sıfırsa adveksiyon yok.","Bu labda doğudan (90°) ya da batıdan (270°) esen rüzgar bunu verir."]},bak:{teknik:["Ok kesikli izotermlerle aynı doğrultuda; kuyruktaki ve uçtaki izoterm değeri aynı.","Haritada izohips ile izotermin yan yana aktığı kuşaklar: kesişme yok.","Okuma satırında −V·∇T ≈ 0 °C/saat görünür."],basit:["Ok çizgilere paralel mi? Paralelse sıcaklık değişmez.","Hiç çizgi kesmeyen ok = nötr."],ben:["Ben oku izotermin üstüne yatırırım: çizgi boyunca gidiyorsa nötr derim.","Rüzgar hızlı olsa da kesişme yoksa «adveksiyon yok» yazarım."]},hata:{teknik:"Kuvvetli rüzgarı adveksiyon sanmak; doğrusu: izotermlere dik bileşen belirler, paralel akış sıfır verir.",basit:"Rüzgar sert diye sıcaklık değişmez; çizgileri kesmiyorsa hava aynı kalır.",ben:"Ben 60 kt'lık paralel rüzgarda da sıfır yazarım; hızla değil açıyla karar veririm."},dene:{s:"Rüzgar 270° (batıdan) eserken onu 30° saat yönünde çevirip 300° yaparsan ne olur?",c:{teknik:"Kuzey bileşeni doğar: zayıf soğuk adveksiyon; izoterme dik bileşen V·sin 30° = V/2, tam dik halin yarısı.",basit:"Rüzgar biraz kuzeyden gelmeye başlar; hafif soğuma olur.",ben:"Ben 300°'yi «kuzeybatıdan» okurum: soğuk taraftan biraz giriyor, mavi ama zayıf."}},kaynak:"AMS Glossary: advection; ders dosyası ADVECTION"},"term.veering":{baslik:"Veering — yükseklikle saat yönünde dönüş",kisa:{teknik:"Rüzgar 850'den 500 hPa'ya saat yönünde dönüyor (veering): katmanda sıcak adveksiyon.",basit:"Yukarı çıktıkça rüzgar saat ibresi gibi dönüyor: sıcak hava geliyor.",ben:"Ben derece yukarı doğru artıyorsa (180° → 240°) «veering, sıcak» derim."},neden:{teknik:["V_T = V500 − V850 ortalama izotermlere paraleldir; KYK'de soğuk hava V_T'nin solunda kalır.","Saat yönünde dönüşte 850 rüzgarı izotermleri sıcak taraftan soğuğa keser: sıcak adveksiyon.","Yer–850 arası dönüş sürtünmeden de gelir; termal yorum için 850–500 gibi serbest atmosfer katmanı kullanılır."],basit:["Üst ve alt rüzgar arasındaki fark, katmandaki sıcaklık farkından doğar.","Bu dönüş, alttaki rüzgarın sıcak taraftan geldiğini gösterir."],ben:["Ben V_T okunun üstünde yürürüm: soğuk solumda; 850 oku sola, soğuğa gidiyorsa sıcak adveksiyon.","360°'yi geçerken de bakarım: 340° → 020° da saat yönündedir, veering."]},bak:{teknik:["Hodografta 500 oku 850 okuna göre saat yönünde ilerde; V_T 850 ucundan 500 ucuna gider.","Dönüş açısı ve hızlar büyüdükçe adveksiyon güçlenir (|V850|·|V500|·sin θ ile orantılı).","Kesikli şeritlerde 850 okunun «sıcak» yandan «soğuk» yana doğru gittiğini gör."],basit:["Hodografta alttaki okla üstteki oku karşılaştır.","Üstteki ok saat ibresi yönünde ileride kalıyorsa sıcak hava taşınıyor."],ben:["Ben önce iki yönü derece olarak yazarım: 180° → 240° artıyor, veering.","Sonra V_T okunun solunda «soğuk», sağında «sıcak» etiketini kontrol ederim."]},hata:{teknik:"«Veering = soğuk» demek; doğrusu: KYK'de yükseklikle saat yönünde dönüş sıcak, saat tersine dönüş soğuk adveksiyon.",basit:"Saat yönü = Sıcak; ikisini karıştırma.",ben:"Ben «Saat yönü = Sıcak» diye iki S ile kodlarım; «soğuk» dersem yanlış yaptığımı bilirim."},dene:{s:"Rüzgar 850 hPa'da 340°, 500 hPa'da 020°. Veering mi backing mi; katmanda hangi adveksiyon var?",c:{teknik:"Veering: 340° → 360° → 020° saat yönünde 40°; katmanda sıcak adveksiyon.",basit:"Saat yönünde dönüyor; sıcak hava geliyor.",ben:"Ben 20'ye 360 ekler, 380 − 340 = +40 bulurum: artı, yani veering ve sıcak."}},kaynak:"AMS Glossary: veering, thermal wind; Holton 2004, bölüm 3"},"term.backing":{baslik:"Backing — yükseklikle saat tersine dönüş",kisa:{teknik:"Rüzgar 850'den 500 hPa'ya saat tersine dönüyor (backing): katmanda soğuk adveksiyon.",basit:"Yukarı çıktıkça rüzgar saatin tersine dönüyor: soğuk hava geliyor.",ben:"Ben derece yukarı doğru azalıyorsa (300° → 240°) «backing, soğuk» derim."},neden:{teknik:["V_T izotermlere paralel, soğuk hava solunda; backing'de 850 rüzgarı izotermleri soğuktan sıcağa keser.","Soğuk adveksiyon katman kalınlığını azaltır; çökme ve trof derinleşmesiyle birlikte görülür."],basit:["Ters dönüş, alttaki rüzgarın soğuk taraftan geldiğini gösterir.","Soğuk hava ağırdır, çöker; bulutlar dağılabilir."],ben:["Ben V_T okunun üstünde yürürüm: soğuk solumda; 850 oku sağa, sıcağa gidiyorsa soğuk adveksiyon.","Soğuk cephe arkasındaki «yükseklikle backing» bilgisini bununla bağlarım."]},bak:{teknik:["Hodografta 500 oku 850 okuna göre saat tersine kalır; okuma satırı «backing» yazar.","850 okunun «soğuk» yandan «sıcak» yana doğru gittiğini gör.","Tipik yer: trof arkası ve soğuk cephe gerisi."],basit:["Üstteki ok alttakinin saat tersi yönünde kalıyorsa soğuk hava geliyor.","«Soğuk» etiketi okların hangi yanında, ona bak."],ben:["Ben 300° → 240° gibi derecenin azaldığını görünce backing yazarım.","Sonra yer haritasında soğuk cephenin geçip geçmediğini kontrol ederim."]},hata:{teknik:"Kuzeyi geçerken yanılmak: 020° → 340° saat tersine 40° dönüştür (backing), veering değil.",basit:"Kuzeyi geçen dönüşte büyük sayıya aldanma; dönüşün yönüne bak.",ben:"Ben 340°'yi −20° gibi düşünürüm: 20'den −20'ye inmek 40° saat tersine, yani backing."},dene:{s:"Hazır «saat tersine» durumunda (850: 300°/25 kt, 500: 240°/50 kt) 500 rüzgarını 300°'ye çevirirsen ne değişir?",c:{teknik:"Dönüş kalkar: V_T 850 rüzgarına paralel olur, 850 izotermleri kesmez; adveksiyon zayıf, yalnız hız artar.",basit:"Ters dönüş biter; soğuk hava taşınması neredeyse durur.",ben:"Ben aynı yönde iki ok görünce «yalnız hız artıyor, adveksiyon zayıf» derim."}},kaynak:"AMS Glossary: backing, thermal wind; FRONTS_2 (soğuk cephe tablosu)"},"term.tanim":{baslik:"Termal rüzgar (thermal wind)",kisa:{teknik:"V_T = V500 − V850: ortalama izotermlere paralel, KYK'de soğuk hava solunda.",basit:"Üst rüzgar ile alt rüzgarın farkı; sıcaklık farkını izler.",ben:"Ben V_T'yi 850 okunun ucundan 500 okunun ucuna çizerim; soğuk solumda kalır."},neden:{teknik:["Hidrostatik + jeostrofik denge: kalınlık ortalama sıcaklıkla orantılı, V_T kalınlık çizgilerine paralel.","İzotermler sıkıştıkça (|∇T̄| büyük) V_T uzar; rüzgar yükseklikle artar, yukarıda jet oluşur.","Yön dönmeden yalnız hız artıyorsa alt rüzgar izotermlere paraleldir: adveksiyon zayıf."],basit:["Sıcak hava sütunu uzun, soğuk sütun kısa; aradaki eğim yukarıda rüzgarı büyütür.","İki ok aynı yöne bakıyorsa sıcak ya da soğuk hava taşınmıyor."],ben:["Ben kalınlık çizgilerini ortalama izoterm gibi okurum; V_T onlara paralel akar.","Oklar aynı yöndeyse «adveksiyon zayıf» yazar, hız farkını jet işareti sayarım."]},bak:{teknik:["Hodografta kesikli V_T oku; arkadaki kesikli şeritler ortalama izotermleri temsil eder.","V_T uzunluğu |∇T̄| ile orantılı: uzun ok = sıkışık izoterm kuşağı.","Dönüş açısı 8°'den küçükse lab «yön neredeyse aynı, adveksiyon zayıf» der."],basit:["Üçüncü oka (V_T) bak: «soğuk» etiketi solunda.","Ok uzunsa sıcak-soğuk farkı büyük."],ben:["Ben önce V_T'nin yönünü, sonra soğuk ve sıcak etiketlerinin yerini kontrol ederim.","Hazır «yön aynı» durumunda iki oku da 250°'den görür, adveksiyonu zayıf yazarım."]},hata:{teknik:"V_T'yi gerçek bir rüzgar sanmak; doğrusu: iki seviye arasındaki vektör farkıdır (düşey kesme), hava onunla akmaz.",basit:"V_T esip seni üşütmez; iki rüzgarın farkını gösteren bir oktur.",ben:"Ben V_T'ye «kesme oku» derim; onu rüzgar ölçümü gibi okumam."},dene:{s:"V_T batıdan doğuya doğru uzanıyorsa KYK'de soğuk hava hangi taraftadır?",c:{teknik:"Kuzeyde: V_T doğuya bakarken sol taraf kuzeydir; orta enlemlerin tipik batılı kesmesi.",basit:"Kuzeyde; okun yönüne dön, sol elin soğuğu gösterir.",ben:"Ben doğuya bakar gibi dururum: solum kuzey, soğuk hava orada."}},kaynak:"AMS Glossary: thermal wind; Holton 2004, bölüm 3; Wallace & Hobbs 2006, bölüm 7"},"ind.K":{baslik:"K indeksi (K index)",kisa:{teknik:"K = (T850 − T500) + Td850 − (T700 − Td700); büyüdükçe kuvvetli yağışlı oraj potansiyeli artar.",basit:"Alt kat ılık-nemli, orta kat nemli, üst kat soğuksa K büyür: sağanak-oraj işareti.",ben:"Ben K'yı üç parça yazarım: VT + Td850 − DD700; 30'u geçince dikkat kesilirim."},neden:{teknik:["(T850 − T500): 850–500 azalma oranı; Td850: alt seviye nemi; T700 − Td700 (DD700): 700 hPa kuruluğu.","Kuru 700 hPa (büyük DD700) K'yı düşürür: orta seviyeden karışan kuru hava bulutu zayıflatır.","Eşikler: 30 altı düşük; 30–40 kuvvetli yağışlı oraj potansiyeli daha iyi; 40 ve üstü en iyi potansiyel."],basit:["Üç soru: Yukarısı aşağıdan çok mu soğuk? Altta nem var mı? Ortada hava nemli mi?","Üçüne de «evet» denirse K yükselir."],ben:["Ben DD700'ü ayrı hesaplar, sonra çıkarırım; işaret hatasını böyle önlerim.","Örnek İstanbul sondasında K = 15,3 bulurum: düşük."]},bak:{teknik:["K göstergesi ve eşik bandı; 850 ve 700 hPa T/Td girişleri K'yı doğrudan oynatır.","Td700'ü 1 °C artırmak K'yı 1 artırır; T500'ü 1 °C düşürmek de 1 artırır.","K düşükken 700 kuru mu bak: kuruysa alt nem ve tetikle şiddetli oraj yine olabilir."],basit:["K çubuğunda işaretin hangi renkte durduğuna bak.","700 hPa'yı nemlendirince K'nın hemen arttığını gör."],ben:["Ben −/+ ile Td700'ü oynatıp K'nın nasıl tepki verdiğini izlerim.","Sonra çıkan yorumu eşik tablosuyla karşılaştırırım."]},hata:{teknik:"K'da DD700'ü eklemek; doğrusu: T700 çıkarılır, Td700 eklenir, yani K = … − (T700 − Td700).",basit:"700 hPa ne kadar kuruysa K o kadar küçülür; kuruluğu ekleme, çıkar.",ben:"Ben parantezi açmadan önce DD700 = T700 − Td700 yazarım, sonra eksiyle çıkarırım."},dene:{s:"T850 = 12, Td850 = 8, T700 = 2, Td700 = 0, T500 = −16 °C. K kaçtır, hangi banda düşer?",c:{teknik:"K = 28 + 8 − 2 = 34 °C: 30–40 bandı, kuvvetli yağışlı oraj potansiyeli daha iyi.",basit:"K = 34; orta kat nemli olduğu için sağanak-oraj ihtimali iyi.",ben:"Ben VT = 28, DD700 = 2 bulurum; 28 + 8 − 2 = 34, yani 30–40 bandı."}},kaynak:"Instability indexes (ders dosyası); AMS Glossary: K index"},"ind.TT":{baslik:"Total Totals (TT)",kisa:{teknik:"TT = VT + CT = (T850 − T500) + (Td850 − T500); 45 altı düşük, 55–60 şiddetli oraj en olası.",basit:"Alt kat sıcak-nemli, 500 hPa soğuksa TT büyür; büyük TT = oraj ihtimali.",ben:"Ben TT'yi VT ve CT diye iki parçada toplarım; T500'ü iki kez çıkardığımı unutmam."},neden:{teknik:["VT 850–500 statik kararlılığı (azalma oranını), CT 850 nemi ile 500 soğukluğunu birlikte ölçer.","VT 26 ve üstü nemden bağımsız yeterli statik kararsızlık; CT > 18 konveksiyon için çoğu zaman gerekli.","Güçlü inversiyon (cap) varsa yüksek TT'ye rağmen konveksiyon başlamayabilir."],basit:["Üst kat ne kadar soğuksa sıcak-nemli alt hava o kadar kolay yükselir.","TT bu iki şeyi tek sayıda toplar."],ben:["Ben önce VT'ye bakarım: atmosfer dik mi? Sonra CT'ye: nem yeterli mi?","Örnek İstanbul sondasında TT = 43,8 bulurum: 45'in altı, oraj potansiyeli düşük."]},bak:{teknik:["TT göstergesi ve altındaki VT/CT satırı; T500 ikisine de girer.","T500'ü 1 °C düşürmek TT'yi 2 artırır; T850 ya da Td850'yi 1 °C artırmak 1 artırır.","TT 850 altındaki nemi görmez: nem çok sığsa temsil gücü düşer."],basit:["TT çubuğundaki bantlara bak: 45, 50, 55, 60 sınırları.","500 hPa'yı soğutunca TT'nin hızla arttığını gör."],ben:["Ben T500'ü −/+ ile oynatıp TT'nin iki kat tepki verdiğini kendim görürüm.","TT yüksek ama LI artıysa inversiyon olabilir diye sondaya bakarım."]},hata:{teknik:"T500'ü bir kez çıkarmak; doğrusu: TT = T850 + Td850 − 2·T500, ve −2·(−20) = +40 olur.",basit:"Eksi derecelerde işarete dikkat: eksi bir sayıyı çıkarmak eklemektir.",ben:"Ben TT'yi doğrudan değil VT + CT diye hesaplarım; iki çıkarmayı da böyle unutmam."},dene:{s:"T850 = 14, Td850 = 8, T500 = −16 °C (yaz oraj senaryosu). VT, CT ve TT kaç; hangi bant?",c:{teknik:"VT = 30, CT = 24, TT = 54: 50–55 bandı, oraj daha olası, şiddetli olabilir.",basit:"TT = 54; oraj ihtimali yüksek, sert olabilir.",ben:"Ben 14 + 16 = 30, 8 + 16 = 24 yazarım; toplam 54, yani 50–55 bandı."}},kaynak:"Instability indexes (ders dosyası); AMS Glossary: total totals index"},"ind.SI":{baslik:"Showalter indeksi (SI)",kisa:{teknik:"SI = T500(çevre) − T500(850 hPa'dan kaldırılan parsel); eksi değer kararsızlık demek.",basit:"850 hPa'daki havayı 500'e çıkar; çevresinden sıcaksa SI eksi, hava kararsız.",ben:"Ben SI'da parseli yerden değil 850 hPa'dan kaldırırım; eksi çıkarsa kararsız derim."},neden:{teknik:["Parsel 850'den LCL'ye kuru, sonra 500'e nemli adyabatla çıkar; çevreden sıcaksa kaldırma kuvveti yukarı.","Eşikler: 0 ve üstü kararlı; 0…−3 orta; −3…−6 çok; −6 altı aşırı kararsız.","Altta sığ soğuk hava varsa (ör. cephenin kuzeyi) yerden parsel yanıltır; SI o zaman daha temsilîdir."],basit:["850'deki havayı bir balon gibi bırak: 500'e vardığında çevresinden sıcaksa yükselmeye devam eder.","Sayı ne kadar eksiyse balon o kadar hızlı kaçar."],ben:["Ben «çevre eksi parsel» sırasını hiç ters çevirmem.","Örnek İstanbul sondasının kendi tablosunda SI = 6,9: açıkça kararlı."]},bak:{teknik:["SI göstergesi yalnız T850, Td850 ve T500'e bağlıdır; 700 ve yer değerleri onu değiştirmez.","Td850'yi artırmak LCL'yi alçaltır, parseli 500'de ısıtır, SI'yı düşürür.","SI ile LI'yi kıyasla: büyük fark, alt katmanın 850'den farklı olduğunu gösterir."],basit:["850 hPa'nın nemini artır, SI'nın düştüğünü gör.","Yer değerlerini değiştirince SI kıpırdamaz; bu normal."],ben:["Ben Td850'yi −/+ ile oynatıp SI'nın nasıl indiğini izlerim.","LI ile SI çok farklıysa «alt katta ne var?» diye düşünürüm."]},hata:{teknik:"SI'da parseli yerden kaldırmak; doğrusu: SI'da parsel 850 hPa'dan, LI'de yerden (sınır tabakasından) kalkar.",basit:"SI'nın balonu 850 hPa'dan kalkar, yerden değil.",ben:"Ben SI ile LI'yi başlangıç seviyesiyle ayırırım: SI = 850, LI = yer."},dene:{s:"Td850 aynı kalırken T850 2 °C artarsa SI nasıl değişir, neden?",c:{teknik:"SI azalır: aynı nemle daha sıcak parselin θe'si büyür, 500'e daha sıcak varır; T500 aynıyken fark küçülür.",basit:"SI düşer; alttaki hava ısındığı için hava daha kararsız olur.",ben:"Ben «parsel ısınır, çevre aynı kalır» derim; çevre − parsel küçülür, SI iner."}},kaynak:"Instability indexes (ders dosyası); AMS Glossary: Showalter stability index"},"ind.LI":{baslik:"Kaldırma indeksi (Lifted Index, LI)",kisa:{teknik:"LI = T500(çevre) − T500(yerden/sınır tabakasından kaldırılan parsel); eksi = kararsız.",basit:"Yerdeki havayı 500 hPa'ya çıkar; çevresinden sıcak kalırsa LI eksi, oraj ihtimali.",ben:"Ben LI = −5 görünce «parsel 5 °C sıcak, orta derecede kararsız» derim."},neden:{teknik:["Parsel yerden LCL'ye kuru, sonra 500'e nemli adyabatla çıkar; çevreden sıcaksa kaldırma kuvveti yukarı.","Eşikler: 0 ve üstü kararlı; 0…−3 sınırda; −3…−6 orta; −6…−9 çok; −9 altı aşırı kararsız.","Yer T ve Td'si parselin enerjisini belirler; gündüz ısınması LI'yi düşürür."],basit:["Sabahın serin yer havası 500'e çıkınca soğuk kalır; öğlen ısınınca sıcak kalabilir.","Bu yüzden oraj çoğu zaman öğleden sonra patlar."],ben:["Ben yer T'sini 1 °C artırıp LI'nin nasıl indiğini izlerim.","LI ile SI'yı birlikte okurum; tek indekse güvenmem."]},bak:{teknik:["Sondaj kutusunda kesikli «yerden parsel» eğrisi; 500'de parsel noktası çevrenin sağındaysa LI < 0.","LI göstergesi yalnız yer T/Td ve T500'e bağlıdır; 850 ve 700 değerleri onu değiştirmez.","Yer Td'sini artırmak LCL'yi alçaltır; parsel nemli adyabata erken geçer, 500'e daha sıcak varır."],basit:["Kesikli çizgi (parsel) 500'de sıcaklık çizgisinin sağında mı? Sağdaysa kararsız.","Yer sıcaklığını ve nemini değiştirip kesikli çizginin nasıl yer değiştirdiğini gör."],ben:["Ben parsel noktasını çevre noktasıyla kıyaslarım: sağda = sıcak = eksi LI.","Sonra göstergedeki bandın adını okurum."]},hata:{teknik:"LI = parsel − çevre yazmak; doğrusu: LI = çevre − parsel; parsel sıcaksa sonuç eksi, hava kararsız.",basit:"Eksi LI fırtına ihtimali demek; artı LI sakin hava.",ben:"Ben işareti kontrol için parselin çevreden sıcak mı soğuk mu olduğunu sözle söylerim."},dene:{s:"Yaz oraj senaryosunda LI = −5. Hangi sınıf; gündüz ısınması artarsa LI nereye gider?",c:{teknik:"−3…−6 bandı: orta derecede kararsız. Yer T'si artarsa parsel ısınır, LI daha eksiye iner.",basit:"Orta derecede kararsız; güneş yeri ısıttıkça daha da kararsız olur.",ben:"Ben −5'i «orta» bandına koyarım; öğleden sonra ısınmayla daha eksi beklerim."}},kaynak:"Instability indexes (ders dosyası); AMS Glossary: lifted index; Wallace & Hobbs 2006, bölüm 3"},"ong.lodos-soguk-cephe":{baslik:"Sonbahar: lodos ve yaklaşan soğuk cephe",kisa:{teknik:"Lodos sürer; 6–12 saatte soğuk cephe geçer: kısa kuvvetli sağanak, olası oraj, sonra karayel ve soğuma.",basit:"Önce sert lodos, sonra kısa ama sert sağanak; ardından karayel ve serin hava.",ben:"Ben «6–12 saat içinde sağanaklı cephe geçişi, ardından karayel ve soğuma» yazarım."},neden:{teknik:["300 hPa'da ≈ 120 kt GB jet, 500'de doğuya ilerleyen trofun önü: geniş ölçekli yükselme.","850'de GB rüzgar +8'den +4 °C'ye keser: sıcak adveksiyon; sondada 190° → 240° veering bunu doğrular.","Yüzeyde sıcak sektör, düşen basınç, Ege'de cephe ve dar konvektif bant: soğuk cephe yaklaşıyor."],basit:["Üstte kuvvetli rüzgar ve doğuya yürüyen bir oluk var.","Lodos şimdilik ılık havayı getiriyor; arkasından soğuk hava geliyor.","Batıdaki ince bulut şeridi cephenin kendisi."],ben:["Ben yukarıdan aşağı inerim: jet, trof önü, 850 sıcak adveksiyon, yerde sıcak sektör.","Hepsi aynı hikâyeyi anlatınca güvenim orta-yüksek olur; zamanlama trofun hızına bağlı."]},bak:{teknik:["Yüzey: cephe Ege kıyısında, İstanbul sıcak sektörde, GB 25 kt, basınç sürekli düşüyor.","Uydu: dar, parlak, kuzey-güney uzanan konvektif bant = soğuk cephe imzası.","Sonda: TT = 48 (45–50, oraj olası), K = 28 (30 altı): sağanak baskın, oraj olası."],basit:["Yer haritasında cephe ile İstanbul arasındaki mesafeye bak.","Uyduda batıdaki ince, parlak bulut şeridine bak."],ben:["Ben önce yüzeyde cepheyi bulurum, sonra uydu bandını cepheyle eşleştiririm.","Sondadaki veering'i sıcak sektörün kanıtı sayarım, sıcak cephenin değil."]},hata:{teknik:"Veering ve 850 sıcak adveksiyonuna bakıp «sıcak cephe» demek; bunlar sıcak sektörü anlatır, yüzeydeki cephe soğuk.",basit:"Lodos ılık diye «ısınma sürer» deme; cephe geçince hava soğur.",ben:"Ben veering'i görünce «sıcak cephe» demeden önce yüzeydeki cephe sembolüne bakarım."},dene:{s:"Cephe geçtikten sonra 850 hPa rüzgarı KB'ya döner ve izotermleri soğuktan sıcağa keser. Sonda ve istasyon için ne beklersin?",c:{teknik:"Soğuk adveksiyon: 850–500'de backing; T ve Td düşer, basınç yükselir; sağanaklar aralıklı sürüp azalır.",basit:"Hava soğur ve kurur; ara ara sağanak olabilir, sonra açar.",ben:"Ben veering'in backing'e döndüğünü, sıcaklığın düştüğünü ve basıncın yükseldiğini beklerim."}},kaynak:"Senaryo ipuçları; FRONTS_2 (soğuk cephe geçiş tablosu)"},"ong.kis-poyraz-kar":{baslik:"Kış: poyraz ve Karadeniz etkili kar",kisa:{teknik:"Poyrazla aralıklı kar sağanağı; Karadeniz'e bakan ilçelerde birikim. Güven orta-yüksek.",basit:"Poyraz eser, ara ara kar yağar; en çok kuzey kıyı ilçeleri beyazlar.",ben:"Ben «poyraz karı, yer yer birikim, Karadeniz'e bakan ilçeler önde» yazarım."},neden:{teknik:["500'de trof ekseni doğuya geçmiş, Trakya'da 540 dam altı konturlar: trof arkası, soğuk hava.","850'de −6 °C Marmara'ya inmiş, KD akış soğuk adveksiyon yapıyor; bu sıcaklık kar için yeterli.","Ilık deniz alttan ısıtıp nem verir: alt 1,5 km kuru adyabatiğe yakın, 700'deki inversiyon tavanı sınırlar."],basit:["Soğuk hava ılık Karadeniz'in üstünden geçerken nem ve ısı alır.","Bu nem bulut olur, İstanbul'a kar olarak düşer."],ben:["Ben yukarıdan aşağı inerim: trof arkası, 850 soğuk adveksiyon, yerde poyraz, denizde bantlar.","700 hPa inversiyonunu görünce «sığ konveksiyon: oraj değil, kar sağanağı» derim."]},bak:{teknik:["850 hPa: −6 °C izotermi ve KD akışın izotermleri soğuktan sıcağa kesmesi.","Uydu: Karadeniz'de rüzgar yönünde dizilmiş konvektif bantlar = denizden beslenen kar.","Sonda: alt 1,5 km kuru adyabatiğe yakın, 700'de inversiyon; 700'de T−Td ≈ 2 °C, nemli katman ince."],basit:["850 haritasında −6 °C çizgisinin nereye indiğine bak.","Uyduda deniz üstündeki sıra sıra bulutlara bak."],ben:["Ben önce 850'de −5 °C altını ararım, sonra uyduda bantların hangi kıyıya vurduğuna bakarım.","Yüzeyde Balkanlar yükseği ile Doğu Akdeniz alçağı arasındaki KD rüzgarı kontrol ederim."]},hata:{teknik:"1035 hPa yüksek görüp «açık ve ayazlı» demek; deniz ile hava arasındaki büyük sıcaklık farkı konvektif bulut üretir.",basit:"Yüksek basınç her zaman açık hava demek değil; soğuk hava ılık denizden geçince kar bulutu yapar.",ben:"Ben yüksek basıncı görünce önce rüzgarın denizden gelip gelmediğine bakarım."},dene:{s:"Akış KD yerine KB'dan, yani büyük ölçüde karadan (Balkanlar üzerinden) gelseydi kar beklentisi nasıl değişirdi?",c:{teknik:"Deniz üstü yol kısalır: nem ve alttan ısınma azalır, konveksiyon zayıflar; kar azalır, hava daha kuru ve ayaz.",basit:"Karadan gelen hava kurudur; kar azalır, soğuk ve açık hava artar.",ben:"Ben rüzgarın deniz üstünde ne kadar yol aldığına bakarım; yol kısalırsa kar beklentimi düşürürüm."}},kaynak:"Senaryo ipuçları; AMS Glossary: lake-effect snow (denizde de aynı süreç)"},"ong.yaz-oraj":{baslik:"Yaz: öğleden sonra oraj",kisa:{teknik:"Öğleden sonra yer yer kuvvetli sağanak, oraj ve dolu; yer ve miktar için güven düşük.",basit:"Sabah güneşli; öğleden sonra yer yer sert sağanak, gök gürültüsü ve dolu.",ben:"Ben «öğleden sonra yer yer oraj, dolu olası; yer ve miktar belirsiz» yazarım."},neden:{teknik:["500'de soğuk çekirdekli zayıf kesik alçak (T500 = −16 °C) üst seviyeyi soğutur, azalma oranını dikleştirir.","K = 34, TT = 54, LI = −5, CAPE ≈ 1500 J/kg ve küçük CIN: orta derecede kararsız profil.","850'de adveksiyon zayıf (barotropik yapı): tetik gündüz ısınması ve deniz meltemi yakınsaması."],basit:["Üstte soğuk hava, altta ılık ve nemli hava: yükselmeye hazır bir düzen.","Güneş yeri ısıtınca ve meltem havayı bir araya toplayınca bulutlar kabarır."],ben:["Ben indeksleri hesaplarım; hepsi aynı yönü gösterince oraja güvenirim.","Cephe aramam; tetiği güneşte ve meltemde ararım."]},bak:{teknik:["Sonda: LI = −5, K = 34, TT = 54, CAPE ≈ 1500 J/kg, CIN küçük.","700 hPa'da T−Td = 4 °C (orta seviye nemli); 850'de T = +14, Td = +8 °C.","Uydu/radar: öğlene doğru Trakya ve Kocaeli'de kümülüs gelişimi = tetik çalışıyor."],basit:["İndekslerde eksi LI'ye ve büyük TT'ye bak.","Öğlene doğru kabaran kümülüs bulutlarına bak."],ben:["Ben K'yı kendim hesaplarım: (14 + 16) + 8 − 4 = 34.","Sabah uydusu açık diye aldanmam; öğlene doğru kümülüs gelişimine bakarım."]},hata:{teknik:"«Anadolu yakasına kesin 30 mm» demek: konvektif yağışta noktasal miktar kesin verilemez; güven dili gerekir.",basit:"Oraj her mahalleye aynı yağmaz; «kesin şu kadar» demek yanlış olur.",ben:"Ben konvektif günde sayı ve semt vermem; «yer yer» ve «olası» kelimeleriyle yazarım."},dene:{s:"Aynı günde 700 hPa çok kuru olsaydı (T−Td büyük) K nasıl değişir, oraj yorumu ne olurdu?",c:{teknik:"DD700 büyür, K düşer. Ama alt nem, LI = −5 ve tetik sürerse oraj yine olabilir; düşük K'ya körü körüne güvenme.",basit:"K küçülür; ama alttaki nem ve ısınma duruyorsa oraj yine çıkabilir.",ben:"Ben K düşünce LI ve CAPE'e bakarım; onlar kararsızsa orajı tahminden çıkarmam."}},kaynak:"Senaryo ipuçları; Instability indexes (ders dosyası)"},"ong.kis-sirt-sis":{baslik:"Kış: sırt altında sis ve pus",kisa:{teknik:"Sabah sis ve pus, görüş yer yer 1 km altı; öğlene doğru kısmen dağılır; yağış yok.",basit:"Sabah sisli ve puslu, öğlen biraz açılır; yağmur yok.",ben:"Ben «sabah yoğun sis, öğlen kısmen dağılma, yağış yok» yazar, görüş uyarısını öne koyarım."},neden:{teknik:["500'de 576 dam kuvvetli sırt ve geniş alanda çökme: kararlı, kuru üst katman.","Sakin rüzgar ve açık gecede ışınımsal soğuma: yerde +2 °C, 850'de +6 °C, yani inversiyon.","Yüzeyde T−Td = 1 °C: nemli katman doymaya çok yakın; LI = +8 çok kararlı profil."],basit:["Üstte ılık bir kapak, altta soğuk ve nemli hava sıkışmış.","Gece açık ve rüzgarsız; yer soğuyunca nem sise döner."],ben:["Ben yukarıdan aşağı inerim: sırt ve çökme, 850 ılık, yer soğuk: inversiyon kapanı.","Yerde küçük T−Td ve sakin rüzgar görünce sis derim."]},bak:{teknik:["Sonda: yerden 900 hPa'ya kadar inversiyon, LI = +8, yüzeyde T−Td = 1 °C.","Yüzey: 1032 hPa yüksek basınç, sakin rüzgar, açık gece.","Uydu: sabah Marmara havzasında alçak bulut / sis alanı, üstü açık."],basit:["Yerde sıcaklık ile çiy noktası birbirine çok yakın mı? Yakınsa sis.","Rüzgar sakin mi? Sakinse sis kolay dağılmaz."],ben:["Ben 850 ile yer sıcaklığını kıyaslarım: yukarısı daha sıcaksa inversiyon var.","Uyduda havzayı dolduran beyaz alanı sis diye işaretlerim."]},hata:{teknik:"Kış diye «kar yağışı» seçmek: 850 hPa +6 °C ve çökme var; nem yalnız yüzeyde, yükselme yok.",basit:"Kış diye kar bekleme; üst kat ılık, hava çöküyor, yağış için yükselme yok.",ben:"Ben kışın karı seçmeden önce 850'nin sıfırın altında olup olmadığına ve yükselme olup olmadığına bakarım."},dene:{s:"Gece rüzgar belirgin şekilde artsa ve gökyüzü bulutla kapansaydı sis tahmini nasıl değişirdi?",c:{teknik:"Sis olasılığı düşer: bulut ışınımsal soğumayı azaltır, rüzgar karışımla nemi dağıtır; en çok alçak St olur.",basit:"Sis zorlaşır; bulut yeri sıcak tutar, rüzgar nemi karıştırır.",ben:"Ben «açık gece + sakin rüzgar» ikilisi bozulunca sisi «az olası» yaparım."}},kaynak:"Senaryo ipuçları; AMS Glossary: radiation fog"},"ong.ilkbahar-sicak-cephe":{baslik:"İlkbahar: sıcak cephe önünde sürekli yağış",kisa:{teknik:"Önce bulutlanma, sonra saatlerce orta şiddette sürekli yağmur; cephe geçince ılık ve nemli hava.",basit:"Gök yavaşça griye döner, gün boyu yağmur yağar; sonra hava ılır.",ben:"Ben «uzun süreli sürekli yağmur, sonra ılık-nemli hava» yazarım; sağanak demem."},neden:{teknik:["500'de trof Adriyatik'te, İstanbul trof önünde GB akışta: geniş ölçekli yükselme.","850'de G–GB akış izotermleri sıcaktan soğuğa keser, yükseklikle veering: sıcak adveksiyon.","700'de T−Td ≤ 2 °C, BN %90 üstü; LI = +3 kararlı: sağanak değil, katmanlı bulut ve sürekli yağış."],basit:["Sıcak hava soğuk havanın üstüne yavaşça tırmanıyor.","Hava kararlı; kabaran bulut değil, düz ve kalın
