sen:"^7[0-9/]{4}$",harfler:[K("7","Grup göstericisi"),{h:"R24R24R24R24",ad:"24 saatlik yağış",birim:"mm",nasil:"÷10: 0040 = 4,0 mm; 9999 eser; 0000 kullanılmaz. Türkiye: yalnız 06 UTC, yağış varsa",n:4}]},{id:"8NsChshs",sablon:"8NsChshs",bolum:3,ad:"Bulut tabakası: miktar, cins, taban yüksekliği",anlam:"bulut",desen:"^8[0-9/][0-9/][0-9/]{2}$",harfler:[K("8","Grup göstericisi"),{h:"Ns",ad:"Tabakanın miktarı",tablo:"N",birim:"okta",n:1},{h:"C",ad:"Bulut cinsi",tablo:"C",n:1},{h:"hshs",ad:"Taban yüksekliği (ya da dikey görüş)",tablo:"hshs",birim:"m",nasil:"01–50 → ×30 m; 56–80 → (hshs−50)×300 m; 81–88 → (hshs−80)×1500+9000 m. Alttan üste sıralı; 1-3-5 kuralı",n:2}]},{id:"907tt",sablon:"907tt",bolum:3,ad:"Referans süresi (sonraki 9xxxx grubu için)",anlam:"ruzgar",desen:"^907[0-9/]{2}$",harfler:[K("907","Grup göstericisi (9 + SpSp = 07)"),{h:"tt",ad:"Referans süresi",tablo:"tt",nasil:"tt × 6 dk: 30 = 3 saat, 60 = 6 saat. Rüzgâr değeri değildir",n:2}]},{id:"910ff",sablon:"910ff",bolum:3,ad:"Son 10 dakikanın rüzgâr hamlesi",anlam:"ruzgar",desen:"^910[0-9/]{2}$",harfler:[K("910","Grup göstericisi"),{h:"ff",ad:"Hamle (gust)",birim:"kt",nasil:"Hamle ortalamayı ≥10 kt aşarsa verilir; ≥100 kt ise 91099 + 00fff",n:2}]},{id:"911ff",sablon:"911ff",bolum:3,ad:"Referans süresindeki en yüksek hamle",anlam:"ruzgar",desen:"^911[0-9/]{2}$",harfler:[K("911","Grup göstericisi"),{h:"ff",ad:"En yüksek hamle / en süratli rüzgâr",birim:"kt",nasil:"Süre: önündeki 907tt; yoksa geçmiş hava süresi (6 ya da 3 saat)",n:2}]},{id:"924SVs",sablon:"924SVs",bolum:3,ad:"Denizin hali ve denize doğru görüş",anlam:"gorus",desen:"^924[0-9/]{2}$",harfler:[K("924","Grup göstericisi"),{h:"S",ad:"Denizin hali",tablo:"S",n:1},{h:"Vs",ad:"Denize doğru görüş",tablo:"V'",n:1}]},{id:"931ss",sablon:"931ss",bolum:3,ad:"Taze kar kalınlığı",anlam:"yagis",desen:"^931[0-9/]{2}$",harfler:[K("931","Grup göstericisi"),{h:"ss",ad:"Taze kar kalınlığı",tablo:"ss",nasil:"01–55 düz cm; 56–90 → (ss−50)×10 cm; 91–96 → 1–6 mm; 97 <1 mm",n:2}]},{id:"960ww",sablon:"960ww",bolum:3,ad:"İkinci halihazır hava",anlam:"hava",desen:"^960[0-9/]{2}$",harfler:[K("960","Grup göstericisi"),{h:"ww",ad:"Ek hadise",tablo:"ww",n:2}]}],fe={MiMiMjMj:{teknik:["MiMiMjMj rapor tipini tanımlar: AAXX = kara istasyonu SYNOP (FM-12), BBXX = gemi raporu (FM-13).","Mesajın ilk grubudur; hangi kod formunun izleneceğini belirler."],basit:["Zarfın üstündeki etiket gibi: «Bu karadan gelen bir hava mektubu» der.","AAXX gördün mü, gerisi kara istasyonu düzeniyle okunur."],ben:["AAXX'i görünce «kara istasyonu, normal SYNOP» derim; BBXX olsa gemi derdim.","Bu grupta sayı yok, sadece etiket; hızla geçerim."]},YYGGiw:{teknik:["YY = ayın günü, GG = rasat saati (UTC, en yakın tam saat), iw = rüzgâr birimi ve ölçüm şekli.","iw = 4: anemometre, knot (Türkiye standardı); iw = 3: tahmini, knot; 0 ve 1: m/s.","Ana sinoptik saatler 00, 06, 12, 18 UTC; ara saatler 03, 09, 15, 21 UTC."],basit:["Mektubun tarihi ve saati: 14124 = ayın 14'ü, saat 12 UTC.","Son rakam «rüzgârı neyle ölçtüm, hangi birimle yazdım» sorusunun cevabı."],ben:["14124'ü bölerim: 14 gün, 12 saat; sondaki 4 bana «knot, anemometre» der.","Türk istasyonlarında hep 4 görürüm; 3 görürsem rüzgâr tahminle yazılmış derim."]},IIiii:{teknik:["II = WMO blok numarası (Türkiye = 17), iii = istasyon numarası.","Örnek: 17022 Zonguldak, 17026 Sinop, 17038 Trabzon, 17244 Konya."],basit:["İstasyonun posta kodu gibi: ilk iki rakam bölge, son üçü istasyon.","17 ile başlıyorsa mesaj Türkiye'den geliyor."],ben:["17'yi görünce «Türkiye» derim, son üç haneyi listeden bulurum.","17022 çıkarsa Zonguldak; kıyı istasyonu olduğunu da hatırlarım."]},iRiXhVV:{teknik:["iR: 6RRRtR'nin yeri (1 = Kısım 1, 4 = verilmedi); iX: istasyon tipi ve 7wwW1W2 var mı.","h: en alçak bulut tabanı (0–9 aralık kodu); VV: yatay görüş (KOD 4377).","VV: 01–50 → ×0,1 km; 56–80 → (VV−50) km; 81–88 → 5 km adımla 35–70 km."],basit:["Mesajın içindekiler listesi: yağış yazıldı mı, hava olayı yazıldı mı?","Sonra «bulut ne kadar alçak, ne kadar uzağı görüyorum» bilgisi gelir."],ben:["12670'i dörde ayırırım: 1 yağış var, 2 hadise yok, 6 bulut 1–1,5 km, 70 görüş 20 km.","iX = 2 görünce 7'li grubu aramam; mesajda olmayacağını bilirim."]},Nddff:{teknik:["N: toplam bulut kapalılığı (okta; 9 = gök görülmüyor); dd: rüzgârın geldiği yön, onlarca derece.","ff: son 10 dakikanın ortalama hızı (iw'ye göre kt ya da m/s); ff ≥ 99 ise 00fff izler.","dd = 00 ve ff = 00 → sakin; dd = 99 → değişken yön."],basit:["Gökyüzü kaç parça kapalı, rüzgâr nereden ve ne hızla esiyor; hepsi tek grupta.","73603: gök 7/8 kapalı, rüzgâr kuzeyden, 3 knot."],ben:["İlk rakamı bulut diye ayırırım, kalan dördü rüzgâr: iki yön, iki hız.","dd'yi 10'la çarparım: 36 → 360°, kuzeyden eser; «nereye» değil «nereden»."]},"00fff":{teknik:["Hız 99 birim ya da üstündeyse Nddff'te ff = 99 yazılır, hemen ardından 00fff gelir.","fff gerçek hızdır (üç hane, iw birimi); N3299 00125 = 320°'den 125 kt."],basit:["Hız iki haneye sığmayınca açılan ek kutu.","Fırtına çok güçlüyse gerçek değer burada yazar."],ben:["ff'te 99 görünce bir sonraki 00'lı gruba bakarım, gerçek hız orada.","Türk kara istasyonlarında nadir görürüm ama sınavda tuzak olabilir."]},"1SnTTT":{teknik:["Sn: işaret (0 = ≥0 °C, 1 = <0 °C); TTT: hava sıcaklığı (dry-bulb), ondalığa kadar °C.","Örnek: 10192 = +19,2 °C; 11043 = −4,3 °C."],basit:["Termometrenin o anki değeri, virgülsüz yazılmış.","Sn bir «eksi» düğmesi: 1 ise sıcaklık sıfırın altında."],ben:["1'den sonra 0 gelirse sıfırın üstündeyiz; son üç haneyi 10'a bölerim.","10192 → 19,2 °C; aklımda «bir, işaret, üç hane» diye duruyor."]},"2SnTdTdTd":{teknik:["Sn + TdTdTd: çiy noktası (dew point), ondalığa kadar °C.","T − Td farkı (dew-point depression) nemin ölçüsü; fark küçüldükçe bağıl nem artar.","Td yok ama bağıl nem varsa grup 29UUU olarak gelir."],basit:["Havanın doyması için ne kadar soğuması gerektiğini gösterir.","Sıcaklıkla çiy noktası yakınsa hava nemli, sis ihtimali artar."],ben:["2'li grubu hep 1'li grupla birlikte okurum: 19,2 ile 13,0 → fark 6,2 °C.","İkisi eşitse «hava doymuş» derim, sis ya da yağış ararım."]},"29UUU":{teknik:["2'den sonra Sn yerine 9 → çiy noktası değil bağıl nem (relative humidity) verilmiştir.","UUU yüzde bağıl nemdir: 29064 = %64."],basit:["Çiy noktası hesaplanamayınca nemi doğrudan yüzde olarak yazarlar.","29 ile başladıysa sıcaklık değil nem yüzdesi okursun."],ben:["2'den sonra 9 görürsem «dikkat, bu çiy noktası değil» derim.","Son üç hane düz yüzde: 064 → %64."]},"3PoPoPoPo":{teknik:["PoPoPoPo: istasyon seviyesindeki aktüel basınç (station pressure), ondalığa kadar hPa.","Okuma: 0 ile başlıyorsa 1000 ekle (0022 → 1002,2); değilse ÷10 (8854 → 885,4)."],basit:["İstasyonun bulunduğu yükseklikteki gerçek basınç; dağ istasyonunda düşük çıkar.","Haritada izobar çizmek için bu değil, 4'lü grup kullanılır."],ben:["Ben 3'ü görünce «istasyon basıncı» derim, deniz seviyesi 4'tür.","Konya'da 898 hPa görünce şaşırmam; 1000 m yükseklik farkı yapıyor."]},"4PPPP":{teknik:["PPPP: deniz seviyesine indirgenmiş basınç (MSLP), ondalığa kadar hPa, binler hanesi atılmış.","0 ile başlıyorsa 1000 ekle (0184 → 1018,4); 9 ile başlıyorsa ÷10 (9984 → 998,4).","Yüzey haritasında izobarlar bu değerle çizilir."],basit:["Tüm istasyonlar deniz kıyısındaymış gibi karşılaştırılsın diye düzeltilmiş basınç.","Yüksek ve alçak basınç merkezlerini bu sayılarla buluruz."],ben:["4'ü görünce istasyon modelinin sağ üstüne yazacağım üç rakamı düşünürüm: 0184 → 184.","İlk hane 0 ise 1000'li, 9 ise 900'lü hPa; hiç şaşırmam."]},"4a3hhh":{teknik:["Yüksek istasyonlar (Türkiye: >1000 m) 4PPPP yerine standart seviyenin yüksekliğini verir.","a3 seviyedir (8 = 850 hPa); hhh binler hanesi atılmış metre: 48526 = 850 hPa, 1526 gpm.","Ayırt etme: 4'ten sonraki rakam 1, 2, 5, 7 ya da 8 ise bu gruptur."],basit:["Dağdaki istasyon deniz seviyesinden çok uzak; o yüzden «850 hPa yüzeyi şu yükseklikte» der.","Bingöl ve Konya mesajlarında görürsün."],ben:["Yüksek istasyonda 4'ten sonra 8 görürsem MSLP değil, 850 hPa yüksekliği derim.","526'nın başına 1 eklerim: 1526 m; 850 hPa haritasıyla karşılaştırırım."]},"5appp":{teknik:["a: son 3 saatteki basınç eğilimi karakteristiği (KOD 0200, barograf çizgisinin şekli).","ppp: 3 saatlik basınç değişimi, ondalığa kadar hPa; işaret a'dan anlaşılır.","a = 0–3 → artış (0'da aynı olabilir), 4 → sabit, 5–8 → düşüş (5'te aynı olabilir)."],basit:["Basınç son 3 saatte çıktı mı indi mi, ne kadar? Yaklaşan sistemin habercisi.","Hızlı düşüş çoğu zaman kötü havanın yaklaştığını söyler."],ben:["a'yı «çizginin şekli» diye hatırlarım: 0–3 yukarı, 4 düz, 5–8 aşağı.","58003 → düşüyor, 0,3 hPa; 57015 → düzenli düşüş, 1,5 hPa."]},"6RRRtR":{teknik:["RRR: tR süresindeki yağış (KOD 3590): 001–988 mm, 990 eser (trace), 991–999 = 0,1–0,9 mm.","tR (KOD 4019): Türkiye 00/12 UTC'de 1 (6 sa), 06/18 UTC'de 2 (12 sa) kullanır.","Türkiye ana saatlerde grubu yağış olmasa da RRR = 000 ile verir (iR = 1)."],basit:["Son 6 ya da 12 saatte kaç milimetre yağış düştüğünü söyler.","60001 = son 6 saatte hiç yağış yok."],ben:["Önce son haneye bakarım: 1 ise 6 saat, 2 ise 12 saat.","99 ile başlarsa ondalık okurum: 991 → 0,1 mm; 996 → 0,6 mm."]},"7wwW1W2":{teknik:["ww: rasat anı ya da son saatteki hava (present weather, KOD 4677, 00–99).","W1W2: geçmiş hava (past weather, KOD 4561); süre ana saatlerde 6, ara saatlerde 3 saat.","Grup yalnız önemli hadise varsa verilir (iX = 1); ww 00–03 ve W 0–2 tek başına önemsizdir."],basit:["Şu an ne oluyor (yağmur, sis, oraj) ve son saatlerde ne oldu?","Rakam büyüdükçe hadise ciddileşir: 50'ler çisenti, 60'lar yağmur, 95 ve üstü oraj."],ben:["ww'yi onluklarla okurum: 4x sis, 5x çisenti, 6x yağmur, 7x kar, 8x sağanak, 9x oraj.","70281'de şimdi önemli bir şey yok (02) ama geçmişte sağanak (8) olmuş derim."]},"8NhCLCMCH":{teknik:["Nh: alçak bulut miktarı (yoksa orta bulut miktarı), okta; CL, CM, CH: alçak, orta, yüksek bulut cinsi.","N = 0 (açık) ya da N = 9 (gök görülmüyor) ise grup verilmez.","CL, CM ya da CH = / → karanlık, sis vb. nedeniyle görülemiyor."],basit:["Gökyüzünü üç kata ayırır: alt, orta, üst kat; her katta hangi bulut var.","İlk rakam sadece alt kattaki bulutun ne kadar yer kapladığı, toplam değil."],ben:["Nh'yi toplam bulut sanmamaya dikkat ederim; toplam N'dir, Nddff'te.","82108 → 2/8 alçak bulut, iyi hava Cu'su, orta yok, yüksekte Cs."]},333:{teknik:["Kısım 3 göstericisi: bölgesel/ulusal ek gruplar (Tmax, Tmin, bulut tabakaları, hamle) başlar.","Kısım 3'teki 1, 2, 3, 4, 6, 7, 8 grupları Kısım 1'dekilerle aynı rakamla başlar ama anlamları farklıdır."],basit:["«Buradan sonrası ek bilgiler» tabelası.","Aynı rakamla başlayan gruplar artık başka şey anlatır; 1 artık en yüksek sıcaklık."],ben:["333'ü görünce kafamda sayfa çeviririm: 1 en yüksek, 2 en düşük sıcaklık.","8'li gruplar burada tekrar tekrar gelir, her biri bir bulut tabakası."]},"1SnTxTxTx":{teknik:["TxTxTx: azami sıcaklık (maximum temperature), ondalığa kadar °C.","Türkiye: yalnız 18 UTC rasadında; 06–18 UTC arasındaki 12 saatlik en yüksek değer."],basit:["Günün en sıcak anı; akşam mesajında gelir.","10182 → gündüz en yüksek 18,2 °C."],ben:["333'ten sonra 1 görürsem «anlık sıcaklık değil, maksimum» derim.","Sadece 18 UTC mesajında ararım; başka saatte çıkmaz."]},"2SnTnTnTn":{teknik:["TnTnTn: asgari sıcaklık (minimum temperature), ondalığa kadar °C.","Türkiye: yalnız 06 UTC rasadında; 18–06 UTC arasındaki 12 saatlik en düşük değer."],basit:["Gecenin en soğuk değeri; sabah mesajında gelir.","Don olup olmadığını buradan anlarsın."],ben:["333'ten sonra 2'yi «gece minimumu» diye okurum, çiy noktasıyla karıştırmam.","20125 → gece en düşük 12,5 °C; sadece 06 UTC'de ararım."]},"3EsnTgTg":{teknik:["E: kar/buz yokken zeminin hali (KOD 0901); sn + TgTg: toprak üstü asgari sıcaklık, tam °C.","Türkiye: yalnız 06 UTC. Yerde kar varsa E = / yazılır, zemin 4E'sss ile verilir."],basit:["Toprak kuru mu ıslak mı, gece çimen hizasında ne kadar soğudu?","Zirai don için önemli bir bilgi."],ben:["32010'u 3-2-0-10 diye bölerim: zemin ıslak, toprak üstü minimum +10 °C.","TgTg'de ondalık yok, iki haneyi düz okurum."]},"4E'sss":{teknik:["E': yerde kar/buz varken zeminin hali (KOD 0975); sss: toplam kar kalınlığı, cm.","sss: 997 = <0,5 cm, 998 = süreksiz örtü, 999 = ölçülemedi. Türkiye: 06 UTC'de, kar varsa."],basit:["Yerde ne kadar kar var ve örtü düzgün mü?","Kış mesajlarında çıkar; yazın görmezsin."],ben:["Kısım 3'te 4 görünce kar derinliği derim; son üç hane düz santimetre.","Bu 4'lü grubu Kısım 1'deki basınçla asla karıştırmam."]},"5EEEiE":{teknik:["EEE: son 24 saatlik buharlaşma (evaporation), ondalığa kadar mm; iE: alet ya da ürün tipi (KOD 1806).","Türkiye: yalnız 06 UTC. 55 ile başlayan grup bu değil, güneşlenme grubudur."],basit:["Bir kaptan bir günde ne kadar su uçtuğunu söyler.","Sıcak ve rüzgârlı günlerde değer büyür."],ben:["5'ten sonra 5 gelirse güneşlenme, başka rakam gelirse buharlaşma derim.","EEE'yi 10'a bölerim: 037 → 3,7 mm."]},"55SSS":{teknik:["SSS: bir önceki günün toplam güneşlenme süresi (sunshine duration), saatin ondalığına kadar.","Türkiye: yalnız 06 UTC. Hemen ardından 0–6 ile başlayan grup radyasyon grubudur (J5F24…)."],basit:["Dün güneş kaç saat göründü?","55013 → 1,3 saat güneş; çok bulutlu bir gün."],ben:["55'i görünce «dünün güneşi» derim, son üç haneyi 10'a bölerim.","Arkasından 2 ile başlayan grup gelirse onu radyasyon diye okurum."]},J5F24:{teknik:["J: radyasyon tipi (2 = küresel güneş radyasyonu, Türkiye); F24F24F24F24: 24 saat toplamı, J/cm².","Yalnız 06 UTC'de ve 55SSS'ten hemen sonra gelir: 20398 = 398 J/cm²."],basit:["Dün yere ne kadar güneş enerjisi ulaştı?","Bulutlu günde küçük, açık günde büyük çıkar."],ben:["55SSS'ten sonra 2xxxx görürsem asgari sıcaklık değil radyasyon derim.","20620 → 620 J/cm²; güneşlenme süresiyle birlikte yorumlarım."]},"6RRRtR_b3":{teknik:["Kısım 3'te yağış grubu: iR = 2 (ya da 0) ise yağış bu kısımda verilir; okuma Kısım 1 ile aynı.","Türkiye yağışı her zaman Kısım 1'de verir; bu grup Türk mesajlarında beklenmez."],basit:["Aynı yağış bilgisi, sadece başka bir bölmeye konmuş hali.","Bazı ülkeler yağışı burada yazar."],ben:["iR = 2 görürsem yağışı 333'ten sonra ararım.","Türk mesajında bunu görürsem iR'ye geri dönüp kontrol ederim."]},"7R24":{teknik:["R24R24R24R24: 24 saatlik toplam yağış, ondalığa kadar mm (0040 = 4,0 mm; 9999 = eser).","Türkiye: yalnız 06 UTC; önceki 18 UTC ve 06 UTC yağışlarının toplamı. Yağış yoksa verilmez."],basit:["Bir tam günde düşen yağışın toplamı.","Dört hane, sonuncusu ondalık."],ben:["Sinop'ta 70040 → 4,0 mm; dün akşamki yaklaşık 3 mm ile sabahki 0,6 mm'yi toplarım.","Kısım 3'teki 7'yi hava olayı sanmam, 24 saatlik yağıştır."]},"8NsChshs":{teknik:["Bulut tabakası (cloud layer): Ns miktar (okta), C cins (KOD 0500), hshs taban yüksekliği (KOD 1677).","1-3-5 kuralı: 1. tabaka ≥1/8, 2. ≥3/8, 3. ≥5/8; Cb her zaman ayrıca verilir (en çok 4 grup).","hshs: 01–50 → ×30 m; 56–80 → (hshs−50)×300 m; 89/hshs → gök görülmüyor, dikey görüş."],basit:["Gökyüzündeki bulutların kat kat listesi: ne kadar, hangi tür, ne yükseklikte.","Alttan üste doğru sıralanır."],ben:["82834'ü 2-8-34 diye okurum: 2/8 Cu, 34 × 30 = 1020 m.","56'dan büyük hshs görürsem 50 çıkarıp 300'le çarparım: 70 → 6000 m."]},"907tt":{teknik:["907: süre göstericisi (WMO FM-12); tt: arkasından gelen 9xxxx grubunun referans süresi (KOD 4077).","tt 01–60 → 6 dakikalık birimler: 30 = 3 saat, 60 = 6 saat. Grup hız ya da hamle taşımaz.","Kod kağıdında ve rasat notlarında yoktur; Türk mesajlarında 911ff'ten hemen önce gelir."],basit:["Arkasından gelen hamle değeri için «son kaç saate bakıldı» etiketidir.","Kendisi rüzgâr değeri taşımaz."],ben:["90760'ı 907 + 60 diye ayırırım: 60 × 6 dk = 6 saat; içinde hız yok.","Ara saatte 90730 görürüm: 3 saat, geçmiş hava süresiyle aynı."]},"910ff":{teknik:["ff: rasattan önceki 10 dakikadaki rüzgâr hamlesi (gust), knot.","Türkiye: hamle ortalama hızı en az 10 kt aşarsa verilir; 100 kt ve üstü 91099 + 00fff."],basit:["Rüzgârın ani, kısa süreli en sert vuruşu.","Ortalama rüzgârdan belirgin güçlüyse yazılır."],ben:["910'u «10 dakikanın hamlesi» diye ezberledim: 9-10 → 10 dakika.","91099 görürsem gerçek hamleyi bir sonraki 00'lı grupta ararım."]},"911ff":{teknik:["ff: referans süresindeki en yüksek hamle / en süratli rüzgâr (highest gust), knot.","Süre önündeki 907tt ile verilir; 907tt yoksa geçmiş hava (W1W2) süresidir.","Türkiye'de otomatik ölçüm sistemi olan istasyonlar verir."],basit:["Son birkaç saatte rüzgârın ulaştığı en sert an.","91106 → en sert an 6 knot."],ben:["911'i hep 907 ile birlikte okurum: «son 6 saatte en sert hamle 6 kt».","Ortalama ff'yi yanına koyarım: 3 kt ortalama, 6 kt hamle; mantıklı."]},"924SVs":{teknik:["S: denizin hali (KOD 3700, dalga yüksekliği); Vs: denize doğru görüş (KOD 0685).","Belirlenen kıyı istasyonları tüm ana ve ara saatlerde verir."],basit:["Kıyıdaki istasyon «deniz ne kadar dalgalı, açığı ne kadar görüyorum» der.","Denizciler için yararlı bilgi."],ben:["924'ü görünce «kıyı istasyonu, deniz bilgisi» derim.","S'yi dalga, Vs'yi denize doğru görüş diye ikiye ayırırım."]},"931ss":{teknik:["ss: taze kar kalınlığı (KOD 3870): 01–55 → düz cm, 56–90 → (ss−50)×10 cm, 97 → <1 mm.","Türkiye: son 6 saatte kar yağmışsa ana saatlerde verilir; ölçüm 0 ise 93100."],basit:["Son yağan kardan kaç santim birikti?","Toplam kar değil, sadece yeni yağan."],ben:["931'i «yeni kar» diye okurum; toplam kar Kısım 3'teki 4'lü gruptadır.","ss = 05 → 5 cm; 60 görürsem 100 cm derim."]},"960ww":{teknik:["İkinci halihazır hava: birden çok hadise varsa en yüksek kod 7wwW1W2'de, diğeri burada.","İstisna: 17 (kuru oraj) 20–49 ile birlikteyse 17 ana grupta, diğeri 960ww'de."],basit:["Aynı anda iki şey oluyorsa (çisenti + pus) ikincisi buraya yazılır.","Ana grupta en önemli olay durur."],ben:["960'ı «ek hava olayı» diye okurum, aynı ww tablosuyla çözerim.","750W1W2 + 96010 → çisenti var, ayrıca pus da var."]}},L="Brifing örneği: Ogimet SYNOP çıktısı",Ee=[{id:"zonguldak-12",istasyon:"17022 Zonguldak (136 m)",ham:"AAXX 14124 17022 12670 73603 10192 20130 30022 40184 58003 60001 av paketi: Backing / Veering"},{id:"tr-solunda-soguk",konu:"termal-ruzgar",yildiz:2,tip:"dogru-yanlis",soru:"Kuzey yarımkürede termal rüzgârın solunda soğuk hava vardır.",soruEn:"In the Northern Hemisphere, cold air lies to the left of the thermal wind. True or false?",secenekler:Za,dogru:0,adimlar:[r("V_T = V_üst − V_alt (iki geostrofik rüzgârın vektör farkı).","V_T = V_üst − V_alt","V_T","ruzgar"),r("Termal rüzgâr kalınlık çizgilerine paralel eser."),r("Solunda ince (soğuk), sağında kalın (sıcak) tabaka."),r("Geostrofik rüzgârda alçak solda; termal rüzgârda soğuk solda."),r("Cevap: Doğru.")],derin:[g("Jetle ilişkisi ne?",[r("Jet, güçlü sıcaklık kontrastının (termal rüzgâr) ürünüdür."),r("Kontrast büyüdükçe rüzgâr yükseklikle daha çok artar.")])],tuzak:"Sıcak ve soğuk tarafı ters koymak.",kaynak:"Ders dosyası: Thermal Wind"},{id:"kr-dalr",konu:"kararlilik",yildiz:3,tip:"sayi",soru:"Yer 20 °C. Doymamış parsel 300 m tepeye çıkıyor. Parsel kaç °C olur?",soruEn:"An unsaturated parcel at 20 °C is lifted 300 m. What is its temperature?",dogru:"17",tolerans:.05,adimlar:[r("Doymamış parsel → kuru adyabatik oran (DALR) kullan."),r("DALR = 1 °C / 100 m (sabit).","1 °C / 100 m","1 °C","kararlilik"),r("300 m = 3 × 100 m."),r("Soğuma: 3 × 1 = 3 °C."),r("20 − 3 = 17 °C.","20 − 3 = 17","17","sicaklik")],derin:[g("Doymuş olsaydı?",[r("SALR ≈ 0,6 °C / 100 m."),r("20 − 3 × 0,6 = 20 − 1,8 = 18,2 °C.","18,2 °C","18,2","sicaklik")],[g("SALR neden daha küçük?",[r("Doymuş hava soğurken yoğuşur."),r("Yoğuşma gizli ısı bırakır; soğumayı yavaşlatır."),r("Soğuk havada buhar az → SALR, DALR'a yaklaşır.")])]),g("Adyabatik ne demek?",[r("Dışarıyla ısı alışverişi yok."),r("Yükselen parsel genleşir → soğur; inen parsel sıkışır → ısınır.")])],tuzak:"Doymamış parsele 0,6 kullanmak.",kaynak:"Ders dosyası: Stability (adyabatik süreçler)"},{id:"kr-elr-08",konu:"kararlilik",yildiz:3,tip:"secmeli",soru:"ELR = 0,8 °C/100 m. Atmosfer ne durumda?",soruEn:"The ELR is 0.8 °C per 100 m. Describe the stability  eşikleri?",[r("< 30: kuvvetli yağışlı oraj ya da şiddetli hava mümkün."),r("> 30: daha iyi potansiyel · 40: en iyi potansiyel.")])],tuzak:"Eksi işaretleri karıştırmak: −(−16) = +16.",kaynak:"Ders dosyası: Instability indexes"},{id:"in-tt",konu:"kararlilik",yildiz:3,tip:"sayi",soru:"T850 = 10, Td850 = 6, T500 = −20 °C. TT = ?",soruEn:"Calculate the Total Totals index.",dogru:"56",tolerans:.05,adimlar:[r("Formül: TT = T850 + Td850 − 2 × T500.","TT = T850 + Td850 − 2 × T500","2 × T500","kararlilik"),r("2 × T500 = 2 × (−20) = −40."),r("TT = 10 + 6 − (−40) = 16 + 40 = 56.","16 + 40 = 56","56","kararlilik"),r("Kontrol: VT = 10 − (−20) = 30 · CT = 6 − (−20) = 26."),r("VT + CT = 30 + 26 = 56: tutuyor."),r("Eşik: 55–60 → şiddetli oraj en olası.")],derin:[g("VT ve CT ne anlatır?",[r("VT = T850 − T500: dikey sıcaklık farkı (statik kararsızlık)."),r("CT = Td850 − T500: alt seviye nemi + üst soğukluk."),r("VT ~26+ ve CT > 18 konveksiyona uygun.")]),g("TT yüksek ama oraj yoksa?",[r("Güçlü inversiyon (kapak) konveksiyonu başlatmayabilir."),r("Alt nem 850'nin altında kalıyorsa TT yanıltabilir.")]),g("TT eşikleri?",[r("45–50 oraj mümkün · 50–55 olası, şiddetli olabilir."),r("55–60 şiddetli oraj en olası.")])],tuzak:"T500'ü 2 ile çarpmayı unutmak.",kaynak:"Ders dosyası: Instability indexes · Hızlı test"},{id:"in-li",konu:"kararlilik",yildiz:3,tip:"sayi",soru:"500 hPa'da çevre −14 °C; yüzeyden kaldırılan parsel −9 °C ile varıyor. LI = ?",soruEn:"T500(env) = −14 °C, lifted surface parcel = −9 °C. Calculate LI.",dogru:"-5",tolerans:.05,adimlar:[r("Formül: LI = T500(çevre) − T500(parsel).","LI = T500(çevre) − T500(parsel)","çevre","kararlilik"),r("LI = −14 − (−9)."),r("−14 + 9 = −5.","−14 + 9 = −5","−5","kararlilik"),r("Negatif → parsel çevreden 5 °C sıcak → kararsız."),r("LI −3 / −6 aralığı → orta kararsız.")],derin:[g("Ya SI = −5 olsaydı?",[r("SI tablosu farklı: −4 / −6 → çok kararsız."),r("Aynı sayı iki indiste farklı sınıfa düşebilir."),r("Örnek: −2 SI'de orta, LI'de marjinal karars
