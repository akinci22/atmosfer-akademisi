ğış miktarı",tablo:"RRR",birim:"mm",n:3},{h:"tR",ad:"Yağış periyodu",tablo:"tR",nasil:"iR = 0 ya da 2 ise burada; Türkiye kullanmaz",n:1}]},{id:"7R24",sablon:"7R24R24R24R24",bolum:3,ad:"24 saatlik toplam yağış",anlam:"yagis",desen:"^7[0-9/]{4}$",harfler:[ea("7","Grup göstericisi"),{h:"R24R24R24R24",ad:"24 saatlik yağış",birim:"mm",nasil:"÷10: 0040 = 4,0 mm; 9999 eser; 0000 kullanılmaz. Türkiye: yalnız 06 UTC, yağış varsa",n:4}]},{id:"8NsChshs",sablon:"8NsChshs",bolum:3,ad:"Bulut tabakası: miktar, cins, taban yüksekliği",anlam:"bulut",desen:"^8[0-9/][0-9/][0-9/]{2}$",harfler:[ea("8","Grup göstericisi"),{h:"Ns",ad:"Tabakanın miktarı",tablo:"N",birim:"okta",n:1},{h:"C",ad:"Bulut cinsi",tablo:"C",n:1},{h:"hshs",ad:"Taban yüksekliği (ya da dikey görüş)",tablo:"hshs",birim:"m",nasil:"01–50 → ×30 m; 56–80 → (hshs−50)×300 m; 81–88 → (hshs−80)×1500+9000 m. Alttan üste sıralı; 1-3-5 kuralı",n:2}]},{id:"907tt",sablon:"907tt",bolum:3,ad:"Referans süresi (sonraki 9xxxx grubu için)",anlam:"ruzgar",desen:"^907[0-9/]{2}$",harfler:[ea("907","Grup göstericisi (9 + SpSp = 07)"),{h:"tt",ad:"Referans süresi",tablo:"tt",nasil:"tt × 6 dk: 30 = 3 saat, 60 = 6 saat. Rüzgâr değeri değildir",n:2}]},{id:"910ff",sablon:"910ff",bolum:3,ad:"Son 10 dakikanın rüzgâr hamlesi",anlam:"ruzgar",desen:"^910[0-9/]{2}$",harfler:[ea("910","Grup göstericisi"),{h:"ff",ad:"Hamle (gust)",birim:"kt",nasil:"Hamle ortalamayı ≥10 kt aşarsa verilir; ≥100 kt ise 91099 + 00fff",n:2}]},{id:"911ff",sablon:"911ff",bolum:3,ad:"Referans süresindeki en yüksek hamle",anlam:"ruzgar",desen:"^911[0-9/]{2}$",harfler:[ea("911","Grup göstericisi"),{h:"ff",ad:"En yüksek hamle / en süratli rüzgâr",birim:"kt",nasil:"Süre: önündeki 907tt; yoksa geçmiş hava süresi (6 ya da 3 saat)",n:2}]},{id:"924SVs",sablon:"924SVs",bolum:3,ad:"Denizin hali ve denize doğru görüş",anlam:"gorus",desen:"^924[0-9/]{2}$",harfler:[ea("924","Grup göstericisi"),{h:"S",ad:"Denizin hali",tablo:"S",n:1},{h:"Vs",ad:"Denize doğru görüş",tablo:"V'",n:1}]},{id:"931ss",sablon:"931ss",bolum:3,ad:"Taze kar kalınlığı",anlam:"yagis",desen:"^931[0-9/]{2}$",harfler:[ea("931","Grup göstericisi"),{h:"ss",ad:"Taze kar kalınlığı",tablo:"ss",nasil:"01–55 düz cm; 56–90 → (ss−50)×10 cm; 91–96 → 1–6 mm; 97 <1 mm",n:2}]},{id:"960ww",sablon:"960ww",bolum:3,ad:"İkinci halihazır hava",anlam:"hava",desen:"^960[0-9/]{2}$",harfler:[ea("960","Grup göstericisi"),{h:"ww",ad:"Ek hadise",tablo:"ww",n:2}]}],jr={MiMiMjMj:{teknik:["MiMiMjMj rapor tipini tanımlar: AAXX = kara istasyonu SYNOP (FM-12), BBXX = gemi raporu (FM-13).","Mesajın ilk grubudur; hangi kod formunun izleneceğini belirler."],basit:["Zarfın üstündeki etiket gibi: «Bu karadan gelen bir hava mektubu» der.","AAXX gördün mü, gerisi kara istasyonu düzeniyle okunur."],ben:["AAXX'i görünce «kara istasyonu, normal SYNOP» derim; BBXX olsa gemi derdim.","Bu grupta sayı yok, sadece etiket; hızla geçerim."]},YYGGiw:{teknik:["YY = ayın günü, GG = rasat saati (UTC, en yakın tam saat), iw = rüzgâr birimi ve ölçüm şekli.","iw = 4: anemometre, knot (Türkiye standardı); iw = 3: tahmini, knot; 0 ve 1: m/s.","Ana sinoptik saatler 00, 06, 12, 18 UTC; ara saatler 03, 09, 15, 21 UTC."],basit:["Mektubun tarihi ve saati: 14124 = ayın 14'ü, saat 12 UTC.","Son rakam «rüzgârı neyle ölçtüm, hangi birimle yazdım» sorusunun cevabı."],ben:["14124'ü bölerim: 14 gün, 12 saat; sondaki 4 bana «knot, anemometre» der.","Türk istasyonlarında hep 4 görürüm; 3 görürsem rüzgâr tahminle yazılmış derim."]},IIiii:{teknik:["II = WMO blok numarası (Türkiye = 17), iii = istasyon numarası.","Örnek: 17022 Zonguldak, 17026 Sinop, 17038 Trabzon, 17244 Konya."],basit:["İstasyonun posta kodu gibi: ilk iki rakam bölge, son üçü istasyon.","17 ile başlıyorsa mesaj Türkiye'den geliyor."],ben:["17'yi görünce «Türkiye» derim, son üç haneyi listeden bulurum.","17022 çıkarsa Zonguldak; kıyı istasyonu olduğunu da hatırlarım."]},iRiXhVV:{teknik:["iR: 6RRRtR'nin yeri (1 = Kısım 1, 4 = verilmedi); iX: istasyon tipi ve 7wwW1W2 var mı.","h: en alçak bulut tabanı (0–9 aralık kodu); VV: yatay görüş (KOD 4377).","VV: 01–50 → ×0,1 km; 56–80 → (VV−50) km; 81–88 → 5 km adımla 35–70 km."],basit:["Mesajın içindekiler listesi: yağış yazıldı mı, hava olayı yazıldı mı?","Sonra «bulut ne kadar alçak, ne kadar uzağı görüyorum» bilgisi gelir."],ben:["12670'i dörde ayırırım: 1 yağış var, 2 hadise yok, 6 bulut 1–1,5 km, 70 görüş 20 km.","iX = 2 görünce 7'li grubu aramam; mesajda olmayacağını bilirim."]},Nddff:{teknik:["N: toplam bulut kapalılığı (okta; 9 = gök görülmüyor); dd: rüzgârın geldiği yön, onlarca derece.","ff: son 10 dakikanın ortalama hızı (iw'ye göre kt ya da m/s); ff ≥ 99 ise 00fff izler.","dd = 00 ve ff = 00 → sakin; dd = 99 → değişken yön."],basit:["Gökyüzü kaç parça kapalı, rüzgâr nereden ve ne hızla esiyor; hepsi tek grupta.","73603: gök 7/8 kapalı, rüzgâr kuzeyden, 3 knot."],ben:["İlk rakamı bulut diye ayırırım, kalan dördü rüzgâr: iki yön, iki hız.","dd'yi 10'la çarparım: 36 → 360°, kuzeyden eser; «nereye» değil «nereden»."]},"00fff":{teknik:["Hız 99 birim ya da üstündeyse Nddff'te ff = 99 yazılır, hemen ardından 00fff gelir.","fff gerçek hızdır (üç hane, iw birimi); N3299 00125 = 320°'den 125 kt."],basit:["Hız iki haneye sığmayınca açılan ek kutu.","Fırtına çok güçlüyse gerçek değer burada yazar."],ben:["ff'te 99 görünce bir sonraki 00'lı gruba bakarım, gerçek hız orada.","Türk kara istasyonlarında nadir görürüm ama sınavda tuzak olabilir."]},"1SnTTT":{teknik:["Sn: işaret (0 = ≥0 °C, 1 = <0 °C); TTT: hava sıcaklığı (dry-bulb), ondalığa kadar °C.","Örnek: 10192 = +19,2 °C; 11043 = −4,3 °C."],basit:["Termometrenin o anki değeri, virgülsüz yazılmış.","Sn bir «eksi» düğmesi: 1 ise sıcaklık sıfırın altında."],ben:["1'den sonra 0 gelirse sıfırın üstündeyiz; son üç haneyi 10'a bölerim.","10192 → 19,2 °C; aklımda «bir, işaret, üç hane» diye duruyor."]},"2SnTdTdTd":{teknik:["Sn + TdTdTd: çiy noktası (dew point), ondalığa kadar °C.","T − Td farkı (dew-point depression) nemin ölçüsü; fark küçüldükçe bağıl nem artar.","Td yok ama bağıl nem varsa grup 29UUU olarak gelir."],basit:["Havanın doyması için ne kadar soğuması gerektiğini gösterir.","Sıcaklıkla çiy noktası yakınsa hava nemli, sis ihtimali artar."],ben:["2'li grubu hep 1'li grupla birlikte okurum: 19,2 ile 13,0 → fark 6,2 °C.","İkisi eşitse «hava doymuş» derim, sis ya da yağış ararım."]},"29UUU":{teknik:["2'den sonra Sn yerine 9 → çiy noktası değil bağıl nem (relative humidity) verilmiştir.","UUU yüzde bağıl nemdir: 29064 = %64."],basit:["Çiy noktası hesaplanamayınca nemi doğrudan yüzde olarak yazarlar.","29 ile başladıysa sıcaklık değil nem yüzdesi okursun."],ben:["2'den sonra 9 görürsem «dikkat, bu çiy noktası değil» derim.","Son üç hane düz yüzde: 064 → %64."]},"3PoPoPoPo":{teknik:["PoPoPoPo: istasyon seviyesindeki aktüel basınç (station pressure), ondalığa kadar hPa.","Okuma: 0 ile başlıyorsa 1000 ekle (0022 → 1002,2); değilse ÷10 (8854 → 885,4)."],basit:["İstasyonun bulunduğu yükseklikteki gerçek basınç; dağ istasyonunda düşük çıkar.","Haritada izobar çizmek için bu değil, 4'lü grup kullanılır."],ben:["Ben 3'ü görünce «istasyon basıncı» derim, deniz seviyesi 4'tür.","Konya'da 898 hPa görünce şaşırmam; 1000 m yükseklik farkı yapıyor."]},"4PPPP":{teknik:["PPPP: deniz seviyesine indirgenmiş basınç (MSLP), ondalığa kadar hPa, binler hanesi atılmış.","0 ile başlıyorsa 1000 ekle (0184 → 1018,4); 9 ile başlıyorsa ÷10 (9984 → 998,4).","Yüzey haritasında izobarlar bu değerle çizilir."],basit:["Tüm istasyonlar deniz kıyısındaymış gibi karşılaştırılsın diye düzeltilmiş basınç.","Yüksek ve alçak basınç merkezlerini bu sayılarla buluruz."],ben:["4'ü görünce istasyon modelinin sağ üstüne yazacağım üç rakamı düşünürüm: 0184 → 184.","İlk hane 0 ise 1000'li, 9 ise 900'lü hPa; hiç şaşırmam."]},"4a3hhh":{teknik:["Yüksek istasyonlar (Türkiye: >1000 m) 4PPPP yerine standart seviyenin yüksekliğini verir.","a3 seviyedir (8 = 850 hPa); hhh binler hanesi atılmış metre: 48526 = 850 hPa, 1526 gpm.","Ayırt etme: 4'ten sonraki rakam 1, 2, 5, 7 ya da 8 ise bu gruptur."],basit:["Dağdaki istasyon deniz seviyesinden çok uzak; o yüzden «850 hPa yüzeyi şu yükseklikte» der.","Bingöl ve Konya mesajlarında görürsün."],ben:["Yüksek istasyonda 4'ten sonra 8 görürsem MSLP değil, 850 hPa yüksekliği derim.","526'nın başına 1 eklerim: 1526 m; 850 hPa haritasıyla karşılaştırırım."]},"5appp":{teknik:["a: son 3 saatteki basınç eğilimi karakteristiği (KOD 0200, barograf çizgisinin şekli).","ppp: 3 saatlik basınç değişimi, ondalığa kadar hPa; işaret a'dan anlaşılır.","a = 0–3 → artış (0'da aynı olabilir), 4 → sabit, 5–8 → düşüş (5'te aynı olabilir)."],basit:["Basınç son 3 saatte çıktı mı indi mi, ne kadar? Yaklaşan sistemin habercisi.","Hızlı düşüş çoğu zaman kötü havanın yaklaştığını söyler."],ben:["a'yı «çizginin şekli» diye hatırlarım: 0–3 yukarı, 4 düz, 5–8 aşağı.","58003 → düşüyor, 0,3 hPa; 57015 → düzenli düşüş, 1,5 hPa."]},"6RRRtR":{teknik:["RRR: tR süresindeki yağış (KOD 3590): 001–988 mm, 990 eser (trace), 991–999 = 0,1–0,9 mm.","tR (KOD 4019): Türkiye 00/12 UTC'de 1 (6 sa), 06/18 UTC'de 2 (12 sa) kullanır.","Türkiye ana saatlerde grubu yağış olmasa da RRR = 000 ile verir (iR = 1)."],basit:["Son 6 ya da 12 saatte kaç milimetre yağış düştüğünü söyler.","60001 = son 6 saatte hiç yağış yok."],ben:["Önce son haneye bakarım: 1 ise 6 saat, 2 ise 12 saat.","99 ile başlarsa ondalık okurum: 991 → 0,1 mm; 996 → 0,6 mm."]},"7wwW1W2":{teknik:["ww: rasat anı ya da son saatteki hava (present weather, KOD 4677, 00–99).","W1W2: geçmiş hava (past weather, KOD 4561); süre ana saatlerde 6, ara saatlerde 3 saat.","Grup yalnız önemli hadise varsa verilir (iX = 1); ww 00–03 ve W 0–2 tek başına önemsizdir."],basit:["Şu an ne oluyor (yağmur, sis, oraj) ve son saatlerde ne oldu?","Rakam büyüdükçe hadise ciddileşir: 50'ler çisenti, 60'lar yağmur, 95 ve üstü oraj."],ben:["ww'yi onluklarla okurum: 4x sis, 5x çisenti, 6x yağmur, 7x kar, 8x sağanak, 9x oraj.","70281'de şimdi önemli bir şey yok (02) ama geçmişte sağanak (8) olmuş derim."]},"8NhCLCMCH":{teknik:["Nh: alçak bulut miktarı (yoksa orta bulut miktarı), okta; CL, CM, CH: alçak, orta, yüksek bulut cinsi.","N = 0 (açık) ya da N = 9 (gök görülmüyor) ise grup verilmez.","CL, CM ya da CH = / → karanlık, sis vb. nedeniyle görülemiyor."],basit:["Gökyüzünü üç kata ayırır: alt, orta, üst kat; her katta hangi bulut var.","İlk rakam sadece alt kattaki bulutun ne kadar yer kapladığı, toplam değil."],ben:["Nh'yi toplam bulut sanmamaya dikkat ederim; toplam N'dir, Nddff'te.","82108 → 2/8 alçak bulut, iyi hava Cu'su, orta yok, yüksekte Cs."]},333:{teknik:["Kısım 3 göstericisi: bölgesel/ulusal ek gruplar (Tmax, Tmin, bulut tabakaları, hamle) başlar.","Kısım 3'teki 1, 2, 3, 4, 6, 7, 8 grupları Kısım 1'dekilerle aynı rakamla başlar ama anlamları farklıdır."],basit:["«Buradan sonrası ek bilgiler» tabelası.","Aynı rakamla başlayan gruplar artık başka şey anlatır; 1 artık en yüksek sıcaklık."],ben:["333'ü görünce kafamda sayfa çeviririm: 1 en yüksek, 2 en düşük sıcaklık.","8'li gruplar burada tekrar tekrar gelir, her biri bir bulut tabakası."]},"1SnTxTxTx":{teknik:["TxTxTx: azami sıcaklık (maximum temperature), ondalığa kadar °C.","Türkiye: yalnız 18 UTC rasadında; 06–18 UTC arasındaki 12 saatlik en yüksek değer."],basit:["Günün en sıcak anı; akşam mesajında gelir.","10182 → gündüz en yüksek 18,2 °C."],ben:["333'ten sonra 1 görürsem «anlık sıcaklık değil, maksimum» derim.","Sadece 18 UTC mesajında ararım; başka saatte çıkmaz."]},"2SnTnTnTn":{teknik:["TnTnTn: asgari sıcaklık (minimum temperature), ondalığa kadar °C.","Türkiye: yalnız 06 UTC rasadında; 18–06 UTC arasındaki 12 saatlik en düşük değer."],basit:["Gecenin en soğuk değeri; sabah mesajında gelir.","Don olup olmadığını buradan anlarsın."],ben:["333'ten sonra 2'yi «gece minimumu» diye okurum, çiy noktasıyla karıştırmam.","20125 → gece en düşük 12,5 °C; sadece 06 UTC'de ararım."]},"3EsnTgTg":{teknik:["E: kar/buz yokken zeminin hali (KOD 0901); sn + TgTg: toprak üstü asgari sıcaklık, tam °C.","Türkiye: yalnız 06 UTC. Yerde kar varsa E = / yazılır, zemin 4E'sss ile verilir."],basit:["Toprak kuru mu ıslak mı, gece çimen hizasında ne kadar soğudu?","Zirai don için önemli bir bilgi."],ben:["32010'u 3-2-0-10 diye bölerim: zemin ıslak, toprak üstü minimum +10 °C.","TgTg'de ondalık yok, iki haneyi düz okurum."]},"4E'sss":{teknik:["E': yerde kar/buz varken zeminin hali (KOD 0975); sss: toplam kar kalınlığı, cm.","sss: 997 = <0,5 cm, 998 = süreksiz örtü, 999 = ölçülemedi. Türkiye: 06 UTC'de, kar varsa."],basit:["Yerde ne kadar kar var ve örtü düzgün mü?","Kış mesajlarında çıkar; yazın görmezsin."],ben:["Kısım 3'te 4 görünce kar derinliği derim; son üç hane düz santimetre.","Bu 4'lü grubu Kısım 1'deki basınçla asla karıştırmam."]},"5EEEiE":{teknik:["EEE: son 24 saatlik buharlaşma (evaporation), ondalığa kadar mm; iE: alet ya da ürün tipi (KOD 1806).","Türkiye: yalnız 06 UTC. 55 ile başlayan grup bu değil, güneşlenme grubudur."],basit:["Bir kaptan bir günde ne kadar su uçtuğunu söyler.","Sıcak ve rüzgârlı günlerde değer büyür."],ben:["5'ten sonra 5 gelirse güneşlenme, başka rakam gelirse buharlaşma derim.","EEE'yi 10'a bölerim: 037 → 3,7 mm."]},"55SSS":{teknik:["SSS: bir önceki günün toplam güneşlenme süresi (sunshine duration), saatin ondalığına kadar.","Türkiye: yalnız 06 UTC. Hemen ardından 0–6 ile başlayan grup radyasyon grubudur (J5F24…)."],basit:["Dün güneş kaç saat göründü?","55013 → 1,3 saat güneş; çok bulutlu bir gün."],ben:["55'i görünce «dünün güneşi» derim, son üç haneyi 10'a bölerim.","Arkasından 2 ile başlayan grup gelirse onu radyasyon diye okurum."]},J5F24:{teknik:["J: radyasyon tipi (2 = küresel güneş radyasyonu, Türkiye); F24F24F24F24: 24 saat toplamı, J/cm².","Yalnız 06 UTC'de ve 55SSS'ten hemen sonra gelir: 20398 = 398 J/cm²."],basit:["Dün yere ne kadar güneş enerjisi ulaştı?","Bulutlu günde küçük, açık günde büyük çıkar."],ben:["55SSS'ten sonra 2xxxx görürsem asgari sıcaklık değil radyasyon derim.","20620 → 620 J/cm²; güneşlenme süresiyle birlikte yorumlarım."]},"6RRRtR_b3":{teknik:["Kısım 3'te yağış grubu: iR = 2 (ya da 0) ise yağış bu kısımda verilir; okuma Kısım 1 ile aynı.","Türkiye yağışı her zaman Kısım 1'de verir; bu grup Türk mesajlarında beklenmez."],basit:["Aynı yağış bilgisi, sadece başka bir bölmeye konmuş hali.","Bazı ülkeler yağışı burada yazar."],ben:["iR = 2 görürsem yağışı 333'ten sonra ararım.","Türk mesajında bunu görürsem iR'ye geri dönüp kontrol ederim."]},"7R24":{teknik:["R24R24R24R24: 24 saatlik toplam yağış, ondalığa kadar mm (0040 = 4,0 mm; 9999 = eser).","Türkiye: yalnız 06 UTC; önceki 18 UTC ve 06 UTC yağışlarının toplamı. Yağış yoksa verilmez."],basit:["Bir tam günde düşen yağışın toplamı.","Dört hane, sonuncusu ondalık."],ben:["Sinop'ta 70040 → 4,0 mm; dün akşamki yaklaşık 3 mm ile sabahki 0,6 mm'yi toplarım.","Kısım 3'teki 7'yi hava olayı sanmam, 24 saatlik yağıştır."]},"8NsChshs":{teknik:["Bulut tabakası (cloud layer): Ns miktar (okta), C cins (KOD 0500), hshs taban yüksekliği (KOD 1677).","1-3-5 kuralı: 1. tabaka ≥1/8, 2. ≥3/8, 3. ≥5/8; Cb her zaman ayrıca verilir (en çok 4 grup).","hshs: 01–50 → ×30 m; 56–80 → (hshs−50)×300 m; 89/hshs → gök görülmüyor, dikey görüş."],basit:["Gökyüzündeki bulutların kat kat listesi: ne kadar, hangi tür, ne yükseklikte.","Alttan üste doğru sıralanır."],ben:["82834'ü 2-8-34 diye okurum: 2/8 Cu, 34 × 30 = 1020 m.","56'dan büyük hshs görürsem 50 çıkarıp 300'le çarparım: 70 → 6000 m."]},"907tt":{teknik:["907: süre göstericisi (WMO FM-12); tt: arkasından gelen 9xxxx grubunun referans süresi (KOD 4077).","tt 01–60 → 6 dakikalık birimler: 30 = 3 saat, 60 = 6 saat. Grup hız ya da hamle taşımaz.","Kod kağıdında ve rasat notlarında yoktur; Türk mesajlarında 911ff'ten hemen önce gelir."],basit:["Arkasından gelen hamle değeri için «son kaç saate bakıldı» etiketidir.","Kendisi rüzgâr değeri taşımaz."],ben:["90760'ı 907 + 60 diye ayırırım: 60 × 6 dk = 6 saat; içinde hız yok.","Ara saatte 90730 görürüm: 3 saat, geçmiş hava süresiyle aynı."]},"910ff":{teknik:["ff: rasattan önceki 10 dakikadaki rüzgâr hamlesi (gust), knot.","Türkiye: hamle ortalama hızı en az 10 kt aşarsa verilir; 100 kt ve üstü 91099 + 00fff."],basit:["Rüzgârın ani, kısa süreli en sert vuruşu.","Ortalama rüzgârdan belirgin güçlüyse yazılır."],ben:["910'u «10 dakikanın hamlesi» diye ezberledim: 9-10 → 10 dakika.","91099 görürsem gerçek hamleyi bir sonraki 00'lı grupta ararım."]},"911ff":{teknik:["ff: referans süresindeki en yüksek hamle / en süratli rüzgâr (highest gust), knot.","Süre önündeki 907tt ile verilir; 907tt yoksa geçmiş hava (W1W2) süresidir.","Türkiye'de otomatik ölçüm sistemi olan istasyonlar verir."],basit:["Son birkaç saatte rüzgârın ulaştığı en sert an.","91106 → en sert an 6 knot."],ben:["911'i hep 907 ile birlikte okurum: «son 6 saatte en sert hamle 6 kt».","Ortalama ff'yi yanına koyarım: 3 kt ortalama, 6 kt hamle; mantıklı."]},"924SVs":{teknik:["S: denizin hali (KOD 3700, dalga yüksekliği); Vs: denize doğru görüş (KOD 0685).","Belirlenen kıyı istasyonları tüm ana ve ara saatlerde verir."],basit:["Kıyıdaki istasyon «deniz ne kadar dalgalı, açığı ne kadar görüyorum» der.","Denizciler için yararlı bilgi."],ben:["924'ü görünce «kıyı istasyonu, deniz bilgisi» derim.","S'yi dalga, Vs'yi denize doğru görüş diye ikiye ayırırım."]},"931ss":{teknik:["ss: taze kar kalınlığı (KOD 3870): 01–55 → düz cm, 56–90 → (ss−50)×10 cm, 97 → <1 mm.","Türkiye: son 6 saatte kar yağmışsa ana saatlerde verilir; ölçüm 0 ise 93100."],basit:["Son yağan kardan kaç santim birikti?","Toplam kar değil, sadece yeni yağan."],ben:["931'i «yeni kar» diye okurum; toplam kar Kısım 3'teki 4'lü gruptadır.","ss = 05 → 5 cm; 60 görürsem 100 cm derim."]},"960ww":{teknik:["İkinci halihazır hava: birden çok hadise varsa en yüksek kod 7wwW1W2'de, diğeri burada.","İstisna: 17 (kuru oraj) 20–49 ile birlikteyse 17 ana grupta, diğeri 960ww'de."],basit:["Aynı anda iki şey oluyorsa (çisenti + pus) ikincisi buraya yazılır.","Ana grupta en önemli olay durur."],ben:["960'ı «ek hava olayı» diye okurum, aynı ww tablosuyl syonların ne kadar sık olduğuna bakarım; seyrek yerde analizime daha az güvenirim.","Halkada 7'den 1'e dönen kesikli oku görüp «zincir kapanıyor» derim."]},hata:{teknik:"Hata: GG'yi yerel saat sanmak. Doğrusu: SYNOP saatleri UTC'dir; Türkiye UTC+3 olduğundan 12 UTC yerel 15:00'tir.",basit:"Hata: haritadaki saati kendi saatin sanmak. Doğrusu: dünya ortak saati (UTC) kullanılır, Türkiye 3 saat ileridedir.",ben:"Ben 06 UTC'yi sabah 6 sanmamak için hep 3 ekleyip yerel saati yanına yazarım."},dene:{s:"09 UTC gözlemi ana mı, ara mı sinoptik saattir? Türkiye saatiyle kaçtır?",c:{teknik:"Ara sinoptik saat (03/09/15/21 kümesi); UTC+3 ile yerel saat 12:00.",basit:"Ara saat; Türkiye'de öğlen 12.",ben:"Ben 09'u ara saat listesinde bulurum, 3 ekleyip öğlen 12 derim."}},kaynak:"WMO-No. 544 (sinoptik saatler); WMO-No. 8 (ölçüm yükseklikleri); AMS Glossary: synoptic"},"zincir.kod":{baslik:"2 · Kod (SYNOP)",kisa:{teknik:"Gözlem FM-12 SYNOP'a çevrilir: AAXX başlığı, 5 haneli gruplar, bölümler 0, 1, 3 ve 5.",basit:"Hava raporu, her ülkenin okuyabileceği rakam paketlerine dönüşür.",ben:"Ben kodu bölümlere ayırırım: 333 ve 555'i bulup araya çizgi çekerim."},neden:{teknik:["Rakam kodu dilden bağımsızdır ve makineyle çözülür; WMO GTS ağıyla hızla bütün dünyaya dağılır.","Gruplar ilk rakamla (gösterge) tanınır: Bölüm 1'de 1 T, 2 Td, 3 Po, 4 PPPP, 5 appp, 6 RRR, 7 ww, 8 bulut."],basit:["Rakamı her dilden meteorolog aynı okur.","Her paketin ilk rakamı, içinde ne olduğunu söyleyen bir etikettir."],ben:["Ben grubun ilk rakamına bakıp türünü söylerim, sonra kalan dört haneyi çözerim.","Bölüm 3'te aynı rakamların başka anlam taşıdığını unutmam."]},bak:{teknik:["Halkada 2. düğüm; «Gözlem tarafı» kümesinde Gözlem ile Haritaya çizim arasında durur.","Kod çözücüde her grup çipi, istasyon modelinde aynı renkte parlayan konumla eşleşir."],basit:["İkinci daire kodu temsil eder, içinde rakam simgesi var.","Kod çözücüde bir gruba dokununca modelde yeri yanar."],ben:["Ben kod çözücüde gruba dokunup modelde hangi köşenin yandığına bakarım.","Çip seçili ama modelde hiçbir yer yanmıyorsa o grup modele çizilmiyor derim (ör. 3PoPoPoPo)."]},hata:{teknik:"Hata: grupları sırasına göre okumak. Doğrusu: bazı gruplar hiç gelmeyebilir; her grubu ilk rakamından (göstergeden) tanı.",basit:"Hata: beşinci paket hep basınç eğilimidir sanmak. Doğrusu: eksik paket olabilir; paketi ilk rakamından tanı.",ben:"Ben iR = 4 görünce 6'lı grup yok, iX = 2 görünce 7'li grup yok diye önceden not alırım."},dene:{s:"Bölüm 1'de 5 ile başlayan grup neyi, 333'ten sonra 55 ile başlayan grup neyi verir?",c:{teknik:"5appp: 3 saatlik basınç eğilimi; 55SSS: önceki günün güneşlenme süresi (saatin onda biri).",basit:"Birincisi basıncın 3 saatlik değişimi, ikincisi dünkü güneşli saatler.",ben:"Ben Bölüm 1'deki 5'i eğilim, 333'ten sonraki 55'i güneşlenme diye ayırırım."}},kaynak:"WMO-No. 306, Cilt I.1, FM 12 SYNOP; WMO-No. 386 (GTS)"},"zincir.cizim":{baslik:"3 · Çizim (plotting)",kisa:{teknik:"Çözülen değerler istasyon modelinde sabit konumlara işlenir (Met Office düzeni).",basit:"Rakamlar harita üstünde istasyonun çevresine küçük bir resim olarak yazılır.",ben:"Ben her değeri hep aynı köşeye koyarım; göz yerinden tanısın diye."},neden:{teknik:["Sabit konum, yüzlerce istasyonun tek bakışta okunmasını sağlar; değerin adı yazılmaz, yeri adıdır.","Yer kazanmak için kısaltılır: basıncın son 3 hanesi (1004,2 → 042), sıcaklık tam derece, eğilim onda bir hPa (05)."],basit:["Etiket yazmaya yer yok; değerin yeri ne olduğunu söyler.","Sayılar kısaltılır ki harita kalabalıklaşmasın."],ben:["Ben «sol sıcaklık ailesi, sağ basınç ailesi» diye hatırlarım.","042'yi görünce başına 10 koyup son haneden önce virgül atarım: 1004,2."]},bak:{teknik:["Sol üst TT, sol alt TdTd, solda ww, en solda VV; sağ üst PPP, sağ orta ppp ve a, sağ alt W1W2.","Üstte CH ve CM, altta CL ve Nh/h; çubuk daireden rüzgarın geldiği yöne uzanır, tüyler ucundadır."],basit:["Solda sıcaklıklar ve görüş, sağda basınç, üstte ve altta bulutlar.","Çubuk rüzgarın geldiği tarafı gösterir."],ben:["Ben modelde önce sağ üstteki basınca ve çubuğa bakarım; izobar onlara dayanır.","Sonra solda T ile Td'yi karşılaştırırım."]},hata:{teknik:"Hata: çubuğu rüzgarın gittiği yöne çizmek. Doğrusu: dd geldiği yöndür; 230° rüzgarda çubuk güneybatıya uzanır.",basit:"Hata: oku rüzgarın gittiği yere çevirmek. Doğrusu: çubuk rüzgarın geldiği yeri gösterir.",ben:"Ben çizmeden önce «nereden?» diye sorarım ve çubuğu o tarafa uzatırım."},dene:{s:"1004,2 hPa ve son 3 saatte düzenli 0,5 hPa düşüş modelde nasıl yazılır?",c:{teknik:"Sağ üstte 042; sağ ortada 05 ve düzenli düşüş çizgisi (a = 7).",basit:"Sağ üstte 042, sağ ortada 05 ve aşağı inen çizgi.",ben:"Ben 1004,2'nin son üç hanesini yazarım: 042; altına 05 ve düşen çizgi."}},kaynak:"AMS Glossary: station model; Met Office factsheet 11 (istasyon modeli düzeni)"},"zincir.analiz":{baslik:"4 · Analiz",kisa:{teknik:"Değerler arası ara değerle izobar (4 hPa), üstte kontur ve izoterm (2,5 °C) çizilir.",basit:"Noktaları birleştirip çizgiler, çizgilerden de şekiller çıkarırsın.",ben:"Ben önce merkezleri bulur, sonra izobarları 4'er hPa aralıkla doldururum."},neden:{teknik:["Basınç alanı süreklidir; izobarlar istasyonlar arasında doğrusal ara değerle (interpolation) geçirilir.","İzobar sıklığı basınç gradyanını, dolayısıyla rüzgar hızını verir; yerde sürtünme rüzgarı alçağa doğru saptırır."],basit:["Basınç bir arazinin yüksekliği gibidir; izobar onun eş yükselti çizgisidir.","Çizgiler sıklaştıkça rüzgar sertleşir."],ben:["Ben izobar ile rüzgar çubuğu çelişirse önce kendi çizgimden şüphelenirim.","Sık izobar gördüğüm yere «rüzgar kuvvetli olmalı» diye not düşerim."]},bak:{teknik:["Komşu istasyonların PPP değerlerini karşılaştır; 1008 izobarı 1006 ile 1010'un ortasından geçer.","Çubuklar izobara yaklaşık paralel olmalı: rüzgara arkanı dönünce alçak solda kalır (Buys-Ballot, KYK)."],basit:["Yan yana istasyonların basınç sayılarını kıyasla.","Rüzgar okları çizgilere hemen hemen paralel uzanmalı."],ben:["Ben kapalı izobar bulduğum yere A ya da Y yazar, sonra dışa doğru açılırım.","Kenarda biten izobarı harita kenarına kadar götürürüm, yarıda bırakmam."]},hata:{teknik:"Hata: izobarları kesiştirmek ya da yarıda bırakmak. Doğrusu: izobar ya kapanır ya harita kenarında biter; asla kesişmez.",basit:"Hata: iki çizgiyi kesiştirmek. Doğrusu: bir noktada iki basınç olamaz; çizgi ya kapanır ya kenarda biter.",ben:"Ben kesişen iki izobar görürsem bir değeri yanlış okuduğumu anlar, geri dönerim."},dene:{s:"Komşu iki istasyonda PPP 042 ve 122. 4 hPa aralıkla hangi izobar aralarından geçer?",c:{teknik:"1004,2 ile 1012,2 hPa arasından 1008 geçer; 1012 izobarı 122'li istasyona çok yakın geçer.",basit:"1008 çizgisi iki istasyonun arasından geçer.",ben:"Ben 042'yi 1004,2, 122'yi 1012,2 yapar, aradaki 4'ün katını bulurum: 1008."}},kaynak:"Wallace & Hobbs, Atmospheric Science (yüzey analizi); AMS Glossary: isobar, Buys-Ballot's law"},"zincir.teshis":{baslik:"5 · Teşhis",kisa:{teknik:"Desenlere ad verilir: alçak (A), yüksek (Y), trof, sırt, cepheler; seviyeler birlikte okunur.",basit:"Çizilen şekillere isim koyarsın: çukur, tepe, oluk, sırt, cephe.",ben:"Ben her sistemi işaretleyip adını yazarım, sonra 500 hPa'da doğrularım."},neden:{teknik:["Her sistemin tipik izi var: cephede sıcaklık-çiy farkı, rüzgar dönmesi ve izobarda V kırılması (trof) görülür.","Gelişen alçakta 500 hPa trofu yer alçağının batısında kalır (eksen batıya eğik); bu, sistemin büyüdüğünü söyler."],basit:["Sistemi tanımak, ne yapacağını bilmektir: alçak bulut ve yağış, yüksek açık hava getirir.","Cephe, iki farklı havanın buluştuğu çizgidir; rüzgar ve sıcaklık orada değişir."],ben:["Ben cephe ararken üç şeye bakarım: sıcaklık farkı, rüzgarın dönmesi, izobarın kırılması.","Yer alçağının batısında 500 hPa trofu varsa «derinleşebilir» derim."]},bak:{teknik:["Kapalı izobarda merkez değerine ve dönüşe bak: KYK'de alçak çevresinde akış saat yönünün tersinedir.","Rüzgarın bir hat boyunca saat yönünde döndüğü (veering, ör. 200° → 270°) ve Td'nin düştüğü yer soğuk cephedir."],basit:["Kapalı çizgilerin ortasına bak: içe doğru basınç düşüyorsa alçak.","Rüzgarın aniden yön değiştirdiği hat bir cephe olabilir."],ben:["Ben izobarın sivri V yaptığı yere kalemle trof çizgisi çekerim.","Sonra o hattın iki yanındaki T ve Td'yi karşılaştırırım."]},hata:{teknik:"Hata: her V kırılmasına cephe demek. Doğrusu: iki yanda sıcaklık-nem farkı yoksa bu bir trof çizgisidir, cephe sembolü konmaz.",basit:"Hata: her kıvrımı cephe sanmak. Doğrusu: iki yanda farklı hava yoksa sadece bir oluktur (trof).",ben:"Ben üçgen ya da yarım daire çizmeden önce iki yanda gerçekten farklı hava kütlesi var mı diye bakarım."},dene:{s:"Bir hattın batısında rüzgar 270°'den esiyor, Td düşük; doğusunda 200°'den esiyor, Td yüksek. Teşhis?",c:{teknik:"Soğuk cephe: geçişte rüzgar saat yönünde döner (veering), arkada daha kuru ve serin hava vardır.",basit:"Soğuk cephe; geçince rüzgar döner, hava kurur ve serinler.",ben:"Ben rüzgarın döndüğü ve Td'nin düştüğü hatta mavi üçgenli bir çizgi çizerim."}},kaynak:"Wallace & Hobbs, Atmospheric Science (hava sistemleri); AMS Glossary: front, trough, veering"},"zincir.ongoru":{baslik:"6 · Öngörü",kisa:{teknik:"Sistemlerin hareketi ve gelişmesi kestirilir; sonuç yer, saat (UTC) ve kesinlik derecesiyle söylenir.",basit:"Şekillerin nereye gideceğini bulup yarının havasını söylersin.",ben:"Ben öngörüyü hep bir gerekçeye bağlarım: hangi sistem, nereye, ne zaman."},neden:{teknik:["Yer sistemleri büyük ölçüde üst akışla (500 hPa) yönlenir; trofun önünde yükselme ve yağış, arkasında çökme ve açılma olur.","Alçak, basıncın en hızlı düştüğü bölgeye (izallobarik alçak) doğru ilerleme eğilimindedir."],basit:["Üstteki rüzgar, yerdeki sistemleri bir akıntı gibi sürükler.","Basıncın en hızlı düştüğü yer, alçağın gideceği yerdir."],ben:["Ben 500 hPa akışına bakıp alçağın gideceği yönü kestiririm.","Emin değilsem «olası» derim, «kesin» demem."]},bak:{teknik:["İstasyonlarda a ve ppp'ye bak: a = 6–8 ve büyük ppp'nin kümelendiği bölge, sistemin gideceği yeri gösterir.","Ardışık haritalarda (6 saat arayla) merkezin yer değiştirmesini ölç ve ileri taşı."],basit:["Basıncın düştüğü istasyonları bul; sistem oraya gidiyor.","Bir önceki haritayla karşılaştırıp merkezin ne kadar kaydığına bak."],ben:["Ben sağ ortadaki eğilim sembollerini tarayıp düşüşlerin toplandığı yeri daire içine alırım.","Sonra merkezin 6 saatlik kaymasını kalemle ileri uzatırım."]},hata:{teknik:"Hata: yalnız düz çizgi uzatmak (ekstrapolasyon). Doğrusu: hızlanma, yavaşlama, derinleşme ve dolmayı da hesaba kat.",basit:"Hata: sistemin aynı hızla ve aynı güçle gideceğini varsaymak. Doğrusu: sistemler büyür, küçülür, yavaşlar.",ben:"Ben kesik alçak görürsem hızlı geçeceğini sanmam; inatçı ve uzun süreli hava beklerim."},dene:{s:"Alçağın doğusundaki istasyonlarda basınç hızla düşüyor (a = 7), batısında yükseliyor (a = 2). Alçak nereye gider?",c:{teknik:"Doğuya: alçak en büyük düşüşe doğru ilerler; batıdaki yükseliş arkadan gelen sırtı gösterir.",basit:"Doğuya; basıncın düştüğü taraf, alçağın gittiği taraftır.",ben:"Ben düşen tarafa ok çizerim: doğu; batıdaki yükselişi açılma işareti sayarım."}},kaynak:"Wallace & Hobbs, Atmospheric Science; AMS Glossary: isallobaric low, steering"},"zincir.dogrulama":{baslik:"7 · Doğrulama",kisa:{teknik:"Öngörü, geçerlilik saatindeki gözlem ve analizle karşılaştırılır; hata kaynağı aranır.",basit:"Söylediğin oldu mu diye kontrol edip ders çıkarırsın.",ben:"Ben ertesi günün haritasını açıp kendi öngörümü puanlarım."},neden:{teknik:["Evet/hayır olaylarda isabet, ıska ve yanlış alarm sayılır (çapraz tablo); beceri skorları bunlardan hesaplanır.","Sistematik hata (bias) ancak çok sayıda doğrulamada görünür; tek tahmin şanstan ayrılamaz."],basit:["Kaç kez tuttu, kaç kez kaçırdın, kaç kez boşuna uyardın: üçünü de sayarsın.","Hep aynı yönde yanılıyorsan yönteminde bir kusur var demektir."],ben:["Ben yanıldığımda önce analizime, sonra hareket kestirimime bakarım.","Hep geç kalıyorsam sistemleri yavaş taşıdığımı anlarım."]},bak:{teknik:["Halkada 7'den 1'e kesikli ok: doğrulama yeni gözleme bağlanır, döngü kapanır.","Geçerlilik saatindeki SYNOP'ta ww, W1W2 ve 6RRRtR'ye bak; yağış olduysa burada görünür."],basit:["Son daireden ilk daireye dönen kesikli oka bak.","Ertesi günün istasyon modellerinde yağış sembolü var mı, bak."],ben:["Ben öngördüğüm saatin haritasını açıp aynı istasyonların ww sembollerine bakarım.","Sonra merkezin gerçek yerini benim tahmin ettiğim yerle kıyaslarım."]},hata:{teknik:"Hata: tek istasyona bakıp karar vermek ya da yanlış saatle kıyaslamak. Doğrusu: aynı UTC saatte, öngörünün tüm alanında değerlendir.",basit:"Hata: «benim mahallede yağmadı, demek yanıldım» demek. Doğrusu: öngörü bölge içindi; bölgeye bak.",ben:"Ben sonucu tek bir istasyondan değil, öngördüğüm bölgenin bütün modellerinden okurum."},dene:{s:"«12 UTC'ye kadar yağış» dedin; o saatin SYNOP'unda 60001 var ve iX = 2. Sonuç ne?",c:{teknik:"RRR = 000, tR = 1: son 6 saatte 0 mm; iX = 2: önemli hadise yok. Sonuç: yanlış alarm.",basit:"Hiç yağmamış; boşuna uyarmışsın (yanlış alarm).",ben:"Ben 60001'i 0 mm diye okur, bu öngörüyü yanlış alarm hanesine yazarım."}},kaynak:"Wilks, Statistical Methods in the Atmospheric Sciences (doğrulama); AMS Glossary: forecast verification"},"kod.YYGGiw":{baslik:"YYGGiw · gün, saat, rüzgar birimi",kisa:{teknik:"YY ayın günü, GG rasat saati (UTC), iw rüzgar hızının birimi ve ölçüm şekli (KOD 1855).",basit:"Mesajın günü, saati ve rüzgarın hangi birimle yazıldığı.",ben:"Ben 14124'ü 14 | 12 | 4 diye bölerim: ayın 14'ü, 12 UTC, knot."},neden:{teknik:["Kod gerçek zamanlı değişim için tasarlandığından ay ve yıl yazılmaz; gün ve saat yeterlidir.","iw: 0 tahmini m/s, 1 anemometre m/s, 3 tahmini kt, 4 anemometre kt; Nddff'teki ff bu birimle okunur."],basit:["Rapor hemen gönderildiği için ay ve yıl yazmaya gerek görülmez.","Son rakam «hızı neyle ölçtüm, hangi birimle yazdım» der."],ben:["Ben Nddff'ye geçmeden iw'ye bakarım; 4 ise knot, 1 ise m/s.","Türk istasyonlarında 4 görürüm; 3 görürsem hız tahminle yazılmış derim."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; gün ve saat, haritanın geçerlilik zamanına (ör. 14'ü, 12 UTC) gider.","iw = 0 ya da 1 ise ff m/s'dir; tüyler knotla çizildiği için önce çevrilir (10 m/s ≈ 19 kt)."],basit:["Modelde yeri yok; harita başlığındaki gün-saat buradan gelir.","Birim m/s ise tüyleri çizmeden önce knota çevir."],ben:["Ben harita başlığındaki saatle GG'yi eşleştiririm; tutmuyorsa yanlış mesaj okuyorum.","m/s görürsem hızı yaklaşık iki katına çıkarıp tüyleri öyle sayarım."]},hata:{teknik:"Hata: iw'yi atlayıp m/s'yi knot okumak. Doğrusu: iw = 0/1 → m/s; 10 m/s ≈ 19 kt olduğundan hız neredeyse yarı yarıya yanlış çıkar.",basit:"Hata: son rakamı görmezden gelmek. Doğrusu: o rakam hızın birimini söyler; atlarsan hız yarı yarıya yanlış çıkar.",ben:"Ben iw'yi okumadan ff'e asla dokunmam; birimi grubun yanına küçük harfle yazarım."},dene:{s:"14094 grubunu çöz: gün, saat ve rüzgar birimi nedir?",c:{teknik:"YY = 14, GG = 09 UTC (ara sinoptik saat), iw = 4: anemometre, knot.",basit:"Ayın 14'ü, saat 09 UTC; rüzgar aletle ölçülmüş, knotla yazılmış.",ben:"Ben 14 | 09 | 4 diye bölerim: ara saat, anemometre, knot."}},kaynak:"WMO-No. 306, FM 12 SYNOP Bölüm 0; KOD 1855 (iw)"},"kod.IIiii":{baslik:"IIiii · istasyon numarası",kisa:{teknik:"II WMO blok numarası (Türkiye = 17), iii istasyon numarası; birlikte istasyonun kimliği.",basit:"İstasyonun posta kodu: ilk iki rakam bölge, son üçü istasyon.",ben:"Ben 17 görünce «Türkiye» der, son üç haneyi listeden bulurum."},neden:{teknik:["Mesajda koordinat yoktur; konum ve yükseklik WMO istasyon kataloğundan numarayla bulunur.","Yükseklik basınç gruplarını belirler: 1000 m üstü istasyonlar (17203 Bingöl) 4PPPP yerine 4a3hhh verir."],basit:["Rakam, istasyonun haritadaki yerini bulmak için bir anahtardır.","Numaradan istasyonun dağda mı kıyıda mı olduğunu da öğrenirsin."],ben:["Ben numarayı görünce istasyonun yüksekliğini hatırlarım; basınç gruplarını ona göre okurum.","17022 Zonguldak, 17026 Sinop: ikisi de kıyı istasyonu."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; numara, modelin haritadaki yerini (daire merkezini) belirler.","Örnek seçicide istasyon adının yanında yükseklik yazar: 17244 Konya (1032 m)."],basit:["Modelde yazmaz; dairenin haritada nereye konacağını söyler.","Örnek seçicide numaranın yanında şehir adı var."],ben:["Ben örnek seçicide şehri seçip numarayla eşleştiririm.","Yüksek istasyonda 4'lü grubu iki kez kontrol ederim."]},hata:{teknik:"Hata: IIiii ile YYGGiw'yi karıştırıp 17022'yi ayın 17'si okumak. Doğrusu: AAXX'ten sonra önce YYGGiw, sonra IIiii gelir.",basit:"Hata: 17'yi gün sanmak. Doğrusu: tarih bir önceki paketteydi; 17 Türkiye'nin blok numarasıdır.",ben:"Ben AAXX'ten sonra «önce zaman, sonra yer» diye sayarım."},dene:{s:"17026 hangi ülkenin hangi istasyonu, basıncını hangi grupla verir?",c:{teknik:"Blok 17 Türkiye, iii = 026 Sinop (32 m); 1000 m altında olduğu için 4PPPP verir.",basit:"Türkiye, Sinop; alçak bir kıyı istasyonu, deniz seviyesi basıncını verir.",ben:"Ben 17'yi Türkiye, 026'yı Sinop diye okur, kıyı olduğu için 4PPPP beklerim."}},kaynak:"WMO OSCAR/Surface istasyon kataloğu (eski WMO-No. 9, Cilt A); WMO-No. 306, FM 12 Bölüm 0"},"kod.iRiXhVV":{baslik:"iRiXhVV · yağış, istasyon tipi, bulut tabanı, görüş",kisa:{teknik:"iR yağış grubunun yeri, iX istasyon tipi ve 7'li grup, h en alçak bulut tabanı, VV görüş.",basit:"İçindekiler listesi, bulutun ne kadar alçak olduğu ve ne kadar uzağın göründüğü.",ben:"Ben 12670'i 1-2-6-70 diye bölerim: yağış grubu var, hadise yok, taban 1–1,5 km, görüş 20 km."},neden:{teknik:["iR (KOD 1819): 1 = 6RRRtR Bölüm 1'de, 4 = verilmedi; iX (KOD 1860): 1 = 7wwW1W2 var, 2 = önemli hadise yok.","VV (KOD 4377) iki hanede geniş aralık taşır: 01–50 → ×0,1 km, 56–80 → (VV − 50) km, 81–88 → 35–70 km."],basit:["İlk iki rakam «sonra hangi paketler gelecek» diye haber verir.","Görüş iki haneye sığsın diye yakın mesafe ince, uzak mesafe kaba adımla yazılır."],ben:["Ben iX = 2 görünce 7'li grubu aramam.","VV 50'den büyükse 50 çıkarırım: 56 → 6 km."]},bak:{teknik:["VV modelin en solunda iki haneli kod olarak yazılır (56); h, dairenin altındaki Nh/h'nin ikinci rakamıdır (6/4).","iR ve iX çizilmez; iX = 2 ise soldaki ww ve sağ alttaki W1W2 yerleri boş kalır."],basit:["En soldaki iki rakam görüş, en alttaki kesrin ikinci rakamı bulut tabanı.","Hava olayı yoksa daire çevresinde sembol çıkmaz."],ben:["Ben en soldaki 56'yı görünce «6 km» derim, 56 km demem.","Alttaki 6/4'te 4'ü 300–600 m diye okurum."]},hata:{teknik:"Hata: VV'yi doğrudan km okumak (56 → 56 km). Doğrusu: 56–80 aralığında VV − 50 → 6 km; 51–55 kullanılmaz.",basit:"Hata: 56'yı 56 km sanmak. Doğrusu: 50'den büyükse 50 çıkar, kalan km'dir: 6 km.",ben:"Ben VV 50 ve altındaysa 10'a bölerim (30 → 3 km), 56–80 ise 50 çıkarırım."},dene:{s:"42570 grubunu çöz: yağış grubu var mı, 7'li grup var mı, bulut tabanı ve görüş ne?",c:{teknik:"iR = 4: 6RRRtR yok; iX = 2: 7wwW1W2 yok; h = 5: 600–1000 m; VV = 70: 20 km.",basit:"Yağış paketi yok, hava olayı yok; bulut 600–1000 m'de, görüş 20 km.",ben:"Ben 4-2-5-70 diye bölerim: yağış grubu yok, hadise yok, taban 600–1000 m, görüş 20 km."}},kaynak:"WMO-No. 306: KOD 1819 (iR), 1860 (iX), 1600 (h), 4377 (VV)"},"kod.Nddff":{baslik:"Nddff · toplam bulut ve rüzgar",kisa:{teknik:"N toplam bulut (okta), dd rüzgarın geldiği yön (onlarca derece), ff 10 dk ortalama hız.",basit:"Gök kaç parça kapalı, rüzgar nereden ve ne hızla esiyor.",ben:"Ben ilk rakamı bulut diye ayırırım; kalan dördü rüzgar: iki yön, iki hız."},neden:{teknik:["Yön için 10°'lik adım yeter (±5°); ortalama 10 dakikalıktır, böylece anlık hamle ortalamayı bozmaz.","dd 00 sakin, 99 değişken; hız 99 birim ya da üstüyse ff = 99 yazılır, gerçek hız ardından 00fff'te gelir."],basit:["Rüzgar sürekli oynar; o yüzden 10 dakikanın ortalaması yazılır.","Yön, rüzgarın estiği yer değil, geldiği yerdir."],ben:["Ben dd'ye bir sıfır eklerim: 23 → 230°, güneybatıdan.","N = 9 görürsem «göğü göremiyor, belki sis» derim."]},bak:{teknik:["N merkez dairenin dolu kısmıdır (8 = tam dolu, 9 = ⊗); çubuk daireden dd yönüne uzanır.","Tüyler çubuğun ucunda: uzun tüy 10, kısa tüy 5 kt, üçgen bayrak 50 kt; hız en yakın 5 kt'a yuvarlanır."],basit:["Dairenin ne kadarı doluysa gök o kadar kapalı.","Çubuk rüzgarın geldiği yeri gösterir; tüyleri para gibi say."],ben:["Ben çubuğun yönünü pusulaya oturtur, sonra tüyleri toplarım: 3 uzun = 30 kt.","dd = 00 ise dairenin çevresinde ikinci halkayı ararım: sakin."]},hata:{teknik:"Hata: dd = 36'yı 36° (kuzeydoğu) okumak. Doğrusu: dd onluk derecedir; 36 → 360°, kuzeyden esen rüzgar.",basit:"Hata: 36'yı 36 derece sanmak. Doğrusu: sonuna sıfır ekle; 360°, yani kuzeyden.",ben:"Ben dd'yi görür görmez sonuna 0 koyarım; «nereye» değil «nereden» diye tekrar ederim."},dene:{s:"62315 grubunu çöz ve modelde çubuğun nasıl çizileceğini söyle (iw = 4).",c:{teknik:"N = 6/8; dd = 23 → 230°; ff = 15 kt. Çubuk güneybatıya uzanır: 1 uzun + 1 kısa tüy.",basit:"Gök 6/8 kapalı; rüzgar güneybatıdan 15 knot: bir uzun, bir kısa tüy.",ben:"Ben 6 | 23 | 15 diye bölerim: daireyi 6/8 doldurur, çubuğu 230°'ye çizer, 10 + 5 tüy koyarım."}},kaynak:"WMO-No. 306: KOD 2700 (N), 0877 (dd); AMS Glossary: wind barb"},"kod.1SnTTT":{baslik:"1SnTTT · hava sıcaklığı",kisa:{teknik:"Sn işaret (0 artı, 1 eksi), TTT kuru termometre sıcaklığı, onda bir °C.",basit:"Termometrenin o anki değeri, virgülsüz yazılmış.",ben:"Ben 1'den sonra işarete bakar, son üç haneyi 10'a bölerim: 10192 → 19,2 °C."},neden:{teknik:["Kodda eksi işareti yazılamadığı için ayrı bir işaret hanesi (Sn, KOD 3845) kullanılır.","Onda bir derece virgülsüz üç haneyle verilir; sıcaklık siperde, 1,25–2 m yükseklikte ölçülür."],basit:["Rakam kodunda «−» işareti yok; yerine 1 yazılır.","Virgül de yok; son hane her zaman ondalıktır."],ben:["Ben Sn'yi bir eksi düğmesi gibi düşünürüm: 1 ise sıfırın altı.","Son haneden önce virgül koymayı hiç unutmam."]},bak:{teknik:["Modelde sol üstte, tam dereceye yuvarlanmış yazılır: 19,2 → 19; eksi değer işaretiyle (−4).","Çip seçilince sol üst köşe aynı renkte yanar."],basit:["Dairenin sol üstündeki sayı sıcaklıktır.","Ondalık modelde görünmez; tam sayı yazılır."],ben:["Ben sol üstteki sayıyı hemen sol alttakiyle (Td) karşılaştırırım.","Eksi işaretini kaçırmamak için önce ona bakarım."]},hata:{teknik:"Hata: işaret hanesini atlamak (11043'ü +4,3 ya da 104,3 okumak). Doğrusu: Sn = 1 → eksi; 11043 = −4,3 °C.",basit:"Hata: ikinci rakamı unutmak. Doğrusu: 1 ise sıcaklık eksidir; 11043 eksi 4,3 derecedir.",ben:"Ben grubu 1 | Sn | TTT diye üçe bölüp yazarım; işaret hiç kaybolmaz."},dene:{s:"11018 grubu hangi sıcaklığı verir, modelde sol üstte ne yazılır?",c:{teknik:"Sn = 1 → eksi; 018 / 10 = 1,8: −1,8 °C; modelde tam sayıya yuvarlanmış −2.",basit:"Eksi 1,8 derece; modelde −2 görünür.",ben:"Ben 1 | 1 | 018 diye bölerim: eksi, 1,8 °C; sol üste −2 yazarım."}},kaynak:"WMO-No. 306: KOD 3845 (Sn); WMO-No. 8 (sıcaklık ölçümü)"},"kod.2SnTdTdTd":{baslik:"2SnTdTdTd · çiy noktası",kisa:{teknik:"Sn işaret, TdTdTd çiy noktası (dew point), onda bir °C; Sn = 9 ise grup 29UUU, bağıl nem.",basit:"Havanın doyması için ne kadar soğuması gerektiğini gösteren sıcaklık.",ben:"Ben 2'li grubu hep 1'li grupla birlikte okur, aradaki farkı hesaplarım."},neden:{teknik:["Td havadaki su buharının ölçüsüdür; T − Td farkı (dew-point depression) küçüldükçe bağıl nem artar.","Td her zaman T'ye eşit ya da ondan küçüktür; eşitse hava doymuştur."],basit:["Çiy noktası, bu havayı soğutsan hangi derecede buğu yapacağını söyler.","Sıcaklıkla çiy noktası yakınsa hava nemlidir; sis ve alçak bulut olasıdır."],ben:["Ben farkı 2 °C ya da altında görünce sis ya da alçak bulut ararım.","Td'nin yükselmesini nemli hava geliyor diye okurum."]},bak:{teknik:["Modelde sol altta, tam dereceye yuvarlanmış yazılır; tam üstündeki TT ile dikey olarak karşılaştırılır.","T − Td'yi kafadan çıkar: 23 / 18 → 5 °C, nemli; 19 / 18 → 1 °C, doymaya çok yakın."],basit:["Dairenin sol altındaki sayı çiy noktasıdır.","Üstteki sayıyla arası açıksa hava kuru, yakınsa nemli."],ben:["Ben sol sütunda üst ile alt sayının farkına bakarım.","Fark küçük ve solda sis sembolü varsa «tutarlı» derim."]},hata:{teknik:"Hata: Td'nin işaret hanesini atlamak (21012'yi +101,2 okumak). Doğrusu: Sn = 1 → −1,2 °C; Sn = 9 ise bağıl nem.",basit:"Hata: ikinci rakamı sayıya katmak. Doğrusu: o rakam işarettir; 21012 eksi 1,2 derecedir.",ben:"Ben işareti çözdükten sonra Td'yi T ile kıyaslarım; Td, T'den büyük çıkarsa bir yerde hata yapmışımdır."},dene:{s:"10192 ve 20130 gruplarından T − Td farkı kaç, hava ne kadar nemli?",c:{teknik:"T = 19,2, Td = 13,0 °C; fark 6,2 °C: doymaktan uzak, görece kuru.",basit:"Fark 6 derece kadar; sis beklenmez, hava görece kuru.",ben:"Ben 19,2 − 13,0 = 6,2 yaparım; sis beklemem."}},kaynak:"WMO-No. 306: KOD 3845 (Sn); AMS Glossary: dewpoint, dewpoint depression"},"kod.3PoPoPoPo":{baslik:"3PoPoPoPo · istasyon basıncı",kisa:{teknik:"İstasyon seviyesindeki aktüel basınç (station pressure), onda bir hPa, binler hanesi atılmış.",basit:"İstasyonun bulunduğu yükseklikteki gerçek basınç.",ben:"Ben 3'ü görünce «istasyon basıncı» derim; izobar için 4'e geçerim."},neden:{teknik:["Basınç yükseklikle hızla azalır; yüksek istasyonda Po düşük çıkar (Konya 38983 → 898,3 hPa).","Po, deniz seviyesine indirgemenin ve 4a3hhh hesabının girdisidir; haritada doğrudan kullanılmaz."],basit:["Dağda üstteki hava daha az olduğundan basınç düşüktür.","Bu değeri doğrudan kıyaslarsan dağları alçak basınç sanırsın."],ben:["Ben Po ile PPPP arasındaki farka bakıp istasyonun ne kadar yüksekte olduğunu kestiririm.","Konya'da 898 görünce şaşırmam: istasyon 1000 m'nin üstünde."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; sağ üstteki 3 hane 4PPPP'den gelir.","Kıyıda Po ile PPPP yakındır (Sinop 1014,7 / 1018,5 hPa); istasyon yükseldikçe fark büyür."],basit:["Modelde bu sayı yazmaz.","Kıyı istasyonunda iki basınç birbirine yakındır, dağda uzaktır."],ben:["Ben modeldeki basıncın 3'lü değil 4'lü gruptan geldiğini bilirim.","Zonguldak'ta 1002,2 ile 1018,4'ü kıyaslar, farkı yüksekliğe bağlarım."]},hata:{teknik:"Hata: 3PoPoPoPo ile izobar çizmek. Doğrusu: istasyonlar farklı yükseklikte; izobar deniz seviyesine indirgenmiş 4PPPP ile çizilir.",basit:"Hata: dağ istasyonunun düşük basıncını alçak merkez sanmak. Doğrusu: haritada deniz seviyesi basıncı kullanılır.",ben:"Ben 38854'ü (885,4 hPa) görünce alçak merkez değil, yüksek istasyon (Bingöl) derim."},dene:{s:"30022 ve 38854 gruplarını hPa olarak oku. Hangisi yüksek istasyondan gelir?",c:{teknik:"0022 → 1002,2 hPa (0 ile başlıyor, +1000); 8854 → 885,4 hPa: yüksek istasyon.",basit:"Biri 1002,2, diğeri 885,4 hPa; düşük olan dağ istasyonudur.",ben:"Ben 0 ile başlayana 1000 ekler, 8 ile başlayanı 10'a bölerim; 885,4 dağdır."}},kaynak:"WMO-No. 306, FM 12 Bölüm 1; Wallace & Hobbs, Atmospheric Science (hidrostatik denge)"},"kod.4PPPP":{baslik:"4PPPP · deniz seviyesi basıncı",kisa:{teknik:"Deniz seviyesine indirgenmiş basınç (MSLP), onda bir hPa, binler hanesi atılmış; izobarın kaynağı.",basit:"Bütün istasyonlar deniz kıyısındaymış gibi düzeltilmiş basınç.",ben:"Ben 4'ü görünce modelin sağ üstüne yazacağım üç rakamı düşünürüm: 0184 → 184."},neden:{teknik:["İndirgeme yükseklik etkisini kaldırır; geriye kalan yatay farklar hava sistemlerini (A, Y) gösterir.","Dört haneye sığsın diye binler atılır: 0 ile başlarsa +1000 (0184 → 1018,4), 9 ile başlarsa ÷10 (9984 → 998,4)."],basit:["Yükseklik farkını silince geriye gerçek hava farkları kalır.","Baştaki «1» yer kaplamasın diye atılır."],ben:["Ben ilk hane 0 ise 1000'li, 9 ise 900'lü hPa okurum.","Sonuç 950–1050 arasında değilse yanlış okumuşumdur."]},bak:{teknik:["Modelin sağ üstünde son 3 hane: 1004,2 → 042; okurken 0–4 ile başlarsa başına 10, 5–9 ile başlarsa 9 eklenir.","Komşu istasyonların PPP'lerini karşılaştırıp 4 hPa aralıklı izobarı aralarından geçir."],basit:["Sağ üstteki üç rakam basınçtır.","Küçük sayılar (042) 1000'in biraz üstü, büyük sayılar (976) 1000'in altı."],ben:["Ben sağ üstteki 042'nin başına 10 koyar, son haneden önce virgül atarım: 1004,2.","En küçük PPP'yi bulduğum yerde alçak merkezi ararım."]},hata:{teknik:"Hata: binler hanesini unutmak (40184 → 18,4 ya da 184 hPa). Doğrusu: 0 ile başlıyor → 1018,4 hPa; modelde 184.",basit:"Hata: 0184'ü küçük bir sayı sanmak. Doğrusu: baştaki 0 «1000'in üstü» demektir: 1018,4 hPa.",ben:"Ben 4'lü grubun ilk hanesine bakmadan sayı okumam: 0 ise bin ekler, 9 ise doğrudan 10'a bölerim."},dene:{s:"Muğla'nın 40105 grubu kaç hPa, modelde sağ üste ne yazılır?",c:{teknik:"0105 → 1010,5 hPa (0 ile başlıyor, +1000); modelde son 3 hane: 105.",basit:"1010,5 hPa; haritada 105 görünür.",ben:"Ben 0105'e bin ekler, virgül koyarım: 1010,5; sağ üste 105 yazarım."}},kaynak:"WMO-No. 306, FM 12 Bölüm 1 (4PPPP); AMS Glossary: sea level pressure"},"kod.5appp":{baslik:"5appp · basınç eğilimi",kisa:{teknik:"a son 3 saatteki eğilim karakteristiği (KOD 0200), ppp 3 saatlik değişim, onda bir hPa.",basit:"Basınç son 3 saatte çıktı mı, indi mi, ne kadar?",ben:"Ben a'yı çizginin şekli diye okurum: 0–3 yukarı, 4 düz, 5–8 aşağı."},neden:{teknik:["ppp işaretsizdir; işaret a'dan gelir: 0–3 artış (0'da aynı olabilir), 4 sabit, 5–8 düşüş (5'te aynı olabilir).","Eğilim alanı (izallobar) sistemin hareketini gösterir: düşüş bölgesi yaklaşan alçak ya da trofu haber verir."],basit:["Sayıya işaret koymak yerine barograf çizgisinin şekli yazılır.","Hızlı düşüş çoğu zaman kötü havanın yaklaştığını söyler."],ben:["Ben 5'i «indi, sonra çıktı» diye okurum; trof geçişinde sık görülür.","57015'i düzenli 1,5 hPa düşüş diye okurum."]},bak:{teknik:["Modelin sağ ortasında: iki haneli ppp (05 = 0,5 hPa) ve yanında a'nın çizgi sembolü.","Komşu istasyonlarda a = 6–8 kümelenmişse sistemin gideceği yönü oraya işaretle."],basit:["Sağ ortadaki küçük sayı ve yanındaki kırık çizgi eğilimdir.","Çizgi aşağı iniyorsa basınç düşüyor."],ben:["Ben sağ ortadaki sembolün son ucunun yukarıda mı aşağıda mı bittiğine bakarım.","05'i 5 hPa değil 0,5 hPa okurum."]},hata:{teknik:"Hata: ppp'yi tam hPa okumak ya da işareti ppp'de aramak. Doğrusu: 58003 → a = 8 düşüş, ppp 0,3; yani −0,3 hPa.",basit:"Hata: 05'i 5 hPa sanmak. Doğrusu: son hane ondalıktır; 0,5 hPa.",ben:"Ben işareti hep a'dan alırım; ppp yalnız büyüklüktür ve onda bir hPa'dır."},dene:{s:"Edirne'nin 57015 grubu ne anlatır?",c:{teknik:"a = 7: düzenli ya da düzensiz düşüş, basınç 3 saat öncesinden düşük; ppp = 1,5 → −1,5 hPa.",basit:"Basınç 3 saatte 1,5 hPa düşmüş ve hâlâ iniyor.",ben:"Ben 7'yi «iniyor», 015'i 1,5 diye okur, modele 15 ve düşen çizgi koyarım."}},kaynak:"WMO-No. 306: KOD 0200 (a); AMS Glossary: pressure tendency, isallobar"},"kod.6RRRtR":{baslik:"6RRRtR · yağış miktarı",kisa:{teknik:"RRR tR süresindeki yağış (KOD 3590, mm), tR periyot (KOD 4019): 1 = 6 saat, 2 = 12 saat.",basit:"Son 6 ya da 12 saatte kaç milimetre yağış düştü?",ben:"Ben önce son haneye bakarım: 1 ise 6 saat, 2 ise 12 saat."},neden:{teknik:["RRR tam mm'dir; 990 eser (trace), 991–999 ise 0,1–0,9 mm: küçük değerler ayrı kodla yazılır.","Türkiye 00/12 UTC'de tR = 1, 06/18 UTC'de tR = 2 verir; yağış yoksa da grubu RRR = 000 ile gönderir (iR = 1)."],basit:["Çok az yağış için özel numaralar var; 991 aslında 0,1 mm.","Yağmur yağmasa da paket «000» ile gönderilir."],ben:["Ben 99 ile başlayan RRR'yi görünce ondalık okurum: 996 → 0,6 mm.","Ara saatte iR = 4 görünce bu grubu aramam."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; yağış miktarı Met Office modeline çizilmez.","Yağışın türünü ww (solda) ve W1W2 (sağ altta) sembolleri verir: nokta yağmur, virgül çisenti, yıldız kar."],basit:["Modelde yağış miktarı yazmaz.","Yağıp yağmadığını dairenin çevresindeki nokta ve yıldızlardan anlarsın."],ben:["Ben 6'lı gruptaki miktarı W1W2 sembolüyle karşılaştırırım; ikisi tutarlı olmalı.","Miktar var ama hiç yağış sembolü yoksa nedenini ararım."]},hata:{teknik:"Hata: 69911'i 991 mm okumak. Doğrusu: 991–999 → (RRR − 990) × 0,1 mm; 991 = 0,1 mm, tR = 1 → son 6 saat.",basit:"Hata: 991'i dev bir yağış sanmak. Doğrusu: 991 aslında 0,1 mm; neredeyse hiç.",ben:"Ben 990'ı «eser», 991–999'u «onda bir mm» diye ayrı bir kutuda tutarım."},dene:{s:"Sinop 06 UTC mesajındaki 69962 grubunu çöz.",c:{teknik:"RRR = 996 → 0,6 mm; tR = 2 → son 12 saat (18–06 UTC).",basit:"Son 12 saatte 0,6 mm, yani çok az yağış.",ben:"Ben 996'dan 990 çıkarır, 0,6 mm derim; son hane 2 → 12 saat."}},kaynak:"WMO-No. 306: KOD 3590 (RRR), 4019 (tR), 1819 (iR)"},"kod.7wwW1W2":{baslik:"7wwW1W2 · şimdiki ve geçmiş hava",kisa:{teknik:"ww şimdiki hava (KOD 4677, 00–99), W1W2 geçmiş hava (KOD 4561); yalnız iX = 1 ise verilir.",basit:"Şu an ne oluyor (yağmur, sis, oraj) ve son saatlerde ne oldu?",ben:"Ben ww'yi onluk ailesinden tanırım: 6x yağmur, 7x kar, 9x oraj; şiddeti birler hanesi söyler."},neden:{teknik:["00–49: rasat anında istasyonda yağış yok; 50–99: yağış var; 20–29 son saatte olup bitmiş hadisedir.","W1W2 süresi ana saatlerde 6, ara saatlerde 3 saattir; W1 ≥ W2, tek tip havada W1 = W2."],basit:["Rakam büyüdükçe hadise ciddileşir: 50'ler çisenti, 60'lar yağmur, 95 ve üstü oraj.","Geçmiş hava, son birkaç saatin kısa özetidir."],ben:["Ben birden çok hadise varsa en büyük kodun buraya yazıldığını bilirim (17 hariç).","W1 = W2 görürsem periyot boyunca tek tip hava olmuş derim."]},bak:{teknik:["ww sembolü dairenin solunda (TT ile TdTd arasında), W1W2 sağ altta çizilir.","Nokta yağmur, virgül çisenti, yıldız kar, ▽ sağanak, yatay çizgiler pus ya da sis; nokta sayısı şiddeti verir."],basit:["Dairenin solundaki işaret şu anki hava, sağ alttaki geçmiş hava.","Üç nokta orta yağmur, şimşek oklu işaret oraj."],ben:["Ben soldaki sembolde nokta sayarım: 63'te üçgen dizili üç nokta.","Sağ altta nokta görürsem «geçmişte yağmur» derim."]},hata:{teknik:"Hata: ww 20–29'u şu an süren hadise sanmak. Doğrusu: 20–29 son saatte olup bitmiştir, şimdi yok (ör. 25 = sağanak bitti).",basit:"Hata: 20'li kodları «şu an yağıyor» sanmak. Doğrusu: 20'li kodlar «son saatte vardı, şimdi bitti» demektir.",ben:"Ben 2x görünce kafamda köşeli parantez açarım: geçti, bitti; modeldeki sembolün yanında da o parantez durur."},dene:{s:"76366 grubunu çöz: şimdi ne var, geçmişte ne vardı?",c:{teknik:"ww = 63: donmayan sürekli orta yağmur; W1 = W2 = 6: periyot boyunca yağmur.",basit:"Şimdi orta şiddette kesintisiz yağmur var; önceki saatlerde de yağmur vardı.",ben:"Ben 63'ü üç noktayla, 66'yı sağ altta yağmur noktasıyla çizerim."}},kaynak:"WMO-No. 306: KOD 4677 (ww), 4561 (W1W2), 1860 (iX)"},"kod.8NhCLCMCH":{baslik:"8NhCLCMCH · bulut miktarı ve cinsleri",kisa:{teknik:"Nh alçak (yoksa orta) bulut miktarı, okta; CL, CM, CH alçak, orta ve yüksek bulut cinsi.",basit:"Gökyüzünü üç kata ayırır: her katta hangi bulut var, alt kat ne kadar dolu.",ben:"Ben 82108'i 2/8 alçak bulut, iyi hava Cu'su, orta bulut yok, yüksekte Cs diye okurum."},neden:{teknik:["Bulut cinsi kararlılığı anlatır: CL 2 (Cu congestus) ve 9 (Cb) konveksiyon, CM 2 (As/Ns) çoğu zaman cephe bulutudur.","N = 0 (açık) ya da N = 9 (gök görülmüyor) ise grup verilmez; görülemeyen kat / ile yazılır."],basit:["Bulutun türü havanın huyunu anlatır: kabarık kule sağanak, düz gri tabaka sürekli yağış getirir.","Gök açıksa ya da hiç görünmüyorsa bu paket gelmez."],ben:["Ben CH'de gökyüzünü işgal eden Ci ya da Cs (4–6) görünce yaklaşan sıcak cepheyi düşünürüm.","Nh'yi toplam bulut sanmam; toplam N'dir."]},bak:{teknik:["CH dairenin tepesinde, altında CM; CL dairenin altında, onun altında Nh/h (ör. 6/4).","Çip seçilince bu dört yer birlikte yanar; Nh, merkezdeki N'den büyük olamaz."],basit:["Üstteki yazılar yüksek ve orta bulut, alttaki alçak bulut.","En alttaki kesrin ilk sayısı alçak bulut miktarı."],ben:["Ben modeli yukarıdan aşağı okurum: CH, CM, daire, CL, Nh/h.","Alttaki 6/4'te 6'yı Nh, 4'ü h diye ayırırım."]},hata:{teknik:"Hata: Nh'yi toplam kapalılık sanmak. Doğrusu: Nh yalnız CL (yoksa CM) miktarıdır; toplam N Nddff'tedir ve Nh ≤ N.",basit:"Hata: ilk rakamı bütün göğün bulutu sanmak. Doğrusu: o yalnız alt kattaki bulut; toplam, dairedeki N'dir.",ben:"Ben Nh > N çıkarsa bir şeyi yanlış okuduğumu anlarım; Nh hiçbir zaman N'yi geçmez."},dene:{s:"Sinop'un 84270 grubunu çöz.",c:{teknik:"Nh = 4/8; CL = 2 Cu mediocris/congestus; CM = 7 çift tabakalı Ac ya da As/Ns ile Ac; CH = 0 yok.",basit:"Alt katın yarısı gelişmiş Cu ile kaplı, orta katta katmanlı Ac var, üst kat boş.",ben:"Ben 4-2-7-0 diye bölerim: 4/8 kule Cu, orta katta çift Ac, yüksek bulut yok."}},kaynak:"WMO-No. 306: KOD 2700 (Nh), 0513 (CL), 0515 (CM), 0509 (CH); WMO Uluslararası Bulut Atlası"},"kod.333":{baslik:"333 · Bölüm 3 göstericisi",kisa:{teknik:"Bölüm 3 başlar: bölgesel ek gruplar (Tmax, Tmin, bulut tabakaları, hamle) gelir.",basit:"«Buradan sonrası ek bilgi» tabelası.",ben:"Ben 333'ü görünce kafamda sayfa çeviririm: rakamların anlamı değişti."},neden:{teknik:["Bölüm 3 grupları bölgesel kararla seçilir (Türkiye WMO Bölge VI'da); göstergeler Bölüm 1 ile aynı rakamlar ama anlam farklı.","Tek ayraç grubu çözücüye «gösterge tablosunu değiştir» der: 1 → Tmax, 2 → Tmin, 8 → bulut tabakası."],basit:["Aynı rakamlar yeni bir sözlükle okunur.","Böylece kısa bir mesajda daha çok bilgi taşınır."],ben:["Ben 333'ten sonra 1'i en yüksek, 2'yi en düşük sıcaklık diye okurum.","8'li grupların burada tekrar tekrar geldiğini bilirim: her biri bir bulut tabakası."]},bak:{teknik:["Kod çözücüde 333 üç haneli bir ayraç çipidir; modelde hiçbir konum yanmaz.","Seçicide «Bölüm 3 · bölgesel ek» başlığı bu çipten sonra açılır."],basit:["Kısa, üç rakamlı çip bir sınır taşıdır.","Ondan sonraki çipler ayrı bir başlık altında listelenir."],ben:["Ben listede «Bölüm 3» başlığını görünce okuma kuralımı değiştiririm.","Bölüm 3 çiplerinin çoğunda modelde ışık yanmadığını, yalnız hamlenin (G) yandığını bilirim."]},hata:{teknik:"Hata: 333'ten sonraki 10182'yi anlık sıcaklık okumak. Doğrusu: Bölüm 3'te 1 = azami sıcaklık; 18,2 °C Tmax'tır.",basit:"Hata: ayraçtan sonraki paketleri eski anlamıyla okumak. Doğrusu: 1 artık en yüksek, 2 en düşük sıcaklıktır.",ben:"Ben 333'ün yerini kalemle işaretlerim; sağındaki 1'leri ve 2'leri bir daha T ve Td sanmam."},dene:{s:"06 UTC mesajında 333'ten hemen sonra 20125 geliyor. Bu çiy noktası mı?",c:{teknik:"Hayır: Bölüm 3'te 2SnTnTnTn; asgari sıcaklık 12,5 °C (18–06 UTC).",basit:"Hayır, gecenin en düşük sıcaklığı: 12,5 derece.",ben:"Ben 333'ün sağında olduğu için Tmin derim: 12,5 °C."}},kaynak:"WMO-No. 306, FM 12 Bölüm 3; WMO Bölge VI uygulaması"},"kod.1SnTxTxTx":{baslik:"1SnTxTxTx · azami sıcaklık",kisa:{teknik:"Bölüm 3'te azami sıcaklık (Tmax), onda bir °C; Türkiye'de yalnız 18 UTC'de, 06–18 UTC için.",basit:"Günün en sıcak değeri; akşam mesajında gelir.",ben:"Ben 333'ten sonra 1 görürsem «anlık değil, maksimum» derim."},neden:{teknik:["Gündüz ısınması öğleden sonra en yükseğe çıkar; 06–18 UTC penceresi Türkiye'de gündüzü kapsar.","Okuma 1SnTTT ile aynıdır (Sn işaret, ÷10); farkı bölüm ve süredir."],basit:["Güneş en çok öğleden sonra ısıtır; o 12 saatin en yükseği yazılır.","Okuması anlık sıcaklıkla aynı, anlamı farklı."],ben:["Ben Tmax'ı yalnız 18 UTC mesajında ararım.","18 UTC'deki T, Tmax'tan büyük çıkamaz; çıkarsa yanlış okumuşumdur."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; sol üstteki TT anlık sıcaklıktır, Tmax değil.","Zonguldak 18 UTC: TT 14,8 °C (10148), Tmax 18,2 °C (10182); ikisini ayrı tut."],basit:["Modelde Tmax yazmaz; sol üstteki sayı o anki sıcaklıktır.","Akşam mesajında iki farklı «1» grubu görürsün."],ben:["Ben aynı mesajda iki 1'li grup görürsem 333'ün solundakini T, sağındakini Tmax sayarım.","Tmax'ı TT'nin yanına kalemle not ederim, modelin içine yazmam."]},hata:{teknik:"Hata: 333'ten sonraki 1'li grubu TT sanıp modele yazmak. Doğrusu: o Tmax'tır; modelin TT'si Bölüm 1'deki 1SnTTT'dir.",basit:"Hata: günün en yüksek sıcaklığını o anki sıcaklık sanmak. Doğrusu: ayraçtan sonraki 1 «günün en yükseği»dir.",ben:"Ben 10182'yi görünce «akşam mesajı, gündüz en yüksek 18,2» derim, o anki sıcaklık demem."},dene:{s:"Sinop 18 UTC: Bölüm 1'de 10188, 333'ten sonra 10234. Anlık sıcaklık ve gündüz en yüksek sıcaklık kaç?",c:{teknik:"Bölüm 1: T = 18,8 °C; Bölüm 3: Tmax = 23,4 °C (06–18 UTC).",basit:"Akşam 18,8 derece; gündüz en yüksek 23,4 derece.",ben:"Ben 333'ün solundakini T (18,8), sağındakini Tmax (23,4) diye ayırırım."}},kaynak:"WMO-No. 306, FM 12 Bölüm 3; WMO Bölge VI uygulaması"},"kod.2SnTnTnTn":{baslik:"2SnTnTnTn · asgari sıcaklık",kisa:{teknik:"Bölüm 3'te asgari sıcaklık (Tmin), onda bir °C; Türkiye'de yalnız 06 UTC'de, 18–06 UTC için.",basit:"Gecenin en soğuk değeri; sabah mesajında gelir.",ben:"Ben 333'ten sonra 2'yi «gece minimumu» diye okurum, çiy noktasıyla karıştırmam."},neden:{teknik:["Gece ışınımla soğuma şafağa doğru en düşük değere iner; açık ve sakin gecede Tmin daha düşük olur.","Bulut örtüsü uzun dalga ışınımı yere geri yollar; bulutlu gecede Tmin yüksek kalır."],basit:["Gece yer ısısını göğe verir, sabaha karşı en soğuk an gelir.","Bulut bir yorgan gibidir; bulutlu gece daha ılık geçer."],ben:["Ben Tmin'i don riski için okurum; 0 °C'nin altı tarım için önemlidir.","Açık gökte düşük, bulutlu gökte yüksek Tmin beklerim."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; sol alttaki TdTd çiy noktasıdır, Tmin değil.","06 UTC'de 55SSS'ten hemen sonra gelen 2xxxx radyasyon grubudur (20398 = 398 J/cm²), Tmin değil."],basit:["Modelde Tmin yazmaz.","Sabah mesajında 2 ile başlayan iki farklı grup olabilir; yerlerine bak."],ben:["Ben 333'ün hemen sağındaki 2'yi Tmin, 55'li grubun arkasındaki 2'yi radyasyon sayarım.","Tmin'i gecenin bulut durumuyla (N) karşılaştırırım."]},hata:{teknik:"Hata: 55SSS'ten sonraki 20398'i Tmin (39,8 °C) okumak. Doğrusu: o J = 2 küresel güneş radyasyonu, 398 J/cm².",basit:"Hata: sabah mesajındaki her 2'li grubu en düşük sıcaklık sanmak. Doğrusu: güneşlenme grubunun arkasındaki 2 güneş enerjisidir.",ben:"Ben 39,8 °C gibi bir gece minimumu çıkarsa durur, grubun yerine bakarım: 55'in arkasındaysa radyasyondur."},dene:{s:"Zonguldak 06 UTC: 333 20125 32010 55000 20398. Tmin hangisi, kaç °C?",c:{teknik:"20125: Tmin = 12,5 °C; 20398 ise 55SSS'ten sonra gelen radyasyon grubudur (398 J/cm²).",basit:"İlki: gece en düşük 12,5 derece; sondaki sıcaklık değil, güneş enerjisi.",ben:"Ben 333'ün hemen sağındaki 20125'i seçerim: 12,5 °C."}},kaynak:"WMO-No. 306, FM 12 Bölüm 3; Wallace & Hobbs, Atmospheric Science (ışınımla soğuma)"},"kod.8NsChshs":{baslik:"8NsChshs · bulut tabakası",kisa:{teknik:"Her tabaka için Ns miktar (okta), C cins (KOD 0500), hshs taban yüksekliği (KOD 1677).",basit:"Bulutların kat kat listesi: ne kadar, hangi tür, ne yükseklikte.",ben:"Ben 82834'ü 2-8-34 diye okurum: 2/8 Cu, taban 34 × 30 = 1020 m."},neden:{teknik:["1-3-5 kuralı: 1. tabaka ≥1/8, 2. ≥3/8, 3. ≥5/8; Cb her zaman ayrıca verilir; tabakalar alttan üste sıralanır.","hshs: 01–50 → ×30 m (≈ ×100 ft), 56–80 → (hshs − 50) × 300 m; havacılık için taban yüksekliği kritiktir."],basit:["İnce, önemsiz bulutlar listeye girmez; kalınlaştıkça girer.","Pilotlar için bulutun tabanı çok önemlidir."],ben:["Ben 56'dan büyük hshs görürsem 50 çıkarıp 300'le çarparım: 70 → 6000 m.","İlk 8'li grubun tabanının h aralığına uyup uymadığına bakarım."]},bak:{teknik:["Bu çip seçilince modelde konum yanmaz; ama ilk tabakanın tabanı alttaki Nh/h'nin h aralığına düşmelidir.","Zonguldak 12 UTC: h = 6 (1000–1500 m), ilk tabaka 82834 → 1020 m; tutarlı."],basit:["Modelde bu bilgi ayrıca yazmaz.","Alttaki h ile ilk tabakanın yüksekliği birbirini tutmalı."],ben:["Ben 8'li tabakaları alttan üste dizer, modeldeki CL ve CH ile eşleştiririm.","Cu tabakası CL'deki Cu ile, Cs tabakası CH ile uyuşmalı."]},hata:{teknik:"Hata: 56–80 aralığına da ×30 uygulamak (70 → 2100 m). Doğrusu: (70 − 50) × 300 = 6000 m.",basit:"Hata: her yükseklik kodunu aynı kuralla okumak. Doğrusu: 50'ye kadar 30'la çarp, 56'dan sonra 50 çıkarıp 300'le çarp.",ben:"Ben hshs'yi okumadan önce «50'den küçük mü, büyük mü?» diye sorarım."},dene:{s:"Sinop'un 84830 ve 86359 gruplarını çöz.",c:{teknik:"84830: 4/8 Cu, taban 30 × 30 = 900 m; 86359: 6/8 Ac, taban (59 − 50) × 300 = 2700 m.",basit:"Önce 900 m'de yarım kat Cu, üstünde 2700 m'de daha geniş bir Ac tabakası.",ben:"Ben 30'u 30'la çarpıp 900 m, 59'dan 50 çıkarıp 300'le çarpıp 2700 m bulurum."}},kaynak:"WMO-No. 306: KOD 0500 (C), 2700 (Ns), 1677 (hshs); WMO Bölge VI 1-3-5 kuralı"},"kod.910ff":{baslik:"910ff · son 10 dakikanın hamlesi",kisa:{teknik:"Rasattan önceki 10 dakikadaki en yüksek rüzgar hamlesi (gust), kt; 910 göstergedir.",basit:"Rüzgarın son 10 dakikadaki en sert vuruşu.",ben:"Ben 910'u «9-10 → 10 dakika» diye ezberledim."},neden:{teknik:["Hamle, türbülans ve konvektif aşağı akışların yarattığı kısa süreli hız artışıdır; ortalama ff bunu gizler.","Türkiye uygulamasında hamle ortalamayı en az 10 kt aşarsa verilir; 100 kt ve üstü 91099 + 00fff ile."],basit:["Ortalama rüzgar sakin görünse de ani vuruşlar ağaç devirebilir.","Ancak ortalamadan belirgin güçlüyse yazılır."],ben:["Ben hamleyi ortalama ff ile yan yana koyarım; fark büyükse çalkantılı hava derim.","Sağanak ya da oraj varsa yüksek hamleyi doğal bulurum."]},bak:{teknik:["Modelin en sağ üstünde «G» ile yazılır (G45 = 45 kt); çip seçilince orası yanar.","Çubuktaki tüyler ortalamayı (ff), G ise hamleyi gösterir; ikisini karıştırma."],basit:["Sağ üst köşedeki G harfli sayı hamledir.","Tüyler ortalama rüzgarı, G en sert anı söyler."],ben:["Ben önce tüyleri sayarım (ortalama), sonra G'ye bakarım (hamle).","G45 ve 3 uzun tüy görürsem «30 kt esiyor, 45'e vuruyor» derim."]},hata:{teknik:"Hata: 910'u değer sanmak ya da 910ff'i 911ff ile karıştırmak. Doğrusu: 910 gösterge, ff son 10 dk hamlesi; 911 daha uzun süreyi kapsar.",basit:"Hata: «910» rakamını hız sanmak. Doğrusu: 910 yalnız etiket, hız son iki rakamdır.",ben:"Ben 91025'i 910 | 25 diye bölerim: son 10 dakikada 25 kt hamle."},dene:{s:"Aynı mesajda Nddff 62315 ve Bölüm 3'te 91028 var. Ortalama ve hamle kaç, grup neden verilmiş?",c:{teknik:"Ortalama 230°'den 15 kt, hamle 28 kt; fark 13 kt, yani 10 kt'tan fazla olduğu için grup verilmiş.",basit:"Rüzgar 15 knot esiyor, 28 knota vuruyor; fark büyük olduğu için yazılmış.",ben:"Ben 28 − 15 = 13 yaparım; 10'dan büyük, grup yerinde."}},kaynak:"WMO-No. 306, FM 12 Bölüm 3 (9SpSpspsp grupları); AMS Glossary: gust"},"kod.911ff":{baslik:"911ff · referans süresinde en yüksek hamle",kisa:{teknik:"Referans süresindeki en yüksek hamle, kt; süre önündeki 907tt'den, yoksa W1W2 süresinden.",basit:"Son birkaç saatte rüzgarın ulaştığı en sert an.",ben:"Ben 911'i hep 907 ile birlikte okurum: «son 6 saatte en sert hamle»."},neden:{teknik:["907tt süreyi verir: tt × 6 dk (30 = 3 saat, 60 = 6 saat); 911ff o süredeki en yüksek hamledir.","907tt yoksa süre geçmiş hava periyodudur: ana saatlerde 6, ara saatlerde 3 saat."],basit:["Önce «ne kadar geriye bakıldı» etiketi gelir, sonra o sürenin en sert vuruşu.","Böylece son 10 dakikada kaçan fırtına anı da yakalanır."],ben:["Ben 90760'ı 6 saat, 90730'u 3 saat diye okurum; içinde hız yok.","911ff'i 910ff'ten küçük bulursam bir yanlışlık ararım."]},bak:{teknik:["Hamle modelin sağ üstünde «G» ile yazılır; bu laboratuvar 910 ve 911'den büyük olanı G'ye koyar.","Çip seçilince G yanar; 907tt çipi ise modelde konum yakmaz."],basit:["Sağ üstteki G sayısına bak.","Önündeki 907 çipi yalnız süreyi söyler."],ben:["Ben G'nin hangi süreye ait olduğunu 907'den okurum.","Ara saat mesajında G'nin son 3 saati anlattığını bilirim."]},hata:{teknik:"Hata: 90760'ı 60 kt hamle okumak. Doğrusu: 907tt süredir, 60 × 6 dk = 6 saat; hamle 911ff'tedir.",basit:"Hata: 907'li paketteki 60'ı rüzgar hızı sanmak. Doğrusu: o 6 saatlik süredir; hız bir sonraki pakettedir.",ben:"Ben 907'den sonra «saat», 911'den sonra «knot» derim; ikisini hiç karıştırmam."},dene:{s:"Sinop 12 UTC: 90760 91110. Ne anlatır?",c:{teknik:"907tt: tt = 60 → 6 saat; 911ff: o 6 saatteki en yüksek hamle 10 kt.",basit:"Son 6 saatte rüzgarın en sert anı 10 knot.",ben:"Ben 60 × 6 dk = 6 saat yapar, 911'den 10 kt okurum."}},kaynak:"WMO-No. 306: KOD 4077 (tt), FM 12 Bölüm 3; AMS Glossary: gust"},"kur.ruzgar":{baslik:"Rüzgar: dd, ff, hamle",kisa:{teknik:"dd (geldiği yön, 10°'lik) ve ff (10 dk ortalama) Nddff'e, hamle Bölüm 3'te 910ff/911ff'e kodlanır.",basit:"Çubuk rüzgarın geldiği yönü, tüyler hızını, G en sert vuruşu gösterir.",ben:"Ben kaydırıcıyı oynatıp çubuğun döndüğünü ve tüylerin arttığını izlerim."},neden:{teknik:["Rüzgarı basınç gradyanı sürer; izobarlar sıklaştıkça ff artar, yerde sürtünme akışı alçağa doğru saptırır.","Hamle sürtünme türbülansı ve konvektif aşağı akışlarla gelir; ortalamadan belirgin büyükse ayrıca verilir."],basit:["Basınç farkı ne kadar büyükse rüzgar o kadar serttir.","Ani vuruşlar havadaki çalkantıdan gelir."],ben:["Ben ff artınca «izobarlar sıklaşıyor» diye düşünürüm.","Yön saat yönünde dönüyorsa (veering) bir cephenin geçtiğini aklıma getiririm."]},bak:{teknik:["dd kaydırıcısı çubuğu çevirir: çubuk daireden geldiği yöne (ör. 230°) uzanır; dd = 0 ise daire çevresinde sakin halkası.","ff tüyleri değiştirir: en yakın 5 kt'a yuvarlanır (28 → 30 kt = 3 uzun tüy); 50 kt'ta üçgen bayrak çıkar."],basit:["Yön değişince çubuk döner.","Hız artınca tüy eklenir; 50 knotta üçgen bayrak gelir."],ben:["Ben ff'i 45'ten 50'ye çıkarıp tüylerin bayrağa dönüşmesini izlerim.","Hamle kaydırıcısını oynatınca sağ üstteki G sayısının değiştiğini görürüm."]},hata:{teknik:"Hata: çubuğu rüzgarın estiği yöne çizmek. Doğrusu: dd = 23 → 230°'den eser; çubuk güneybatıya uzanır, hava kuzeydoğuya akar.",basit:"Hata: çubuğu rüzgarın gittiği yöne çevirmek. Doğrusu: çubuk rüzgarın geldiği yöndedir.",ben:"Ben dd'yi değiştirirken «rüzgar bu çubuğun ucundan geliyor» diye tekrar ederim."},dene:{s:"N = 6, dd = 23, ff = 28 kt iken model nasıl görünür, Nddff kodu ne olur?",c:{teknik:"Çubuk 230°'ye (güneybatı) uzanır; 28 → 30 kt, 3 uzun tüy; Nddff = 62328.",basit:"Çubuk güneybatıyı gösterir, üç uzun tüy var; kod 62328.",ben:"Ben 6 | 23 | 28 yazarım: 62328; çubuğu güneybatıya, üç uzun tüyle çizerim."}},kaynak:"WMO-No. 306: KOD 0877 (dd); AMS Glossary: wind barb, gust, Buys-Ballot's law"},"kur.sicaklik":{baslik:"Sıcaklık ve nem: T, Td, T − Td",kisa:{teknik:"T 1SnTTT'ye, Td 2SnTdTdTd'ye onda bir °C ile kodlanır; modelde sol üst ve sol alt.",basit:"Üstte sıcaklık, altta çiy noktası; aradaki fark havanın ne kadar nemli olduğunu söyler.",ben:"Ben T ile Td'yi birlikte izlerim; fark küçüldükçe sis aklıma gelir."},neden:{teknik:["T − Td farkı (dew-point depression) bağıl nemin göstergesidir; sıfıra yaklaşınca hava doyar, yoğuşma başlar.","Basınç sabitken hava soğusa da Td doyana kadar değişmez; bu yüzden Td nemin iyi bir izleyicisidir."],basit:["Fark küçüldükçe hava, ağzına kadar dolmuş bir bardak gibi taşmaya yaklaşır.","Gece hava soğur, çiy noktası pek değişmez; ikisi buluşunca sis olur."],ben:["Ben gece T'nin Td'ye yaklaştığını görünce sabah sisi beklerim.","Td birden yükselirse nemli havanın geldiğini düşünürüm."]},bak:{teknik:["T kaydırıcısı sol üst sayıyı ve 1SnTTT çipini, Td sol alt sayıyı ve 2SnTdTdTd çipini değiştirir.","Td, T'yi geçemez (kaydırıcı onu T'ye eşitler); panel fark 2 °C ya da altındaysa «doymaya çok yakın» yazar."],basit:["Sol üstteki sayı sıcaklık, sol alttaki çiy noktası.","Paneldeki farkı izle: küçülünce uyarı çıkar."],ben:["Ben T'yi sıfırın altına indirip çipteki Sn hanesinin 1'e döndüğünü görürüm.","Farkı 2 °C'ye indirince paneldeki uyarıyı okurum."]},hata:{teknik:"Hata: Td'nin T'yi geçebileceğini sanmak. Doğrusu: Td ≤ T; eşitlik doymuş hava (sis ya da bulut) demektir.",basit:"Hata: çiy noktası sıcaklıktan yüksek olabilir sanmak. Doğrusu: en fazla sıcaklığa eşit olur; eşitse hava doymuştur.",ben:"Ben Td'yi T'nin üstüne çekmeye çalışınca kaydırıcının durduğunu görür, nedenini hatırlarım: Td ≤ T."},dene:{s:"T = 23, Td = 18 °C iken T'yi 19'a indirirsen kod ve panel ne der?",c:{teknik:"1SnTTT = 10190, Td 20180 kalır; fark 1 °C → «doymaya çok yakın»: sis ya da alçak bulut olası.",basit:"Fark 1 dereceye iner; hava doymak üzere, sis gelebilir.",ben:"Ben çipte 10190'ı görür, fark 1'e inince sis uyarısını okurum."}},kaynak:"WMO-No. 306: KOD 3845 (Sn); AMS Glossary: dewpoint depression; Wallace & Hobbs, Atmospheric Science"},"kur.basinc":{baslik:"Basınç: PPPP, a, ppp",kisa:{teknik:"MSLP 4PPPP'ye, eğilim 5appp'ye kodlanır; modelde sağ üstte PPP, sağ ortada ppp ve a sembolü.",basit:"Sağ üstte basıncın kendisi, sağ ortada son 3 saatte nasıl değiştiği.",ben:"Ben sağ sütunu birlikte okurum: «1004,2 hPa ve düşüyor»."},neden:{teknik:["PPPP izobar analizinin girdisidir; a ve ppp basınç alanının nasıl değiştiğini (izallobar) verir.","Düşüş (a = 5–8) yaklaşan alçak ya da trofu, yükseliş (a = 0–3) arkadan gelen sırtı haber verir."],basit:["Basıncın değeri haritayı, değişimi geleceği anlatır.","Düşen basınç çoğu zaman bozan havanın habercisidir."],ben:["Ben a = 7 ile büyük ppp görünce «sistem yaklaşıyor» derim.","Cephe geçince a = 5 (indi, sonra çıktı) görmeyi beklerim."]},bak:{teknik:["P kaydırıcısı sağ üstteki 3 haneyi (1004,2 → 042) ve 4PPPP çipini (40042) değiştirir.","a kaydırıcısı sağ ortadaki çizgi sembolünü çizer; ppp iki hane yazılır (0,5 → 05), çip 5appp olur (57005)."],basit:["Basıncı değiştirince sağ üstteki sayı değişir.","a'yı değiştirince sağ ortadaki küçük çizginin şekli değişir."],ben:["Ben a'yı 0'dan 8'e kaydırıp sembolün yukarı bakandan aşağı bakana döndüğünü izlerim.","P'yi 999,9'dan 1000,0'a geçirip sağ üstte 999'un 000'a sıçradığını görürüm."]},hata:{teknik:"Hata: ppp'yi tam hPa okumak ya da işareti ppp'de aramak. Doğrusu: 05 = 0,5 hPa; artış ya da düşüş yalnız a'dan anlaşılır.",basit:"Hata: 05'i 5 hPa sanmak. Doğrusu: son hane ondalıktır; 0,5 hPa.",ben:"Ben 57005'i yazarken işareti 7'ye bırakırım; 005 yalnız büyüklüktür: 0,5 hPa."},dene:{s:"P = 1004,2 hPa, a = 7, ppp = 0,5 hPa iken modelde ne görünür, çipler ne olur?",c:{teknik:"Sağ üst 042, sağ orta 05 ve düzenli düşüş çizgisi; çipler 40042 ve 57005.",basit:"Sağ üstte 042, sağ ortada 05 ve aşağı inen çizgi.",ben:"Ben 1004,2'den 042 ve 40042, eğilimden 57005 yazarım."}},kaynak:"WMO-No. 306: KOD 0200 (a); AMS Glossary: pressure tendency, sea level pressure"},"kur.bulut":{baslik:"Bulut ve görüş: N, Nh, h, VV",kisa:{teknik:"N Nddff'e, Nh 8NhCLCMCH'ye, h ve VV iRiXhVV'ye kodlanır; modelde daire, Nh/h ve en solda VV.",basit:"Dairenin doluluğu gökyüzünü, alttaki kesir alçak bulutu, soldaki sayı görüşü anlatır.",ben:"Ben daireye, altına ve en sola bakıp «ne kadar kapalı, ne kadar alçak, ne kadar uzak» derim."},neden:{teknik:["Okta ölçeği gökyüzünü sekize böler; 7 = en az bir açıklık var, 9 = gök görülemiyor (sis vb.).","Alçalan h ve azalan VV nemli havanın ya da yaklaşan cephenin işaretidir; sisli havada görüş 1 km'nin altındadır."],basit:["Gökyüzü sekiz dilimli bir pasta gibi sayılır.","Bulut alçalıp görüş azalınca hava kötüleşiyor demektir."],ben:["Ben VV 10'un altına inince (1 km'den az) sis düşünürüm.","h küçüldükçe bulutun tepeme indiğini hayal ederim."]},bak:{teknik:["N kaydırıcısı merkez daireyi doldurur (6 → dörtte üç dolu, 9 → ⊗); Nh ve h dairenin altında Nh/h olarak yazılır (6/4).","VV en solda iki haneli koddur: 56 → 6 km; 51–55 kullanılmaz, 89 → 70 km'den fazla."],basit:["Kaydırıcıyı çekince daire dolar.","En soldaki iki rakam görüştür; doğrudan km değildir."],ben:["Ben N'yi 7'ye getirip dairede bırakılan ince açıklığı görürüm.","VV'yi 50'den 56'ya atlatıp «5 km'den 6 km'ye» diye okurum."]},hata:{teknik:"Hata: Nh'yi N'den büyük seçmek. Doğrusu: Nh yalnız alçak (yoksa orta) buluttur, toplam N'yi aşamaz; kaydırıcı bunu engellemez.",basit:"Hata: alt kattaki bulutu bütün göğün bulutundan çok yapmak. Doğrusu: parça bütünden büyük olamaz.",ben:"Ben Nh'yi her değiştirdiğimde dairedeki N'ye bakarım; Nh ≤ N olmalı."},dene:{s:"VV = 56 ve h = 4 ne anlatır? VV'yi 10'a indirirsen ne değişir?",c:{teknik:"56 → 6 km, h = 4 → taban 300–600 m; VV = 10 → 1 km: görüş sis sınırına inmiş.",basit:"Görüş 6 km, bulut tabanı 300–600 m; 10'da görüş 1 km'ye düşer.",ben:"Ben 56'dan 50 çıkarıp 6 km, 10'u 10'a bölüp 1 km bulurum; sise çok yakın."}},kaynak:"WMO-No. 306: KOD 2700 (N), 1600 (h), 4377 (VV); AMS Glossary: okta, fog"},"kur.hava":{baslik:"Hadise: şimdiki hava ww",kisa:{teknik:"ww 7wwW1W2'ye kodlanır (KOD 4677); sembol dairenin solunda, TT ile TdTd arasında çizilir.",basit:"Şu an ne oluyor: pus, sis, yağmur, kar, sağanak ya da oraj.",ben:"Ben listeden bir hadise seçip soldaki sembolün ve 7'li çipin nasıl değiştiğini izlerim."},neden:{teknik:["00–49 istasyonda yağış yok, 50–99 yağış var; birler hanesi şiddet ve sürekliliği verir (60 hafif aralıklı … 65 kuvvetli sürekli).","Önemli hadise yoksa (ww ≤ 03) 7'li grup gönderilmez ve iX = 2 olur; hadise seçilince iX = 1'e döner."],basit:["Sayı büyüdükçe olay ciddileşir.","Önemli bir olay yoksa paket hiç gönderilmez."],ben:["Ben 63'ten 65'e geçince nokta sayısının 3'ten 4'e çıktığını görürüm.","95 seçince sembolün oraj işaretine döndüğünü izlerim."]},bak:{teknik:["Sembol ailesi: nokta yağmur, virgül çisenti, yıldız kar, ▽ sağanak, yatay çizgiler pus ya da sis, şimşek oklu işaret oraj.","ww değişince iRiXhVV çipinde iX değişir (1 ↔ 2) ve 7wwW1W2 çipi belirir ya da kaybolur."],basit:["Dairenin solundaki küçük resim şu anki havadır.","Hadise seçince alttaki kod sırasına yeni bir paket eklenir."],ben:["Ben 00'ı seçince soldaki sembolün kaybolduğunu ve 7'li çipin gittiğini görürüm.","45 (sis) seçip görüşü de düşük tutarım; ikisi tutarlı olsun diye."]},hata:{teknik:"Hata: 05 ile 10'u aynı sanmak. Doğrusu: 05 kuru duman/pus (haze), 10 nemli pus (mist); sis (45) görüşü 1 km'nin altına indirir.",basit:"Hata: pusu sisle karıştırmak. Doğrusu: sisli havada görüş 1 km'nin altına iner; puslu havada daha uzağı görürsün.",ben:"Ben 45 (sis) seçtiğimde VV'yi 10'un altına çekerim; sisli havada 6 km görüş tutarsızdır."},dene:{s:"ww'yi 63'ten 95'e çevirince modelde ve 7'li çipte ne değişir?",c:{teknik:"Soldaki üç nokta yerine üstünde nokta olan oraj sembolü çıkar; çip 76366'dan 79566'ya döner.",basit:"Yağmur işareti gider, oraj işareti gelir; kodda 63 yerine 95 yazar.",ben:"Ben çipte 63'ün 95'e döndüğünü, W1W2'nin 66 kaldığını görürüm."}},kaynak:"WMO-No. 306: KOD 4677 (ww), 1860 (iX); AMS Glossary: fog, mist, haze"}},...{"harita.alcak":{baslik:"Alçak basınç merkezi (A / L)",kisa:{teknik:"Kapalı izobarlarla çevrili, basıncın merkeze doğru azaldığı siklonik sistem (low, cyclone).",basit:"Havanın içine çekildiği basınç çukuru; çoğu zaman bulut, rüzgar ve yağış getirir.",ben:"A gördüğümde «burada hava bozuk, rüzgar saat tersine dönüyor» derim."},neden:{teknik:["Basınç gradyan kuvveti merkeze, Coriolis dışa yönelir; KYK'de bu denge saat yönünün tersine (siklonik) dolaşım verir.","Yerde sürtünme rüzgarı merkeze doğru saptırır: konverjans → yükselme → soğuma → bulut ve yağış."],basit:["Hava çukura doğru akar ama dünyanın dönüşü onu sağa çeker; sonunda çukurun çevresinde döner.","Ortada sıkışan hava yukarı kaçar, soğur ve bulut olur."],ben:["Ben alçağı bir girdap gibi düşünürüm: içine dolan hava yukarı çıkmak zorunda.","Yukarı çıkan havanın soğuyup bulut yaptığını hatırlarım."]},bak:{teknik:["Kırmızı A ve çevresinde iç içe kapalı izobarlar; etiketler 4 hPa adımla merkeze doğru küçülür.","A'ya bağlı cepheler: oklüzyon merkezden çıkar, soğuk ve sıcak cephe üçlü noktada (triple point) ayrılır."],basit:["Kırmızı büyük A harfi ve onu saran halkalar.","Halkalardaki sayılar içe doğru azalır."],ben:["Ben önce izobar etiketlerinin içe doğru azaldığını kontrol ederim.","Sonra A'nın çevresine dokunup okların saat tersine dönüp dönmediğine bakarım."]},hata:{teknik:"A'yı antisiklon (anticyclone) sanmak: Türkçe kartta A alçak (L), Y yüksek (H) basınçtır; antisiklon Y'dir.",basit:"A «alçak» demek, «antisiklon» değil. Yüksek basınç Y harfiyle gösterilir.",ben:"Ben A'yı İngilizce L ile eşlerim: A = alçak = low; böylece antisiklonla karıştırmam."},dene:{s:"Laboratuvarda A'nın güneyine dokunursan geostrofik ok hangi yöne gider, rüzgar nereden eser?",c:{teknik:"Ok doğuya gider: KYK'de siklonik dolaşımda alçağın güneyinde batılı (westerly) rüzgar eser.",basit:"Ok doğuyu gösterir; rüzgar batıdan gelir.",ben:"Ben alçak soluma gelecek şekilde dururum: yüzüm doğuya döner, rüzgar arkamdan, batıdan eser."}},kaynak:"AMS Glossary of Meteorology: low, cyclone, Buys-Ballot's law; Wallace & Hobbs 2006"},"harita.yuksek":{baslik:"Yüksek basınç merkezi (Y / H)",kisa:{teknik:"Basıncın merkeze doğru arttığı antisiklonik sistem (high, anticyclone); çökme ve zayıf rüzgar.",basit:"Havanın yukarıdan bastırdığı basınç tepesi; çoğu zaman sakin ve açık hava.",ben:"Y görünce «hava durulur» derim ama kış sabahı sis ihtimalini akılda tutarım."},neden:{teknik:["KYK'de basınç gradyanı dışa, Coriolis içe yönelir: dolaşım saat yönünde (antisiklonik).","Yerde sürtünme akışı dışa saptırır (diverjans); yerine üstten çöken hava adyabatik ısınır, bulut dağılır."],basit:["Hava tepeden dışarı akar, yukarıdan yeni hava iner.","İnen hava ısınır ve kurur; bulut tutunamaz."],ben:["Ben Y'yi bir fıskiye gibi düşünürüm: hava merkezden dışarı yayılır.","Yayılan havanın yerini üstten inen kuru havanın aldığını hatırlarım."]},bak:{teknik:["Mavi Y ve çevresinde etiketleri merkeze doğru artan kapalı izobarlar.","Merkeze yakın izobarlar seyrek: gradyan ve rüzgar zayıf; Y'den kuzeye bir sırt ekseni uzanır."],basit:["Mavi büyük Y harfi.","Çevresindeki çizgiler geniş aralıklı: rüzgar hafif."],ben:["Ben Y'nin çevresinde izobar aralığının açıldığını görürüm.","Oradan çıkan turuncu zikzak çizgiyi sırt diye işaretlerim."]},hata:{teknik:"«Y varsa kesin güneşli» demek: kışın çökme inversiyonu altında sis ve alçak stratus günlerce kalabilir.",basit:"Yüksek basınç her zaman güneş demek değil; kışın sis ve gri gök de getirebilir.",ben:"Ben Y altında kış sabahı için hep «sis olası» notu düşerim."},dene:{s:"Y'nin batı tarafına dokunursan geostrofik ok hangi yöne gider?",c:{teknik:"Kuzeye: antisiklonik (saat yönü) dolaşımda yüksek merkezin batısında güneyli rüzgar eser.",basit:"Kuzeyi gösterir; rüzgar güneyden gelir.",ben:"Ben yüksek sağımda kalacak şekilde dururum: yüzüm kuzeye döner, rüzgar güneyden eser."}},kaynak:"AMS Glossary of Meteorology: anticyclone, subsidence inversion; Wallace & Hobbs 2006"},"harita.soguk"
